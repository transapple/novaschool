    </div>`;
    document.getElementById("retryGradesBtn").onclick = () => renderGrades(body);
    return;
  }

  gradesCache = grades;
  body.innerHTML = `<div class="section-head"><h3 style="color:var(--teal-dark);">Grades</h3><button class="btn btn-primary btn-sm" id="addBtn">${ic.plus} Add grade</button></div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin:-8px 0 12px;">Define the grade bands used on report cards and results — e.g. A+ for 90–100%, with a remark like "Excellent".</p>
    <div class="card" id="list"></div>`;
  const list = document.getElementById("list");
  list.innerHTML = grades.length ? "" : emptyState('No grades set up yet. Add bands like A+ (90–100), A (80–89)…');
  grades.forEach(g => {
    const row = el(`<div class="list-row"><div class="avatar">${initials(g.grade)}</div>
      <div class="list-main"><div class="list-title">${g.grade}</div>
      <div class="list-sub">${g.min_score}–${g.max_score}%${g.remark?(' · '+g.remark):''}</div></div></div>`);
    const view = () => openViewModal(g.grade, [["Score range", `${g.min_score}% – ${g.max_score}%`], ["Remark", g.remark || "—"]], () => openGradeModal(body, grades, g));
    const edit = () => openGradeModal(body, grades, g);
    const del = async () => { if (await customConfirm(`Move grade "${g.grade}" to trash?`, { danger:true, okLabel:"Move to trash" })) safe(async()=>{ await softDelete("grades", g.id); gradesCache = null; renderGrades(body); })(); };
    bindRowGestures(row, { onView:view, onEdit:edit, onDelete:del });
    list.appendChild(row);
  });
  document.getElementById("addBtn").onclick = () => openGradeModal(body, grades, null);
}
function openGradeModal(body, existingGrades, g) {
  const isEdit = !!g;
  openModal(isEdit ? "Edit grade" : "New grade", `
    <div class="field"><label>Grade (e.g. A+, A, B+)</label><input id="f_grade" placeholder="A+" value="${g?.grade||''}"/></div>
    <div class="grid2">
      <div class="field"><label>Min score (%)</label><input id="f_min" type="number" min="0" max="100" step="1" value="${g?.min_score??''}"/></div>
      <div class="field"><label>Max score (%)</label><input id="f_max" type="number" min="0" max="100" step="1" value="${g?.max_score??''}"/></div>
    </div>
    <div class="field"><label>Remark</label><input id="f_remark" placeholder="Excellent" value="${g?.remark||''}"/></div>
  `, async (ov) => {
    const grade = val(ov,"f_grade").trim();
    const min_score = Number(val(ov,"f_min"));
    const max_score = Number(val(ov,"f_max"));
    if (!grade) throw new Error("Enter a grade label.");
    if (val(ov,"f_min")==="" || val(ov,"f_max")==="" || Number.isNaN(min_score) || Number.isNaN(max_score)) throw new Error("Enter both a min and max score.");
    if (min_score > max_score) throw new Error("Min score can't be greater than max score.");
    const dupeName = existingGrades.find(e => e.grade.toLowerCase()===grade.toLowerCase() && (!isEdit || e.id!==g.id));
    if (dupeName) throw new Error(`"${grade}" already exists. Edit that one instead of adding a duplicate.`);
    const overlap = existingGrades.find(e => (!isEdit || e.id!==g.id) && min_score <= Number(e.max_score) && max_score >= Number(e.min_score));
    if (overlap) throw new Error(`That range overlaps with "${overlap.grade}" (${overlap.min_score}–${overlap.max_score}%). Adjust the range so ranges don't repeat.`);
    const payload = { grade, min_score, max_score, remark: val(ov,"f_remark").trim() || null };
    if (isEdit) await dbUpdate("grades", g.id, payload); else await dbInsert("grades", payload);
    gradesCache = null;
    renderGrades(body);
  }, { saveLabel: isEdit ? "Save changes" : "Add" });
}

function openSubjectModal(body, classes, s, linkedClassIds) {
  const isEdit = !!s;
  openModal(isEdit ? "Edit subject" : "New subject", `
    <div class="field"><label>Subject name</label><input id="f_name" placeholder="Mathematics" value="${s?.name||''}"/></div>
    <div class="field"><label>Code</label><input id="f_code" placeholder="MTH" value="${s?.code||''}"/></div>
    <div class="field"><label>Linked classes</label>
      <div style="max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:8px;">
        ${classes.length ? classes.map(c=>`
          <label style="display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13.5px;">
            <input type="checkbox" class="f_classlink" value="${c.id}" style="width:auto;" ${linkedClassIds.includes(c.id)?'checked':''}/>
            ${c.name}${c.section?(' '+c.section):''}

        `).join("") : `<div style="color:var(--ink-soft);font-size:13px;padding:4px;">Create a class first in Setup.</div>`}
      </div>
    </div>
  `, async (ov) => {

    let subjectId = s?.id;
    if (isEdit) await dbUpdate("subjects", subjectId, payload);
    else { const created = await dbInsert("subjects", payload); subjectId = created[0].id; }
    const selectedIds = [...ov.querySelectorAll(".f_classlink:checked")].map(cb=>cb.value);
    const toAdd = selectedIds.filter(id => !linkedClassIds.includes(id));
    const toRemove = linkedClassIds.filter(id => !selectedIds.includes(id));
    if (toAdd.length) await dbInsert("class_subjects", toAdd.map(class_id => ({ class_id, subject_id: subjectId })));
    for (const class_id of toRemove) { await sb(`/rest/v1/class_subjects?class_id=eq.${class_id}&subject_id=eq.${subjectId}`, { method:"DELETE" }); }
    renderSubjects(body);
  }, { saveLabel: isEdit ? "Save changes" : "Add" });
}

  pickInput.onchange = async () => {

  if (!isEdit) {
    const admInput = document.getElementById("f_adm");
    const genderSelect = document.getElementById("f_gender");
    genderSelect.onchange = () => { admInput.value = nextIdFor("student", genderSelect.value); };

/* ---- Student attendance: class list only, tap a class to mark it ---- */
async function renderStudentAttendance(body, opts={}) {
  const date = opts.date || new Date().toISOString().slice(0,10);
  const classes = await dbSelectActive("classes", { order:"name.asc" });
  body.innerHTML = `
    <div class="card">
      <div class="field"><label>Date</label><input id="attDate" type="text" class="datefield" readonly placeholder="Select date" value="${date}"/></div>
    </div>
    <div class="card" id="classListCard"><div class="center-loading">Loading…</div></div>
  `;
  document.getElementById("attDate").onchange = (e) => renderStudentAttendance(body, { date: e.target.value });
  const listCard = document.getElementById("classListCard");
  if (!classes.length) { listCard.innerHTML = emptyState("Create classes first in Setup."); return; }
  const [studentRows, takenToday] = await Promise.all([
    dbSelectActive("students", { status:"eq.active", select:"id,class_id" }),
    dbSelect("attendance", { date:`eq.${date}`, select:"class_id" }).catch(()=>[]),
  ]);
  const takenSet = new Set(takenToday.map(a=>a.class_id));
  listCard.innerHTML = "";
  classes.forEach(c => {
    const total = studentRows.filter(s=>s.class_id===c.id).length;
    const taken = takenSet.has(c.id);
    const row = el(`<div class="list-row" style="cursor:${taken?'pointer':'default'};">
      <div class="avatar">${initials(c.name)}</div>
      <div class="list-main">
        <div class="list-title">${c.name}${c.section?(' '+c.section):''}</div>
        <div class="list-sub">${total} student${total===1?'':'s'}</div>
        ${taken ? '' : `<button class="btn btn-primary btn-sm attClassBtn" style="margin-top:6px;padding:6px 10px;font-size:12.5px;">Take attendance</button>`}
      </div>
      ${taken ? `<span class="badge badge-green">Taken ✓</span>` : ``}
    </div>`);
    if (taken) {
      bindTapHold(row, {
        onTap: () => openClassAttendanceViewModal(c, date, () => openClassAttendanceModal(c, date, () => renderStudentAttendance(body, { date }))),
        onHold: () => openClassAttendanceModal(c, date, () => renderStudentAttendance(body, { date })),
      });
    } else {
      row.querySelector(".attClassBtn").onclick = (e) => { e.stopPropagation(); openClassAttendanceModal(c, date, () => renderStudentAttendance(body, { date })); };
    }
    listCard.appendChild(row);
  });
}

/* ---- Read-only view: who's present/absent in a class, with an edit shortcut ---- */
async function openClassAttendanceViewModal(cls, date, onEdit) {
  const overlay = el(`<div class="overlay"><div class="modal">
    <button class="modal-close">&times;</button>

    </div>
  </div></div>`);
  document.body.appendChild(overlay);
  enableModalKeyboardHandling(overlay);
  const close = () => overlay.remove();
  overlay.querySelector(".modal-close").onclick = close;
  overlay.querySelector("#modalCancel").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  overlay.querySelector("#editAttBtn").onclick = () => { close(); onEdit(); };

  const bodyEl = overlay.querySelector("#attViewBody");
  const [students, existing] = await Promise.all([

  ]);
  const marks = {}; existing.forEach(a => marks[a.student_id]=a.status);
  const presentCount = students.filter(s=>marks[s.id]==='present').length;
  const absentCount = students.filter(s=>marks[s.id]==='absent').length;
  bodyEl.innerHTML = (students.length ? `
    <div class="row" style="margin-bottom:10px;font-size:13px;font-weight:700;">
      <div style="color:var(--teal-dark);">${presentCount} present</div><div style="color:var(--red);">${absentCount} absent</div>
    </div>` : "") +
    (students.length ? students.map(s=>`
      <div class="view-row"><div class="vlabel">${s.full_name}</div><div class="vvalue">
        ${marks[s.id]==='present' ? `<span class="badge badge-green">Present</span>` : marks[s.id]==='absent' ? `<span class="badge badge-red">Absent</span>` : `<span class="badge badge-grey">Not marked</span>`}
      </div></div>
    `).join("") : emptyState("No active students in this class."));
}

/* ---- Modal: mark present/absent for every student in one class ---- */
async function openClassAttendanceModal(cls, date, onSaved) {
  const overlay = el(`<div class="overlay"><div class="modal">
    <button class="modal-close">&times;</button>
    <h3>${cls.name}${cls.section?(' '+cls.section):''} <span style="font-weight:500;font-size:12.5px;color:var(--ink-soft);">— ${date}</span></h3>
    <div id="attModalBody" style="margin-top:10px;"><div class="center-loading">Loading…</div></div>
    <div class="form-actions">
      <button class="btn btn-ghost" id="modalCancel">Close</button>
      <button class="btn btn-primary" id="saveAttBtn">Save attendance</button>
    </div>
  </div></div>`);
  document.body.appendChild(overlay);
  enableModalKeyboardHandling(overlay);
  const close = () => overlay.remove();
  overlay.querySelector(".modal-close").onclick = close;
  overlay.querySelector("#modalCancel").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };

  const bodyEl = overlay.querySelector("#attModalBody");
  const [students, existing] = await Promise.all([
    dbSelectActive("students", { class_id:`eq.${cls.id}`, status:"eq.active", order:"full_name.asc" }),
    dbSelect("attendance", { class_id:`eq.${cls.id}`, date:`eq.${date}` }).catch(()=>[]),
  ]);
  const marks = {}; existing.forEach(a => marks[a.student_id]=a.status);
  bodyEl.innerHTML = students.length ? "" : emptyState("No active students in this class.");
  const state = {};
  students.forEach(s => {
    state[s.id] = marks[s.id] || null;
    const row = el(`<div class="roll-row">
      <div class="roll-top">
        ${avatarHtml(s.full_name, s.photo_url)}
        <div class="list-main"><div class="roll-name">${s.full_name}</div><div class="roll-sub">${s.admission_no}</div></div>
      </div>
      <div class="att-btns" data-sid="${s.id}">
        <button class="att-btn p ${state[s.id]==='present'?'on':''}" data-v="present">Present</button>
        <button class="att-btn a ${state[s.id]==='absent'?'on':''}" data-v="absent">Absent</button>
      </div>
    </div>`);
    row.querySelectorAll(".att-btn").forEach(btn => {
      btn.onclick = () => {
        state[s.id] = btn.dataset.v;
        row.querySelectorAll(".att-btn").forEach(b=>b.classList.remove("on"));
        btn.classList.add("on");
      };
    });
    bodyEl.appendChild(row);
  });
  overlay.querySelector("#saveAttBtn").onclick = async (e) => {
    if (!students.length) { close(); return; }
    e.target.textContent = "Saving…"; e.target.disabled = true;
    try {
      const records = Object.entries(state).filter(([,v])=>v).map(([student_id,status])=>({ student_id, class_id: cls.id, date, status, marked_by: profile.id }));
      if (records.length) await dbUpsert("attendance", records, "student_id,date");
      toast("Attendance saved.", false);
      close();
      onSaved && onSaved();
    } catch(err) { toast(err.message); e.target.textContent = "Save attendance"; e.target.disabled=false; }
  };
}

      };
    });
    card.appendChild(row);
  });
  saveBtn.onclick = async (e) => {
    e.target.textContent = "Saving…"; e.target.disabled = true;
    try {
      const records = Object.entries(state).filter(([,v])=>v).map(([teacher_id,status])=>({ teacher_id, date, status, marked_by: profile.id }));
      if (records.length) await dbUpsert("staff_attendance", records, "teacher_id,date");
      e.target.textContent = "Saved ✓";
      setTimeout(()=>{ e.target.textContent = "Save attendance"; e.target.disabled=false; }, 1400);
    } catch(err) { toast(err.message); e.target.textContent = "Save attendance"; e.target.disabled=false; }
  };
}

/* ---------------- SCHOOL HEALTH (admin-only overview) ----------------
   A single at-a-glance dashboard combining fees, results, attendance and
   staffing. Only visible to profiles with full ("all") access — see the
   {id:"health",...} NAV entry above, which is deliberately left out of
   every DEPARTMENTS access list except Administration's "all". */
const LOW_ATTENDANCE_THRESHOLD = 75; // % present, below this a student is flagged
const ATT_WINDOW_DAYS = 30;          // rolling window used for both student & teacher attendance rates
function daysAgoISO(n) { const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

async function renderSchoolHealth(container) {
  container.innerHTML = `<div class="center-loading">Loading…</div>`;
  const today = new Date().toISOString().slice(0,10);
  const windowStart = daysAgoISO(ATT_WINDOW_DAYS);

  const [students, teachers, classesAll, feePayments, feeStructures, examsRaw, examResults, attWindow, staffAttWindow, staffAttToday] = await Promise.all([
    dbSelectActive("students", { status:"eq.active", select:"id,full_name,admission_no,class_id,photo_url,classes(name,section)" }),
    dbSelectActive("teachers", { status:"eq.active", select:"id,full_name,photo_url,specialty,staff_no" }),
    dbSelectActive("classes", { select:"id,name,section" }),
    dbSelect("fee_payments", { select:"student_id,amount_paid" }).catch(()=>[]),
    dbSelect("fee_structures", { select:"class_id,amount" }).catch(()=>[]),
    dbSelectActive("exams", { select:"id,class_id" }).catch(()=>[]),
    dbSelect("exam_results", { select:"exam_id,marks_obtained,max_marks" }).catch(()=>[]),
    dbSelect("attendance", { date:`gte.${windowStart}`, select:"student_id,status" }).catch(()=>[]),
    dbSelect("staff_attendance", { date:`gte.${windowStart}`, select:"teacher_id,status" }).catch(()=>[]),
    dbSelect("staff_attendance", { date:`eq.${today}`, select:"teacher_id,status" }).catch(()=>[]),
  ]);

  // ---- Fees: total collected & outstanding balances (assigned − paid, summed across all active students) ----
  const totalCollected = feePayments.reduce((a,p)=>a+Number(p.amount_paid||0),0);
  const classAssigned = {};
  feeStructures.forEach(s => { classAssigned[s.class_id] = (classAssigned[s.class_id]||0) + Number(s.amount||0); });
  const paidByStudent = {};
  feePayments.forEach(p => { paidByStudent[p.student_id] = (paidByStudent[p.student_id]||0) + Number(p.amount_paid||0); });
  const outstanding = students.reduce((sum,s) => {
    const assigned = classAssigned[s.class_id] || 0;
    const paid = paidByStudent[s.id] || 0;
    return sum + Math.max(assigned - paid, 0);
  }, 0);

  // ---- Top performing class: highest weighted average score across all recorded exam results ----
  const examClassMap = {}; examsRaw.forEach(x=>examClassMap[x.id]=x.class_id);
  const classPerf = {};
  examResults.forEach(r => {
    const cid = examClassMap[r.exam_id];
    if (!cid) return;
    if (!classPerf[cid]) classPerf[cid] = { obtained:0, max:0 };
    classPerf[cid].obtained += Number(r.marks_obtained||0);
    classPerf[cid].max += Number(r.max_marks||0);
  });
  let topClassId = null, topPct = -1;
  Object.entries(classPerf).forEach(([cid,v]) => {
    if (!v.max) return;
    const pct = v.obtained/v.max*100;
    if (pct > topPct) { topPct = pct; topClassId = cid; }
  });
  const classMap = {}; classesAll.forEach(c=>classMap[c.id]=c);
  const topClassName = topClassId && classMap[topClassId] ? (classMap[topClassId].name + (classMap[topClassId].section?(' '+classMap[topClassId].section):'')) : null;

  // ---- Students with low attendance (rolling window) ----
  const studentAttAgg = {};
  attWindow.forEach(a => {
    if (!studentAttAgg[a.student_id]) studentAttAgg[a.student_id] = { present:0, total:0 };
    studentAttAgg[a.student_id].total++;
    if (a.status === "present") studentAttAgg[a.student_id].present++;
  });
  const activeIds = new Set(students.map(s=>s.id));
  const lowAttendanceStudents = Object.entries(studentAttAgg)
    .filter(([sid,v]) => activeIds.has(sid) && v.total>0 && (v.present/v.total*100) < LOW_ATTENDANCE_THRESHOLD)
    .map(([sid,v]) => ({ id:sid, rate:(v.present/v.total*100), present:v.present, total:v.total }));

  // ---- Teacher attendance: today's snapshot + rolling-window performance ----
  const presentToday = staffAttToday.filter(a=>a.status==="present").length;
  const absentToday = staffAttToday.filter(a=>a.status==="absent").length;
  const teacherAttAgg = {};
  staffAttWindow.forEach(a => {
    if (!teacherAttAgg[a.teacher_id]) teacherAttAgg[a.teacher_id] = { present:0, total:0 };
    teacherAttAgg[a.teacher_id].total++;
    if (a.status === "present") teacherAttAgg[a.teacher_id].present++;
  });
  const overallTeacherRate = staffAttWindow.length ? (staffAttWindow.filter(a=>a.status==="present").length/staffAttWindow.length*100) : null;

  container.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="num">${currency()}${totalCollected.toLocaleString()}</div><div class="lbl">Total fees collected</div></div>
      <div class="stat"><div class="num" style="color:${outstanding>0?'var(--red)':'var(--teal-dark)'};">${currency()}${outstanding.toLocaleString()}</div><div class="lbl">Outstanding fee balances</div></div>
      <div class="stat"><div class="num" style="font-size:17px;">${topClassName || "—"}</div><div class="lbl">Top performing class${topPct>=0?` · ${topPct.toFixed(1)}%`:""}</div></div>
      <div class="stat"><div class="num">${students.length}</div><div class="lbl">Total students</div></div>
      <div class="stat" id="lowAttStat" style="cursor:pointer;"><div class="num" style="color:${lowAttendanceStudents.length?'var(--red)':'var(--teal-dark)'};">${lowAttendanceStudents.length}</div><div class="lbl">Students with low attendance</div></div>
      <div class="stat"><div class="num">${teachers.length}</div><div class="lbl">Total teachers</div></div>
      <div class="stat"><div class="num" style="color:var(--teal-dark);">${presentToday}</div><div class="lbl">Teachers present today</div></div>
      <div class="stat"><div class="num" style="color:${absentToday?'var(--red)':'var(--ink)'};">${absentToday}</div><div class="lbl">Teachers absent today</div></div>
    </div>
    <div class="card" id="teacherPerfPanel"><div class="center-loading">Loading…</div></div>
  `;
  document.getElementById("lowAttStat").onclick = () => renderLowAttendanceList(container, lowAttendanceStudents, students, windowStart);
  renderTeacherAttendancePerformance(document.getElementById("teacherPerfPanel"), teachers, teacherAttAgg, overallTeacherRate);
}

/* ---- School Health panel: Teacher Attendance Performance (rolling window, worst first) ---- */
function renderTeacherAttendancePerformance(body, teachers, teacherAttAgg, overallRate) {
  const rows = teachers.map(t => {
    const agg = teacherAttAgg[t.id] || { present:0, total:0 };
    const pct = agg.total ? (agg.present/agg.total*100) : null;
    return { teacher:t, pct, present:agg.present, total:agg.total };
  }).sort((a,b) => (a.pct===null?101:a.pct) - (b.pct===null?101:b.pct));
  const rowsHtml = rows.map(r => {
    const barPct = r.pct===null ? 0 : r.pct;
    const color = r.pct===null ? 'var(--slate)' : barPct>=90 ? 'var(--teal)' : barPct>=75 ? 'var(--amber)' : 'var(--red)';
    const label = r.pct===null ? 'No records' : `${r.present}/${r.total} · ${barPct.toFixed(0)}%`;
    return `<div style="margin-bottom:12px;">
      <div class="row" style="margin-bottom:5px;font-size:13px;">
        <div style="font-weight:700;color:var(--ink);">${r.teacher.full_name}</div>
        <div style="color:var(--ink-soft);font-weight:600;">${label}</div>
      </div>
      <div style="background:var(--card-alt);border-radius:999px;height:9px;overflow:hidden;">
        <div style="width:${barPct}%;height:100%;background:${color};border-radius:999px;"></div>
      </div>
    </div>`;
  }).join("");
  body.innerHTML = `<div class="section-head" style="margin-bottom:14px;">
      <h3 style="color:var(--purple);margin:0;">Teacher Attendance Performance</h3>
      ${overallRate!==null ? `<span class="badge ${overallRate>=90?'badge-green':overallRate>=75?'badge-amber':'badge-red'}">${overallRate.toFixed(0)}% overall · last ${ATT_WINDOW_DAYS}d</span>` : ""}
    </div>
    ${rows.length ? rowsHtml : emptyState("No teachers yet.")}`;
}

/* ---- School Health drill-down: full list of students under the attendance threshold ---- */
function renderLowAttendanceList(container, lowList, students, windowStart) {
  const studentMap = {}; students.forEach(s=>studentMap[s.id]=s);
  const rows = lowList
    .map(l => ({ ...l, student: studentMap[l.id] }))
    .filter(l => l.student)
    .sort((a,b) => a.rate - b.rate);
  container.innerHTML = `
    <button class="btn btn-ghost btn-sm" id="backBtn" style="margin-bottom:12px;">${ic.back} Back to School Health</button>
    <div class="section-head"><h3 style="color:var(--red);">Students with low attendance</h3></div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin:-6px 0 14px;">Attendance below ${LOW_ATTENDANCE_THRESHOLD}% over the last ${ATT_WINDOW_DAYS} days (since ${formatDate(windowStart)}).</p>
    <div class="card" id="lowAttList"></div>
  `;
  document.getElementById("backBtn").onclick = () => renderSchoolHealth(container).catch(errShow(container));
  const list = document.getElementById("lowAttList");
  list.innerHTML = rows.length ? "" : emptyState("No students currently below the attendance threshold.");
  rows.forEach(r => {
    const s = r.student;
    const className = s.classes ? (s.classes.name + (s.classes.section?(' '+s.classes.section):'')) : "Unassigned";
    const row = el(`<div class="list-row">${avatarHtml(s.full_name, s.photo_url, 40)}
      <div class="list-main"><div class="list-title">${s.full_name}</div><div class="list-sub">${s.admission_no||''} · ${className}</div></div>
      <div style="text-align:right;"><div style="font-weight:800;color:var(--red);">${r.rate.toFixed(0)}%</div><div style="font-size:11px;color:var(--ink-soft);">${r.present}/${r.total} days</div></div>
    </div>`);
    list.appendChild(row);
  });
}

/* ---------------- FEES ---------------- */
async function renderFees(container, sub="payments") {
  container.innerHTML = `<div class="pill-row" id="pills"></div><div id="secBody"><div class="center-loading">Loading…</div></div>`;
  const pills = document.getElementById("pills");
  [["payments","Record payment"],["history","Payment history"],["structure","Fee structure"],["health","Fees Health"],["status","Payment Status"],["reminders","Reminders"]].forEach(([id,label])=>{

    p.onclick = () => renderFees(container, id);
    pills.appendChild(p);
  });
  const body = document.getElementById("secBody");
  if (sub==="structure") return renderFeeStructure(body);
  if (sub==="payments") return renderFeePayment(body);

  if (sub==="health") return renderFeesHealth(body);
  if (sub==="status") return renderFeeStatus(body);

/* ---- Fees Health Dashboard — Current Term / Last Term / Previous Terms,
   each with a clickable "Total Payments" figure that opens the list of
   every student who paid within that group. ---- */
async function renderFeesHealth(body) {
  const [terms, payments] = await Promise.all([
    dbSelectActive("terms", { order:"start_date.desc" }),
    dbSelect("fee_payments", { select:"student_id,amount_paid,term_id,students(full_name,admission_no,photo_url,classes(name,section))" }).catch(()=>[]),
  ]);
  if (!terms.length) { body.innerHTML = emptyState("Create terms first in Setup, then come back to see fee health."); return; }
  const sorted = [...terms].sort((a,b) => new Date(b.start_date) - new Date(a.start_date));
  const currentTerm = sorted.find(t => t.is_current) || sorted[0];
  const currentIdx = sorted.findIndex(t => t.id === currentTerm.id);
  const lastTerm = sorted[currentIdx + 1] || null;
  const previousTerms = sorted.slice(currentIdx + 2);

  function groupStats(termList) {
    const ids = new Set(termList.map(t => t.id));
    const rows = payments.filter(p => ids.has(p.term_id));
    const total = rows.reduce((a,p) => a + Number(p.amount_paid||0), 0);
    const studentIds = new Set(rows.map(p => p.student_id));
    return { total, studentCount: studentIds.size, rows };
  }
  function termRangeLabel(termList) {
    if (!termList.length) return "No term yet";
    return termList.map(t => t.name).join(", ");
  }
  function feeHealthCard(key, title, termList, stats) {
    if (!termList.length) {
      return `<div class="card"><h3 style="color:var(--red);margin-bottom:4px;">${title}</h3>${emptyState("No term in this group yet.")}</div>`;
    }
    return `<div class="card">
      <h3 style="color:var(--red);margin-bottom:2px;">${title}</h3>
      <div class="tiny-note" style="margin:0 0 10px;text-align:left;">${termRangeLabel(termList)}</div>
      <div class="stat-grid">
        <div class="stat" id="fh_total_${key}" style="cursor:pointer;"><div class="num">${currency()}${stats.total.toLocaleString()}</div><div class="lbl">Total Payments</div></div>
        <div class="stat"><div class="num">${stats.studentCount}</div><div class="lbl">Students paid</div></div>
      </div>
    </div>`;
  }

  const curStats = groupStats([currentTerm]);
  const lastStats = groupStats(lastTerm ? [lastTerm] : []);
  const prevStats = groupStats(previousTerms);

  body.innerHTML = `
    <div class="section-head"><h3 style="color:var(--red);">Fees Health Dashboard</h3></div>
    ${feeHealthCard("current", "Current Term", [currentTerm], curStats)}
    ${feeHealthCard("last", "Last Term", lastTerm ? [lastTerm] : [], lastStats)}
    ${feeHealthCard("previous", "Previous Terms", previousTerms, prevStats)}
  `;
  const bind = (key, title, termList, stats) => {
    if (!termList.length) return;
    const el2 = document.getElementById(`fh_total_${key}`);
    if (el2) el2.onclick = () => renderPaidStudentsList(body, title, stats.rows);
  };
  bind("current", "Current Term — Students who have paid", [currentTerm], curStats);
  bind("last", "Last Term — Students who have paid", lastTerm ? [lastTerm] : [], lastStats);
  bind("previous", "Previous Terms — Students who have paid", previousTerms, prevStats);
}
// Aggregates payment rows per student (a student may have paid more than once
// in the group) then lists them, each showing how much they've paid in total.
function renderPaidStudentsList(body, title, rows) {
  const byStudent = new Map();
  rows.forEach(p => {
    const sid = p.student_id;
    if (!byStudent.has(sid)) byStudent.set(sid, { student: p.students, total: 0 });
    byStudent.get(sid).total += Number(p.amount_paid||0);
  });
  const list = [...byStudent.values()].filter(e => e.student).sort((a,b) => b.total - a.total);
  body.innerHTML = `
    <button class="btn btn-ghost btn-sm" id="backBtn" style="margin-bottom:12px;">${ic.back} Back to Fees Health</button>
    <div class="section-head"><h3 style="color:var(--red);">${title}</h3></div>
    <div class="card" id="paidList"></div>
  `;
  document.getElementById("backBtn").onclick = () => renderFeesHealth(body);
  const paidList = document.getElementById("paidList");
  paidList.innerHTML = list.length ? "" : emptyState("No payments recorded for this period yet.");
  list.forEach(({ student:s, total }) => {
    const className = s.classes ? (s.classes.name + (s.classes.section?(' '+s.classes.section):'')) : "Unassigned";
    const row = el(`<div class="list-row">${avatarHtml(s.full_name, s.photo_url, 40)}
      <div class="list-main"><div class="list-title">${s.full_name}</div><div class="list-sub">${s.admission_no||''} · ${className}</div></div>
      <div style="text-align:right;font-weight:800;color:var(--teal-dark);">${currency()}${total.toLocaleString()}</div>
    </div>`);
    paidList.appendChild(row);
  });
}

/* ---- Payment Status — every active student's overall paid percentage
   (total ever paid vs. total ever assigned across their class's fee
   structure), with quick bracket filters for chasing unpaid balances.
   Clicking a student opens their full payment history & receipts. ---- */
const FEE_PCT_BRACKETS = [
  ["below30", "Below 30%", (p) => p < 30],
  ["50", "50%", (p) => p >= 30 && p < 50],
  ["75", "75%", (p) => p >= 50 && p < 75],
  ["100", "100%", (p) => p >= 75],
];
async function renderFeeStatus(body, bracketKey="") {
  const [students, structures, payments] = await Promise.all([
    dbSelect("students", { status:"eq.active", select:"id,full_name,admission_no,photo_url,class_id,classes(name,section)", order:"full_name.asc" }),
    dbSelectActive("fee_structures", { select:"class_id,amount" }).catch(()=>[]),
    dbSelect("fee_payments", { select:"student_id,amount_paid" }).catch(()=>[]),
  ]);
  const assignedByClass = {};
  structures.forEach(s => { assignedByClass[s.class_id] = (assignedByClass[s.class_id]||0) + Number(s.amount||0); });
  const paidByStudent = {};
  payments.forEach(p => { paidByStudent[p.student_id] = (paidByStudent[p.student_id]||0) + Number(p.amount_paid||0); });
  const rows = students.map(s => {
    const assigned = assignedByClass[s.class_id] || 0;
    const paid = paidByStudent[s.id] || 0;
    const pct = assigned > 0 ? Math.min(100, (paid/assigned)*100) : (paid > 0 ? 100 : 0);
    return { student: s, assigned, paid, pct };
  });
  const bracket = FEE_PCT_BRACKETS.find(b => b[0]===bracketKey);
  const filtered = bracket ? rows.filter(r => bracket[2](r.pct)) : rows;
  filtered.sort((a,b) => a.pct - b.pct);

  body.innerHTML = `
    <div class="section-head"><h3 style="color:var(--red);">Payment Status</h3></div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin:-6px 0 12px;">Each student's total paid vs. their class's total assigned fees, across all terms. Tap a student to see their full payment history and receipts.</p>
    <div class="pill-row" id="pctPills"></div>
    <div class="card" id="statusList"></div>
  `;
  const pctPills = document.getElementById("pctPills");
  const allPill = el(`<div class="pill ${!bracketKey?'active':''}">All (${rows.length})</div>`);
  allPill.onclick = () => renderFeeStatus(body, "");
  pctPills.appendChild(allPill);
  FEE_PCT_BRACKETS.forEach(([key,label,test]) => {
    const count = rows.filter(r=>test(r.pct)).length;
    const p = el(`<div class="pill ${bracketKey===key?'active':''}">${label} (${count})</div>`);
    p.onclick = () => renderFeeStatus(body, key);
    pctPills.appendChild(p);
  });
  const list = document.getElementById("statusList");
  list.innerHTML = filtered.length ? "" : emptyState("No students match this filter.");
  filtered.forEach(({ student:s, assigned, paid, pct }) => {
    const className = s.classes ? (s.classes.name + (s.classes.section?(' '+s.classes.section):'')) : "Unassigned";
    const color = pct>=100 ? 'var(--teal-dark)' : pct>=50 ? 'var(--amber-dark)' : 'var(--red)';
    const row = el(`<div class="list-row">${avatarHtml(s.full_name, s.photo_url, 40)}
      <div class="list-main"><div class="list-title">${s.full_name}</div><div class="list-sub">${s.admission_no||''} · ${className} · ${currency()}${paid.toLocaleString()} / ${currency()}${assigned.toLocaleString()}</div></div>
      <div style="text-align:right;font-weight:800;color:${color};">${pct.toFixed(0)}%</div>${ic.chevronRight}
    </div>`);
    row.onclick = () => renderStaffStudentFeeDetail(body, s, () => renderFeeStatus(body, bracketKey));
    list.appendChild(row);
  });
}
/* ---- Staff-side view of one student's fee balance by term, full payment
   history and receipts — the Finance-side equivalent of the parent portal's
   own child fee detail page. Receipts here are the same immutable
   openReceiptModal used everywhere else: view/print only, never editable. ---- */
async function renderStaffStudentFeeDetail(body, student, onBack) {
  body.innerHTML = `<div class="center-loading">Loading…</div>`;
  const className = student.classes ? (student.classes.name + (student.classes.section ? (' '+student.classes.section) : '')) : "Unassigned";
  const [structure, payments] = await Promise.all([
    dbSelect("fee_structures", { class_id:`eq.${student.class_id||'null'}`, select:"*,terms(name)" }).catch(()=>[]),
    dbSelect("fee_payments", { student_id:`eq.${student.id}`, select:"*,terms(name)", order:"payment_date.desc" }).catch(()=>[]),
  ]);
  const totalAssigned = structure.reduce((a,b)=>a+Number(b.amount||0),0);
  const totalPaid = payments.reduce((a,b)=>a+Number(b.amount_paid||0),0);
  const totalDue = Math.max(totalAssigned-totalPaid,0);
  const termIds = [...new Set(structure.map(s=>s.term_id))];
  const termRowsHtml = termIds.map(tid => {
    const items = structure.filter(s=>s.term_id===tid);
    const termName = items[0]?.terms?.name || "Term";
    const due = items.reduce((a,b)=>a+Number(b.amount||0),0);
    const paidForTerm = payments.filter(p=>p.term_id===tid).reduce((a,b)=>a+Number(b.amount_paid||0),0);
    const bal = Math.max(due-paidForTerm,0);
    return `<div class="view-row"><div class="vlabel">${termName}</div><div class="vvalue">${currency()}${paidForTerm.toLocaleString()} / ${currency()}${due.toLocaleString()} <span style="color:${bal>0?'var(--red)':'var(--teal-dark)'};">(${currency()}${bal.toLocaleString()} due)</span></div></div>`;
  }).join("");
  body.innerHTML = `
    <button class="btn btn-ghost btn-sm" id="backBtn" style="margin-bottom:12px;">${ic.back} Back</button>
    <div class="card row" style="align-items:center;gap:12px;">
      ${avatarHtml(student.full_name, student.photo_url, 52)}
      <div><div style="font-weight:800;font-size:16px;color:var(--navy);">${student.full_name}</div><div class="tiny-note" style="margin:0;text-align:left;">${student.admission_no||''} · ${className}</div></div>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="num" style="font-size:20px;">${currency()}${totalPaid.toLocaleString()}</div><div class="lbl">Total paid</div></div>
      <div class="stat"><div class="num" style="font-size:20px;color:${totalDue>0?'var(--red)':'var(--teal-dark)'};">${currency()}${totalDue.toLocaleString()}</div><div class="lbl">Balance due</div></div>
    </div>
    <div class="card"><h3 style="color:var(--red);margin-bottom:10px;">Fee balance by term</h3>${termRowsHtml || emptyState("No fee structure set up yet for this class.")}</div>
    <div class="card">
      <h3 style="color:var(--teal-dark);margin-bottom:4px;">Payment history &amp; receipts</h3>
      <div class="tiny-note" style="margin:0 0 10px;text-align:left;">Once issued, a receipt is permanent — it cannot be edited or deleted, only viewed or reprinted.</div>
      <div id="payList"></div>
    </div>
  `;
  document.getElementById("backBtn").onclick = onBack;
  const payList = document.getElementById("payList");
  payList.innerHTML = payments.length ? "" : emptyState("No payments recorded yet.");
  payments.forEach(p => {
    const row = el(`<div class="list-row" style="gap:10px;"><div class="avatar">${ic.fees}</div>
      <div class="list-main"><div class="list-title">${currency()}${Number(p.amount_paid||0).toLocaleString()} · ${p.terms?.name||''}</div><div class="list-sub">${formatDate(p.payment_date)} · ${methodLabel(p.method)}</div></div>
      <button class="btn btn-ghost btn-sm" id="rcpt${p.id}">Receipt</button></div>`);

    row.onclick = () => openReceiptModal(p, student);
    payList.appendChild(row);
  });

async function renderFeeStructure(body) {
  const [classes, terms, items] = await Promise.all([
    dbSelectActive("classes", { order:"name.asc" }),
    dbSelectActive("terms", { order:"start_date.desc" }),
    dbSelectActive("fee_structures", { select:"class_id,amount" }),
  ]);
  if (!classes.length) { body.innerHTML = emptyState("Create a class first in Setup, then come back to set up fees."); return; }
  const byClass = {};
  items.forEach(i => {
    const k = i.class_id;
    if (!byClass[k]) byClass[k] = { count:0, total:0 };
    byClass[k].count++;
    byClass[k].total += Number(i.amount);
  });
  body.innerHTML = `<div class="section-head"><h3 style="color:var(--red);">Fee Structure</h3></div><div style="font-size:13px;color:var(--ink-soft);margin-bottom:12px;">Select a class to view or set up its fee items.</div><div class="card" id="list"></div>`;
  const list = document.getElementById("list");
  classes.forEach(c => {
    const stat = byClass[c.id] || { count:0, total:0 };
    const row = el(`<div class="list-row"><div class="avatar">${ic.fees}</div>
      <div class="list-main"><div class="list-title">${c.name}${c.section?(' '+c.section):''}</div>
      <div class="list-sub">${stat.count} fee item${stat.count===1?'':'s'}${stat.count?` · ${currency()}${stat.total.toLocaleString()}`:''}</div></div>
      <div style="color:var(--ink-soft);display:flex;align-items:center;">${ic.chevronRight}</div></div>`);
    row.onclick = () => renderFeeStructureClass(body, c, terms);
    list.appendChild(row);
  });
}

function openFeeItemModal(body, cls, terms, f, onDone) {
  const isEdit = !!f;
  const done = onDone || (() => {});
  const classLabel = `<div class="field"><label>Class</label><div style="padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--card-alt);font-weight:700;color:var(--navy);">${cls.name}${cls.section?(' '+cls.section):''}</div></div>`;

  // Editing an existing single fee item — keep this a focused one-item form.
  if (isEdit) {
    openModal("Edit fee item", `
      ${classLabel}
      <div class="field"><label>Term</label><select id="f_term">${terms.map(t=>`<option value="${t.id}" ${f.term_id===t.id?'selected':''}>${t.name}</option>`).join("")}</select></div>
      <div class="grid2">
        <div class="field"><label>Item name</label><input id="f_item" placeholder="Tuition" value="${f.item_name||''}"/></div>
        <div class="field"><label>Amount</label><input id="f_amount" type="number" placeholder="50000" value="${f.amount||''}"/></div>
      </div>
    `, async (ov)=>{
      const payload = { class_id: cls.id, term_id: val(ov,"f_term"), item_name: val(ov,"f_item"), amount: Number(val(ov,"f_amount")) };
      await dbUpdate("fee_structures", f.id, payload);
      done();
    }, { saveLabel: "Save changes" });
    return;
  }

  // Adding new fee items — allow multiple item rows (Tuition, Uniform, Development fund, etc.)
  // with rows that can be added or cleared, and a running total shown at the bottom.
  let rowCount = 0;
  const makeRowHtml = () => {
    rowCount++;
    return `<div class="feeItemRow" data-row="${rowCount}" style="display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;">
      <div class="field" style="flex:1.5;margin-bottom:0;">${rowCount===1?'<label>Item name</label>':''}<input class="fi-name" placeholder="e.g. Tuition, Uniform, Development fund"/></div>
      <div class="field" style="flex:1;margin-bottom:0;">${rowCount===1?'<label>Amount</label>':''}<input class="fi-amount" type="number" placeholder="0"/></div>
      <button type="button" class="btn btn-ghost btn-sm fi-remove" title="Remove item" style="padding:10px 12px;flex-shrink:0;">&times;</button>
    </div>`;
  };
  const firstRowHtml = makeRowHtml();

  const overlay = openModal("New fee items", `
    ${classLabel}
    <div class="field"><label>Term</label><select id="f_term">${terms.map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}</select></div>
    <div id="feeItemsWrap">${firstRowHtml}</div>
    <button type="button" class="link-btn" id="addItemRowBtn">${ic.plus} Add another item</button>
    <div class="row" style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px;">
      <div style="font-weight:700;color:var(--navy);">Total</div>
      <div style="font-weight:800;font-size:17px;color:var(--red);" id="feeItemsTotal">${currency()}0</div>
    </div>
  `, async (ov) => {
    const termId = val(ov,"f_term");
    const payloads = Array.from(ov.querySelectorAll(".feeItemRow")).map(r => ({
      class_id: cls.id,
      term_id: termId,
      item_name: r.querySelector(".fi-name").value.trim(),
      amount: Number(r.querySelector(".fi-amount").value),
    })).filter(p => p.item_name && p.amount > 0);
    if (!payloads.length) throw new Error("Add at least one fee item with a name and an amount.");
    await dbInsert("fee_structures", payloads);
    done();
  }, { saveLabel: "Add items" });

  const wrap = overlay.querySelector("#feeItemsWrap");
  const totalEl = overlay.querySelector("#feeItemsTotal");
  const recalcTotal = () => {
    const total = Array.from(overlay.querySelectorAll(".fi-amount")).reduce((a,i)=>a+(Number(i.value)||0), 0);
    totalEl.textContent = currency() + total.toLocaleString();
  };
  const bindRow = (rowEl) => {
    rowEl.querySelector(".fi-amount").addEventListener("input", recalcTotal);
    rowEl.querySelector(".fi-name").addEventListener("input", recalcTotal);
    rowEl.querySelector(".fi-remove").onclick = () => {
      // If it's the only row left, clear it instead of removing it entirely.
      if (overlay.querySelectorAll(".feeItemRow").length <= 1) {
        rowEl.querySelector(".fi-name").value = "";
        rowEl.querySelector(".fi-amount").value = "";
        recalcTotal();
        return;
      }
      rowEl.remove();
      recalcTotal();
    };
  };
  wrap.querySelectorAll(".feeItemRow").forEach(bindRow);
  overlay.querySelector("#addItemRowBtn").onclick = () => {
    const holder = document.createElement("div");
    holder.innerHTML = makeRowHtml();
    const rowEl = holder.firstChild;
    wrap.appendChild(rowEl);
    bindRow(rowEl);
    rowEl.querySelector(".fi-name").focus();
  };
}
async function renderFeePayment(body) {
  const [students, terms, classes] = await Promise.all([
    dbSelect("students", { status:"eq.active", select:"id,full_name,admission_no,class_id", order:"full_name.asc" }),
    dbSelect("terms", { order:"start_date.desc" }),

  ]);

    body.innerHTML = emptyState(!students.length ? "Register an active student first." : "Create a term first in Setup.");
    return;
  }
  const studentOptionsHtml = (list) => `<option value="">— Select student —</option>` + list.map(s=>`<option value="${s.id}" data-class="${s.class_id||''}">${s.full_name} (${s.admission_no})</option>`).join("");
  body.innerHTML = `
    <div class="card">
      <div class="field"><label>Filter by class</label><select id="f_classFilter"><option value="">All classes</option>${classes.map(c=>`<option value="${c.id}">${c.name}${c.section?(' '+c.section):''}</option>`).join("")}</select></div>
      <div class="field"><label>Student</label><select id="f_student">${studentOptionsHtml(students)}</select></div>
      <div class="field"><label>Term</label><select id="f_term"><option value="">— Select term —</option>${terms.map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}</select></div>
      <div id="balanceInfo" style="font-size:13px;color:var(--ink-soft);margin-bottom:10px;"></div>
      <div class="grid2">
        <div class="field"><label>Amount paid</label><input id="f_amount" type="number" placeholder="20000"/></div>
        <div class="field"><label>Method</label><select id="f_method">
          <option value="cash">Cash</option><option value="bank_transfer">Bank transfer</option><option value="card">Card</option><option value="mobile_money">Mobile money</option><option value="other">Other</option>
        </select></div>
      </div>
      <div class="field"><label>Note (optional)</label><input id="f_note"/></div>
      <button class="btn btn-primary" id="payBtn" style="width:100%;">Record payment</button>
      <div id="payMsg"></div>
      <div class="tiny-note" style="margin-top:10px;text-align:left;">Once recorded, a payment and its receipt are permanent — they can't be edited or deleted afterwards, so double-check the details before saving.</div>
      <details style="margin-top:10px;"><summary style="cursor:pointer;font-size:12px;color:var(--ink-soft);">Enforce this at the database level too (optional, one-time)</summary>
      <pre style="background:var(--card-alt);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:11px;overflow-x:auto;white-space:pre-wrap;margin-top:8px;">${FEE_PAYMENTS_READONLY_SQL}</pre></details>
    </div>`;
  const classFilterSel = document.getElementById("f_classFilter");
  const studentSel = document.getElementById("f_student");
  const termSel = document.getElementById("f_term");
  const balanceEl = document.getElementById("balanceInfo");
  classFilterSel.onchange = () => {
    const cid = classFilterSel.value;
    const filtered = cid ? students.filter(s => s.class_id === cid) : students;
    studentSel.innerHTML = studentOptionsHtml(filtered);
    balanceEl.innerHTML = "";
  };
  async function refreshBalance() {
    const sid = studentSel.value;
    const tid = termSel.value;
    if (!sid || !tid) { balanceEl.innerHTML = ""; return; }
    const classId = studentSel.selectedOptions[0].dataset.class;
    const [structure, payments] = await Promise.all([
      dbSelect("fee_structures", { class_id:`eq.${classId}`, term_id:`eq.${tid}` }),
      dbSelect("fee_payments", { student_id:`eq.${sid}`, term_id:`eq.${tid}` }),
    ]);
    const total = structure.reduce((a,b)=>a+Number(b.amount),0);
    const paid = payments.reduce((a,b)=>a+Number(b.amount_paid),0);
    balanceEl.innerHTML = `Term fee: <b>${currency()}${total.toLocaleString()}</b> · Paid so far: <b>${currency()}${paid.toLocaleString()}</b> · Balance: <b style="color:${total-paid>0?'var(--red)':'var(--teal-dark)'}">${currency()}${(total-paid).toLocaleString()}</b>`;
  }
  studentSel.onchange = refreshBalance;
  termSel.onchange = refreshBalance;
  document.getElementById("payBtn").onclick = async (e) => {
    const msg = document.getElementById("payMsg"); msg.innerHTML = "";
    const sid = studentSel.value, tid = termSel.value, amt = Number(document.getElementById("f_amount").value);
    if (!sid) { msg.innerHTML = `<div class="err">Please select a student.</div>`; return; }
    if (!tid) { msg.innerHTML = `<div class="err">Please select a term.</div>`; return; }
    if (!amt || amt <= 0) { msg.innerHTML = `<div class="err">Enter a valid amount.</div>`; return; }
    try {
      await dbInsert("fee_payments", {
        student_id: sid,
        term_id: tid,
        amount_paid: amt,
        method: document.getElementById("f_method").value,
        note: document.getElementById("f_note").value,
        received_by: profile.id,
      });
      msg.innerHTML = `<div class="msg-ok">Payment recorded.</div>`;
      document.getElementById("f_amount").value = "";
      document.getElementById("f_note").value = "";
      refreshBalance();
    } catch(err) { msg.innerHTML = `<div class="err">${err.message}</div>`; }
  };
}
function methodLabel(m) {
  const map = { cash:"Cash", bank_transfer:"Bank transfer", card:"Card", mobile_money:"Mobile money", other:"Other" };
  return map[m] || (m ? (m.charAt(0).toUpperCase()+m.slice(1).replace(/_/g," ")) : "");
}
function formatDate(d) {
  if (!d) return "";
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" });
}

/* ---------------- EXAMS ---------------- */
// A single, consistent label for an exam — exam type + class + term. No separate
// free-text "exam name" field anymore, so this can never show duplicated/repeated text.
function examLabel(x) {
  const type = x.exam_types?.name || x.name || "Exam";
  const cls = (x.classes?.name || "") + (x.classes?.section ? (" " + x.classes.section) : "");
  const term = x.terms?.name || "";
  return [type, cls, term].filter(Boolean).join(" • ");
}
function examDateRange(x) {
  if (x.exam_date && x.exam_end_date) return `${x.exam_date} → ${x.exam_end_date}`;
  return x.exam_date || x.exam_end_date || "";
}
// Guards every exam picker against showing the same class+term+exam-type more than once,
// even if duplicate rows already exist in the database from before.
function dedupeExams(exams) {
  const seen = new Set(); const out = [];
  exams.forEach(x => {
    const key = `${x.class_id}|${x.term_id}|${x.exam_type_id}`;
    if (seen.has(key)) return;
    seen.add(key); out.push(x);
  });
  return out;
}
async function renderExams(container, sub="exams") {
  container.innerHTML = `<div class="pill-row" id="pills"></div><div id="secBody"><div class="center-loading">Loading…</div></div>`;

  [["exams","Exams"],["enter","Enter results"],["results","Results"],["report","Report card"]].forEach(([id,label])=>{
    const p = el(`<div class="pill ${sub===id?'active':''}">${label}</div>`);
    p.onclick = () => renderExams(container, id);
    pills.appendChild(p);
  });
  const body = document.getElementById("secBody");
  if (sub==="exams") return renderExamList(body);
  if (sub==="enter") return renderEnterResults(body);
  if (sub==="results") return renderResultsOverview(body);
  if (sub==="report") return renderReportCard(body);
}

    <pre style="background:var(--card-alt);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:11px;overflow-x:auto;white-space:pre-wrap;margin-top:8px;">${EXAM_MIGRATION_SQL}</pre></details>
    <div class="card" id="list"></div>`;
  const list = document.getElementById("list");
  list.innerHTML = exams.length ? "" : emptyState("No exams created yet.");
  exams.forEach(x => {
    const title = x.exam_types?.name || x.name || "Exam";

      <div class="list-main"><div class="list-title">${title}</div>
      <div class="list-sub">${x.classes?.name||''} ${x.classes?.section||''} · ${x.terms?.name||''}${examDateRange(x)?(' · '+examDateRange(x)):''}</div></div></div>`);
    const view = () => openViewModal(title, [["Class", (x.classes?.name||'')+' '+(x.classes?.section||'')], ["Term", x.terms?.name], ["Start date", x.exam_date], ["End date", x.exam_end_date]], () => openExamModal(body, classes, terms, examTypes, exams, x));
    const edit = () => openExamModal(body, classes, terms, examTypes, exams, x);
    const del = async () => { if (await customConfirm(`Move "${title}" to trash?`, { danger:true, okLabel:"Move to trash" })) safe(async()=>{ await softDelete("exams", x.id); renderExamList(body); })(); };
    bindRowGestures(row, { onView:view, onEdit:edit, onDelete:del });

  document.getElementById("addBtn").onclick = () => {

    openExamModal(body, classes, terms, examTypes, exams, null);
  };
}
function openExamModal(body, classes, terms, examTypes, existingExams, x) {
  const isEdit = !!x;
  openModal(isEdit ? "Edit exam" : "New exam", `
    <div class="field"><label>Exam type</label><select id="f_examtype">${examTypes.map(t=>`<option value="${t.id}" ${x?.exam_type_id===t.id?'selected':''}>${t.name}</option>`).join("")}</select></div>
    <div class="field"><label>Class</label><select id="f_class">${isEdit ? "" : `<option value="__all__">— All Classes —</option>`}${classes.map(c=>`<option value="${c.id}" ${x?.class_id===c.id?'selected':''}>${c.name}${c.section?(' '+c.section):''}</option>`).join("")}</select>
    ${isEdit ? "" : `<div class="tiny-note" style="margin:6px 0 0;text-align:left;">Choose "All Classes" to create this exam for every class at once (skipping any class that already has one for this type and term).</div>`}</div>
    <div class="field"><label>Term</label><select id="f_term">${terms.map(t=>`<option value="${t.id}" ${x?.term_id===t.id?'selected':''}>${t.name}</option>`).join("")}</select></div>
    <div class="grid2">
      <div class="field"><label>Start date</label><input id="f_start" type="text" class="datefield" readonly placeholder="Select date" value="${x?.exam_date||''}"/></div>
      <div class="field"><label>End date</label><input id="f_end" type="text" class="datefield" readonly placeholder="Select date" value="${x?.exam_end_date||''}"/></div>
    </div>
  `, async (ov)=>{
    const exam_type_id = val(ov,"f_examtype")||null, class_id = val(ov,"f_class"), term_id = val(ov,"f_term");
    const typeName = examTypes.find(t=>t.id===exam_type_id)?.name || "Exam";
    const exam_date = val(ov,"f_start")||null, exam_end_date = val(ov,"f_end")||null;
    if (class_id === "__all__") {
      const already = new Set((existingExams||[]).filter(e => e.exam_type_id===exam_type_id && e.term_id===term_id).map(e=>e.class_id));
      const targetClasses = classes.filter(c => !already.has(c.id));
      if (!targetClasses.length) throw new Error("Every class already has an exam of this type for this term.");
      await dbInsert("exams", targetClasses.map(c => ({ name: typeName, exam_type_id, class_id: c.id, term_id, exam_date, exam_end_date })));
      renderExamList(body);
      toast(`Created for ${targetClasses.length} class${targetClasses.length===1?'':'es'}${already.size ? ` (${already.size} already had one and were skipped)` : ""}.`, false);
      return;
    }
    const dupe = (existingExams||[]).find(e => e.exam_type_id===exam_type_id && e.class_id===class_id && e.term_id===term_id && (!isEdit || e.id!==x.id));
    if (dupe) throw new Error("An exam of this type already exists for this class and term. Edit that one instead of creating a duplicate.");
    const payload = { name: typeName, exam_type_id, class_id, term_id, exam_date, exam_end_date };
    if (isEdit) await dbUpdate("exams", x.id, payload); else await dbInsert("exams", payload);
    renderExamList(body);
  }, { saveLabel: isEdit ? "Save changes" : "Add" });
}
async function renderEnterResults(body) {
  const examsRaw = await dbSelect("exams", { select:"*,classes(name,section),terms(name),exam_types(name,max_score)", order:"exam_date.desc" });
  // Dedupe by class+term+exam type so an "End of Term" exam (or any type) never shows twice.
  const exams = dedupeExams(examsRaw);
  await loadGrades(); // so the live Grade column below can use the admin-defined grade bands
  if (!exams.length) { body.innerHTML = emptyState("Create an exam first (see the Exams tab)."); return; }
  body.innerHTML = `<div class="card"><div class="field"><label>Select exam</label><select id="selExam">${exams.map(x=>`<option value="${x.id}" data-class="${x.class_id}" data-max="${x.exam_types?.max_score||100}">${examLabel(x)}</option>`).join("")}</select></div>
    <div class="field"><label>Subject</label><select id="selSubject"></select></div></div>
    <div id="resultsArea"><div class="center-loading">Choose an exam and subject</div></div>`;
  const selExam = document.getElementById("selExam");
  const selSubject = document.getElementById("selSubject");
  async function loadSubjects() {
    if (!selExam.value) return;
    const classId = selExam.selectedOptions[0].dataset.class;
    const cs = await dbSelect("class_subjects", { select:"subjects(id,name)", class_id:`eq.${classId}` });
    selSubject.innerHTML = cs.map(c=>`<option value="${c.subjects.id}">${c.subjects.name}</option>`).join("") || `<option value="">No subjects linked — add in Setup</option>`;
    loadGrid();
  }
  async function loadGrid() {
    const examId = selExam.value, subjectId = selSubject.value;
    const area = document.getElementById("resultsArea");
    if (!examId || !subjectId) { area.innerHTML = emptyState("Link subjects to this class in Setup first."); return; }
    const classId = selExam.selectedOptions[0].dataset.class;
    const maxScore = Number(selExam.selectedOptions[0].dataset.max) || 100;
    const [students, results] = await Promise.all([
      dbSelect("students", { class_id:`eq.${classId}`, status:"eq.active", order:"full_name.asc" }),
      dbSelect("exam_results", { exam_id:`eq.${examId}`, subject_id:`eq.${subjectId}` }),
    ]);
    const marksMap = {}, remarksMap = {};
    results.forEach(r=>{ marksMap[r.student_id]=r.marks_obtained; remarksMap[r.student_id]=r.remarks||""; });
    area.innerHTML = `<div class="card table-wrap"><table><thead><tr><th>Student</th><th>Marks</th><th>Max</th><th>Grade</th><th>Remarks</th></tr></thead><tbody id="gridBody"></tbody></table></div>
      <button class="btn btn-primary" id="saveResultsBtn" style="width:100%;">Save results</button><div id="resMsg"></div>`;
    const gb = document.getElementById("gridBody");
    students.forEach(s => {
      const mark = marksMap[s.id];
      const initialGrade = (mark !== undefined && mark !== null && mark !== "") ? gradeFor((Number(mark)/maxScore)*100) : "—";
      gb.appendChild(elRow(`<tr><td>${s.full_name}</td>
        <td><input type="number" max="${maxScore}" min="0" style="width:80px;padding:6px;border:1px solid var(--line);border-radius:6px;" data-sid="${s.id}" class="markInput" value="${marksMap[s.id]??''}"/></td>
        <td>${maxScore}</td>
        <td class="gradeCell" data-sid="${s.id}" style="font-weight:700;">${initialGrade}</td>
        <td><input type="text" placeholder="Teacher's remark…" style="width:100%;min-width:120px;padding:6px;border:1px solid var(--line);border-radius:6px;" data-sid="${s.id}" class="remarkInput" value="${remarksMap[s.id]||''}"/></td></tr>`));
    });
    // Live-update the Grade cell as marks are typed, using the admin-defined grade bands.
    gb.querySelectorAll(".markInput").forEach(inp => {
      inp.addEventListener("input", () => {
        const cell = gb.querySelector(`.gradeCell[data-sid="${inp.dataset.sid}"]`);
        if (!cell) return;
        cell.textContent = inp.value === "" ? "—" : gradeFor((Number(inp.value)/maxScore)*100);
      });
    });
    document.getElementById("saveResultsBtn").onclick = async () => {
      const msg = document.getElementById("resMsg");
      const markInputs = [...gb.querySelectorAll(".markInput")].filter(i=>i.value !== "");
      const records = markInputs.map(i => {
        const remarkEl = gb.querySelector(`.remarkInput[data-sid="${i.dataset.sid}"]`);
        return { exam_id: examId, student_id: i.dataset.sid, subject_id: subjectId, marks_obtained: Number(i.value), max_marks: maxScore, remarks: (remarkEl && remarkEl.value) || null };
      });
      try {
        // Upsert on (exam_id,student_id,subject_id) — re-saving the same student/subject
        // updates their existing row instead of creating a repeat entry.
        if (records.length) await dbUpsert("exam_results", records, "exam_id,student_id,subject_id");
        msg.innerHTML = `<div class="msg-ok">Results saved.</div>`;
      } catch(err) { msg.innerHTML = `<div class="err">${err.message}</div>`; }
    };
  }
  selExam.onchange = loadSubjects;
  selSubject.onchange = loadGrid;
  if (exams.length) loadSubjects();
}

/* ---- Results: every saved result, grouped per child / class / exam ---- */
async function renderResultsOverview(body, filters={}) {
  const [examsRaw, classes, terms, subjects, resultsRaw, students] = await Promise.all([
    dbSelectActive("exams", { select:"*,classes(name,section),terms(name),exam_types(name)", order:"exam_date.desc" }),
    dbSelectActive("classes", { order:"name.asc" }),
    dbSelectActive("terms", { order:"start_date.desc" }),
    dbSelectActive("subjects", { order:"name.asc" }),
    dbSelect("exam_results", { select:"*" }),
    dbSelectActive("students", { select:"id,full_name,admission_no,class_id" }),
    loadGrades(),
  ]);
  const exams = dedupeExams(examsRaw);
  const examMap = {}; exams.forEach(x=>examMap[x.id]=x);
  const studentMap = {}; students.forEach(s=>studentMap[s.id]=s);
  const subjectMap = {}; subjects.forEach(s=>subjectMap[s.id]=s.name);

  // One row per (student, exam) — every subject saved for that student+exam rolls up into it.
  const groups = {};
  resultsRaw.forEach(r => {
    const exam = examMap[r.exam_id];
    if (!exam) return; // belongs to a trashed/duplicate exam we've already filtered out
    if (filters.class_id && exam.class_id !== filters.class_id) return;
    if (filters.term_id && exam.term_id !== filters.term_id) return;
    const key = `${r.student_id}|${r.exam_id}`;
    if (!groups[key]) groups[key] = { student_id:r.student_id, exam_id:r.exam_id, total:0, max:0, subjects:[] };
    groups[key].total += Number(r.marks_obtained||0);
    groups[key].max += Number(r.max_marks||0);
    groups[key].subjects.push(r);
  });
  const rows = Object.values(groups)
    .filter(g => studentMap[g.student_id] && examMap[g.exam_id])
    .sort((a,b) => (studentMap[a.student_id].full_name||"").localeCompare(studentMap[b.student_id].full_name||""));

  body.innerHTML = `
    <div class="row" style="gap:10px;margin-bottom:14px;">
      <select id="filterClass" style="flex:1;min-width:140px;"><option value="">All classes</option>${classes.map(c=>`<option value="${c.id}" ${filters.class_id===c.id?'selected':''}>${c.name}${c.section?(' '+c.section):''}</option>`).join("")}</select>
      <select id="filterTerm" style="flex:1;min-width:140px;"><option value="">All terms</option>${terms.map(t=>`<option value="${t.id}" ${filters.term_id===t.id?'selected':''}>${t.name}</option>`).join("")}</select>
    </div>
    <div class="card" id="resultsList"></div>
  `;
  document.getElementById("filterClass").onchange = (e) => renderResultsOverview(body, Object.assign({}, filters, { class_id: e.target.value || undefined }));
  document.getElementById("filterTerm").onchange = (e) => renderResultsOverview(body, Object.assign({}, filters, { term_id: e.target.value || undefined }));

  const list = document.getElementById("resultsList");
  list.innerHTML = rows.length ? "" : emptyState("No results recorded yet. Enter marks from the \"Enter results\" tab.");
  rows.forEach(g => {
    const student = studentMap[g.student_id];
    const exam = examMap[g.exam_id];
    const pct = g.max ? (g.total/g.max*100) : 0;
    const row = el(`<div class="list-row"><div class="avatar">${initials(student.full_name)}</div>
      <div class="list-main"><div class="list-title">${student.full_name}</div>
      <div class="list-sub">${examLabel(exam)}</div></div>
      <div style="text-align:right;"><div style="font-weight:800;color:var(--navy);">${g.total}/${g.max}</div><div style="font-size:11.5px;color:var(--ink-soft);">${pct.toFixed(1)}% · ${gradeLabel(pct)}</div></div>
    </div>`);
    row.onclick = () => openViewModal(`${student.full_name} — ${examLabel(exam)}`, [
      ["Admission no.", student.admission_no],
      ...g.subjects.map(r => [subjectMap[r.subject_id] || "Subject", `${r.marks_obtained}/${r.max_marks}${r.remarks?(' — '+r.remarks):''}`]),
      ["Total", `${g.total} / ${g.max}`],
      ["Average", `${pct.toFixed(1)}%`],
      ["Grade", gradeLabel(pct)],
    ]);
    list.appendChild(row);
  });
}
/* ---------------- COMMS: Announcements / Reports / Notices / Meetings ----------------
   One page, four pill tabs. Announcements/Reports/Notices share one small
   table (school_communications) told apart by `type`. Meetings gets its own
   table (school_meetings, see MEETINGS_SQL) since it needs a date/location
   instead of a free-text message. Administration always has this (via "all"
   access); the Parents & Community department is the other one that sees it,
   for sending things out to parents/guardians. */
const COMMS_TYPES = [
  ["announcement","Announcements","Send announcement"],
  ["report","Reports","Send report"],
  ["notice","Notices","Deliver information"],
  ["meeting","Meetings","Schedule meeting"],
];
async function renderComms(container, sub="announcement") {

async function renderCommsList(body, container, type) {

  try { items = await dbSelectActive("school_communications", { type:`eq.${type}`, order:"created_at.desc" }); }

      <pre style="background:var(--card-alt);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:11.5px;overflow-x:auto;white-space:pre-wrap;">${COMMUNICATIONS_SQL}</pre>
      <button class="btn btn-primary" id="retryCommsBtn" style="margin-top:12px;">I've run it — Refresh</button>
    </div>`;
    document.getElementById("retryCommsBtn").onclick = () => renderCommsList(body, container, type);
    return;
  }

  body.innerHTML = `<div class="section-head"><h3 style="color:#c2410c;">${meta[1]}</h3><button class="btn btn-primary btn-sm" id="addBtn">${ic.plus} ${meta[2]}</button></div>

      <div class="list-main"><div class="list-title">${c.title}</div>
      <div class="list-sub">${c.audience || "Everyone"} · ${new Date(c.created_at).toLocaleDateString()}</div></div></div>`);
    const view = () => openViewModal(c.title, [
      ["Audience", c.audience || "Everyone"], ["Message", c.message],
      ["Sent by", c.created_by], ["Sent on", new Date(c.created_at).toLocaleString()],
    ], () => openCommsModal(body, container, type, c));
    const edit = () => openCommsModal(body, container, type, c);
    const del = async () => { if (await customConfirm(`Delete "${c.title}"?`, { danger:true, okLabel:"Delete" })) safe(async()=>{ await softDelete("school_communications", c.id); renderCommsList(body, container, type); })(); };
    bindRowGestures(row, { onView:view, onEdit:edit, onDelete:del });
    list.appendChild(row);

  document.getElementById("addBtn").onclick = () => openCommsModal(body, container, type, null);
