<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nova School Manager</title>
<meta name="description" content="Nova School Manager">
<meta name="theme-color" content="#16274A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nova School">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="https://i.postimg.cc/0NBZwRMk/file-000000008ea481f4a7d2fe89b842a95b.png">
<link rel="apple-touch-icon" href="https://i.postimg.cc/0NBZwRMk/file-000000008ea481f4a7d2fe89b842a95b.png">
<style>
  :root{
    --navy:#16274A;
    --navy-2:#1E3563;
    --teal:#2E9E7C;
    --teal-dark:#227A61;
    --teal-tint:#E4F5EE;
    --amber:#E2A33D;
    --amber-dark:#A06A13;
    --amber-tint:#FDF1DE;
    --red:#D6564F;
    --red-tint:#FDECEC;
    --sky:#3E8EDE;
    --sky-tint:#E7F1FC;
    --purple:#7C6FE0;
    --purple-tint:#EFEDFC;
    --indigo:#5B5FCF;
    --indigo-tint:#ECEDFA;
    --slate:#6B7688;
    --slate-tint:#EEF1F5;
    --bg:#EEF2F9;
    --card:#FFFFFF;
    --card-alt:#F7F9FD;
    --ink:#1D2433;
    --ink-soft:#5B647A;
    --line:#E4E8EF;
    --radius:14px;
  }
  @keyframes fadeSlideDown{0%{opacity:0;transform:translateY(-8px);}100%{opacity:1;transform:translateY(0);}}
  @keyframes popScale{0%{opacity:0;transform:scale(.85);}100%{opacity:1;transform:scale(1);}}
  @keyframes slideInLeft{0%{opacity:0;transform:translateX(-14px);}100%{opacity:1;transform:translateX(0);}}
  @keyframes wiggleIn{0%{opacity:0;transform:rotate(-4deg) translateY(-6px);}100%{opacity:1;transform:rotate(0) translateY(0);}}
  @keyframes riseIn{0%{opacity:0;transform:translateY(10px) scale(.96);}100%{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes sheetUp{0%{opacity:0;transform:translateY(24px);}100%{opacity:1;transform:translateY(0);}}
  .pageTitleAnim{display:inline-block;}
  .action-sheet-overlay{position:fixed;inset:0;background:rgba(22,39,74,.35);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
  .action-sheet{background:#fff;width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));animation:sheetUp .18s ease;}
  @media(min-width:860px){.action-sheet-overlay{align-items:center;}.action-sheet{border-radius:16px;}}
  .action-sheet .as-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:2px auto 10px;}
  .action-sheet button{width:100%;text-align:left;padding:13px 14px;border-radius:10px;border:none;background:none;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;color:var(--ink);}
  .action-sheet button:hover{background:var(--card-alt);}
  .action-sheet button.as-danger{color:var(--red);}
  .action-sheet button.as-cancel{color:var(--ink-soft);margin-top:4px;border-top:1px solid var(--line);border-radius:0;}
  .view-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .view-row:last-child{border-bottom:none;}
  .view-row .vlabel{color:var(--ink-soft);font-weight:600;}
  .view-row .vvalue{color:var(--ink);font-weight:700;text-align:right;}
  .list-row{cursor:pointer;-webkit-user-select:none;user-select:none;}
  .list-row:active{background:var(--card-alt);}
  .trash-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  *{box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  body{margin:0;position:fixed;inset:0;width:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
  /* App data is never rendered/visible in a plain browser tab — only once running
     as the installed, standalone app. #app stays hidden until pwaShowApp() runs. */
  #app{display:none;}
  #app.pwa-app-unlocked{display:block;}
  .pwa-open-note{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:10px;}
  h1,h2,h3{font-weight:700;letter-spacing:-0.02em;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:#c9d0dc;border-radius:10px;}

  /* ---------- LOGIN ---------- */
  @keyframes gradientFlow{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 35%,var(--sky) 65%,var(--navy) 100%);background-size:300% 300%;animation:gradientFlow 14s ease infinite;padding:20px;}
  .login-card{background:var(--card);border-radius:20px;padding:36px 28px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(10,20,50,.35);}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;}
  .brand-badge{width:42px;height:42px;border-radius:12px;background:var(--teal);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;}
  .brand-name{font-size:19px;font-weight:800;color:var(--navy);}
  .brand-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;background:#FAFBFD;outline:none;transition:border-color .15s;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);background:#fff;}
  input[type="time"],input[type="datetime-local"]{ color-scheme: light; }
  input[type="time"]::-webkit-calendar-picker-indicator,
  input[type="datetime-local"]::-webkit-calendar-picker-indicator{
    background-color: var(--teal);
    border-radius:6px;
    padding:5px;
    cursor:pointer;
    opacity:1;
    filter: brightness(0) invert(1);
  }

  /* ---------- CUSTOM DATE PICKER (fully app-styled, replaces native OS date picker
     so the "Set/Cancel" buttons are ours to colour, not the phone OS's) ---------- */
  input.datefield{
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%232E9E7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>');
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:18px 18px;
    padding-right:38px;
    cursor:pointer;
    caret-color:transparent;
  }
  input.datefield::placeholder{color:var(--ink-soft);}
  .date-cal-popup{
    position:fixed;z-index:500;background:#fff;border-radius:16px;
    box-shadow:0 16px 44px rgba(16,30,60,.28);border:1px solid var(--line);
    padding:14px;width:288px;animation:riseIn .14s ease;
  }
  .dc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .dc-title{font-size:14.5px;font-weight:800;color:var(--navy);}
  .dc-nav{background:var(--teal-tint);color:var(--teal-dark);border:none;width:30px;height:30px;border-radius:9px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;}
  .dc-nav:hover{background:var(--teal);color:#fff;}
  .dc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .dc-dow{margin-bottom:4px;}
  .dc-dow div{font-size:11px;font-weight:700;color:var(--ink-soft);text-align:center;padding:4px 0;}
  .dc-cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink);border-radius:9px;cursor:pointer;}
  .dc-cell.dc-day:hover{background:var(--teal-tint);}
  .dc-cell.dc-today{color:var(--teal-dark);box-shadow:inset 0 0 0 1.5px var(--teal);}
  .dc-cell.dc-selected{background:var(--teal);color:#fff;box-shadow:none;}
  .dc-cell.dc-empty{cursor:default;}
  .dc-footer{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .dc-link{background:none;border:none;color:var(--teal-dark);font-weight:700;font-size:12.5px;padding:6px 8px;border-radius:8px;}
  .dc-link:hover{background:var(--teal-tint);}
  .dc-link.dc-danger{color:var(--red);}
  .dc-link.dc-danger:hover{background:var(--red-tint);}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s, transform .1s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--teal);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:var(--teal-tint);color:var(--teal-dark);border:1.5px solid var(--teal);}
  .btn-ghost:hover{background:var(--teal);color:#fff;}
  .btn-danger{background:#fde8e7;color:var(--red);}
  .btn-sm{padding:8px 12px;font-size:13px;}
  .confirm-box{max-width:340px;text-align:center;}
  .confirm-msg{font-size:14.5px;color:var(--ink);line-height:1.55;margin-bottom:18px;white-space:pre-wrap;}
  .confirm-box .form-actions{margin-top:0;}
  .link-btn{background:none;border:none;color:var(--teal-dark);font-weight:600;font-size:13.5px;padding:0;}
  .err{background:#fdecec;color:var(--red);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;}
  .msg-ok{background:#e9f7f1;color:var(--teal-dark);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;}
  .tiny-note{font-size:11.5px;color:var(--ink-soft);margin-top:16px;line-height:1.5;text-align:center;}

  /* ---------- SHELL ---------- */
  .shell{display:flex;height:100vh;height:100dvh;overflow:hidden;}
  .sidebar{width:230px;background:linear-gradient(200deg,var(--navy) 0%,var(--navy-2) 45%,#274b8a 100%);background-size:250% 250%;animation:gradientFlow 18s ease infinite;color:#fff;flex-direction:column;padding:22px 14px;position:fixed;top:0;bottom:0;left:0;display:none;z-index:40;}
  .sidebar .brand-name{color:#fff;}
  .sidebar .brand-sub{color:#9fb0d6;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:10px;color:#c7d3ee;font-size:14px;font-weight:600;margin-bottom:3px;transition:background .2s ease,color .2s ease,box-shadow .2s ease;}
  .nav-item svg{opacity:.9;flex-shrink:0;}
  .nav-item.active{background:var(--teal);color:#fff;box-shadow:0 4px 12px rgba(46,158,124,.35);}
  .nav-item:not(.active):hover{background:rgba(255,255,255,.08);color:#fff;}
  .main{flex:1;margin-left:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:20;box-shadow:0 1px 0 rgba(22,39,74,.03);}
  .topbar h1{font-size:19px;color:var(--navy);}
  .topbar .who{font-size:12.5px;color:var(--ink-soft);}
  .content{padding:16px;padding-bottom:98px;max-width:1100px;margin:0 auto;width:100%;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}

  .bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow-x:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(22,39,74,.05);}
  .bn-item{flex:1 0 auto;min-width:64px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;color:var(--ink-soft);font-size:10.5px;font-weight:600;border-radius:10px;transition:background .25s ease,color .25s ease,transform .25s ease;}
  .bn-item.active{color:var(--teal-dark);background:var(--teal-tint);transform:translateY(-2px);}
  .bn-item svg{flex-shrink:0;transition:transform .25s ease;}
  .bn-item.active svg{transform:scale(1.08);}

  @media(min-width:860px){
    .sidebar{display:flex;}
    .main{margin-left:230px;}
    .bottomnav{display:none;}
    .content{padding-bottom:16px;}
  }

  /* ---------- COMPONENTS ---------- */
  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(22,39,74,.05);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .section-head h2{font-size:18px;color:var(--navy);}
  .pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .pill{padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--card);border:1.5px solid var(--line);color:var(--ink-soft);}
  .pill.active{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 3px 10px rgba(46,158,124,.3);}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
  .stat{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:16px;border-left:4px solid var(--teal);box-shadow:0 1px 3px rgba(22,39,74,.05);}
  .stat:nth-child(4n+2){border-left-color:var(--sky);}
  .stat:nth-child(4n+3){border-left-color:var(--amber);}
  .stat:nth-child(4n+4){border-left-color:var(--purple);}
  .stat .num{font-size:24px;font-weight:800;color:var(--navy);}
  .stat .lbl{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
  .list-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .avatar{width:40px;height:40px;border-radius:10px;background:var(--sky-tint);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);font-size:14px;flex-shrink:0;}
  .list-main{flex:1;min-width:0;}
  .list-title{font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .list-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .badge-green{background:#e5f6ee;color:var(--teal-dark);}
  .badge-amber{background:#fdf1de;color:#a06a13;}
  .badge-red{background:#fdecec;color:var(--red);}
  .badge-grey{background:#eef0f4;color:var(--ink-soft);}
  .icon-btn{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .search-bar{display:flex;gap:8px;margin-bottom:14px;}
  .search-bar input{flex:1;}
  .fab{position:fixed;right:18px;bottom:96px;width:54px;height:54px;border-radius:16px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(46,158,124,.45);border:none;z-index:25;}
  @media(min-width:860px){.fab{bottom:28px;}}
  .empty{text-align:center;padding:40px 16px;color:var(--ink-soft);}
  .empty svg{margin-bottom:10px;opacity:.5;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,22,40,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal{background:#fff;width:100%;max-width:480px;border-radius:18px;padding:22px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-size:17px;color:var(--navy);margin-bottom:16px;}
  .modal-close{float:right;background:none;border:none;font-size:20px;color:var(--ink-soft);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .form-actions{display:flex;gap:10px;margin-top:6px;}
  .form-actions .btn{flex:1;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:9px 8px;border-bottom:2px solid var(--line);}
  td{padding:9px 8px;border-bottom:1px solid var(--line);}
  .table-wrap{overflow-x:auto;}
  /* Excel-style colored columns for the fee payment history table */
  .fee-history-table{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:640px;}
  .fee-history-table thead th{color:#fff;font-weight:800;font-size:11px;border-bottom:none;padding:12px 16px;white-space:nowrap;}
  .fee-history-table thead th:first-child{border-radius:10px 0 0 0;}
  .fee-history-table thead th:last-child{border-radius:0 10px 0 0;}
  .fee-history-table tbody td{padding:13px 16px;font-weight:600;border-bottom:1px solid var(--card);vertical-align:middle;}
  .fee-history-table tbody tr:last-child td{border-bottom:none;}
  .fee-history-table th,.fee-history-table td{border-right:3px solid var(--card);}
  .fee-history-table th:last-child,.fee-history-table td:last-child{border-right:none;}
  .fee-history-table .col-date-h,.fee-history-table .col-date-d{width:16%;white-space:nowrap;}
  .fee-history-table .col-student-h,.fee-history-table .col-student-d{width:32%;}
  .fee-history-table .col-student-d{line-height:1.4;overflow-wrap:break-word;}
  .fee-history-table .col-term-h,.fee-history-table .col-term-d{width:18%;overflow-wrap:break-word;}
  .fee-history-table .col-amount-h,.fee-history-table .col-amount-d{width:18%;white-space:nowrap;}
  .fee-history-table .col-method-h,.fee-history-table .col-method-d{width:16%;white-space:nowrap;}
  .col-date-h{background:var(--sky);}
  .col-date-d{background:var(--sky-tint);color:#1D5A96;}
  .col-student-h{background:var(--indigo);}
  .col-student-d{background:var(--indigo-tint);color:#3E4199;}
  .col-term-h{background:var(--purple);}
  .col-term-d{background:var(--purple-tint);color:#5B4FC4;}
  .col-amount-h{background:var(--teal);}
  .col-amount-d{background:var(--teal-tint);color:var(--teal-dark);font-weight:800;}
  .col-method-h{background:var(--amber);}
  .col-method-d{background:var(--amber-tint);color:var(--amber-dark);}
  .att-btns{display:flex;gap:5px;flex-wrap:wrap;}
  .att-btn{padding:6px 10px;border-radius:8px;font-size:11.5px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);}
  /* Roll call: full name on its own line (no truncation), Present/Absent stacked below it. */
  .roll-row{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:default;}
  .roll-row:last-child{border-bottom:none;}
  .roll-top{display:flex;align-items:center;gap:12px;}
  .roll-name{font-weight:700;font-size:14.5px;color:var(--ink);white-space:normal;overflow:visible;word-break:break-word;}
  .roll-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .roll-row .att-btns{width:100%;}
  .roll-row .att-btn{flex:1;padding:5px 6px;font-size:10px;text-align:center;}
  .att-btn.p.on{background:#e5f6ee;color:var(--teal-dark);border-color:var(--teal);}

  /* ---- Masthead (mobile branding strip; sidebar handles this on desktop) ---- */
  .masthead{display:flex;align-items:center;gap:10px;padding:9px 18px;background:linear-gradient(200deg,var(--navy) 0%,var(--navy-2) 45%,#274b8a 100%);background-size:250% 250%;animation:gradientFlow 18s ease infinite;color:#fff;flex-shrink:0;position:relative;overflow:hidden;}
  .masthead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--teal),var(--amber),var(--sky));opacity:.85;}
  .masthead-logo{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;font-weight:800;font-size:12px;}
  .masthead-logo img{width:100%;height:100%;object-fit:cover;display:block;}
  .masthead-text{min-width:0;line-height:1.28;}
  .masthead-name{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

function applyBrandColor(key) {

async function loadSchoolSettings() {
  try {
    const rows = await dbSelect("school_settings", { id:"eq.1" });
    schoolSettings = rows[0] || null;
  } catch (e) { schoolSettings = null; }
  applyBrandColor(schoolSettings?.brand_color);
}
function currency() { return (schoolSettings && schoolSettings.currency_symbol) || "₦"; }
// Builds an ID like DFM25000: prefix + gender letter + 2-digit year + zero-padded running number.
function formatGeneratedId(prefix, seq, digits, gender) {
  if (!prefix) return "";
  const yy = String(new Date().getFullYear()).slice(-2);
  const letter = gender === "Female" ? "F" : "M";
  return `${prefix}${letter}${yy}${String(Number(seq)||0).padStart(Number(digits)||3,'0')}`;
}
// Preview of the next ID for a given entity ("student"/"teacher") and gender, based on the
// currently saved counter — doesn't consume it.
function nextIdFor(kind, gender) {
  const s = schoolSettings || {};
  const prefix = s[`${kind}_id_prefix`];
  if (!prefix) return "";
  return formatGeneratedId(prefix, s[`${kind}_id_seq`] ?? 0, s[`${kind}_id_digits`] ?? 3, gender);
}
// Advances the running number after a new registration, so the next generated ID is unique.
async function advanceIdSeq(kind) {
  const s = schoolSettings || {};
  if (!s[`${kind}_id_prefix`]) return;
  const payload = { id: 1 };
  payload[`${kind}_id_seq`] = Number(s[`${kind}_id_seq`] ?? 0) + 1;
  try {
    await dbUpsert("school_settings", payload, "id");
    schoolSettings = Object.assign({}, schoolSettings, payload);
  } catch (e) { /* non-fatal — the record was already saved with its ID */ }
}

    "Authorization": "Bearer " + (auth ? auth.access_token : SUPABASE_KEY),
    "Content-Type": "application/json",
  }, opts.headers || {});
  let res;
  try {
    res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, { headers }));
  } catch (e) {
    // The browser throws a bare "Failed to fetch" for any network-level failure
    // (offline, blocked request, DNS issue, server unreachable, CORS, etc).
    // Surface something a user can actually act on instead of that raw message.
    throw new Error("Check your internet connection and try again. If this keeps happening, please contact the developer.");
  }
  let data = null;
  try { data = await res.json(); } catch(e) { data = null; }
  if (!res.ok) {
    const msg = (data && (data.error_description || data.msg || data.message)) || "Request failed";
    throw new Error(msg);
  }
  return data;
}
const qs = (obj) => Object.entries(obj).filter(([,v])=>v!==undefined && v!==null && v!=="").map(([k,v])=>`${k}=${v}`).join("&");

async function dbSelect(table, params={}) {
  return sb(`/rest/v1/${table}?${qs(Object.assign({select:"*"}, params))}`);
}
async function dbInsert(table, body) {
  return sb(`/rest/v1/${table}`, { method:"POST", body: JSON.stringify(body), headers:{ "Prefer":"return=representation" } });
}
async function dbUpdate(table, id, body) {
  return sb(`/rest/v1/${table}?id=eq.${id}`, { method:"PATCH", body: JSON.stringify(body), headers:{ "Prefer":"return=representation" } });
}
async function dbUpsert(table, body, onConflict) {
  return sb(`/rest/v1/${table}?on_conflict=${onConflict}`, { method:"POST", body: JSON.stringify(body), headers:{ "Prefer":"resolution=merge-duplicates,return=representation" } });
}
async function dbDelete(table, id) {
  return sb(`/rest/v1/${table}?id=eq.${id}`, { method:"DELETE" });
}
async function dbSelectActive(table, params={}) {

// Browsers silently drop <tr>/<td> tags when parsed as innerHTML of a plain <div> (they're
// only valid inside a table context), which collapses every column into one first cell.

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error("Could not read image file."));
    r.readAsDataURL(file);
  });
}

// Opens a live camera overlay and explicitly asks the browser for camera permission via
// getUserMedia. Calls onCapture(dataUrl) with a JPEG data URL once the person snaps a photo.
// If the browser can't do getUserMedia at all (or the person denies/it errors), calls
// onUnavailable() so the caller can fall back to a native capture-attribute file input.
function openCameraCapture(onCapture, onUnavailable) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { onUnavailable && onUnavailable(); return; }
  const overlay = el(`<div class="overlay">
    <div class="modal" style="max-width:420px;">
      <button class="modal-close">&times;</button>
      <h3>Take photo</h3>
      <div style="border-radius:12px;overflow:hidden;background:#000;margin-top:10px;position:relative;">
        <video id="camVideo" autoplay playsinline style="width:100%;display:block;max-height:60vh;object-fit:cover;"></video>
        <button type="button" class="btn btn-ghost btn-sm" id="camSwitch" style="position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);">${ic.camera} Switch</button>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" id="camCancel">Cancel</button>
        <button class="btn btn-primary" id="camCapture">Capture</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const video = overlay.querySelector("#camVideo");
  let stream = null, settled = false, facing = "user";
  const stop = () => { if (stream) stream.getTracks().forEach(t => t.stop()); };
  const close = () => { stop(); overlay.remove(); };
  overlay.querySelector(".modal-close").onclick = close;
  overlay.querySelector("#camCancel").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  // This call is what triggers the browser/OS's "Allow camera access?" permission prompt.
  const startCamera = (mode) => {
    stop();
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: mode }, audio: false })
      .then(s => { if (settled) { s.getTracks().forEach(t=>t.stop()); return; } stream = s; video.srcObject = s; })
      .catch(() => {
        // If the requested facing mode isn't available on this device, fall back to whatever camera we can get.
        if (mode !== "user") return navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then(s => { if (settled) { s.getTracks().forEach(t=>t.stop()); return; } stream = s; video.srcObject = s; })
          .catch(() => { settled = true; close(); onUnavailable && onUnavailable(); });
        settled = true; close(); onUnavailable && onUnavailable();
      });
  };
  startCamera(facing);
  overlay.querySelector("#camSwitch").onclick = () => {
    facing = facing === "user" ? "environment" : "user";
    startCamera(facing);
  };
  overlay.querySelector("#camCapture").onclick = () => {
    if (!stream) return;
    settled = true;
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 480; canvas.height = video.videoHeight || 480;
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
    close();
    onCapture(dataUrl);
  };
}

/* ---------------- MODAL HELPER ---------------- */
// Keeps a centered modal fully visible and usable when the on-screen keyboard opens:
// shrinks/repositions the overlay to the actual visible viewport (so the modal never ends
// up hidden behind the keyboard), scrolls whichever field the person is typing into into
// view, and — once there's little content left below that field — scrolls the rest of the
// way so the tail of the form (including the Save/Cancel buttons) is never left hidden
// behind the keyboard. Not used for action sheets (the bottom-nav "More" menu, edit/delete
// sheets) — those have no inputs and stay anchored where they already are.
function enableModalKeyboardHandling(overlay) {
  const modal = overlay.querySelector(".modal");
  const vv = window.visualViewport;
  if (!modal) return;
  // If we're close to the end of the form's scrollable content, scroll all the way down
  // so trailing fields and the Save/Cancel row surface above the keyboard too.
  const revealTail = () => {
    const remaining = modal.scrollHeight - (modal.scrollTop + modal.clientHeight);
    if (remaining > 0 && remaining < 160) modal.scrollTo({ top: modal.scrollHeight, behavior: "smooth" });
  };
  modal.addEventListener("focusin", (e) => {
    const t = e.target;
    if (!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    // Give the keyboard's open animation a moment to finish before measuring/scrolling.
    setTimeout(() => {
      t.scrollIntoView({ block: "center", behavior: "smooth" });
      setTimeout(revealTail, 300);
    }, 250);
  });
  if (!vv) return;
  const resize = () => {
    overlay.style.height = vv.height + "px";
    overlay.style.top = vv.offsetTop + "px";
    overlay.style.bottom = "auto";
    modal.style.maxHeight = Math.round(vv.height * 0.9) + "px";
    if (document.activeElement && modal.contains(document.activeElement)) revealTail();
  };
  vv.addEventListener("resize", resize);
  vv.addEventListener("scroll", resize);
  resize();
  const stop = new MutationObserver(() => {
    if (document.body.contains(overlay)) return;
    vv.removeEventListener("resize", resize);
    vv.removeEventListener("scroll", resize);
    stop.disconnect();
  });
  stop.observe(document.body, { childList: true });
}

/* ---------------- CUSTOM ALERT / CONFIRM ----------------
   Replaces the browser's native alert()/confirm() — which show as an unstyled
   "This page says" dialog with an invisible white OK button on many devices —
   with our own centered, clearly-colored dialog. */
function customAlert(message, opts={}) {
  return new Promise((resolve) => {
    const overlay = el(`<div class="overlay">
      <div class="modal confirm-box">
        <div class="confirm-msg">${message}</div>
        <div class="form-actions">
          <button class="btn btn-primary" id="alertOk">${opts.okLabel || "OK"}</button>
        </div>
      </div>
    </div>`);
    document.body.appendChild(overlay);
    enableModalKeyboardHandling(overlay);
    const close = () => { overlay.remove(); resolve(); };
    overlay.querySelector("#alertOk").onclick = close;
    overlay.onclick = (e) => { if (e.target === overlay) close(); };
  });
}
function customConfirm(message, opts={}) {
  return new Promise((resolve) => {
    const danger = !!opts.danger;
    const overlay = el(`<div class="overlay">
      <div class="modal confirm-box">
        <div class="confirm-msg">${message}</div>
        <div class="form-actions">
          <button class="btn btn-ghost" id="confirmNo">${opts.cancelLabel || "Cancel"}</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="confirmYes">${opts.okLabel || (danger ? "Delete" : "OK")}</button>
        </div>
      </div>
    </div>`);
    document.body.appendChild(overlay);
    enableModalKeyboardHandling(overlay);
    let done = false;
    const finish = (v) => { if (done) return; done = true; overlay.remove(); resolve(v); };
    overlay.querySelector("#confirmNo").onclick = () => finish(false);
    overlay.querySelector("#confirmYes").onclick = () => finish(true);
    overlay.onclick = (e) => { if (e.target === overlay) finish(false); };
  });
}

/* ---------------- ROW GESTURES: short click = view, long press = edit/delete ---------------- */
function bindRowGestures(rowEl, { onView, onEdit, onDelete }) {
  rowEl.oncontextmenu = (e) => e.preventDefault();
  let timer = null, longFired = false, startX = 0, startY = 0;
  const LONG_MS = 550, MOVE_TOL = 10;
  const start = (x,y) => {
    longFired = false; startX = x; startY = y;
    timer = setTimeout(() => {
      longFired = true;
      const actions = [];
      if (onEdit) actions.push({ label:"Edit", icon:ic.edit, onClick:onEdit });
      if (onDelete) actions.push({ label:"Delete", icon:ic.trash, danger:true, onClick:onDelete });
      if (actions.length) openActionSheet(actions);
    }, LONG_MS);
  };
  const cancel = () => { clearTimeout(timer); };
  const move = (x,y) => { if (Math.abs(x-startX)>MOVE_TOL || Math.abs(y-startY)>MOVE_TOL) cancel(); };
  rowEl.addEventListener("pointerdown", (e) => start(e.clientX, e.clientY));
  rowEl.addEventListener("pointermove", (e) => move(e.clientX, e.clientY));
  rowEl.addEventListener("pointerup", () => { cancel(); if (!longFired && onView) onView(); });
  rowEl.addEventListener("pointercancel", cancel);
  rowEl.addEventListener("pointerleave", cancel);
}

/* Simple tap-vs-hold gesture: short tap fires onTap, holding fires onHold directly (no action sheet) */
function bindTapHold(rowEl, { onTap, onHold }) {
  rowEl.oncontextmenu = (e) => e.preventDefault();
  let timer = null, longFired = false, startX = 0, startY = 0;
  const LONG_MS = 550, MOVE_TOL = 10;
  const start = (x,y) => {
    longFired = false; startX = x; startY = y;
    timer = setTimeout(() => { longFired = true; if (onHold) onHold(); }, LONG_MS);
  };
  const cancel = () => { clearTimeout(timer); };
  const move = (x,y) => { if (Math.abs(x-startX)>MOVE_TOL || Math.abs(y-startY)>MOVE_TOL) cancel(); };
  rowEl.addEventListener("pointerdown", (e) => start(e.clientX, e.clientY));
  rowEl.addEventListener("pointermove", (e) => move(e.clientX, e.clientY));
  rowEl.addEventListener("pointerup", () => { cancel(); if (!longFired && onTap) onTap(); });
  rowEl.addEventListener("pointercancel", cancel);
  rowEl.addEventListener("pointerleave", cancel);
}

/* ---- Dashboard stat: Total present today (click to see present/absent + gender breakdown) ---- */
async function showPresentTodayBreakdown(date) {
  let attRows = [];
  try { attRows = await dbSelect("attendance", { date:`eq.${date}`, select:"status,students(gender)" }); }
  catch(e) { attRows = []; }
  const isGender = (a, g) => a.students && a.students.gender === g;

  openViewModal(`Attendance — ${date}`, [

    ["Total students absent", absent.length],
    ["Total boys absent", absent.filter(a=>isGender(a,"Male")).length],
    ["Total girls absent", absent.filter(a=>isGender(a,"Female")).length],
  ]);
}

/* ---- Dashboard panel: Attendance by class today ---- */
async function renderAttendanceByClass(body, classes) {
  body.innerHTML = `<h3 style="color:var(--amber-dark);margin-bottom:14px;">Attendance by Class Today</h3><div class="center-loading">Loading…</div>`;
  if (!classes.length) { body.innerHTML = `<h3 style="color:var(--amber-dark);margin-bottom:14px;">Attendance by Class Today</h3>${emptyState("Create classes first in Setup.")}`; return; }
  const today = new Date().toISOString().slice(0,10);
  const [classList, students, attToday] = await Promise.all([
    dbSelectActive("classes", { order:"name.asc" }),
    dbSelectActive("students", { status:"eq.active", select:"id,class_id" }),
    dbSelect("attendance", { date:`eq.${today}`, select:"class_id,status" }).catch(()=>[]),
  ]);
  const rowsHtml = classList.map(c => {
    const total = students.filter(s=>s.class_id===c.id).length;
    const present = attToday.filter(a=>a.class_id===c.id && a.status==="present").length;
    const pct = total ? Math.round((present/total)*100) : 0;
    const color = pct>=75 ? 'var(--teal)' : pct>=40 ? 'var(--amber)' : 'var(--red)';
    return `<div style="margin-bottom:12px;">
      <div class="row" style="margin-bottom:5px;font-size:13px;">
        <div style="font-weight:700;color:var(--ink);">${c.name}${c.section?(' '+c.section):''}</div>
        <div style="color:var(--ink-soft);font-weight:600;">${present}/${total} · ${pct}%</div>
      </div>
      <div style="background:var(--card-alt);border-radius:999px;height:9px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:${color};border-radius:999px;"></div>
      </div>
    </div>`;
  }).join("");
  body.innerHTML = `<h3 style="color:var(--amber-dark);margin-bottom:14px;">Attendance by Class Today</h3>${rowsHtml}`;
}

/* ---- Dashboard panel: Upcoming this week ---- */
async function renderUpcomingWeek(body) {
  body.innerHTML = `<h3 style="color:var(--purple);margin-bottom:14px;">Upcoming This Week</h3><div class="center-loading">Loading…</div>`;
  const now = new Date(); const in7 = new Date(now.getTime()+7*86400000);
  const todayStr = now.toISOString().slice(0,10), in7Str = in7.toISOString().slice(0,10);
  let exams = [];
  try { exams = await dbSelect("exams", { select:"*,classes(name,section)", exam_date:`gte.${todayStr}`, order:"exam_date.asc" }); } catch(e) { exams = []; }
  const upcoming = exams.filter(x => x.exam_date && x.exam_date <= in7Str);
  if (!upcoming.length) { body.innerHTML = `<h3 style="color:var(--purple);margin-bottom:14px;">Upcoming This Week</h3>${emptyState("Nothing scheduled in the next 7 days.")}`; return; }
  body.innerHTML = `<h3 style="color:var(--purple);margin-bottom:14px;">Upcoming This Week</h3>
    ${upcoming.map(x=>{
      const days = Math.round((new Date(x.exam_date) - new Date(todayStr))/86400000);
      const when = days<=0 ? 'Today' : days===1 ? 'Tomorrow' : `in ${days} days`;
      return `<div class="list-row">
        <div class="avatar">${ic.exam}</div>
        <div class="list-main"><div class="list-title">${x.name}</div>
        <div class="list-sub">${x.classes?.name||''} ${x.classes?.section||''} · ${x.exam_date}</div></div>
        <span class="badge badge-amber">${when}</span>
      </div>`;
    }).join("")}
  `;
}

/* ---- Grades: admin-defined grade bands (A+, A, B+ …) with a remark per band ---- */
async function renderGrades(body) {
  let grades = [];
  let missingTable = false;
  try { grades = await dbSelectActive("grades", { order:"min_score.desc" }); }
  catch (e) { missingTable = true; }

  if (missingTable) {
    body.innerHTML = `<div class="card">
      <div class="settings-card-head"><div class="ic" style="background:var(--amber-tint);color:var(--amber-dark);">${ic.sliders}</div><div><h3 style="color:var(--navy);">Almost there — one-time setup</h3><p>Grades need a small table in your database before you can define them.</p></div></div>
      <p style="font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:12px;">Run this once in your Supabase SQL editor, then come back and tap refresh.</p>
      <pre style="background:var(--card-alt);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:11.5px;overflow-x:auto;white-space:pre-wrap;">${GRADES_SETUP_SQL}</pre>
      <button class="btn btn-primary" id="retryGradesBtn" style="margin-top:12px;">I've run it — Refresh</button>
    </div>`;
    document.getElementById("retryGradesBtn").onclick = () => renderGrades(body);
    return;
  }

  gradesCache = grades;
  body.innerHTML = `<div class="section-head"><h3 style="color:var(--teal-dark);">Grades</h3><button class="btn btn-primary btn-sm" id="addBtn">${ic.plus} Add grade</button></div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin:-8px 0 12px;">Define the grade bands used on report cards and results — e.g. A+ for 90–100%, with a remark like "Excellent".</p>
    <div class="card" id="list"></div>`;
  const list = document.getElementById("list");
  list.innerHTML = grades.length ? "" : emptyState('No grades set up yet. Add bands like A+ (90–100), A (80–89)…');
  grades.forEach(g => {
    const row = el(`<div class="list-row"><div class="avatar">${initials(g.grade)}</div>
      <div class="list-main"><div class="list-title">${g.grade}</div>
      <div class="list-sub">${g.min_score}–${g.max_score}%${g.remark?(' · '+g.remark):''}</div></div></div>`);
    const view = () => openViewModal(g.grade, [["Score range", `${g.min_score}% – ${g.max_score}%`], ["Remark", g.remark || "—"]], () => openGradeModal(body, grades, g));
    const edit = () => openGradeModal(body, grades, g);
    const del = async () => { if (await customConfirm(`Move grade "${g.grade}" to trash?`, { danger:true, okLabel:"Move to trash" })) safe(async()=>{ await softDelete("grades", g.id); gradesCache = null; renderGrades(body); })(); };
    bindRowGestures(row, { onView:view, onEdit:edit, onDelete:del });
    list.appendChild(row);
  });
  document.getElementById("addBtn").onclick = () => openGradeModal(body, grades, null);
}
function openGradeModal(body, existingGrades, g) {
  const isEdit = !!g;
  openModal(isEdit ? "Edit grade" : "New grade", `
    <div class="field"><label>Grade (e.g. A+, A, B+)</label><input id="f_grade" placeholder="A+" value="${g?.grade||''}"/></div>
    <div class="grid2">
      <div class="field"><label>Min score (%)</label><input id="f_min" type="number" min="0" max="100" step="1" value="${g?.min_score??''}"/></div>
      <div class="field"><label>Max score (%)</label><input id="f_max" type="number" min="0" max="100" step="1" value="${g?.max_score??''}"/></div>
    </div>
    <div class="field"><label>Remark</label><input id="f_remark" placeholder="Excellent" value="${g?.remark||''}"/></div>
  `, async (ov) => {
    const grade = val(ov,"f_grade").trim();
    const min_score = Number(val(ov,"f_min"));
    const max_score = Number(val(ov,"f_max"));
    if (!grade) throw new Error("Enter a grade label.");
    if (val(ov,"f_min")==="" || val(ov,"f_max")==="" || Number.isNaN(min_score) || Number.isNaN(max_score)) throw new Error("Enter both a min and max score.");
    if (min_score > max_score) throw new Error("Min score can't be greater than max score.");
    const dupeName = existingGrades.find(e => e.grade.toLowerCase()===grade.toLowerCase() && (!isEdit || e.id!==g.id));
    if (dupeName) throw new Error(`"${grade}" already exists. Edit that one instead of adding a duplicate.`);
    const overlap = existingGrades.find(e => (!isEdit || e.id!==g.id) && min_score <= Number(e.max_score) && max_score >= Number(e.min_score));
    if (overlap) throw new Error(`That range overlaps with "${overlap.grade}" (${overlap.min_score}–${overlap.max_score}%). Adjust the range so ranges don't repeat.`);
    const payload = { grade, min_score, max_score, remark: val(ov,"f_remark").trim() || null };
    if (isEdit) await dbUpdate("grades", g.id, payload); else await dbInsert("grades", payload);
    gradesCache = null;
    renderGrades(body);
  }, { saveLabel: isEdit ? "Save changes" : "Add" });
}

async function renderClasses(body) {
  const [classes, teachers, allStudents, allClassSubjects] = await Promise.all([
    dbSelectActive("classes", { select:"*,teachers(full_name)", order:"name.asc" }),
    dbSelectActive("teachers", { status:"eq.active", order:"full_name.asc" }),
    dbSelectActive("students", { status:"eq.active", select:"id,class_id" }),
    dbSelect("class_subjects", { select:"class_id,subjects(name)" }).catch(()=>[]),
  ]);
  body.innerHTML = `<div class="section-head"><h3 style="color:var(--purple);">Classes</h3><button class="btn btn-primary btn-sm" id="addBtn">${ic.plus} Add class</button></div><div class="card" id="list"></div>`;
  const list = document.getElementById("list");
  list.innerHTML = classes.length ? "" : emptyState("No classes yet.");
  classes.forEach(c => {
    const studentCount = allStudents.filter(s=>s.class_id===c.id).length;
    const subjectNames = allClassSubjects.filter(cs=>cs.class_id===c.id).map(cs=>cs.subjects?.name).filter(Boolean);
    const row = el(`<div class="list-row"><div class="avatar">${initials(c.name)}</div>
      <div class="list-main"><div class="list-title">${c.name}${c.section?(' '+c.section):''}</div>
      <div class="list-sub">Class teacher: ${c.teachers?.full_name || "Not assigned"} · ${studentCount} student${studentCount===1?'':'s'}</div></div></div>`);
    const view = () => openViewModal(`${c.name}${c.section?(' '+c.section):''}`, [
      ["Stream", c.section || "—"],
      ["Class teacher", c.teachers?.full_name || "Not assigned"],
      ["Students enrolled", studentCount],
      ["Subjects linked", subjectNames.join(", ") || "None — link in Subjects"],
    ], () => openClassModal(body, teachers, c));
    const edit = () => openClassModal(body, teachers, c);
    const del = async () => { if (await customConfirm(`Move "${c.name}" to trash?`, { danger:true, okLabel:"Move to trash" })) safe(async()=>{ await softDelete("classes", c.id); renderClasses(body); })(); };
    bindRowGestures(row, { onView:view, onEdit:edit, onDelete:del });
    list.appendChild(row);
  });
  document.getElementById("addBtn").onclick = () => openClassModal(body, teachers, null);
}
function openClassModal(body, teachers, c) {
  const isEdit = !!c;
  openModal(isEdit ? "Edit class" : "New class", `
    <div class="grid2">
      <div class="field"><label>Class name</label><input id="f_name" placeholder="Grade 5" value="${c?.name||''}"/></div>
      <div class="field"><label>Stream</label><input id="f_section" placeholder="East" value="${c?.section||''}"/></div>
    </div>
    <div class="field"><label>Class teacher</label><select id="f_teacher"><option value="">— None —</option>${teachers.map(t=>`<option value="${t.id}" ${c?.class_teacher_id===t.id?'selected':''}>${t.full_name}</option>`).join("")}</select></div>
  `, async (ov) => {
    const payload = { name: val(ov,"f_name"), section: val(ov,"f_section"), class_teacher_id: val(ov,"f_teacher") || null };
    if (isEdit) await dbUpdate("classes", c.id, payload); else await dbInsert("classes", payload);
    renderClasses(body);
  }, { saveLabel: isEdit ? "Save changes" : "Add" });
}

async function renderSubjects(body) {
  const [subjects, classes] = await Promise.all([
    dbSelectActive("subjects", { order:"name.asc" }),
    dbSelectActive("classes", { order:"name.asc" }),
  ]);
  body.innerHTML = `<div class="section-head"><h3 style="color:var(--indigo);">Subjects</h3><button class="btn btn-primary btn-sm" id="addBtn">${ic.plus} Add subject</button></div><div class="card" id="list"></div>`;
  const list = document.getElementById("list");
  list.innerHTML = subjects.length ? "" : emptyState("No subjects yet.");
  for (const s of subjects) {
    let links = [];
    try { links = await dbSelect("class_subjects", { select:"class_id,classes(name,section)", subject_id:`eq.${s.id}` }); } catch(e) { links = []; }
    const linkNames = links.map(l => l.classes ? (l.classes.name+(l.classes.section?(' '+l.classes.section):'')) : '').filter(Boolean);
    const row = el(`<div class="list-row"><div class="avatar">${initials(s.name)}</div>
      <div class="list-main"><div class="list-title">${s.name}</div><div class="list-sub">${s.code||""} ${linkNames.length?('· '+linkNames.length+' class'+(linkNames.length>1?'es':'')+' linked'):'· Not linked to any class'}</div></div></div>`);
    const view = () => openViewModal(s.name, [["Code", s.code], ["Linked classes", linkNames.join(", ") || "None"]], () => openSubjectModal(body, classes, s, links.map(l=>l.class_id)));
    const edit = () => openSubjectModal(body, classes, s, links.map(l=>l.class_id));
    const del = async () => { if (await customConfirm(`Move "${s.name}" to trash?`, { danger:true, okLabel:"Move to trash" })) safe(async()=>{ await softDelete("subjects", s.id); renderSubjects(body); })(); };
    bindRowGestures(row, { onView:view, onEdit:edit, onDelete:del });
    list.appendChild(row);
  }
  document.getElementById("addBtn").onclick = () => openSubjectModal(body, classes, null, []);
}
function openSubjectModal(body, classes, s, linkedClassIds) {
  const isEdit = !!s;
  openModal(isEdit ? "Edit subject" : "New subject", `
    <div class="field"><label>Subject name</label><input id="f_name" placeholder="Mathematics" value="${s?.name||''}"/></div>
    <div class="field"><label>Code</label><input id="f_code" placeholder="MTH" value="${s?.code||''}"/></div>
    <div class="field"><label>Linked classes</label>
      <div style="max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:8px;">
        ${classes.length ? classes.map(c=>`
          <label style="display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13.5px;">
            <input type="checkbox" class="f_classlink" value="${c.id}" style="width:auto;" ${linkedClassIds.includes(c.id)?'checked':''}/>
            ${c.name}${c.section?(' '+c.section):''}
          </label>
        `).join("") : `<div style="color:var(--ink-soft);font-size:13px;padding:4px;">Create a class first in Setup.</div>`}
      </div>
    </div>
  `, async (ov) => {
    const payload = { name: val(ov,"f_name"), code: val(ov,"f_code") };
    let subjectId = s?.id;
    if (isEdit) await dbUpdate("subjects", subjectId, payload);
    else { const created = await dbInsert("subjects", payload); subjectId = created[0].id; }
    const selectedIds = [...ov.querySelectorAll(".f_classlink:checked")].map(cb=>cb.value);
    const toAdd = selectedIds.filter(id => !linkedClassIds.includes(id));
    const toRemove = linkedClassIds.filter(id => !selectedIds.includes(id));
    if (toAdd.length) await dbInsert("class_subjects", toAdd.map(class_id => ({ class_id, subject_id: subjectId })));
    for (const class_id of toRemove) { await sb(`/rest/v1/class_subjects?class_id=eq.${class_id}&subject_id=eq.${subjectId}`, { method:"DELETE" }); }
    renderSubjects(body);
  }, { saveLabel: isEdit ? "Save changes" : "Add" });
}

function emptyState(text) { return `<div class="empty">${ic.empty}<div>${text}</div></div>`; }

/* ---------------- STUDENTS ---------------- */
async function renderStudents(container, opts={}) {
  const search = opts.search || "";
  const classFilter = opts.classFilter || "";
  const [classes] = await Promise.all([ dbSelectActive("classes", { order:"name.asc" }) ]);
  let params = { select:"*,classes(name,section)", order:"full_name.asc" };
  if (search) params.or = `(full_name.ilike.*${encodeURIComponent(search)}*,admission_no.ilike.*${encodeURIComponent(search)}*)`;
  if (classFilter) params.class_id = `eq.${classFilter}`;
  const students = await dbSelectActive("students", params);
  container.innerHTML = `
    <h3 style="color:var(--sky);margin-bottom:12px;">Students</h3>
    <div class="search-bar">
      <input id="searchInput" placeholder="Search by name or admission ID…" value="${search}"/>
      <select id="classFilterSel"><option value="">All classes</option>${classes.map(c=>`<option value="${c.id}" ${classFilter===c.id?'selected':''}>${c.name}${c.section?(' '+c.section):''}</option>`).join("")}</select>
    </div>
    <div class="card" id="list"></div>
  `;
  document.getElementById("searchInput").oninput = debounce((e)=>renderStudents(container,{search:e.target.value,classFilter}),350);
  document.getElementById("classFilterSel").onchange = (e)=>renderStudents(container,{search,classFilter:e.target.value});
  const list = document.getElementById("list");
  list.innerHTML = students.length ? "" : emptyState("No students found.");
  students.forEach(s => {
    const row = el(`<div class="list-row">
      ${avatarHtml(s.full_name, s.photo_url)}
      <div class="list-main"><div class="list-title">${s.full_name}</div>
      <div class="list-sub">${s.admission_no} · ${s.classes ? (s.classes.name+(s.classes.section?(' '+s.classes.section):'')) : 'Unassigned'}</div></div>
      <span class="badge ${s.status==='active'?'badge-green':'badge-grey'}">${s.status}</span>
    </div>`);
    const view = () => openViewModal(s.full_name, [
      ["Photo", s.photo_url ? `<img src="${s.photo_url}" style="width:56px;height:56px;border-radius:10px;object-fit:cover;"/>` : ""],
      ["Admission no.", s.admission_no], ["Class", s.classes ? (s.classes.name+(s.classes.section?(' '+s.classes.section):'')) : 'Unassigned'],
      ["Gender", s.gender], ["Date of birth", s.dob],
      ["Parent/guardian", s.guardian_name], ["Relationship", s.guardian_relationship], ["Guardian phone", s.guardian_phone],
      ["Medical information", s.medical_info],
      ["Village", s.village], ["Subcounty", s.subcounty], ["District", s.district],
      ["Emergency contact", s.emergency_name], ["Emergency relationship", s.emergency_relationship], ["Emergency phone", s.emergency_phone],
      ["Status", s.status],
    ], () => openStudentModal(container, classes, s));
    const edit = () => openStudentModal(container, classes, s);
    const del = async () => { if (await customConfirm(`Move ${s.full_name} to trash?`, { danger:true, okLabel:"Move to trash" })) safe(async()=>{ await softDelete("students", s.id); renderStudents(container,{search,classFilter}); })(); };
    bindRowGestures(row, { onView:view, onEdit:edit, onDelete:del });
    list.appendChild(row);
  });
  addFab(container, () => openStudentModal(container, classes, null));
}
function openStudentModal(container, classes, s) {
  const isEdit = !!s;
  const initialGender = s?.gender || "Male";
  let capturedPhotoDataUrl = null; // set when the in-browser camera (getUserMedia) captures a photo
  openModal(isEdit ? "Edit student" : "Register student", `
    <div class="field" style="text-align:center;">
      <label>Photo</label>
      <div id="photoPreviewWrap" style="display:flex;justify-content:center;margin-bottom:8px;">${avatarHtml(s?.full_name, s?.photo_url, 72)}</div>
      <div class="row" style="justify-content:center;gap:8px;">
        <button type="button" class="btn btn-ghost btn-sm" id="liveBtn">Live</button>
        <button type="button" class="btn btn-ghost btn-sm" id="pickBtn">Pick</button>
      </div>
      <input id="f_photo_live" type="file" accept="image/*" capture="user" style="display:none;"/>
      <input id="f_photo_pick" type="file" accept="image/*" style="display:none;"/>
    </div>
    <div class="grid2">
      <div class="field"><label>Admission no.</label><input id="f_adm" readonly value="${s?.admission_no || (isEdit ? '' : nextIdFor('student', initialGender))}"/></div>
      <div class="field"><label>Full name</label><input id="f_name" required value="${s?.full_name||''}"/></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Date of birth</label><input id="f_dob" type="text" class="datefield" readonly required placeholder="Select date" value="${s?.dob||''}"/></div>
      <div class="field"><label>Gender</label><select id="f_gender" required>
        <option ${s?.gender==='Male'?'selected':''}>Male</option><option ${s?.gender==='Female'?'selected':''}>Female</option></select></div>
    </div>
    <div class="field"><label>Class</label><select id="f_class" required><option value="">— Select class —</option>${classes.map(c=>`<option value="${c.id}" ${s?.class_id===c.id?'selected':''}>${c.name}${c.section?(' '+c.section):''}</option>`).join("")}</select></div>

    <div class="field" style="font-weight:700;color:var(--navy-2);margin-top:6px;">Parent / guardian</div>
    <div class="grid2">
      <div class="field"><label>Name</label><input id="f_gname" required value="${s?.guardian_name||''}"/></div>
      <div class="field"><label>Relationship</label><input id="f_grel" required placeholder="Mother, Father, Guardian…" value="${s?.guardian_relationship||''}"/></div>
    </div>
    <div class="field"><label>Phone number</label><input id="f_gphone" required value="${s?.guardian_phone||''}"/></div>

    <div class="field" style="font-weight:700;color:var(--navy-2);margin-top:6px;">Medical information</div>
    <div class="field"><label>Allergies, conditions, medication, etc.</label><textarea id="f_medical" rows="2" required>${s?.medical_info||''}</textarea></div>

    <div class="field" style="font-weight:700;color:var(--navy-2);margin-top:6px;">Location</div>
    <div class="grid2">
      <div class="field"><label>Village</label><input id="f_village" required value="${s?.village||''}"/></div>
      <div class="field"><label>Subcounty</label><input id="f_subcounty" required value="${s?.subcounty||''}"/></div>
    </div>
    <div class="field"><label>District</label><input id="f_district" required value="${s?.district||''}"/></div>

    <div class="field" style="font-weight:700;color:var(--navy-2);margin-top:6px;">Emergency contact</div>
    <div class="grid2">
      <div class="field"><label>Name</label><input id="f_ename" value="${s?.emergency_name||''}"/></div>
      <div class="field"><label>Relationship</label><input id="f_erel" value="${s?.emergency_relationship||''}"/></div>
    </div>
    <div class="field"><label>Phone number</label><input id="f_ephone" value="${s?.emergency_phone||''}"/></div>

    <div class="field"><label>Status</label><select id="f_status" required>
      ${["active","inactive","graduated","transferred"].map(v=>`<option value="${v}" ${s?.status===v?'selected':''}>${v}</option>`).join("")}</select></div>
  `, async (ov) => {
    requireFields(ov, [
      ["f_name","Full name"], ["f_dob","Date of birth"], ["f_class","Class"],
      ["f_gname","Parent/guardian name"], ["f_grel","Parent/guardian relationship"], ["f_gphone","Parent/guardian phone"],
      ["f_medical","Medical information"], ["f_village","Village"], ["f_subcounty","Subcounty"], ["f_district","District"],
    ]);
    const chosenFile = ov.querySelector("#f_photo_live").files[0] || ov.querySelector("#f_photo_pick").files[0];
    if (!isEdit && !capturedPhotoDataUrl && !chosenFile) throw new Error("A registration photo is required — use Live or Pick.");
    const photo_url = capturedPhotoDataUrl || (chosenFile ? await fileToDataURL(chosenFile) : (s?.photo_url || null));
    const payload = {
      admission_no: val(ov,"f_adm"), full_name: val(ov,"f_name"), dob: val(ov,"f_dob")||null,
      gender: val(ov,"f_gender"), class_id: val(ov,"f_class")||null,
      guardian_name: val(ov,"f_gname"), guardian_relationship: val(ov,"f_grel"), guardian_phone: val(ov,"f_gphone"),
      medical_info: val(ov,"f_medical"),
      village: val(ov,"f_village"), subcounty: val(ov,"f_subcounty"), district: val(ov,"f_district"),
      emergency_name: val(ov,"f_ename"), emergency_relationship: val(ov,"f_erel"), emergency_phone: val(ov,"f_ephone"),
      status: val(ov,"f_status"), photo_url,
    };
    if (isEdit) await dbUpdate("students", s.id, payload); else { await dbInsert("students", payload); await advanceIdSeq("student"); }
    renderStudents(container);
  }, { saveLabel: isEdit ? "Save changes" : "Register" });
  const liveInput = document.getElementById("f_photo_live");
  const pickInput = document.getElementById("f_photo_pick");
  const setPreview = (dataUrl) => { document.getElementById("photoPreviewWrap").innerHTML = avatarHtml(s?.full_name, dataUrl, 72); };
  document.getElementById("liveBtn").onclick = () => {
    openCameraCapture(
      (dataUrl) => { // got a photo straight from the in-browser camera
        capturedPhotoDataUrl = dataUrl;
        liveInput.value = ""; pickInput.value = "";
        setPreview(dataUrl);
      },
      () => { // getUserMedia unavailable/denied here — fall back to the device's native camera app
        toast("In-page camera isn't available here — opening the picker instead.", false);
        liveInput.click();
      }
    );
  };
  document.getElementById("pickBtn").onclick = () => pickInput.click();
  liveInput.onchange = async () => {
    if (!liveInput.files[0]) return;
    capturedPhotoDataUrl = null; pickInput.value = ""; // live capture takes precedence over any previously picked file
    const dataUrl = await fileToDataURL(liveInput.files[0]);
    if (dataUrl) setPreview(dataUrl);
  };
  pickInput.onchange = async () => {
    if (!pickInput.files[0]) return;
    capturedPhotoDataUrl = null; liveInput.value = ""; // picked file takes precedence over any prior capture
    const dataUrl = await fileToDataURL(pickInput.files[0]);
    if (dataUrl) setPreview(dataUrl);
  };
  // Admission no. is always generated from Setup → ID Format, based on gender — never hand-typed.
  if (!isEdit) {
    const admInput = document.getElementById("f_adm");
    const genderSelect = document.getElementById("f_gender");
    genderSelect.onchange = () => { admInput.value = nextIdFor("student", genderSelect.value); };
  }
}

  }, { saveLabel: isEdit ? "Save changes" : "Add" });
  const photoInput = document.getElementById("f_photo");
  photoInput.onchange = async () => {
    const dataUrl = await fileToDataURL(photoInput.files[0]);
    if (dataUrl) document.getElementById("photoPreviewWrap").innerHTML = avatarHtml(t?.full_name, dataUrl, 72);
  };
  // Staff no. is always generated from Setup → ID Format, based on gender — never hand-typed.
  if (!isEdit) {
    const staffInput = document.getElementById("f_staffno");
    const genderSelect = document.getElementById("f_gender");
    genderSelect.onchange = () => { staffInput.value = nextIdFor("teacher", genderSelect.value); };
  }
}

/* ---- Modal: mark present/absent for every student in one class ---- */
async function openClassAttendanceModal(cls, date, onSaved) {
  const overlay = el(`<div class="overlay"><div class="modal">
    <button class="modal-close">&times;</button>
    <h3>${cls.name}${cls.section?(' '+cls.section):''} <span style="font-weight:500;font-size:12.5px;color:var(--ink-soft);">— ${date}</span></h3>
    <div id="attModalBody" style="margin-top:10px;"><div class="center-loading">Loading…</div></div>
    <div class="form-actions">
      <button class="btn btn-ghost" id="modalCancel">Close</button>
      <button class="btn btn-primary" id="saveAttBtn">Save attendance</button>
    </div>
  </div></div>`);
  document.body.appendChild(overlay);
  enableModalKeyboardHandling(overlay);
  const close = () => overlay.remove();
  overlay.querySelector(".modal-close").onclick = close;
  overlay.querySelector("#modalCancel").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };

  const bodyEl = overlay.querySelector("#attModalBody");
  const [students, existing] = await Promise.all([
    dbSelectActive("students", { class_id:`eq.${cls.id}`, status:"eq.active", order:"full_name.asc" }),
    dbSelect("attendance", { class_id:`eq.${cls.id}`, date:`eq.${date}` }).catch(()=>[]),
  ]);
  const marks = {}; existing.forEach(a => marks[a.student_id]=a.status);
  bodyEl.innerHTML = students.length ? "" : emptyState("No active students in this class.");
  const state = {};
  students.forEach(s => {
    state[s.id] = marks[s.id] || null;
    const row = el(`<div class="roll-row">
      <div class="roll-top">
        ${avatarHtml(s.full_name, s.photo_url)}
        <div class="list-main"><div class="roll-name">${s.full_name}</div><div class="roll-sub">${s.admission_no}</div></div>
      </div>
      <div class="att-btns" data-sid="${s.id}">
        <button class="att-btn p ${state[s.id]==='present'?'on':''}" data-v="present">Present</button>
        <button class="att-btn a ${state[s.id]==='absent'?'on':''}" data-v="absent">Absent</button>
      </div>
    </div>`);
    row.querySelectorAll(".att-btn").forEach(btn => {
      btn.onclick = () => {
        state[s.id] = btn.dataset.v;
        row.querySelectorAll(".att-btn").forEach(b=>b.classList.remove("on"));
        btn.classList.add("on");
      };
    });
    bodyEl.appendChild(row);
  });
  overlay.querySelector("#saveAttBtn").onclick = async (e) => {
    if (!students.length) { close(); return; }
    e.target.textContent = "Saving…"; e.target.disabled = true;
    try {
      const records = Object.entries(state).filter(([,v])=>v).map(([student_id,status])=>({ student_id, class_id: cls.id, date, status, marked_by: profile.id }));
      if (records.length) await dbUpsert("attendance", records, "student_id,date");
      toast("Attendance saved.", false);
      close();
      onSaved && onSaved();
    } catch(err) { toast(err.message); e.target.textContent = "Save attendance"; e.target.disabled=false; }
  };
}

async function renderFeeStructure(body) {
  const [classes, terms, items] = await Promise.all([
    dbSelectActive("classes", { order:"name.asc" }),
    dbSelectActive("terms", { order:"start_date.desc" }),
    dbSelectActive("fee_structures", { select:"class_id,amount" }),
  ]);
  if (!classes.length) { body.innerHTML = emptyState("Create a class first in Setup, then come back to set up fees."); return; }
  const byClass = {};
  items.forEach(i => {
    const k = i.class_id;
    if (!byClass[k]) byClass[k] = { count:0, total:0 };
    byClass[k].count++;
    byClass[k].total += Number(i.amount);
  });
  body.innerHTML = `<div class="section-head"><h3 style="color:var(--red);">Fee Structure</h3></div><div style="font-size:13px;color:var(--ink-soft);margin-bottom:12px;">Select a class to view or set up its fee items.</div><div class="card" id="list"></div>`;
  const list = document.getElementById("list");
  classes.forEach(c => {
    const stat = byClass[c.id] || { count:0, total:0 };
    const row = el(`<div class="list-row"><div class="avatar">${ic.fees}</div>
      <div class="list-main"><div class="list-title">${c.name}${c.section?(' '+c.section):''}</div>
      <div class="list-sub">${stat.count} fee item${stat.count===1?'':'s'}${stat.count?` · ${currency()}${stat.total.toLocaleString()}`:''}</div></div>
      <div style="color:var(--ink-soft);display:flex;align-items:center;">${ic.chevronRight}</div></div>`);
    row.onclick = () => renderFeeStructureClass(body, c, terms);
    list.appendChild(row);
  });
}
async function renderFeeStructureClass(body, cls, terms) {
  const items = await dbSelectActive("fee_structures", { select:"*,terms(name)", class_id:`eq.${cls.id}`, order:"created_at.desc" });
  const total = items.reduce((a,b)=>a+Number(b.amount), 0);

    const view = () => openViewModal(f.item_name, [["Amount", currency()+Number(f.amount).toLocaleString()], ["Term", f.terms?.name]], () => openFeeItemModal(body, cls, terms, f, refresh));
    const edit = () => openFeeItemModal(body, cls, terms, f, refresh);
    const del = async () => { if (await customConfirm(`Move "${f.item_name}" to trash?`, { danger:true, okLabel:"Move to trash" })) safe(async()=>{ await softDelete("fee_structures", f.id); refresh(); })(); };
    bindRowGestures(row, { onView:view, onEdit:edit, onDelete:del });

  });

function openFeeItemModal(body, cls, terms, f, onDone) {
  const isEdit = !!f;
  const done = onDone || (() => {});
  const classLabel = `<div class="field"><label>Class</label><div style="padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--card-alt);font-weight:700;color:var(--navy);">${cls.name}${cls.section?(' '+cls.section):''}</div></div>`;

  // Editing an existing single fee item — keep this a focused one-item form.
  if (isEdit) {
    openModal("Edit fee item", `
      ${classLabel}
      <div class="field"><label>Term</label><select id="f_term">${terms.map(t=>`<option value="${t.id}" ${f.term_id===t.id?'selected':''}>${t.name}</option>`).join("")}</select></div>
      <div class="grid2">
        <div class="field"><label>Item name</label><input id="f_item" placeholder="Tuition" value="${f.item_name||''}"/></div>
        <div class="field"><label>Amount</label><input id="f_amount" type="number" placeholder="50000" value="${f.amount||''}"/></div>
      </div>
    `, async (ov)=>{
      const payload = { class_id: cls.id, term_id: val(ov,"f_term"), item_name: val(ov,"f_item"), amount: Number(val(ov,"f_amount")) };
      await dbUpdate("fee_structures", f.id, payload);
      done();
    }, { saveLabel: "Save changes" });
    return;
  }

  // Adding new fee items — allow multiple item rows (Tuition, Uniform, Development fund, etc.)
  // with rows that can be added or cleared, and a running total shown at the bottom.
  let rowCount = 0;
  const makeRowHtml = () => {
    rowCount++;
    return `<div class="feeItemRow" data-row="${rowCount}" style="display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;">
      <div class="field" style="flex:1.5;margin-bottom:0;">${rowCount===1?'<label>Item name</label>':''}<input class="fi-name" placeholder="e.g. Tuition, Uniform, Development fund"/></div>
      <div class="field" style="flex:1;margin-bottom:0;">${rowCount===1?'<label>Amount</label>':''}<input class="fi-amount" type="number" placeholder="0"/></div>
      <button type="button" class="btn btn-ghost btn-sm fi-remove" title="Remove item" style="padding:10px 12px;flex-shrink:0;">&times;</button>
    </div>`;
  };
  const firstRowHtml = makeRowHtml();

  const overlay = openModal("New fee items", `
    ${classLabel}
    <div class="field"><label>Term</label><select id="f_term">${terms.map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}</select></div>
    <div id="feeItemsWrap">${firstRowHtml}</div>
    <button type="button" class="link-btn" id="addItemRowBtn">${ic.plus} Add another item</button>
    <div class="row" style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px;">
      <div style="font-weight:700;color:var(--navy);">Total</div>
      <div style="font-weight:800;font-size:17px;color:var(--red);" id="feeItemsTotal">${currency()}0</div>
    </div>
  `, async (ov) => {
    const termId = val(ov,"f_term");
    const payloads = Array.from(ov.querySelectorAll(".feeItemRow")).map(r => ({
      class_id: cls.id,
      term_id: termId,
      item_name: r.querySelector(".fi-name").value.trim(),
      amount: Number(r.querySelector(".fi-amount").value),
    })).filter(p => p.item_name && p.amount > 0);
    if (!payloads.length) throw new Error("Add at least one fee item with a name and an amount.");
    await dbInsert("fee_structures", payloads);
    done();
  }, { saveLabel: "Add items" });

  const wrap = overlay.querySelector("#feeItemsWrap");
  const totalEl = overlay.querySelector("#feeItemsTotal");
  const recalcTotal = () => {
    const total = Array.from(overlay.querySelectorAll(".fi-amount")).reduce((a,i)=>a+(Number(i.value)||0), 0);
    totalEl.textContent = currency() + total.toLocaleString();
  };
  const bindRow = (rowEl) => {
    rowEl.querySelector(".fi-amount").addEventListener("input", recalcTotal);
    rowEl.querySelector(".fi-name").addEventListener("input", recalcTotal);
    rowEl.querySelector(".fi-remove").onclick = () => {
      // If it's the only row left, clear it instead of removing it entirely.
      if (overlay.querySelectorAll(".feeItemRow").length <= 1) {
        rowEl.querySelector(".fi-name").value = "";
        rowEl.querySelector(".fi-amount").value = "";
        recalcTotal();
        return;
      }
      rowEl.remove();
      recalcTotal();
    };
  };
  wrap.querySelectorAll(".feeItemRow").forEach(bindRow);
  overlay.querySelector("#addItemRowBtn").onclick = () => {
    const holder = document.createElement("div");
    holder.innerHTML = makeRowHtml();
    const rowEl = holder.firstChild;
    wrap.appendChild(rowEl);
    bindRow(rowEl);
    rowEl.querySelector(".fi-name").focus();
  };
}

function methodLabel(m) {

/* ---------------- EXAMS ---------------- */
// A single, consistent label for an exam — exam type + class + term. No separate
// free-text "exam name" field anymore, so this can never show duplicated/repeated text.
function examLabel(x) {
  const type = x.exam_types?.name || x.name || "Exam";
  const cls = (x.classes?.name || "") + (x.classes?.section ? (" " + x.classes.section) : "");
  const term = x.terms?.name || "";
  return [type, cls, term].filter(Boolean).join(" • ");
}
function examDateRange(x) {
  if (x.exam_date && x.exam_end_date) return `${x.exam_date} → ${x.exam_end_date}`;
  return x.exam_date || x.exam_end_date || "";
}
// Guards every exam picker against showing the same class+term+exam-type more than once,
// even if duplicate rows already exist in the database from before.
function dedupeExams(exams) {
  const seen = new Set(); const out = [];
  exams.forEach(x => {
    const key = `${x.class_id}|${x.term_id}|${x.exam_type_id}`;
    if (seen.has(key)) return;
    seen.add(key); out.push(x);
  });
  return out;
}

}

/* ---- Results: every saved result, grouped per child / class / exam ---- */
async function renderResultsOverview(body, filters={}) {
  const [examsRaw, classes, terms, subjects, resultsRaw, students] = await Promise.all([
    dbSelectActive("exams", { select:"*,classes(name,section),terms(name),exam_types(name)", order:"exam_date.desc" }),
    dbSelectActive("classes", { order:"name.asc" }),
    dbSelectActive("terms", { order:"start_date.desc" }),
    dbSelectActive("subjects", { order:"name.asc" }),
    dbSelect("exam_results", { select:"*" }),
    dbSelectActive("students", { select:"id,full_name,admission_no,class_id" }),
    loadGrades(),
  ]);
  const exams = dedupeExams(examsRaw);
  const examMap = {}; exams.forEach(x=>examMap[x.id]=x);
  const studentMap = {}; students.forEach(s=>studentMap[s.id]=s);
  const subjectMap = {}; subjects.forEach(s=>subjectMap[s.id]=s.name);

  // One row per (student, exam) — every subject saved for that student+exam rolls up into it.
  const groups = {};
  resultsRaw.forEach(r => {
    const exam = examMap[r.exam_id];
    if (!exam) return; // belongs to a trashed/duplicate exam we've already filtered out
    if (filters.class_id && exam.class_id !== filters.class_id) return;
    if (filters.term_id && exam.term_id !== filters.term_id) return;
    const key = `${r.student_id}|${r.exam_id}`;
    if (!groups[key]) groups[key] = { student_id:r.student_id, exam_id:r.exam_id, total:0, max:0, subjects:[] };
    groups[key].total += Number(r.marks_obtained||0);
    groups[key].max += Number(r.max_marks||0);
    groups[key].subjects.push(r);
  });
  const rows = Object.values(groups)
    .filter(g => studentMap[g.student_id] && examMap[g.exam_id])
    .sort((a,b) => (studentMap[a.student_id].full_name||"").localeCompare(studentMap[b.student_id].full_name||""));

  body.innerHTML = `
    <div class="row" style="gap:10px;margin-bottom:14px;">
      <select id="filterClass" style="flex:1;min-width:140px;"><option value="">All classes</option>${classes.map(c=>`<option value="${c.id}" ${filters.class_id===c.id?'selected':''}>${c.name}${c.section?(' '+c.section):''}</option>`).join("")}</select>
      <select id="filterTerm" style="flex:1;min-width:140px;"><option value="">All terms</option>${terms.map(t=>`<option value="${t.id}" ${filters.term_id===t.id?'selected':''}>${t.name}</option>`).join("")}</select>
    </div>
    <div class="card" id="resultsList"></div>
  `;
  document.getElementById("filterClass").onchange = (e) => renderResultsOverview(body, Object.assign({}, filters, { class_id: e.target.value || undefined }));
  document.getElementById("filterTerm").onchange = (e) => renderResultsOverview(body, Object.assign({}, filters, { term_id: e.target.value || undefined }));

  const list = document.getElementById("resultsList");
  list.innerHTML = rows.length ? "" : emptyState("No results recorded yet. Enter marks from the \"Enter results\" tab.");
  rows.forEach(g => {
    const student = studentMap[g.student_id];
    const exam = examMap[g.exam_id];
    const pct = g.max ? (g.total/g.max*100) : 0;
    const row = el(`<div class="list-row"><div class="avatar">${initials(student.full_name)}</div>
      <div class="list-main"><div class="list-title">${student.full_name}</div>
      <div class="list-sub">${examLabel(exam)}</div></div>
      <div style="text-align:right;"><div style="font-weight:800;color:var(--navy);">${g.total}/${g.max}</div><div style="font-size:11.5px;color:var(--ink-soft);">${pct.toFixed(1)}% · ${gradeLabel(pct)}</div></div>
    </div>`);
    row.onclick = () => openViewModal(`${student.full_name} — ${examLabel(exam)}`, [
      ["Admission no.", student.admission_no],
      ...g.subjects.map(r => [subjectMap[r.subject_id] || "Subject", `${r.marks_obtained}/${r.max_marks}${r.remarks?(' — '+r.remarks):''}`]),
      ["Total", `${g.total} / ${g.max}`],
      ["Average", `${pct.toFixed(1)}%`],
      ["Grade", gradeLabel(pct)],
    ]);
    list.appendChild(row);
  });
}
// Admin-defined grade bands (Setup → Grades), cached after first load so report cards
// and results don't re-fetch on every row. Falls back to a default A–F scale if the
// admin hasn't set up any grades yet (or the grades table doesn't exist).
let gradesCache = null;
async function loadGrades() {
  if (gradesCache !== null) return gradesCache;
  try {
    const rows = await dbSelectActive("grades", { order:"min_score.desc" });
    gradesCache = rows.length ? rows : [];
  } catch (e) { gradesCache = []; }
  return gradesCache;
}
function gradeInfo(pct) {
  const bands = gradesCache || [];
  const match = bands.find(g => pct >= Number(g.min_score) && pct <= Number(g.max_score));
  if (match) return { grade: match.grade, remark: match.remark || "" };
  // Default scale — used only until the admin defines grades in Setup.
  const grade = pct>=80?"A":pct>=70?"B":pct>=60?"C":pct>=50?"D":pct>=40?"E":"F";
  return { grade, remark: "" };
}
function gradeFor(pct) { return gradeInfo(pct).grade; }
function gradeLabel(pct) { const {grade,remark} = gradeInfo(pct); return remark ? `${grade} (${remark})` : grade; }

      { label:"Delete permanently", icon:ic.trash, danger:true, onClick: () => { customConfirm(`Permanently delete "${name}"? This cannot be undone.`, { danger:true, okLabel:"Delete permanently" }).then(ok => { if (ok) safe(async()=>{ await dbDelete(item.table, item.row.id); renderTrash(container); })(); }); } },
    ]);
    list.appendChild(row);
  });
  document.getElementById("emptyBtn").onclick = async () => {
    if (!(await customConfirm(`Permanently delete all ${allTrashed.length} item(s) in trash? This cannot be undone.`, { danger:true, okLabel:"Delete all" }))) return;

      for (const item of allTrashed) { await dbDelete(item.table, item.row.id); }
      toast("Trash emptied.", false);
      renderTrash(container);
    })();
  };
