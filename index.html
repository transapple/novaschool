<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nova Mother App</title>
<style>
  :root{
    /* Ink & neutrals */
    --navy:#161A26; --navy-2:#2A2F42; --ink:#1A1D27; --ink-soft:#666C7D;
    --slate:#8A90A0; --slate-tint:#EEF0F5; --line:#E6E8EF; --line-soft:#EEF0F5;
    --bg:#F0F1F6; --card:#FFFFFF; --surface-2:#F6F7FB;
    /* Accent (primary actions, active nav) — cool azure, distinct from status colors */
    --accent:#3457D5; --accent-dark:#28439E; --accent-tint:#EAEFFD;
    /* Status semantics */
    --teal:#1C9A6C; --teal-dark:#157A56; --teal-tint:#E3F6EC;
    --red:#D8433B; --red-dark:#B33831; --red-tint:#FCEAE9;
    --amber:#B8790F; --amber-tint:#FCF1DC;
    --radius:16px; --radius-sm:12px; --radius-lg:20px;
    --shadow-sm:0 1px 2px rgba(20,23,35,.05), 0 1px 1px rgba(20,23,35,.03);
    --shadow-md:0 12px 28px -12px rgba(20,23,35,.20);
    --shadow-lg:0 20px 45px -18px rgba(20,23,35,.30);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:720px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px));}

  /* ---- Top bar / brand / account chip ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;padding:2px 2px 0;}
  .brand{font-weight:800;font-size:19px;letter-spacing:-.01em;color:var(--navy);}
  .brand span{color:var(--accent);}
  .acct-chip{display:flex;align-items:center;gap:8px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 13px 5px 5px;box-shadow:var(--shadow-sm);transition:border-color .15s ease,transform .1s ease;}
  .acct-chip:hover{border-color:var(--accent);}
  .acct-chip:active{transform:scale(.97);}
  .acct-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(155deg,var(--accent),var(--accent-dark));color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .acct-name{font-size:12.5px;font-weight:700;color:var(--navy-2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* =========================================================
     BOTTOM NAV — fixed 5-slot rail, no horizontal scrolling.
     Overflow items (Updates / Security / Settings) live behind
     the "More" slot as a slide-up sheet, the same pattern real
     native apps use once they have more than ~5 destinations.
     ========================================================= */
  .tabrail{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));margin:0;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);box-shadow:0 -8px 24px -14px rgba(20,23,35,.20);z-index:100;}
  .tab-pill{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--slate);font-size:10.5px;font-weight:700;padding:7px 2px 6px;border-radius:14px;cursor:pointer;transition:color .15s ease,transform .1s ease;position:relative;}
  .tab-pill:active{transform:scale(.94);}
  .tab-pill .icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:10px;transition:background .15s ease;margin-bottom:1px;}
  .tab-pill .icon svg{width:21px;height:21px;}
  .tab-pill.is-active{color:var(--accent-dark);}
  .tab-pill.is-active .icon{background:var(--accent-tint);}
  .tab-pill .nav-dot{position:absolute;top:4px;right:calc(50% - 15px);width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--card);}

  /* ---- "More" slide-up sheet (Updates / Security / Settings) ---- */
  .more-backdrop{position:fixed;inset:0;background:rgba(15,17,26,.42);z-index:130;opacity:0;pointer-events:none;transition:opacity .18s ease;}
  .more-backdrop.is-open{opacity:1;pointer-events:auto;}
  .more-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -20px 45px -10px rgba(20,23,35,.35);z-index:131;padding:10px 14px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s cubic-bezier(.32,.72,0,1);max-width:720px;margin:0 auto;}
  .more-sheet.is-open{transform:translateY(0);}
  .more-sheet-handle{width:36px;height:4px;border-radius:99px;background:var(--line);margin:2px auto 12px;}
  .more-sheet-title{font-weight:800;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;padding:0 4px 8px;}
  .more-item{display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:14px;cursor:pointer;transition:background .12s ease;}
  .more-item:active{background:var(--surface-2);}
  .more-item .icon{width:34px;height:34px;border-radius:10px;background:var(--slate-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--navy-2);}
  .more-item .icon svg{width:18px;height:18px;}
  .more-item-label{font-weight:700;font-size:14px;color:var(--navy);flex:1;}
  .more-item-chevron{color:var(--slate);font-size:18px;}

  /* =========================================================
     GROUPED MENU LIST — used for a school's own tabs (Oversight,
     Subscription, Features & Modules, Administrators, Danger
     Zone) and Settings (Account, Plans & Features, Admins), so
     both drill into one screen at a time via a native-style
     grouped list instead of a horizontal pill bar.
     ========================================================= */
  .menu-list-card{padding:6px 8px;}
  .menu-row{display:flex;align-items:center;gap:12px;padding:13px 8px;cursor:pointer;border-bottom:1px solid var(--line-soft);transition:background .12s ease;}
  .menu-row:last-child{border-bottom:none;}
  .menu-row:active{background:var(--surface-2);}
  .menu-row.is-danger .menu-row-label{color:var(--red-dark);}
  .menu-row-icon{width:34px;height:34px;border-radius:10px;background:var(--slate-tint);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--navy-2);}
  .menu-row-icon svg{width:18px;height:18px;}
  .menu-row.is-danger .menu-row-icon{background:var(--red-tint);color:var(--red-dark);}
  .menu-row-label{font-weight:700;font-size:14px;color:var(--navy);flex:1;min-width:0;}
  .menu-row-chevron{color:var(--slate);font-size:18px;flex-shrink:0;}

  /* ---- Secondary nav (within a school / settings) ---- */
  .subtabrail{display:flex;gap:5px;overflow-x:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:16px;-ms-overflow-style:none;scrollbar-width:none;}
  .subtabrail::-webkit-scrollbar{display:none;}
  .subtab-pill{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:6px;border:none;background:transparent;color:var(--ink-soft);font-size:12.5px;font-weight:700;padding:9px 12px;border-radius:11px;cursor:pointer;white-space:nowrap;transition:all .15s ease;}
  .subtab-pill:hover{color:var(--navy);}
  .subtab-pill.is-active{background:var(--card);color:var(--accent-dark);box-shadow:var(--shadow-sm);}
  .subtab-pill.is-danger.is-active{color:var(--red-dark);}

  .icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0;}

  /* =========================================================
     CARDS — every panel of content sits inside one of these.
     ========================================================= */
  .card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
  .card-danger{border-color:#F0C7C3;background:linear-gradient(180deg,var(--red-tint),var(--card) 70px);}
  .section-title{font-weight:800;font-size:14.5px;margin-bottom:12px;letter-spacing:-.005em;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .section-title .count-chip{font-size:11px;font-weight:800;color:var(--ink-soft);background:var(--slate-tint);border-radius:99px;padding:2px 9px;}
  .subtle{color:var(--ink-soft);font-size:12.5px;}
  .tiny-note{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
  .divider{border:none;border-top:1px solid var(--line);margin:16px 0;}

  /* ---- KPI stat card ---- */
  .stat-card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius-sm);padding:14px 14px 12px;box-shadow:var(--shadow-sm);}
  .stat-card .stat-value{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:-.01em;}
  .stat-card .stat-label{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}

  /* ---- Forms ---- */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.02em;}
  .field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;background:var(--surface-2);color:var(--ink);transition:border-color .15s ease,background .15s ease;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);background:#fff;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  /* ---- Toggle switch (feature/module on-off) ---- */
  .toggle-switch{position:relative;display:inline-flex;align-items:center;width:42px;height:24px;flex-shrink:0;cursor:pointer;}
  .toggle-switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2;}
  .toggle-slider{position:absolute;inset:0;background:var(--slate-tint);border:1px solid var(--line);border-radius:99px;transition:background .18s ease,border-color .18s ease;}
  .toggle-slider::before{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(20,23,35,.25);transition:transform .18s ease;}
  .toggle-switch input:checked + .toggle-slider{background:var(--teal);border-color:var(--teal-dark);}
  .toggle-switch input:checked + .toggle-slider::before{transform:translateX(18px);}
  .toggle-switch input:focus-visible + .toggle-slider{outline:2px solid var(--accent);outline-offset:2px;}
  .toggle-switch input:disabled + .toggle-slider{opacity:.5;cursor:not-allowed;}
  .toggle-row{display:flex;align-items:center;gap:9px;}
  .toggle-state{font-size:12.5px;color:var(--ink-soft);font-weight:700;min-width:54px;text-align:right;}

  /* ---- Buttons ---- */
  .btn{border:none;border-radius:var(--radius-sm);padding:11px 16px;font-size:13.5px;font-weight:700;cursor:pointer;transition:filter .15s ease,background .15s ease,transform .08s ease;}
  .btn:active{filter:brightness(0.94);transform:scale(.98);}
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px -8px rgba(52,87,213,.55);}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:var(--slate-tint);color:var(--navy-2);}
  .btn-ghost:hover{background:#E3E6EE;}
  .btn-danger{background:var(--red-tint);color:var(--red-dark);}
  .btn-danger:hover{background:#F9DBD9;}
  .btn-sm{padding:8px 12px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .row{display:flex;gap:8px;align-items:center;}

  /* =========================================================
     LIST ITEMS AS CARDS — every row in every list (schools,
     admins, payments, changelog, etc.) is its own tappable
     card: padded, rounded, shadowed, with a chevron affordance
     when it opens something. No bare border-bottom rows.
     ========================================================= */
  .school-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 14px;margin-bottom:9px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);transition:background .12s ease,border-color .12s ease,transform .08s ease;}
  .school-row:last-child{margin-bottom:0;}
  .school-name{font-weight:700;color:var(--navy);font-size:14px;}
  .clickable{cursor:pointer;}
  .clickable:hover{border-color:var(--line);background:#fff;box-shadow:var(--shadow-sm);}
  .clickable:active{transform:scale(.99);}
  .school-row.clickable::after{content:"";width:8px;height:8px;border-top:2px solid var(--slate);border-right:2px solid var(--slate);transform:rotate(45deg);flex-shrink:0;margin-left:2px;}

  .admin-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:13px 14px;margin-bottom:9px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--radius-sm);}
  .admin-row:last-child{margin-bottom:0;}
  .inline-form{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-top:8px;}
  .empty{color:var(--ink-soft);font-size:13px;padding:16px 4px;text-align:center;background:var(--surface-2);border-radius:var(--radius-sm);border:1px dashed var(--line);}

  /* ---- Badges ---- */
  .badge{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  .badge-active{background:var(--teal-tint);color:var(--teal-dark);}
  .badge-suspended{background:var(--red-tint);color:var(--red-dark);}
  .badge-pending{background:var(--amber-tint);color:var(--amber);}
  .badge-deactivated{background:var(--slate-tint);color:var(--slate);}
  .badge-warn{background:var(--amber-tint);color:var(--amber);}
  .badge-lock{background:var(--navy-2);color:#fff;display:inline-flex;align-items:center;gap:4px;}
  .badge-lock svg{width:10px;height:10px;stroke:#fff;stroke-width:2.4;}

  /* ---- Tables — kept for genuinely tabular data (logs), wrapped as a card panel ---- */
  .table-scroll{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;margin:0;border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:var(--surface-2);}
  .mini-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .mini-table th{text-align:left;color:var(--ink-soft);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;background:var(--surface-2);position:sticky;top:0;}
  .mini-table td{padding:10px 12px;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
  .mini-table tr:last-child td{border-bottom:none;}
  .mini-table tbody tr:nth-child(even){background:rgba(20,23,35,.015);}
  .table-scroll .mini-table{min-width:480px;}
  .table-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px;}

  /* ---- Nav / status links ---- */
  .back-link{color:var(--accent-dark);font-weight:700;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:4px;margin-bottom:12px;}
  .link-btn{color:var(--accent-dark);font-weight:700;cursor:pointer;}

  /* ---- Messages ---- */
  .err{background:var(--red-tint);color:var(--red-dark);padding:11px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:12px;}
  .msg-ok{background:var(--teal-tint);color:var(--teal-dark);padding:11px 13px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:12px;}

  /* ---- Login ---- */
  .login-wrap{min-height:86vh;display:flex;align-items:center;justify-content:center;}
  .login-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px 26px;box-shadow:var(--shadow-lg);}

  /* ---- Misc ---- */
  details summary{cursor:pointer;font-weight:700;color:var(--navy-2);font-size:13px;padding:4px 0;}
  pre{background:var(--navy);color:#D7DCEA;border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px;font-size:11px;overflow-x:auto;white-space:pre-wrap;}
  hr.divider{border-top:1px solid var(--line);}

  /* ---- Floating, draggable "Register school" button ---- */
  .fab-drag{
    position:fixed; right:20px; bottom:calc(92px + env(safe-area-inset-bottom,0px)); width:56px; height:56px; border-radius:50%;
    background:linear-gradient(155deg,var(--accent),var(--accent-dark)); color:#fff; border:none; z-index:120;
    display:flex; align-items:center; justify-content:center; cursor:grab;
    box-shadow:0 14px 30px -10px rgba(52,87,213,.55); touch-action:none;
  }
  .fab-drag svg{width:24px;height:24px;pointer-events:none;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .fab-drag:hover{filter:brightness(1.05);}
  .fab-drag.dragging{cursor:grabbing;box-shadow:0 18px 36px -10px rgba(20,23,35,.45);}

  /* ---- Modal ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(15,17,26,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;}
  .modal-box{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:22px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .modal-close{background:var(--slate-tint);border:none;border-radius:50%;width:28px;height:28px;color:var(--navy-2);font-size:16px;font-weight:700;cursor:pointer;line-height:1;}
</style>
</head>
<body>
<div id="app"></div>
<div id="fabRoot"></div>
<script>
/* ============================================================
   NOVA MOTHER APP
   Super-admin panel: register/suspend/manage every school that
   uses Nova School Manager. Uses the SAME Supabase project as the
   school app — schools are just rows in the `schools` table.
   ============================================================ */
const SUPABASE_URL = "https://pjdtlpnlvumpefxjmjpv.supabase.co";
const SUPABASE_KEY = "sb_publishable_Y48beigB72EVErcQKDwrDA_sTxiHI6u";


async function sb(path, opts = {}) {
  const headers = Object.assign({
    "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json",
  }, opts.headers || {});
  let res;
  try { res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, { headers })); }
  catch (e) { throw new Error("Check your internet connection and try again."); }
  let data = null;
  try { data = await res.json(); } catch(e) {}
  if (!res.ok) throw new Error((data && (data.message || data.error_description)) || "Request failed");
  return data;
}
const qs = (o) => Object.entries(o).filter(([,v])=>v!=null && v!=="").map(([k,v])=>`${k}=${v}`).join("&");

const REMEMBER_KEY = "novaMotherUsername";
let motherAdmin = null;
let view = "dashboard"; // "dashboard", "analytics", "monitoring", "comms", "updates", "settings", or "schoolDetail"
let currentSchoolId = null;
let schoolSubTab = null; // null = show this school's menu; else "oversight", "subscription", "features", "admins", "danger"
let schoolDangerNotice = null; // one-shot message shown when redirected into the Danger Zone tab
let settingsSubTab = null; // null = show the Settings menu; else "account", "admins", "plans"
const LOG_PAGE_SIZE = 10; // default number of rows shown before "Show all"
let auditLogItems = [];
let auditLogShowAll = false;
let loginActivityItems = [];
let loginActivityShowAll = false;
const SCHOOL_TABS = [["oversight","Oversight","monitoring"],["subscription","Subscription","subscription"],["features","Features & Modules","features"],["admins","Administrators","admins"],["danger","Danger Zone","danger",true]];
const SETTINGS_TABS = [["account","Account","account"],["plans","Plans & Features","subscription"],["admins","Admins","admins"]];

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const ms = new Date(dateStr + "T00:00:00") - new Date(new Date().toDateString());
  return Math.round(ms / 86400000);
}
function subscriptionBadge(s) {
  if (!s.subscription_expires_at) return `<span class="badge badge-deactivated">No plan set</span>`;
  const d = daysUntil(s.subscription_expires_at);
  if (d < 0) return `<span class="badge badge-suspended">Expired ${Math.abs(d)}d ago</span>`;
  if (d <= 7) return `<span class="badge badge-warn">Expires in ${d}d</span>`;
  if (d <= 30) return `<span class="badge badge-warn">Expires in ${d}d</span>`;
  return `<span class="badge badge-active">Active until ${s.subscription_expires_at}</span>`;
}
function statusBadge(status) {
  const map = { pending:"badge-pending", active:"badge-active", suspended:"badge-suspended", deactivated:"badge-deactivated" };
  return `<span class="badge ${map[status]||'badge-deactivated'}">${status}</span>`;
}

function rememberMother(username) { try { localStorage.setItem(REMEMBER_KEY, username); } catch(e) {} }
function forgetMother() { try { localStorage.removeItem(REMEMBER_KEY); } catch(e) {} }
function getRememberedMother() { try { return localStorage.getItem(REMEMBER_KEY) || null; } catch(e) { return null; } }
const TOKEN_KEY = "novaMotherToken";
function rememberToken(token) { try { localStorage.setItem(TOKEN_KEY, token); } catch(e) {} }
function forgetToken() { try { localStorage.removeItem(TOKEN_KEY); } catch(e) {} }
function getRememberedToken() { try { return localStorage.getItem(TOKEN_KEY) || null; } catch(e) { return null; } }

async function motherLogin(username, password, remember) {
  const rows = await sb(`/rest/v1/rpc/verify_mother_login`, { method:"POST", body: JSON.stringify({ p_username: username, p_password: password }) });
  const row = Array.isArray(rows) ? rows[0] : rows;
  if (!row || !row.id) throw new Error("Incorrect username or password.");
  motherAdmin = row;
  if (remember) { rememberMother(username); rememberToken(row.session_token); } else { forgetMother(); forgetToken(); }
}
// Silently restores a "remembered" session on launch. Requires the session token
// issued at login (not just the username) — a bare username is no longer enough
// to rehydrate a super-admin session.
async function tryRestoreMotherSession() {
  const username = getRememberedMother();
  const token = getRememberedToken();
  if (!username || !token) return false;
  try {
    const rows = await sb(`/rest/v1/rpc/restore_mother_session`, { method:"POST", body: JSON.stringify({ p_username: username, p_token: token }) });
    const row = Array.isArray(rows) ? rows[0] : rows;
    if (!row || !row.id) { forgetMother(); forgetToken(); return false; }
    motherAdmin = Object.assign({}, row, { session_token: token });
    return true;
  } catch(e) { return false; }
}
// ---- AUTH REMOVED ----
// No login screen, no username/password: whoever opens this app is signed
// in automatically as the platform's full-access mother admin via
// auto_mother_login() (a security-definer RPC with no credential check).
// tryRestoreMotherSession() above is tried first purely as a fast path when
// a still-valid token is already cached; this is the real entry point.
async function autoMotherLogin() {
  const rows = await sb(`/rest/v1/rpc/auto_mother_login`, { method:"POST", body: JSON.stringify({}) });
  const row = Array.isArray(rows) ? rows[0] : rows;
  if (!row || !row.id) throw new Error("Could not sign in automatically.");
  motherAdmin = row;
  rememberMother(row.username);
  rememberToken(row.session_token);
}
function motherLogout() {
  if (motherAdmin && motherAdmin.session_token) {
    // Best-effort — invalidate the token server-side so it can't be replayed.
    sb(`/rest/v1/rpc/logout_mother_session`, { method:"POST", body: JSON.stringify({ p_username: motherAdmin.username, p_token: motherAdmin.session_token }) }).catch(()=>{});
  }
  motherAdmin = null; view = "dashboard"; forgetMother(); forgetToken();
  // There's no login screen to fall back to anymore — immediately sign back
  // in automatically, same as a fresh page load would.
  boot();
}
async function boot() {
  const restored = await tryRestoreMotherSession();
  if (!restored) {
    try { await autoMotherLogin(); }
    catch(e) { motherAdmin = null; bootError = e.message; }
  }
  render();
}

// profiles has no password_hash column — staff actually authenticate through
// Supabase Auth, not a custom password scheme, so there's no SQL update that
// can "set" their password from here. The real equivalent is triggering
// Supabase's own password-reset email to whatever address is on file.
async function sendAdminPasswordReset(schoolId, profileId, email) {
  assertFullAccess();
  if (!email) throw new Error("This account has no email on file to send a reset link to.");
  let res;
  try { res = await fetch(`${SUPABASE_URL}/auth/v1/recover`, {
    method: "POST",
    headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email }),
  }); } catch(e) { throw new Error("Check your internet connection and try again."); }
  if (!res.ok) {
    let d = null; try { d = await res.json(); } catch(e) {}
    throw new Error((d && (d.msg || d.error_description || d.message)) || "Could not send the reset email.");
  }
  logAudit("send_password_reset_email", "profile", profileId, `school=${schoolId} email=${email}`);
}

// Uses Postgres' exact row count (via the Content-Range header) instead of
// fetching whole tables, so these stay fast even as schools grow.
async function countRows(table, params = {}) {
  const headers = {
    "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY,
    "Prefer": "count=exact",
  };
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${qs(Object.assign({select:"id", limit:"1"}, params))}`, { headers });
  if (!res.ok) throw new Error("Could not load counts.");
  const range = res.headers.get("content-range"); // e.g. "0-0/42"
  return range ? Number(range.split("/")[1]) : 0;
}
async function sumColumn(table, column, params = {}) {
  const rows = await sb(`/rest/v1/${table}?${qs(Object.assign({select:column}, params))}`);
  return rows.reduce((acc, r) => acc + (Number(r[column]) || 0), 0);
}

// ---- Generic floating, draggable action button ----
function makeDraggableFab(el, onActivate) {
  if (!el || el.dataset.dragWired) return;
  el.dataset.dragWired = "1";
  const DRAG_THRESHOLD = 6;
  let pointerId = null, moved = false, startX = 0, startY = 0, startRight = 0, startBottom = 0;
  function clamp(right, bottom) {
    const margin = 8;
    const maxRight = Math.max(window.innerWidth - el.offsetWidth - margin, margin);
    const maxBottom = Math.max(window.innerHeight - el.offsetHeight - margin, margin);
    return [Math.min(Math.max(right, margin), maxRight), Math.min(Math.max(bottom, margin), maxBottom)];
  }
  el.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    pointerId = e.pointerId; moved = false;
    startX = e.clientX; startY = e.clientY;
    const rect = el.getBoundingClientRect();
    startRight = window.innerWidth - rect.right;
    startBottom = window.innerHeight - rect.bottom;
    el.setPointerCapture(pointerId);
    el.classList.add("dragging");
  });
  el.addEventListener("pointermove", (e) => {
    if (pointerId === null || e.pointerId !== pointerId) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (!moved && Math.hypot(dx, dy) > DRAG_THRESHOLD) moved = true;
    if (!moved) return;
    const [right, bottom] = clamp(startRight - dx, startBottom - dy);
    el.style.right = right + "px";
    el.style.bottom = bottom + "px";
  });
  function endDrag(e) {
    if (pointerId === null || (e.pointerId !== undefined && e.pointerId !== pointerId)) return;
    try { el.releasePointerCapture(pointerId); } catch (err) { /* ignore */ }
    pointerId = null;
    el.classList.remove("dragging");
  }
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", endDrag);
  el.addEventListener("click", (e) => {
    if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; return; }
    onActivate();
  });
}

async function loadSchools() {
  const listEl = document.getElementById("schoolList");
  const pendingCard = document.getElementById("pendingCard");
  const pendingList = document.getElementById("pendingList");
  loadTrash();
  try {
    const schools = await listSchools();
    if (!schools.length) { listEl.innerHTML = `<div class="tiny-note">No schools registered yet.</div>`; if (pendingCard) pendingCard.style.display = "none"; return; }

    const pending = schools.filter(s => s.status === "pending");
    if (pendingCard && pendingList) {
      if (pending.length) {
        pendingCard.style.display = "";
        pendingList.innerHTML = pending.map(s => `
          <div class="school-row">
            <div>
              <div class="school-name">${s.name}</div>
              <div class="tiny-note">${[s.motto, s.location].filter(Boolean).join(" · ") || "Self-registered · " + new Date(s.created_at).toLocaleDateString()}</div>
            </div>
            <div class="row">
              <button class="btn btn-primary btn-sm" data-approve="${s.id}">Approve</button>
              <button class="btn btn-danger btn-sm" data-reject="${s.id}">Reject</button>
            </div>
          </div>`).join("");
        pendingList.querySelectorAll("[data-approve]").forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            try { await approveSchool(btn.dataset.approve); loadSchools(); }
            catch(err) { alert(err.message); }
          };
        });
        pendingList.querySelectorAll("[data-reject]").forEach(btn => {
          btn.onclick = async (e) => {
            e.stopPropagation();
            if (!confirm("Reject and delete this school? Its Administrator account and any data already created will be orphaned — do this only for schools you don't want on the platform.")) return;
            try { await deleteSchool(btn.dataset.reject); loadSchools(); }
            catch(err) { alert(err.message); }
          };
        });
      } else { pendingCard.style.display = "none"; }
    }

    const rest = schools.filter(s => s.status !== "pending");
    if (!rest.length) { listEl.innerHTML = `<div class="tiny-note">No approved schools yet.</div>`; return; }
    listEl.innerHTML = rest.map(s => {
      const blockedCount = FEATURE_MODULES.filter(m => s.features && s.features[m.id] === false).length;
      return `
      <div class="school-row clickable" data-open="${s.id}">
        <div>
          <div class="school-name">${s.name}</div>
          <div class="tiny-note">${[s.motto, s.location, s.size_range].filter(Boolean).join(" · ") || new Date(s.created_at).toLocaleDateString()}</div>
          ${s.school_code ? `<div class="tiny-note">School ID: <span class="mono">${s.school_code}</span></div>` : ""}
        </div>
        <div class="row" style="flex-wrap:wrap;justify-content:flex-end;gap:6px;">
          ${statusBadge(s.status)}
          ${s.status==='active' ? subscriptionBadge(s) : ""}
          ${blockedCount > 0 ? `<span class="badge badge-lock">${ICONS.lock}${blockedCount} blocked</span>` : ""}
        </div>
      </div>`;
    }).join("");
    listEl.querySelectorAll("[data-open]").forEach(row => {
      row.onclick = () => { currentSchoolId = row.dataset.open; schoolSubTab = null; view = "schoolDetail"; render(); };
    });
  } catch(e) {
    listEl.innerHTML = `<div class="err">${e.message}</div>`;
  }
}

async function loadTrash() {
  const trashCard = document.getElementById("trashCard");
  const trashList = document.getElementById("trashList");
  if (!trashCard || !trashList) return;
  try {
    const trashed = await listTrashedSchools();
    if (!trashed.length) { trashCard.style.display = "none"; return; }
    trashCard.style.display = "";
    trashList.innerHTML = trashed.map(s => {
      const daysLeft = Math.max(0, 30 - Math.floor((Date.now() - new Date(s.deleted_at).getTime()) / 86400000));
      return `
      <div class="school-row">
        <div>
          <div class="school-name">${s.name}</div>
          <div class="tiny-note">${daysLeft > 0 ? `${daysLeft} day${daysLeft === 1 ? "" : "s"} left to restore` : "Recovery window expired — will be purged soon"}</div>
        </div>
        <div class="row">
          ${isFullAccess() ? `<button class="btn btn-primary btn-sm" data-restore="${s.id}">Restore</button>` : ""}
          <button class="btn btn-ghost btn-sm" data-open-trashed="${s.id}">Open</button>
        </div>
      </div>`;
    }).join("");
    trashList.querySelectorAll("[data-restore]").forEach(btn => {
      btn.onclick = async (e) => {
        e.stopPropagation();
        try { await restoreSchool(btn.dataset.restore); loadSchools(); }
        catch(err) { alert(err.message); }
      };
    });
    trashList.querySelectorAll("[data-open-trashed]").forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        currentSchoolId = btn.dataset.openTrashed; schoolSubTab = "danger"; view = "schoolDetail"; render();
      };
    });
  } catch(e) {
    trashCard.style.display = "none";
  }
}

// Read-only comparison matrix: built straight from PLAN_OPTIONS, FEATURE_MODULES
// and PLAN_FEATURE_DEFAULTS, so it can never drift out of sync with what
// "Apply defaults for plan…" actually sets on a school's Features tab. This
// shows *defaults only* — a given school's live features can still differ
// if a mother admin hand-toggled a module (see that school's Features tab).
function renderSettingsPlansTab() {
  const mount = document.getElementById("settingsTabContent");

  mount.innerHTML = `

      <div class="tiny-note" style="margin-bottom:12px;">What each plan turns on by default when applied from a school's Features &amp; Modules tab. This is a reference view only — nothing here is editable. A school's actual access is whatever is saved on its own Features tab, which can be hand-adjusted per school regardless of plan.</div>
      <div class="table-scroll"><table class="mini-table">
        <thead><tr>
          <th>Module</th>
          ${PLAN_OPTIONS.map(p => `<th>${p}</th>`).join("")}
        </tr></thead>
        <tbody>
          ${FEATURE_MODULES.map(m => `
            <tr>
              <td style="white-space:normal;font-weight:700;color:var(--navy);">${m.label}</td>
              ${PLAN_OPTIONS.map(p => {

      <div class="tiny-note" style="margin-top:12px;">Home, Account, Settings and Trash aren't listed here — every school always has those, on every plan.</div>
    </div>`;
}

// Exactly these four categories — no "Custom" plan tier. A school's modules
// can still be hand-toggled from the Features tab regardless of which of
// these four plans it's on, so a separate "Custom" plan name isn't needed.
const PLAN_OPTIONS = ["Trial","Basic","Standard","Premium"];
const PLAN_DESCRIPTIONS = {
  Trial:    "Free — basic features for evaluation.",
  Basic:    "Paid — essential school management features.",
  Standard: "Paid — extended features with additional capabilities.",
  Premium:  "Paid — full access to all modules and features.",
};
const CYCLE_OPTIONS = [["monthly","Monthly"],["termly","Termly"],["yearly","Yearly"]];
const METHOD_OPTIONS = [["cash","Cash"],["bank","Bank transfer"],["mobile_money","Mobile Money"],["cheque","Cheque"],["other","Other"]];

/* ---------------- FEATURE / MODULE CONTROL ----------------
   These ids must match the GATABLE_NAV_IDS list in the school app exactly —
   they're the sections a school sees in its sidebar/bottom nav. Home,
   Account, Settings and Trash are never listed here: they're core to every
   school's own account and can't be switched off from here.
   schools.features is a jsonb map like {"fees": true, "exams": false, ...}.
   A school app treats a missing key as "on", so an empty/unset features
   column (the default for every existing school) changes nothing until a
   mother admin actually opens this panel and saves. */
const FEATURE_MODULES = [
  { id: "health",     label: "School Health" },
  { id: "students",   label: "Students" },
  { id: "teachers",   label: "Staff" },
  { id: "attendance", label: "Attendance" },
  { id: "fees",       label: "Fees" },
  { id: "exams",      label: "Exams" },
  { id: "academic",   label: "Setup (terms/classes/subjects)" },
  { id: "comms",      label: "Comms (announcements/meetings)" },
  { id: "inventory",  label: "Inventory" },
  { id: "library",    label: "Library" },
  { id: "aio-ai",     label: "AI Assistant" },
];
// What a fresh plan turns on by default. Each tier is a strict superset of
// the one below it, so Premium is the only plan with every module on — as
// described in the plan list. Applying defaults always produces a
// FULLY-SPECIFIED map (every module id set true or false), so the school app
// never has to guess — only truly unconfigured schools (features still `{}`)
// fall back to "everything on". An admin can still hand-toggle any module
// afterward regardless of plan — these are just starting points.
const PLAN_FEATURE_DEFAULTS = {
  // Trial (Free): ONLY the three modules a school needs to evaluate the
  // core workflow — student management, attendance, and fees. Everything
  // else (including Staff) is locked behind a paid plan.
  Trial:    { students:true, teachers:false, attendance:true, health:false, fees:true, exams:false, academic:false, comms:false, inventory:false, library:false, "aio-ai":false },
  // Basic (Paid): adds staff records, term/class setup, and parent comms
  // on top of Trial.
  Basic:    { students:true, teachers:true,  attendance:true, health:false, fees:true, exams:false, academic:true,  comms:true,  inventory:false, library:false, "aio-ai":false },
  // Standard (Paid): adds exams/report cards, inventory and library on top
  // of Basic.
  Standard: { students:true, teachers:true,  attendance:true, health:false, fees:true, exams:true,  academic:true,  comms:true,  inventory:true,  library:true,  "aio-ai":false },
  // Premium (Paid): full access to every module, including School Health
  // and the AI Assistant.
  Premium:  { students:true, teachers:true,  attendance:true, health:true,  fees:true, exams:true,  academic:true,  comms:true,  inventory:true,  library:true,  "aio-ai":true  },
};
function planDefaultFeatures(plan) {
  return PLAN_FEATURE_DEFAULTS[plan] || null; // null for an unrecognized/no plan — caller decides fallback
}

function statusActionsHtml(s) {
  if (s.status === "pending") return `
    <button class="btn btn-primary" data-action="approve">Approve school</button>
    <button class="btn btn-danger" data-action="reject">Reject &amp; delete</button>`;
  // Suspend and Deactivate are independent toggles, not a shared "Reactivate":
  // each button reflects and flips just its own half of the status, so an
  // admin can tell at a glance which state a school is in and undo just that.
  const isSuspended = s.status === "suspended";
  const isDeactivated = s.status === "deactivated";
  return `
    <button class="btn ${isSuspended ? 'btn-primary' : 'btn-ghost'}" data-action="toggle-suspend">${isSuspended ? "Unsuspend" : "Suspend"}</button>
    <button class="btn ${isDeactivated ? 'btn-primary' : 'btn-ghost'}" data-action="toggle-deactivate">${isDeactivated ? "Activate" : "Deactivate"}</button>
    <button class="btn btn-danger" data-action="delete">Delete</button>`;
}

async function renderSchoolDetail() {
  app().innerHTML = `<div class="wrap">${topBarHtml()}<div class="tiny-note">Loading…</div></div>`;
  wireTopBar();
  let s;
  try { s = await getSchool(currentSchoolId); }
  catch(e) { app().innerHTML = `<div class="wrap"><div class="err">${e.message}</div></div>`; return; }
  if (!s) { app().innerHTML = `<div class="wrap"><div class="err">School not found.</div></div>`; return; }

  app().innerHTML = `
    <div class="wrap">
      ${topBarHtml()}
      <div class="back-link" id="backBtn">‹ Back to schools</div>
      <div class="card">
        <div class="row" style="justify-content:space-between;align-items:flex-start;">
          <div>
            <div class="school-name" style="font-size:17px;">${s.name}</div>
            <div class="tiny-note">${[s.motto, s.village, s.sub_county, s.district, s.size].filter(Boolean).join(" · ") || [s.motto, s.location, s.size_range].filter(Boolean).join(" · ") || "No profile details yet"}</div>
            ${s.school_code ? `<div class="tiny-note">School ID (give to the school): <strong class="mono">${s.school_code}</strong></div>` : ""}
            <div class="tiny-note">Registered ${new Date(s.created_at).toLocaleDateString()}${s.approved_at ? " · Approved " + new Date(s.approved_at).toLocaleDateString() : ""}</div>
          </div>
          <div>${statusBadge(s.status)}</div>
        </div>
        <div id="statusMsg"></div>
        <div class="row" style="flex-wrap:wrap;margin-top:12px;">${statusActionsHtml(s)}</div>
      </div>

      ${schoolSubTab ? `<div class="back-link" id="schoolMenuBackBtn">‹ Back to school menu</div>` : ""}
      <div id="schoolTabContent"></div>
    </div>`;

  document.getElementById("backBtn").onclick = () => { view = "dashboard"; render(); };
  wireTopBar();
  const menuBackBtn = document.getElementById("schoolMenuBackBtn");
  if (menuBackBtn) menuBackBtn.onclick = () => { schoolSubTab = null; render(); };

  // Status actions (approve / reject / suspend-toggle / deactivate-toggle / delete) —
  // always visible above the tabs since they apply to the whole school record.
  app().querySelectorAll("[data-action]").forEach(btn => {
    btn.onclick = async () => {
      const action = btn.dataset.action;
      const msg = document.getElementById("statusMsg"); msg.innerHTML = "";
      try {
        if (action === "approve") { await approveSchool(s.id); }
        else if (action === "reject" || action === "delete") {
          // Deleting a school that has ANY data (even a self-registered
          // school's first admin account) fails as a plain row delete, since
          // every school-scoped table references schools(id) — that's what
          // the Danger Zone's "Delete school completely" does properly,
          // wiping the data first. Send them there instead of failing here.
          schoolDangerNotice = `To delete "${s.name}", use "Delete school completely" below — it safely clears the school's data first.`;
          schoolSubTab = "danger";
          render();
          return;
        } else if (action === "toggle-suspend") {
          await setSchoolStatus(s.id, s.status === "suspended" ? "active" : "suspended");
        } else if (action === "toggle-deactivate") {
          if (s.status === "deactivated") { await setSchoolStatus(s.id, "active"); }
          else {
            if (!confirm("Deactivate this school? Its accounts will no longer be able to log in.")) return;
            await setSchoolStatus(s.id, "deactivated");
          }
        }
        renderSchoolDetail();
      } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
    };
  });

  if (!schoolSubTab) { renderSchoolMenu(s); }
  else if (schoolSubTab === "oversight") renderSchoolOversightTab(s);
  else if (schoolSubTab === "features") renderSchoolFeaturesTab(s);
  else if (schoolSubTab === "admins") renderSchoolAdminsTab(s);
  else if (schoolSubTab === "danger") renderSchoolDangerTab(s);
  else renderSchoolSubscriptionTab(s);
}
function renderSchoolMenu(s) {
  const mount = document.getElementById("schoolTabContent");
  mount.innerHTML = `
    <div class="card">
      <div class="section-title">Manage this school</div>
      <div class="menu-list-card">${menuListHtml(SCHOOL_TABS, "schooltab")}</div>
    </div>`;
  wireMenuList("schooltab", (id) => { schoolSubTab = id; render(); });
}

const OVERSIGHT_SEVERITY_BADGE = { high:"badge-suspended", medium:"badge-warn", low:"badge-pending" };
function renderSchoolOversightTab(s) {
  const mount = document.getElementById("schoolTabContent");
  mount.innerHTML = `
    <div class="card">
      <div class="section-title">Security &amp; health checks</div>
      <div class="tiny-note" style="margin-bottom:10px;">Automatic checks only — nothing here is student or staff data.</div>

    </div>

      <div id="summaryGrid">Loading…</div>
    </div>`;

async function loadOversight(schoolId) {
  const flagsMount = document.getElementById("flagsList");
  const gridMount = document.getElementById("summaryGrid");
  try {
    const [flags, summary] = await Promise.all([
      getSchoolSecurityFlags(schoolId),
      getSchoolOversightSummary(schoolId),
    ]);
    flagsMount.innerHTML = (!flags || flags.length === 0)
      ? `<div class="empty">No issues detected.</div>`
      : flags.map(f => `
        <div class="admin-row">
          <div>${escapeHtml(f.detail)}</div>
          <span class="badge ${OVERSIGHT_SEVERITY_BADGE[f.severity] || 'badge-deactivated'}">${escapeHtml(f.severity)}</span>
        </div>`).join("");

    const rows = [
      ["Students", `${summary.active_student_count ?? 0} active / ${summary.student_count ?? 0} total`],
      ["Staff accounts", `${summary.staff_count ?? 0} (${summary.admin_count ?? 0} admin)`],
      ["Classes", summary.class_count ?? 0],
      ["Invoices", summary.invoice_count ?? 0],
      ["Payments recorded", summary.payment_count ?? 0],
      ["Results recorded", summary.result_count ?? 0],
      ["Attendance records", summary.attendance_record_count ?? 0],
      ["AI conversations", summary.ai_conversation_count ?? 0],
      ["Last staff login", summary.last_staff_login ? new Date(summary.last_staff_login).toLocaleString() : "Never"],
      ["Last attendance taken", summary.last_attendance_date || "Never"],
      ["Errors (last 7 days)", summary.error_count_7d ?? 0],
    ];
    gridMount.innerHTML = `<div class="table-scroll"><table class="mini-table">
      ${rows.map(([label, value]) => `<tr><th>${escapeHtml(label)}</th><td>${escapeHtml(String(value))}</td></tr>`).join("")}
    </table></div>`;
  } catch(e) {
    const msg = `<div class="err">${e.message}</div>`;
    flagsMount.innerHTML = msg;
    gridMount.innerHTML = "";
  }
}

function renderSchoolFeaturesTab(s) {
  const mount = document.getElementById("schoolTabContent");
  mount.innerHTML = `
    <div class="card">
      <div class="section-title">Features &amp; modules</div>
      <div class="tiny-note" style="margin-bottom:10px;">Choose which sections this school can see and use. Students, Fees and Comms also control the matching tab in parents' own app (My Children, Fees, Notifications) — everything else here is staff-only. Changes take effect automatically — usually within a minute, or as soon as they reopen the app — no re-login needed.</div>
      ${s.plan ? `<div class="tiny-note" style="margin-bottom:10px;">Current plan: <strong>${s.plan}</strong>${PLAN_DESCRIPTIONS[s.plan] ? ` — ${PLAN_DESCRIPTIONS[s.plan]}` : ""}</div>` : ""}
      <div id="featuresMsg"></div>
      <div class="row" style="margin-bottom:10px;flex-wrap:wrap;">
        <select id="featurePlanDefault" style="flex:1;min-width:180px;">
          <option value="">Apply defaults for plan…</option>
          ${PLAN_OPTIONS.map(p=>`<option value="${p}">${p} — ${PLAN_DESCRIPTIONS[p]}</option>`).join("")}
        </select>
        <button class="btn btn-ghost btn-sm" id="applyPlanDefaultsBtn">Apply</button>
      </div>
      <div id="featureToggles">
        ${FEATURE_MODULES.map(m => {
          const on = (s.features && Object.prototype.hasOwnProperty.call(s.features, m.id)) ? s.features[m.id] !== false : true;
          return `<div class="admin-row"><div style="font-weight:600;">${m.label}</div>
            <div class="toggle-row" data-feature-row="${m.id}">
              <span class="toggle-state">${on?'Enabled':'Disabled'}</span>
              <label class="toggle-switch">
                <input type="checkbox" data-feature="${m.id}" ${on?'checked':''}/>
                <span class="toggle-slider"></span>
              </label>
            </div>
          </div>`;
        }).join("")}
      </div>
      <button class="btn btn-primary btn-sm" id="saveFeaturesBtn" style="margin-top:10px;">Save features</button>
    </div>`;

  const featureBox = document.getElementById("featureToggles");
  const setToggleState = (cb, on) => {
    cb.checked = on;
    const row = cb.closest("[data-feature-row]");
    const stateEl = row ? row.querySelector(".toggle-state") : null;
    if (stateEl) stateEl.textContent = on ? "Enabled" : "Disabled";
  };
  featureBox.querySelectorAll("[data-feature]").forEach(cb => {
    cb.onchange = () => setToggleState(cb, cb.checked);
  });
  document.getElementById("applyPlanDefaultsBtn").onclick = () => {
    const plan = document.getElementById("featurePlanDefault").value;
    if (!plan) return;
    const defaults = planDefaultFeatures(plan) || {};
    featureBox.querySelectorAll("[data-feature]").forEach(cb => {
      const id = cb.dataset.feature;
      const on = Object.prototype.hasOwnProperty.call(defaults, id) ? defaults[id] !== false : true;
      setToggleState(cb, on);
    });
    document.getElementById("featuresMsg").innerHTML = `<div class="msg-ok">${plan} defaults applied below — click "Save features" to make it live.</div>`;
  };
  document.getElementById("saveFeaturesBtn").onclick = async () => {
    const msg = document.getElementById("featuresMsg"); msg.innerHTML = "";
    const featuresObj = {};
    featureBox.querySelectorAll("[data-feature]").forEach(cb => { featuresObj[cb.dataset.feature] = cb.checked; });
    try {
      await saveFeatures(s.id, featuresObj);
      msg.innerHTML = `<div class="msg-ok">Features saved — this school's app will pick up the change automatically, usually within a minute.</div>`;
      renderSchoolDetail();
    } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
  };
}

function renderSchoolDangerTab(s) {
  const mount = document.getElementById("schoolTabContent");
  const notice = schoolDangerNotice;
  schoolDangerNotice = null;
  const inTrash = !!s.deleted_at;
  const daysLeft = inTrash ? Math.max(0, 30 - Math.floor((Date.now() - new Date(s.deleted_at).getTime()) / 86400000)) : null;
  mount.innerHTML = `
    ${inTrash ? `
    <div class="card" id="trashZoneCard">
      <div class="section-title">In Trash</div>
      <div class="tiny-note" style="margin-bottom:10px;">${daysLeft > 0 ? `Staff can't log in while this school is in Trash. ${daysLeft} day${daysLeft === 1 ? "" : "s"} left before it's purged for good.` : "Its 30-day recovery window has expired — it will be purged automatically soon."}</div>
      <div id="trashZoneMsg"></div>
      ${daysLeft > 0 ? `<button class="btn btn-primary btn-sm" id="restoreSchoolBtn">Restore from Trash</button>` : ""}
    </div>` : `
    <div class="card">
      <div class="section-title">Trash</div>
      <div class="tiny-note" style="margin-bottom:10px;">Moves this school to Trash: it disappears from the school list and its staff are blocked from logging in, but nothing is deleted. Recoverable for 30 days.</div>
      <div id="trashZoneMsg"></div>
      <button class="btn btn-ghost btn-sm" id="moveToTrashBtn">Move to Trash</button>
    </div>`}
    <div class="card card-danger" id="dangerZoneCard">
      <div class="section-title" style="color:var(--red-dark);">Danger zone</div>
      <div class="tiny-note" style="margin-bottom:10px;">These actions permanently delete data. There is no undo — unlike Trash above. Type the school's exact name below to unlock either button.</div>
      <div id="dangerMsg">${notice ? `<div class="err">${notice}</div>` : ""}</div>
      <div class="field"><label>Type "${s.name}" to confirm</label><input id="dangerConfirmName" placeholder="${s.name}" /></div>
      <div class="field"><label>Your password</label><input id="dangerConfirmPw" type="password" /></div>
      <div class="row" style="flex-wrap:wrap;gap:8px;">
        <button class="btn btn-ghost btn-sm" id="clearDataBtn" disabled>Clear all data (keep the school &amp; its subscription)</button>
        <button class="btn btn-danger btn-sm" id="deleteAllBtn" disabled>Delete school completely (data + record)</button>
      </div>
    </div>`;

  const trashMsg = document.getElementById("trashZoneMsg");
  const moveToTrashBtn = document.getElementById("moveToTrashBtn");
  if (moveToTrashBtn) moveToTrashBtn.onclick = async () => {
    if (!confirm(`Move "${s.name}" to Trash? Its staff won't be able to log in until it's restored, but no data is deleted. You can restore it for 30 days.`)) return;
    try { await softDeleteSchool(s.id); renderSchoolDetail(); }
    catch(e) { trashMsg.innerHTML = `<div class="err">${e.message}</div>`; }
  };
  const restoreSchoolBtn = document.getElementById("restoreSchoolBtn");
  if (restoreSchoolBtn) restoreSchoolBtn.onclick = async () => {
    try { await restoreSchool(s.id); renderSchoolDetail(); }
    catch(e) { trashMsg.innerHTML = `<div class="err">${e.message}</div>`; }
  };

  // Both buttons stay disabled until the school's name is typed exactly
  // right, on top of the password check the RPCs themselves do.
  const dzName = document.getElementById("dangerConfirmName");
  const dzPw = document.getElementById("dangerConfirmPw");
  const clearBtn = document.getElementById("clearDataBtn");
  const deleteBtn = document.getElementById("deleteAllBtn");
  const dzUpdateState = () => {
    const match = dzName.value.trim().toLowerCase() === (s.name || "").trim().toLowerCase();
    clearBtn.disabled = !match; deleteBtn.disabled = !match;
  };
  dzName.oninput = dzUpdateState;
  clearBtn.onclick = async () => {
    const msg = document.getElementById("dangerMsg"); msg.innerHTML = "";
    if (!confirm(`Permanently delete every data row for "${s.name}" (students, staff, fees, exams, attendance, comms — everything)? The school's account, plan and features stay. This cannot be undone.`)) return;
    try {
      await purgeSchoolData(s.id, dzPw.value);
      msg.innerHTML = `<div class="msg-ok">All data for "${s.name}" has been permanently deleted. The school account itself is untouched.</div>`;
      dzName.value = ""; dzPw.value = ""; dzUpdateState();
    } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
  };
  deleteBtn.onclick = async () => {
    const msg = document.getElementById("dangerMsg"); msg.innerHTML = "";
    if (!confirm(`Permanently delete "${s.name}" AND every data row belonging to it? The school will disappear from this app completely. This cannot be undone.`)) return;
    try {
      await deleteSchoolCompletely(s.id, dzPw.value);
      view = "dashboard"; render(); return;
    } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
  };
}

async function loadAdmins(schoolId) {
  const listEl = document.getElementById("adminList");
  const grantSelect = document.getElementById("grantSelect");
  try {
    const admins = await listAdmins(schoolId);
    if (!admins.length) {
      listEl.innerHTML = `<div class="empty">No administrator accounts found for this school.</div>`;
    } else {
      listEl.innerHTML = admins.map(a => `
        <div class="admin-row">
          <div>
            <div style="font-weight:700;">${a.full_name}</div>
            <div class="tiny-note">@${a.username}${[a.phone,a.email,a.whatsapp].filter(Boolean).length ? " · " + [a.phone,a.email].filter(Boolean).join(" · ") : ""}</div>
          </div>
          <div class="row" style="flex-wrap:wrap;justify-content:flex-end;">
            <button class="btn btn-ghost btn-sm" data-reset="${a.id}" data-email="${a.email||''}" ${a.email ? '' : 'disabled title="No email on file"'}>Send password reset email</button>
            <button class="btn btn-danger btn-sm" data-revoke="${a.id}" ${admins.length<=1?'disabled title="Grant another admin first"':''}>Revoke</button>
          </div>
        </div>`).join("");
      listEl.querySelectorAll("[data-reset]").forEach(btn => {
        btn.onclick = async () => {
          if (btn.disabled) return;
          const msg = document.getElementById("adminMsg"); msg.innerHTML = "";
          const original = btn.textContent;
          btn.disabled = true; btn.textContent = "Sending…";
          try {
            await sendAdminPasswordReset(schoolId, btn.dataset.reset, btn.dataset.email);
            msg.innerHTML = `<div class="msg-ok">Password reset email sent to ${btn.dataset.email}.</div>`;
          } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
          finally { btn.disabled = false; btn.textContent = original; }
        };
      });
      listEl.querySelectorAll("[data-revoke]").forEach(btn => {
        btn.onclick = async () => {
          if (btn.disabled) return;
          if (!confirm("Revoke this account's administrator privileges?")) return;
          const msg = document.getElementById("adminMsg"); msg.innerHTML = "";
          try {
            await setAdminPrivilege(schoolId, btn.dataset.revoke, false);
            msg.innerHTML = `<div class="msg-ok">Admin privileges revoked.</div>`;
            loadAdmins(schoolId);
          } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
        };
      });
    }
    const staff = await listNonAdminStaff(schoolId);
    if (!staff.length) { grantSelect.innerHTML = `<option value="">No other staff accounts</option>`; grantSelect.disabled = true; }
    else {
      grantSelect.disabled = false;
      grantSelect.innerHTML = `<option value="">Select a staff member…</option>` + staff.map(p => `<option value="${p.id}">${p.full_name} (@${p.username})</option>`).join("");
    }
    document.getElementById("grantBtn").onclick = async () => {
      const id = grantSelect.value;
      const msg = document.getElementById("adminMsg"); msg.innerHTML = "";
      if (!id) { msg.innerHTML = `<div class="err">Select a staff member first.</div>`; return; }
      try {
        await setAdminPrivilege(schoolId, id, true);
        msg.innerHTML = `<div class="msg-ok">Admin privileges granted.</div>`;
        loadAdmins(schoolId);
      } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
    };
  } catch(e) {
    listEl.innerHTML = `<div class="err">${e.message}</div>`;
  }
}

        <div class="section-title">Admin accounts &amp; permissions</div>
        <div class="tiny-note" style="margin-bottom:8px;">Full-access admins can register, suspend and delete schools and change other admins. Read-only admins can view every tab but nothing they do is saved.</div>
        <div id="secAdminMsg"></div>
        ${isFullAccess() ? `<div class="field"><label>Your password (to confirm any change below)</label><input id="secConfirmPw" type="password" /></div>` : ""}
        <div id="adminAccountsList" class="tiny-note">Loading…</div>
      </div>
      <div class="card">
        <div class="section-title">Login activity</div>
        <div class="tiny-note" style="margin-bottom:8px;">Recent attempts to log into this mother app. Repeated failures against one username are flagged as suspicious.</div>
        <div id="loginActivityList" class="tiny-note">Loading…</div>
      </div>
      <div class="card">
        <div class="section-title">Audit log</div>
        <div class="tiny-note" style="margin-bottom:8px;">Every write made from this app, most recent first.</div>
        <div id="auditLogList" class="tiny-note">Loading…</div>
      </div>
    </div>`;
  wireTopBar();
  wireNavTabs();
  loadAdminAccounts();
  loadLoginActivity();
  loadAuditLogList();
}

async function loadAdminAccounts() {
  const el = document.getElementById("adminAccountsList");
  try {
    const admins = await listMotherAdmins();
    if (!admins.length) { el.innerHTML = `<div class="empty">No admin accounts found.</div>`; return; }
    el.innerHTML = admins.map(a => `
      <div class="admin-row">
        <div>
          <div style="font-weight:700;">${a.full_name || a.username} ${a.username===motherAdmin.username ? '<span class="tiny-note">(you)</span>' : ''}</div>
          <div class="tiny-note">@${a.username} · ${new Date(a.created_at).toLocaleDateString()}</div>
          <div style="margin-top:4px;">${roleBadge(a.role)} ${a.active ? '' : '<span class="badge badge-suspended">Deactivated</span>'}</div>
        </div>
        ${isFullAccess() && a.username !== motherAdmin.username ? `
        <div class="row" style="flex-wrap:wrap;justify-content:flex-end;">
          <button class="btn btn-ghost btn-sm" data-role="${a.id}" data-newrole="${a.role==='read_only'?'full_access':'read_only'}">${a.role==='read_only'?'Make full access':'Make read-only'}</button>
          <button class="btn ${a.active?'btn-danger':'btn-primary'} btn-sm" data-active="${a.id}" data-newactive="${a.active?'false':'true'}">${a.active?'Deactivate':'Reactivate'}</button>
        </div>` : ""}
      </div>`).join("");
    const doChange = async (id, newRole, newActive) => {
      const msg = document.getElementById("secAdminMsg"); msg.innerHTML = "";
      const pw = document.getElementById("secConfirmPw").value;
      try {
        if (!pw) throw new Error("Enter your password to confirm.");
        await setMotherAdminStatus(pw, id, newRole, newActive);
        document.getElementById("secConfirmPw").value = "";
        msg.innerHTML = `<div class="msg-ok">Updated.</div>`;
        loadAdminAccounts();
      } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
    };
    el.querySelectorAll("[data-role]").forEach(btn => {
      btn.onclick = () => doChange(btn.dataset.role, btn.dataset.newrole, undefined);
    });
    el.querySelectorAll("[data-active]").forEach(btn => {
      btn.onclick = () => {
        const activating = btn.dataset.newactive === "true";
        if (!activating && !confirm("Deactivate this admin? They won't be able to log in until reactivated.")) return;
        doChange(btn.dataset.active, undefined, activating);
      };
    });
  } catch(e) { el.innerHTML = `<div class="err">${e.message}</div>`; }
}

async function loadLoginActivity() {
  const el = document.getElementById("loginActivityList");
  try {
    loginActivityItems = await listLoginLog(500);
    renderLoginActivityList();
  } catch(e) { el.innerHTML = `<div class="err">${e.message}</div>`; }
}
function renderLoginActivityList() {
  const el = document.getElementById("loginActivityList");
  if (!loginActivityItems.length) { el.innerHTML = `<div class="empty">No login activity yet.</div>`; return; }
  // Flag a username as suspicious if it has 3+ failed attempts within the last 15 minutes.
  const now = Date.now();
  const recentFailuresByUser = {};
  loginActivityItems.forEach(r => {
    if (!r.success && (now - new Date(r.created_at).getTime()) < 15*60000) {
      recentFailuresByUser[r.username] = (recentFailuresByUser[r.username]||0) + 1;
    }
  });
  const shown = loginActivityShowAll ? loginActivityItems : loginActivityItems.slice(0, LOG_PAGE_SIZE);
  el.innerHTML = `
    <div class="table-scroll"><table class="mini-table"><thead><tr><th>When</th><th>Username</th><th>Result</th></tr></thead><tbody>
      ${shown.map(r => `<tr>
        <td>${new Date(r.created_at).toLocaleString()}</td>
        <td>${r.username}${recentFailuresByUser[r.username] >= 3 ? ' <span class="badge badge-suspended">Suspicious</span>' : ''}</td>
        <td>${r.success ? '<span class="badge badge-active">Success</span>' : '<span class="badge badge-suspended">Failed</span>'}</td>
      </tr>`).join("")}
    </tbody></table></div>
    <div class="table-foot">
      <span>${loginActivityItems.length > LOG_PAGE_SIZE ? `<span class="link-btn" id="loginActivityToggle">${loginActivityShowAll ? "Show latest 10" : `Show all (${loginActivityItems.length})`}</span>` : ""}</span>
      ${isFullAccess() ? `<button class="btn btn-danger btn-sm" id="clearLoginActivityBtn">Clear login activity</button>` : ""}
    </div>
    <div id="loginActivityMsg"></div>`;
  const toggle = document.getElementById("loginActivityToggle");
  if (toggle) toggle.onclick = () => { loginActivityShowAll = !loginActivityShowAll; renderLoginActivityList(); };
  const clearBtn = document.getElementById("clearLoginActivityBtn");
  if (clearBtn) clearBtn.onclick = async () => {
    if (!confirm("Clear all login activity? This can't be undone.")) return;
    const msg = document.getElementById("loginActivityMsg");
    try {
      await clearLoginLog();
      loginActivityShowAll = false;
      await loadLoginActivity();
    } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
  };
}

async function loadAuditLogList() {
  const el = document.getElementById("auditLogList");
  try {
    auditLogItems = await listAuditLog(500);
    renderAuditLogList();
  } catch(e) { el.innerHTML = `<div class="err">${e.message}</div>`; }
}
function renderAuditLogList() {
  const el = document.getElementById("auditLogList");
  if (!auditLogItems.length) { el.innerHTML = `<div class="empty">No audit entries yet.</div>`; return; }
  const shown = auditLogShowAll ? auditLogItems : auditLogItems.slice(0, LOG_PAGE_SIZE);
  el.innerHTML = `
    <div class="table-scroll"><table class="mini-table"><thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Details</th></tr></thead><tbody>
      ${shown.map(r => `<tr>
        <td>${new Date(r.created_at).toLocaleString()}</td>
        <td>${r.actor_username || '—'}</td>
        <td>${r.action}${r.target_type ? ` (${r.target_type})` : ''}</td>
        <td>${r.details || ''}</td>
      </tr>`).join("")}
    </tbody></table></div>
    <div class="table-foot">
      <span>${auditLogItems.length > LOG_PAGE_SIZE ? `<span class="link-btn" id="auditLogToggle">${auditLogShowAll ? "Show latest 10" : `Show all (${auditLogItems.length})`}</span>` : ""}</span>
      ${isFullAccess() ? `<button class="btn btn-danger btn-sm" id="clearAuditLogBtn">Clear audit log</button>` : ""}
    </div>
    <div id="auditLogMsg"></div>`;
  const toggle = document.getElementById("auditLogToggle");
  if (toggle) toggle.onclick = () => { auditLogShowAll = !auditLogShowAll; renderAuditLogList(); };
  const clearBtn = document.getElementById("clearAuditLogBtn");
  if (clearBtn) clearBtn.onclick = async () => {
    if (!confirm("Clear the entire audit log? This can't be undone.")) return;
    const msg = document.getElementById("auditLogMsg");
    try {
      await clearAuditLog();
      auditLogShowAll = false;
      await loadAuditLogList();
    } catch(e) { msg.innerHTML = `<div class="err">${e.message}</div>`; }
  };
}

let bootError = null; // set only if auto sign-in itself fails (e.g. offline, or no admin account exists)
function render() {
  if (!motherAdmin) { renderBootError(); const root = fabRoot(); if (root) root.innerHTML = ""; return; }
  if (view === "settings") renderSettings();
  else if (view === "schoolDetail") renderSchoolDetail();
  else if (view === "analytics") renderAnalytics();
  else if (view === "monitoring") renderMonitoring();
  else if (view === "comms") renderComms();
  else if (view === "updates") renderUpdates();
  else if (view === "security") renderSecurity();
  else renderDashboard();
  updateRegisterSchoolFab();
}
/* ---------------- Keyboard-aware form scrolling ----------------
   Every screen in this app is re-rendered via innerHTML, so fields are
   created/destroyed constantly — a single delegated listener on document
   covers all of them, present and future, instead of wiring each form. */
document.addEventListener("focusin", (e) => {
  const t = e.target;
  if (t.matches && t.matches("input, select, textarea")) {
    setTimeout(() => {
      t.scrollIntoView({ block: "center", behavior: "smooth" });
    }, 300); // gives the mobile keyboard time to finish animating in
  }
});

boot();
</script>
</body>
</html>
