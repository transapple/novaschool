// ===================== AUTH SCREENS: login, remember me, forgot password, create account =====================
// Confirmed against the live "AiO School Manager" project (read-only schema check) before writing:
//   resolve_school_code(p_school_code)            -> rows(id, name, status, deleted_at, school_code)      [anon]
//   verify_login(p_username, p_password, p_school_id)
//        -> json: the profiles row + session_token. Bad credentials come back as HTTP 400 {message}, which
//           sb() throws as Error(message) (also covers rate-limit lockouts, pending approval, suspended school).
//   create_account(p_full_name, p_username, p_department, p_phone, p_password, p_pin, p_photo_url, p_school_id, p_gender)
//        -> profiles row; approval_status is 'approved' (matched staff_directory / first account) or 'pending'.
//   reset_password(p_username, p_phone, p_new_password, p_school_id) -> json {ok:true} | HTTP 400 {message}
//        PIN-free as of RESET_PASSWORD_NO_PIN_SQL: identity is confirmed with School ID + username + phone only.
//   profiles.department CHECK = administration | academic | finance | parents (mirrors DEPARTMENTS above).
// Client-side checks here (password rules, PIN shape, required fields) are UX only; the server re-enforces them.
let authView = "login";          // "login" | "create" | "forgot"
let authDraft = {};              // non-secret create-account fields kept if the user goes back to log in and returns
let authNotice = null;           // one-shot banner for the next login render: { kind: "ok"|"err", text }
let authPrefillOnce = null;      // one-shot { code, username } after account creation / password reset
const AUTH_PREFILL_KEY = "novaAuthPrefill"; // { code, username } saved only when "Remember me" is ticked — never a password

const AUTH_DEPT_HINTS = {
  administration: "Full access to the whole school",
  academic: "Teaching, attendance and exams",
  finance: "Fees and billing",
  parents: "Parents / guardians communication",
};

function authEsc(v) {
  return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function authGetPrefill() {
  try { return JSON.parse(localStorage.getItem(AUTH_PREFILL_KEY) || "null") || {}; } catch (e) { return {}; }
}
function authSetPrefill(obj) {
  try { if (obj) localStorage.setItem(AUTH_PREFILL_KEY, JSON.stringify(obj)); else localStorage.removeItem(AUTH_PREFILL_KEY); } catch (e) {}
}
function authNormCode(v) { return String(v || "").trim().toUpperCase(); }
function authField(id) { const el = document.getElementById(id); return el ? el.value : ""; }
function authMsg(kind, text) {
  const box = document.getElementById("authMsg");
  if (!box) return;
  box.innerHTML = text ? `<div class="${kind === "ok" ? "msg-ok" : "err"}">${authEsc(text)}</div>` : "";
  if (text && box.scrollIntoView) box.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function authBusy(btn, busy, idleLabel, busyLabel) {
  if (!btn) return;
  btn.disabled = !!busy;
  btn.textContent = busy ? busyLabel : idleLabel;
}

// Paints into one persistent .login-wrap so the keyboard handling wired by enableAuthKeyboardHandling()
// is attached once, not once per Staff/Parent toggle.
function authPaint(inner, wide) {
  let wrap = app().querySelector(".login-wrap[data-auth]");
  if (!wrap) {
    app().innerHTML = `<div class="login-wrap" data-auth="1"><div class="login-card"></div></div>`;
    wrap = app().querySelector(".login-wrap");
    const fresh = wrap.querySelector(".login-card");
    fresh.innerHTML = inner;
    fresh.style.maxWidth = wide ? "460px" : "";
    enableAuthKeyboardHandling();
    return fresh;
  }
  const card = wrap.querySelector(".login-card");
  card.innerHTML = inner;
  card.style.maxWidth = wide ? "460px" : "";
  card.scrollTop = 0;
  return card;
}
function authOnEnter(ids, fn) {
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); fn(); } });
  });
}
function authGo(view) { authView = view; render(); }

// School lookup by the human-facing School ID (schools.school_code).
async function authResolveSchool(rawCode) {
  const code = authNormCode(rawCode);
  if (!code) throw new Error("Enter your School ID.");
  if (!/^[A-Z0-9_]+$/.test(code)) throw new Error("A School ID only has letters, numbers and underscores.");
  const rows = await sb(`/rest/v1/rpc/resolve_school_code`, { method: "POST", body: JSON.stringify({ p_school_code: code }) });
  const school = Array.isArray(rows) ? rows[0] : rows;
  if (!school || !school.id) throw new Error("We couldn't find a school with that School ID. Check it and try again.");
  return school;
}
// schools.status / deleted_at gate: verify_login blocks these too, so there is no point creating an account into them.
function authSchoolBlockMessage(school) {
  if (school.deleted_at) return `"${school.name}" no longer exists in the system.`;
  switch (school.status) {
    case "pending": return `"${school.name}" is still awaiting approval by TransApple. Please check back soon.`;
    case "rejected": return `"${school.name}" was not approved by TransApple.`;
    case "suspended": return `"${school.name}" is currently suspended. Contact TransApple to resolve this.`;
    case "deactivated": return `"${school.name}" has been deactivated by TransApple.`;
  }
  return null;
}

// Live checklist for the password rules (mirrors is_strong_password on the server: 8+, upper, lower, number, symbol).
function authRulesHtml(pw) {
  const checks = [
    ["8+ characters", pw.length >= 8], ["Uppercase", /[A-Z]/.test(pw)], ["Lowercase", /[a-z]/.test(pw)],
    ["Number", /[0-9]/.test(pw)], ["Symbol", /[^A-Za-z0-9]/.test(pw)],
  ];
  return checks.map(([label, ok]) => `<span class="${ok ? "ok" : ""}">${ok ? "✓ " : ""}${label}</span>`).join("");
}
function authWireRules(passId, boxId) {
  const input = document.getElementById(passId), box = document.getElementById(boxId);
  if (!input || !box) return;
  const paint = () => { box.innerHTML = authRulesHtml(input.value); };
  input.addEventListener("input", paint);
  paint();
}

async function authDoLogin() {
  const btn = document.getElementById("authLoginBtn");
  if (btn && btn.disabled) return;
  const username = authField("authUser").trim();
  const password = authField("authPass"); // never trimmed or stored
  const remember = !!(document.getElementById("authRemember") || {}).checked;
  if (!username) { authMsg("err", "Enter your username."); return; }
  if (!password) { authMsg("err", "Enter your password."); return; }
  authMsg("err", "");
  authBusy(btn, true, "Log in", "Logging in…");
  try {
    // No School ID on this screen: usernames are unique across the whole system (create_account rejects
    // duplicates and the live profiles table has none), so verify_login finds the account by lower(username)
    // with p_school_id = null, then checks password_hash and the account's own school status.
    const res = await sb(`/rest/v1/rpc/verify_login`, {
      method: "POST",
      body: JSON.stringify({ p_username: username, p_password: password, p_school_id: null }),
    });
    if (res && res.__error) throw new Error(res.__error);
    if (!res || !res.id || !res.session_token) throw new Error("Login failed. Please try again.");
    await authCompleteLogin(res, remember);
  } catch (e) {
    authMsg("err", e.message || "Login failed. Please try again.");
    const pw = document.getElementById("authPass"); if (pw) { pw.value = ""; pw.focus(); }
    authBusy(document.getElementById("authLoginBtn"), false, "Log in", "Logging in…");
  }
}

// Same state the boot-time session restore builds (tryRestoreRememberedSession), so everything downstream
// behaves identically whether the user just logged in or came back with a remembered session.
async function authCompleteLogin(row, remember) {
  const token = row.session_token;
  const p = scrubProfile(row); // strips password_hash + session_token from the in-memory profile
  if (remember) {
    persistSessionToken(token);                       // localStorage: survives closing the app
    try { localStorage.setItem(REMEMBER_KEY, p.username); } catch (e) {}
  } else {
    clearRememberedSession();                         // nothing kept on disk: token lives in memory only
    persistSessionToken(null);
    SESSION_TOKEN = token;
    authSetPrefill(null);
  }
  profile = p;
  setCurrentSchool(profile.school_id);
  if (!remember) { try { localStorage.removeItem(REMEMBER_SCHOOL_KEY); } catch (e) {} }
  await loadCurrentSchool();
  if (remember) authSetPrefill({ code: (CURRENT_SCHOOL && CURRENT_SCHOOL.school_code) || "", username: p.username, remember: true });
  auth = { user: { id: profile.id } };
  markDeviceSeen();
  pinLocked = false;
  await loadSchoolSettings(); // brand colour / logo / ID prefixes now that a session exists
  startSchoolSync();
  primeSchoolCache();
  tab = "dashboard"; pendingSubTab = null; authView = "login";
  render();
}

async function authDoReset() {
  const btn = document.getElementById("authResetBtn");
  if (btn && btn.disabled) return;
  const code = authNormCode(authField("authSchool"));
  const username = authField("authUser").trim();
  const phone = authField("authPhone").trim();
  const pw = authField("authNewPass"), pw2 = authField("authNewPass2");
  if (!code) return authMsg("err", "Enter your School ID.");
  if (!username) return authMsg("err", "Enter your username.");
  if (phone.replace(/\D/g, "").length < 7) return authMsg("err", "Enter the phone number on your account.");
  if (!isStrongPassword(pw)) return authMsg("err", PASSWORD_HINT);
  if (pw !== pw2) return authMsg("err", "The two passwords don't match.");
  authMsg("err", "");
  authBusy(btn, true, "Reset password", "Resetting…");
  try {
    const school = await authResolveSchool(code);
    if (school.deleted_at) throw new Error(authSchoolBlockMessage(school));
    // reset_password(p_username, p_phone, p_new_password, p_school_id) — no PIN. Run RESET_PASSWORD_NO_PIN_SQL
    // (below) once in Supabase -> SQL Editor to replace the old PIN-based overload with this one.
    const res = await sb(`/rest/v1/rpc/reset_password`, {
      method: "POST",
      body: JSON.stringify({ p_username: username, p_phone: phone, p_new_password: pw, p_school_id: school.id }),
    });
    if (res && res.__error) throw new Error(res.__error);
    authNotice = { kind: "ok", text: "Password updated. Log in with your new password." };
    authPrefillOnce = { code: school.school_code || code, username };
    authView = "login";
    render();
  } catch (e) {
    authMsg("err", e.message || "Couldn't reset the password. Please try again.");
    authBusy(document.getElementById("authResetBtn"), false, "Reset password", "Resetting…");
  }
}

function authCaptureDraft() {
  ["cSchool", "cDept", "cName", "cGender", "cUser", "cPhone"].forEach(id => {

  });
}
// Rebuilds the department dropdown against a school's locked_departments map: locked departments
// are removed from the list entirely, and if the currently selected one just became locked, the
// selection is cleared and the hint explains why — this is what makes department locks actually
// take effect on the "Create account" screen instead of only being caught after submission.
function authApplyDeptLock(locked) {
  const dept = document.getElementById("cDept"), hint = document.getElementById("cDeptHint");
  if (!dept) return;
  const wasSelected = dept.value;
  dept.innerHTML = departmentSelectOptions(wasSelected, locked || {});
  if (wasSelected && (locked || {})[wasSelected] === true) {
    dept.value = "";
    if (hint) hint.textContent = "That department is closed for new self-registrations right now — please choose another or contact your school Administrator.";
  } else if (hint) {
    hint.textContent = AUTH_DEPT_HINTS[dept.value] || "";
  }
}

function authWireSchoolChip() {
  const input = document.getElementById("cSchool"), chip = document.getElementById("cSchoolChip");
  if (!input || !chip) return;
  let timer = null, seq = 0;
  const show = (cls, text) => { chip.className = "auth-chip " + cls; chip.style.display = text ? "block" : "none"; chip.textContent = text; };
  const run = async () => {
    const code = authNormCode(input.value);
    if (code.length < 6) { show("", ""); authApplyDeptLock({}); return; }
    const mine = ++seq;
    show("", "Checking…");
    try {
      const school = await authResolveSchool(code);
      if (mine !== seq) return;
      const block = authSchoolBlockMessage(school);
      if (block) { show("bad", block); authApplyDeptLock({}); return; }
      show("ok", "✓ " + school.name);
      const locked = await fetchLockedDepartments(school.id);
      if (mine === seq) authApplyDeptLock(locked);
    } catch (e) { if (mine === seq) { show("bad", e.message); authApplyDeptLock({}); } }
  };
  input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 450); });
  input.addEventListener("blur", run);
  if (input.value) run();
}

async function authDoCreate() {
  const btn = document.getElementById("authCreateBtn");
  if (btn && btn.disabled) return;
  const code = authNormCode(authField("cSchool"));
  const dept = authField("cDept");
  const name = authField("cName").trim().replace(/\s+/g, " ");
  const gender = authField("cGender");
  const phone = authField("cPhone").trim();
  const username = authField("cUser").trim();
  const pw = authField("cPass"), pw2 = authField("cPass2");

  if (!code) return authMsg("err", "Enter your School ID.");
  if (!dept) return authMsg("err", "Choose your department.");
  if (name.length < 2) return authMsg("err", "Enter your full name.");
  if (phone.replace(/\D/g, "").length < 7) return authMsg("err", "Enter a valid phone number.");
  if (!/^[A-Za-z0-9._-]{3,30}$/.test(username)) return authMsg("err", "Username must be 3–30 letters, numbers, dots, dashes or underscores, with no spaces.");
  if (!isStrongPassword(pw)) return authMsg("err", PASSWORD_HINT);
  if (pw !== pw2) return authMsg("err", "The two passwords don't match.");
  authMsg("err", "");
  authBusy(btn, true, "Create account", "Creating account…");
  try {
    const school = await authResolveSchool(code);
    const block = authSchoolBlockMessage(school);
    if (block) throw new Error(block);
    // profiles.department is CHECK-constrained to administration | academic | finance | parents.
    const row = await sb(`/rest/v1/rpc/create_account`, { method: "POST", body: JSON.stringify({
      p_full_name: name, p_username: username, p_department: dept, p_phone: phone,
      p_password: pw, p_pin: null, p_photo_url: null, p_school_id: school.id, p_gender: gender || null,
    }) });
    if (row && row.__error) throw new Error(row.__error);
    authRenderCreated(row || {}, school, username);
  } catch (e) {
    authMsg("err", e.message || "Couldn't create the account. Please try again.");
    authBusy(document.getElementById("authCreateBtn"), false, "Create account", "Creating account…");
  }
}

function authRenderCreated(row, school, username) {
  const approved = row.approval_status === "approved";

function enableModalKeyboardHandling(overlay) {
  const modal = overlay.querySelector(".modal");
  const vv = window.visualViewport;
  if (!modal) return;
  
  
  const revealTail = () => {
    const remaining = modal.scrollHeight - (modal.scrollTop + modal.clientHeight);
    if (remaining > 0 && remaining < 160) modal.scrollTo({ top: modal.scrollHeight, behavior: "smooth" });
  };
  modal.addEventListener("focusin", (e) => {
    const t = e.target;
    if (!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    
    setTimeout(() => {
      t.scrollIntoView({ block: "center", behavior: "smooth" });
      setTimeout(revealTail, 300);
    }, 250);
  });
  if (!vv) return;
  const resize = () => {
    overlay.style.height = vv.height + "px";
    overlay.style.top = vv.offsetTop + "px";
    overlay.style.bottom = "auto";
    modal.style.maxHeight = Math.round(vv.height * 0.9) + "px";
    if (document.activeElement && modal.contains(document.activeElement)) revealTail();
  };
  vv.addEventListener("resize", resize);
  vv.addEventListener("scroll", resize);
  resize();
  const stop = new MutationObserver(() => {
    if (document.body.contains(overlay)) return;
    vv.removeEventListener("resize", resize);
    vv.removeEventListener("scroll", resize);
    stop.disconnect();
  });
  stop.observe(document.body, { childList: true });
}

function bindRowGestures(rowEl, { onView, onEdit, onDelete }) {
  rowEl.oncontextmenu = (e) => e.preventDefault();
  let timer = null, longFired = false, startX = 0, startY = 0;
  const LONG_MS = 550, MOVE_TOL = 10;
  const start = (x,y) => {
    longFired = false; startX = x; startY = y;
    timer = setTimeout(() => {
      longFired = true;
      const actions = [];
      if (onEdit) actions.push({ label:"Edit", icon:ic.edit, onClick:onEdit });
      if (onDelete) actions.push({ label:"Delete", icon:ic.trash, danger:true, onClick:onDelete });
      if (actions.length) openActionSheet(actions);
    }, LONG_MS);
  };
  const cancel = () => { clearTimeout(timer); };
  const move = (x,y) => { if (Math.abs(x-startX)>MOVE_TOL || Math.abs(y-startY)>MOVE_TOL) cancel(); };
  rowEl.addEventListener("pointerdown", (e) => start(e.clientX, e.clientY));
  rowEl.addEventListener("pointermove", (e) => move(e.clientX, e.clientY));
  rowEl.addEventListener("pointerup", () => { cancel(); if (!longFired && onView) onView(); });
  rowEl.addEventListener("pointercancel", cancel);
  rowEl.addEventListener("pointerleave", cancel);
}

function bindTapHold(rowEl, { onTap, onHold }) {
  rowEl.oncontextmenu = (e) => e.preventDefault();
  let timer = null, longFired = false, startX = 0, startY = 0;
  const LONG_MS = 550, MOVE_TOL = 10;
  const start = (x,y) => {
    longFired = false; startX = x; startY = y;
    timer = setTimeout(() => { longFired = true; if (onHold) onHold(); }, LONG_MS);
  };
  const cancel = () => { clearTimeout(timer); };
  const move = (x,y) => { if (Math.abs(x-startX)>MOVE_TOL || Math.abs(y-startY)>MOVE_TOL) cancel(); };
  rowEl.addEventListener("pointerdown", (e) => start(e.clientX, e.clientY));
  rowEl.addEventListener("pointermove", (e) => move(e.clientX, e.clientY));
  rowEl.addEventListener("pointerup", () => { cancel(); if (!longFired && onTap) onTap(); });
  rowEl.addEventListener("pointercancel", cancel);
  rowEl.addEventListener("pointerleave", cancel);
}

  if (!parents.length) {
    openInfoModal("No parent account linked", `

async function openChatThread(other, student, onClose) {
  const meIsParent = profile.role === "parent" || profile.department === "parents";
  const parentId = meIsParent ? profile.id : other.id;
  const parentName = meIsParent ? profile.full_name : other.full_name;
  const staffId = meIsParent ? other.id : profile.id;
  const staffName = meIsParent ? other.full_name : profile.full_name;

  const overlay = el(`<div class="overlay"><div class="modal chat-modal">
    <button class="modal-close">&times;</button>
    <h3>${ic.chat} ${other.full_name}${student ? ` <span style="font-weight:600;color:var(--ink-soft);font-size:12.5px;">— ${student.full_name}</span>` : ""}</h3>
    <div class="chat-log" id="chatLog"><div class="center-loading">Loading…</div></div>
    <div class="chat-input-row">
      <textarea id="chatInput" rows="1"></textarea>
      <button class="btn btn-primary" id="chatSendBtn">Send</button>
    </div>
  </div></div>`);
  document.body.appendChild(overlay);
  enableModalKeyboardHandling(overlay);
  const close = () => { overlay.remove(); if (onClose) onClose(); };
  overlay.querySelector(".modal-close").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };

  const log = overlay.querySelector("#chatLog");
  async function load() {
    try {
      const msgs = await dbSelect("private_messages", { parent_id:`eq.${parentId}`, recipient_id:`eq.${staffId}`, order:"created_at.asc", limit:"200" });
      log.innerHTML = msgs.length ? msgs.map(m => {
        const mine = meIsParent ? m.sender_role === "parent" : m.sender_role !== "parent";
        return `<div class="chat-bubble ${mine?'chat-out':'chat-in'}">
          <div>${String(m.message||'').replace(/</g,"&lt;")}</div>
          <div class="chat-meta">${formatDate(m.created_at)}</div>
        </div>`;
      }).join("") : `<div class="empty" style="padding:24px 0;">${ic.empty}<div>No messages yet — say hello.</div></div>`;
      log.scrollTop = log.scrollHeight;
      
      msgs.filter(m => m.status === "unread" && (meIsParent ? m.sender_role !== "parent" : m.sender_role === "parent"))
        .forEach(m => { dbUpdate("private_messages", m.id, { status:"read" }).catch(()=>{}); });
    } catch (e) {
      log.innerHTML = missingSetupHtml("Chat isn't available for your school yet.");
    }
  }
  await load();

  const send = safe(async () => {
    const input = overlay.querySelector("#chatInput");
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    await dbInsert("private_messages", {
      parent_id: parentId, parent_name: parentName,
      recipient_id: staffId, recipient_name: staffName,
      subject: student ? `Chat — ${student.full_name}` : "Chat",
      message, sender_role: meIsParent ? "parent" : "staff",
      student_id: student ? student.id : null,
    });
    await load();
  });
  overlay.querySelector("#chatSendBtn").onclick = send;
  overlay.querySelector("#chatInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
}

async function refreshStaffBell() {
  document.querySelectorAll('[data-bell="staff"]').forEach(btn => {
    const badge = btn.querySelector(".nav-badge-count");
    if (badge) badge.remove();
  });
  if (!staffNotifEligible()) return;
  let announcements = [], messages = [], latestChangelog = null;
  try { announcements = await fetchStaffAnnouncements(); } catch (e) {}
  try { messages = await fetchStaffMessages(); } catch (e) {}
  try { latestChangelog = await fetchLatestChangelog(); } catch (e) {}
  const read = getStaffReadIds();
  const dismissed = getBellDismissedIds();
  const unreadAnnCount = announcements.filter(a => !read.has(`ann:${a.id}`) && !dismissed.has(`ann:${a.id}`)).length;
  const unreadMsgCount = messages.filter(m => m.status === "unread" && !dismissed.has(`msg:${m.id}`)).length;
  const updateUnseen = latestChangelog && isUpdateNotifFresh(latestChangelog) && String(latestChangelog.id) !== getSeenChangelogId() && !dismissed.has(`upd:${latestChangelog.id}`);
  const upgradePending = profile?.department === "administration" && schoolUpgradePending() && !dismissed.has(`schoolupg:${CURRENT_SCHOOL_ID}`);
  const count = unreadAnnCount + unreadMsgCount + (updateUnseen ? 1 : 0) + (upgradePending ? 1 : 0);
  document.querySelectorAll('[data-bell="staff"]').forEach(btn => {
    if (count > 0) btn.appendChild(el(`<span class="nav-badge-count">${count > 99 ? "99+" : count}</span>`));
  });
}

  const dismissed = getBellDismissedIds();
  const items = [...annItems, ...msgItems].filter(i => !dismissed.has(i.id)).sort((a, b) => new Date(b.when) - new Date(a.when));
  const updateUnseen = latestChangelog && String(latestChangelog.id) !== getSeenChangelogId();
  const updateDismissed = latestChangelog && getBellDismissedIds().has(`upd:${latestChangelog.id}`);
  const updateExpired = latestChangelog && !isUpdateNotifFresh(latestChangelog);

  const updateItemHtml = (latestChangelog && !updateDismissed && !updateExpired) ? `
    <div class="bell-item" id="bellUpdateItem" style="border:1px solid var(--line);border-radius:10px;">
      <div class="b-title">🚀 New version available${updateUnseen ? " <span class=\"nav-badge-count\" style=\"position:static;display:inline-block;vertical-align:middle;margin-left:6px;\">1</span>" : ""}</div>
      <div class="b-body"><strong>${latestChangelog.title}</strong>${latestChangelog.description ? ` — ${latestChangelog.description}` : ""}</div>
      <div class="b-meta">Update · ${new Date(latestChangelog.created_at).toLocaleString()}</div>
      <button class="btn btn-primary btn-sm" id="bellUpdateBtn" style="margin-top:8px;width:100%;">${ic.download} Update to New Version</button>
    </div>` : "";

  
  
  const upgradePendingNow = profile?.department === "administration" && schoolUpgradePending();
  const upgradeDismissed = getBellDismissedIds().has(`schoolupg:${CURRENT_SCHOOL_ID}`);
  const upgradeItemHtml = (upgradePendingNow && !upgradeDismissed) ? `
    <div class="bell-item" id="bellUpgradeItem" style="border:1px solid var(--line);border-radius:10px;">
      <div class="b-title">🏫 School upgrade available</div>
      <div class="b-body">TransApple has moved to a new registration format. Complete a short form to finish upgrading — your students, staff, fees, exams and settings are all preserved.</div>
      <div class="b-meta">Upgrade · ${new Date(CURRENT_SCHOOL.upgrade_requested_at).toLocaleString()}</div>
      <button class="btn btn-primary btn-sm" id="bellUpgradeBtn" style="margin-top:8px;width:100%;">Complete Upgrade</button>
    </div>` : "";

  const itemsHtml = items.map(i => `
    <div class="bell-item" data-id="${i.id}">
      <div class="b-title">${i.kind === "Message" ? "" : "📣 "}${i.title}</div>
      <div class="b-body">${i.body}</div>
      <div class="b-meta">${i.kind} · ${new Date(i.when).toLocaleString()}</div>
    </div>`).join("");

  function renderBellBody() {
    body.innerHTML = (updateItemHtml || upgradeItemHtml || itemsHtml) ? `${updateItemHtml}${upgradeItemHtml}${itemsHtml}` : `<div class="empty">No notifications yet.</div>`;
  }
  function showEmptyIfNothingLeft() {
    if (!body.querySelector(".bell-item")) body.innerHTML = `<div class="empty">No notifications yet.</div>`;
  }
  renderBellBody();

  
  
  
  const updateBtn = document.getElementById("bellUpdateBtn");
  if (updateBtn) updateBtn.onclick = () => {
    markChangelogSeen(latestChangelog.id);
    markBellDismissed(`upd:${latestChangelog.id}`);
    openUpdateSite();
    document.getElementById("bellUpdateItem")?.remove();
    showEmptyIfNothingLeft();
    refreshStaffBell();
  };

  
  
  
  const upgradeBtn = document.getElementById("bellUpgradeBtn");
  if (upgradeBtn) upgradeBtn.onclick = () => {
    closeStaffBellPanel();
    openSchoolUpgradeModal();
  };

  
  
  body.querySelectorAll(".bell-item[data-id]").forEach(rowEl => {
    bindRowGestures(rowEl, {
      onDelete: () => {
        markBellDismissed(rowEl.dataset.id);
        rowEl.remove();
        showEmptyIfNothingLeft();
        refreshStaffBell();
      },
    });
  });

  
  markStaffReadIds(announcements.map(a => `ann:${a.id}`));
  const unreadMsgIds = messages.filter(m => m.status === "unread").map(m => m.id);
  await Promise.all(unreadMsgIds.map(id => dbUpdate("parent_messages", id, { status: "read" }).catch(() => {})));
  refreshStaffBell();
}

const VAPID_PUBLIC_KEY = "BN1vsx9nDlrhKcKHTHtTSFfj7Dpwbyc45d3JJwB0clU2NkP8RBkn95axxN4ETd9_47haCWHoebERdaU2oIFAf6I";
function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function getExistingStaffPushSubscription() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}
async function subscribeStaffPush() {
  const reg = await navigator.serviceWorker.ready;
  const permission = await Notification.requestPermission();
  if (permission !== "granted") throw new Error("Notification permission was not granted.");
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
  });
  const json = sub.toJSON();
  await sb(`/rest/v1/push_subscriptions_staff`, { method: "POST", headers: { "Prefer": "resolution=merge-duplicates" }, body: JSON.stringify({
    endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth,
    school_id: CURRENT_SCHOOL_ID, profile_id: profile?.id || null, department: profile?.department || null,
  }) });
  return sub;
}
async function unsubscribeStaffPush() {
  const sub = await getExistingStaffPushSubscription();
  if (!sub) return;
  const endpoint = sub.endpoint;
  await sub.unsubscribe();
  try { await sb(`/rest/v1/push_subscriptions_staff?endpoint=eq.${encodeURIComponent(endpoint)}`, { method: "DELETE" }); } catch (e) {}
}

async function computeChildFeeSummary(studentId, classId) {
  const [structure, payments] = await Promise.all([
    dbSelect("fee_structures", { class_id:`eq.${classId||'null'}`, select:"amount,term_id" }).catch(()=>[]),
    dbSelect("fee_payments", { student_id:`eq.${studentId}`, select:"amount_paid,term_id" }).catch(()=>[]),
  ]);
  const totalAssigned = structure.reduce((a,b)=>a+Number(b.amount||0),0);
  const totalPaid = payments.reduce((a,b)=>a+Number(b.amount_paid||0),0);
  return { totalAssigned, totalPaid, totalDue: Math.max(totalAssigned-totalPaid,0) };
}

async function getOrAssignReceiptNo(payment) {
  if (payment.receipt_no) return payment.receipt_no;
  const s = schoolSettings || {};
  try {
    const prefix = s.receipt_prefix || "RCT";
    const digits = s.receipt_digits || 6;
    const next = s.receipt_next_number || 1;
    const receiptNo = `${prefix}-${String(next).padStart(digits, "0")}`;
    await dbUpdate("fee_payments", payment.id, { receipt_no: receiptNo });
    await dbUpsert("school_settings", { receipt_next_number: next + 1 }, "school_id");
    await loadSchoolSettings();
    payment.receipt_no = receiptNo;
    return receiptNo;
  } catch (e) {
    return `RCT-${String(payment.id).slice(0,8).toUpperCase()}`;
  }
}

async function showPresentTodayBreakdown(date) {
  let attRows = [];
  try { attRows = await dbSelect("attendance", { date:`eq.${date}`, select:"status,students(gender)" }); }
  catch(e) { attRows = []; }
  const isGender = (a, g) => a.students && a.students.gender === g;
  const present = attRows.filter(a=>a.status==="present");
  const absent = attRows.filter(a=>a.status==="absent");
  openViewModal(`Attendance — ${date}`, [
    ["Total students present", present.length],
    ["Total boys present", present.filter(a=>isGender(a,"Male")).length],
    ["Total girls present", present.filter(a=>isGender(a,"Female")).length],
    ["Total students absent", absent.length],
    ["Total boys absent", absent.filter(a=>isGender(a,"Male")).length],
    ["Total girls absent", absent.filter(a=>isGender(a,"Female")).length],
  ]);
}

async function renderAttendanceByClass(body, classes) {
  body.innerHTML = `<h3 style="color:var(--amber-dark);margin-bottom:14px;">Attendance by Class Today</h3><div class="center-loading">Loading…</div>`;
  if (!classes.length) { body.innerHTML = `<h3 style="color:var(--amber-dark);margin-bottom:14px;">Attendance by Class Today</h3>${emptyState("Create classes first in Setup.")}`; return; }
  const today = new Date().toISOString().slice(0,10);
  const classList = [...classes].sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  const [students, attToday] = await Promise.all([
    dbSelectActive("students", { status:"eq.active", select:"id,class_id" }),
    dbSelect("attendance", { date:`eq.${today}`, select:"class_id,status" }).catch(()=>[]),
  ]);
  const rowsHtml = classList.map(c => {
    const total = students.filter(s=>s.class_id===c.id).length;
    const present = attToday.filter(a=>a.class_id===c.id && a.status==="present").length;
    const pct = total ? Math.round((present/total)*100) : 0;
    const color = pct>=75 ? 'var(--teal)' : pct>=40 ? 'var(--amber)' : 'var(--red)';
    return `<div style="margin-bottom:12px;">
      <div class="row" style="margin-bottom:5px;font-size:13px;">
        <div style="font-weight:700;color:var(--ink);">${c.name}${c.section?(' '+c.section):''}</div>
        <div style="color:var(--ink-soft);font-weight:600;">${present}/${total} · ${pct}%</div>
      </div>
      <div style="background:var(--card-alt);border-radius:999px;height:9px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:${color};border-radius:999px;"></div>
      </div>
    </div>`;
  }).join("");
  body.innerHTML = `<h3 style="color:var(--amber-dark);margin-bottom:14px;">Attendance by Class Today</h3>${rowsHtml}`;
}

async function renderUpcomingWeek(body) {
  body.innerHTML = `<h3 style="color:var(--purple);margin-bottom:14px;">Upcoming This Week</h3><div class="center-loading">Loading…</div>`;
  const now = new Date(); const in7 = new Date(now.getTime()+7*86400000);
  const todayStr = now.toISOString().slice(0,10), in7Str = in7.toISOString().slice(0,10);
  let exams = [];
  try { exams = await dbSelect("exams", { select:"*,classes(name,section)", exam_date:`gte.${todayStr}`, order:"exam_date.asc" }); } catch(e) { exams = []; }
  const upcoming = exams.filter(x => x.exam_date && x.exam_date <= in7Str);
  if (!upcoming.length) { body.innerHTML = `<h3 style="color:var(--purple);margin-bottom:14px;">Upcoming This Week</h3>${emptyState("Nothing scheduled in the next 7 days.")}`; return; }
  body.innerHTML = `<h3 style="color:var(--purple);margin-bottom:14px;">Upcoming This Week</h3>
    ${upcoming.map(x=>{
      const days = Math.round((new Date(x.exam_date) - new Date(todayStr))/86400000);
      const when = days<=0 ? 'Today' : days===1 ? 'Tomorrow' : `in ${days} days`;
      return `<div class="list-row">
        <div class="avatar">${ic.exam}</div>
        <div class="list-main"><div class="list-title">${x.name}</div>
        <div class="list-sub">${x.classes?.name||''} ${x.classes?.section||''} · ${x.exam_date}</div></div>
        <span class="badge badge-amber">${when}</span>
      </div>`;
    }).join("")}
  `;
}

function openGradeModal(body, existingGrades, g) {
  const isEdit = !!g;
  openModal(isEdit ? "Edit grade" : "New grade", `
    <div class="field"><label>Grade (e.g. A+, A, B+)</label><input id="f_grade" value="${g?.grade||''}"/></div>
    <div class="grid2">
      <div class="field"><label>Min score (%)</label><input id="f_min" type="number" min="0" max="100" step="1" value="${g?.min_score??''}"/></div>
      <div class="field"><label>Max score (%)</label><input id="f_max" type="number" min="0" max="100" step="1" value="${g?.max_score??''}"/></div>
    </div>
    <div class="field"><label>Remark</label><input id="f_remark" value="${g?.remark||''}"/></div>
  `, async (ov) => {
    const grade = val(ov,"f_grade").trim();
    const min_score = Number(val(ov,"f_min"));
    const max_score = Number(val(ov,"f_max"));
    if (!grade) throw new Error("Enter a grade label.");
    if (val(ov,"f_min")==="" || val(ov,"f_max")==="" || Number.isNaN(min_score) || Number.isNaN(max_score)) throw new Error("Enter both a min and max score.");
    if (min_score > max_score) throw new Error("Min score can't be greater than max score.");
    const dupeName = existingGrades.find(e => e.grade.toLowerCase()===grade.toLowerCase() && (!isEdit || e.id!==g.id));
    if (dupeName) throw new Error(`"${grade}" already exists. Edit that one instead of adding a duplicate.`);
    const overlap = existingGrades.find(e => (!isEdit || e.id!==g.id) && min_score <= Number(e.max_score) && max_score >= Number(e.min_score));
    if (overlap) throw new Error(`That range overlaps with "${overlap.grade}" (${overlap.min_score}–${overlap.max_score}%). Adjust the range so ranges don't repeat.`);
    const payload = { grade, min_score, max_score, remark: val(ov,"f_remark").trim() || null };
    if (isEdit) await dbUpdate("grades", g.id, payload); else await dbInsert("grades", payload);
    gradesCache = null;
    renderGrades(body);
  }, { saveLabel: isEdit ? "Save changes" : "Add" });
}

function emptyState(text) { return `<div class="empty">${ic.empty}<div>${text}</div></div>`; }

function sortSelectHtml(id, selected, includeGender=true) {
  const opts = [["newest","Newest"],["oldest","Oldest"],["az","A–Z"],["za","Z–A"]];
  if (includeGender) opts.push(["male","Male"],["female","Female"]);
  return `<select id="${id}">${opts.map(([v,l])=>`<option value="${v}" ${selected===v?'selected':''}>${l}</option>`).join("")}</select>`;
}

function sortToParams(sortBy, nameCol, dateCol, genderCol="gender") {
  const params = {};
  switch (sortBy) {
    case "oldest": params.order = `${dateCol}.asc`; break;
    case "az": params.order = `${nameCol}.asc`; break;
    case "za": params.order = `${nameCol}.desc`; break;
    case "male": params.order = `${nameCol}.asc`; params[genderCol] = "eq.Male"; break;
    case "female": params.order = `${nameCol}.asc`; params[genderCol] = "eq.Female"; break;
    case "newest": default: params.order = `${dateCol}.desc`; break;
  }
  return params;
}

function daysOverdue(dueDate) {
  const due = new Date(dueDate + "T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((today - due) / 86400000);
}
async function renderLibrary(container, sub="catalog") {

function openBookModal(body, b, opts) {
  const isEdit = !!b;
  openModal(isEdit ? "Edit book" : "New book", `
    <div class="field"><label>Title</label><input id="f_title" value="${b?.title||''}"/></div>
    <div class="grid2">
      <div class="field"><label>Author</label><input id="f_author" value="${b?.author||''}"/></div>
      <div class="field"><label>ISBN (optional)</label><input id="f_isbn" value="${b?.isbn||''}"/></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Category</label><input id="f_category" value="${b?.category||''}"/></div>
      <div class="field"><label>Publisher</label><input id="f_publisher" value="${b?.publisher||''}"/></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Total copies</label><input id="f_copies" type="number" min="1" step="1" value="${b?.total_copies??1}"/></div>
      <div class="field"><label>Shelf location</label><input id="f_shelf" value="${b?.shelf_location||''}"/></div>
    </div>
    <div class="field"><label>Condition</label><select id="f_condition">${["New","Good","Fair","Poor","Damaged"].map(c=>`<option value="${c}" ${b?.condition===c?'selected':''}>${c}</option>`).join("")}</select></div>
    <div class="field"><label>Notes</label><textarea id="f_notes" rows="2">${b?.notes||''}</textarea></div>
  `, async (ov) => {
    const title = val(ov,"f_title").trim();
    if (!title) throw new Error("Enter a title.");
    const total_copies = Number(val(ov,"f_copies"));
    if (val(ov,"f_copies")==="" || Number.isNaN(total_copies) || total_copies < 1) throw new Error("Enter a valid number of copies.");
    let available_copies = total_copies;
    if (isEdit) {
      
      
      const delta = total_copies - Number(b.total_copies);
      available_copies = Math.max(0, Math.min(total_copies, Number(b.available_copies) + delta));
    }
    const payload = {
      title, author: val(ov,"f_author").trim() || null, isbn: val(ov,"f_isbn").trim() || null,
      category: val(ov,"f_category").trim() || null, publisher: val(ov,"f_publisher").trim() || null,
      total_copies, available_copies,
      shelf_location: val(ov,"f_shelf").trim() || null, condition: val(ov,"f_condition"),
      notes: val(ov,"f_notes").trim() || null,
    };
    if (isEdit) await dbUpdate("library_books", b.id, payload); else await dbInsert("library_books", payload);
    renderBookCatalog(body, opts);
  }, { saveLabel: isEdit ? "Save changes" : "Add" });
}

      ]),
    });
    const returnBtn = row.querySelector(".returnBtn");
    if (returnBtn) {
      
      
      
      ["pointerdown","pointerup","pointermove","click"].forEach(evt => returnBtn.addEventListener(evt, e => e.stopPropagation()));

      });

  });
  document.getElementById("addBtn").onclick = () => openLoanModal(body, books, opts);
}
async function returnLoan(loan) {
  await dbUpdate("library_loans", loan.id, { returned_at: new Date().toISOString() });
  if (loan.book_id) {
    try {
      const rows = await dbSelect("library_books", { id:`eq.${loan.book_id}`, select:"id,total_copies,available_copies" });
      const b = rows[0];
      if (b) await dbUpdate("library_books", b.id, { available_copies: Math.min(Number(b.total_copies), Number(b.available_copies) + 1) });
    } catch (e) {  }
  }
}
function openLoanModal(body, books, opts) {

  openModal("New loan", `
    <div class="field"><label>Book</label><input id="f_book" list="f_book_list" />
      <datalist id="f_book_list">${available.map(b=>`<option value="${b.title}"></option>`).join("")}</datalist></div>

    </div>

    const bookTitle = val(ov,"f_book").trim();

    const payload = {

      due_date, notes: val(ov,"f_notes").trim() || null,

    await dbInsert("library_loans", payload);

}

async function renderLibraryFines(body) {
  let loans = [];

  try { loans = await dbSelectActive("library_loans", { order:"due_date.asc" }); }
  catch (e) { missingTable = true; }

  if (missingTable) {

  const withFines = loans.filter(l => Number(l.fine_amount) > 0);
  const outstanding = withFines.filter(l => !l.fine_paid);
  const totalOutstanding = outstanding.reduce((a,l) => a + Number(l.fine_amount||0), 0);

      <div style="font-size:12px;color:var(--ink-soft);">${outstanding.length} unpaid</div>
    </div>

    const ul = document.getElementById("unfinedList");

      const row = el(`<div class="list-row"><div class="avatar">${initials(l.book_title)}</div>

      ul.appendChild(row);
    });
  }

  const list = document.getElementById("list");
  list.innerHTML = withFines.length ? "" : emptyState("No fines recorded yet.");
  withFines.forEach(l => {
    const row = el(`<div class="list-row" style="flex-wrap:wrap;align-items:flex-start;"><div class="avatar">${initials(l.book_title)}</div>
      <div class="list-main"><div class="list-title">${l.book_title} <span class="badge ${l.fine_paid?'badge-green':'badge-red'}">${l.fine_paid?"Paid":"Unpaid"}</span></div>

      </div>`);
    const payBtn = row.querySelector(".payBtn");

    row.addEventListener("click", (e) => { if (e.target.closest(".payBtn")) return; openLoanEditModal(document.getElementById("secBody") || document.body, l, {}); });
    list.appendChild(row);

async function renderStudents(container, opts={}) {
  setActiveRefresh(() => renderStudents(container, opts));
  const sub = opts.sub || "roster";
  const canManageStudents = hasFullAccess(profile) || profile?.department === "academic";
  if (!canManageStudents) {
    container.innerHTML = `<div id="secBody"><div class="center-loading">Loading…</div></div>`;
    return renderStudentRoster(document.getElementById("secBody"), container, opts);
  }
  const prevPillScroll = document.getElementById("pills")?.scrollLeft;
  container.innerHTML = `<div class="pill-row" id="pills"></div><div id="secBody"><div class="center-loading">Loading…</div></div>`;
  const pills = document.getElementById("pills");
  [["roster","Roster"],["transfers","Transfer requests"]].forEach(([id,label])=>{

async function renderStudentRoster(body, container, opts={}) {
  const search = opts.search || "";
  const classFilter = opts.classFilter || "";
  const sortBy = opts.sortBy || "az";
  const __gen = beginSearchGen(container);
  let params = { select:"*,classes(name,section)", ...sortToParams(sortBy, "full_name", "created_at", "gender") };
  if (search) params.or = `(full_name.ilike.*${encodeURIComponent(search)}*,sin.ilike.*${encodeURIComponent(search)}*)`;
  if (classFilter) params.class_id = `eq.${classFilter}`;
  params.status = "neq.transferred";
  syncPendingSins().then(r => { if (r && r.success && (r.linked || r.rejected)) renderStudents(container, opts); });
  const [classes, students] = await Promise.all([
    dbSelectActive("classes", { order:"name.asc" }),
    dbSelectActive("students", params),
  ]);
  if (isStaleSearch(container, __gen)) return; // a newer keystroke already started a fresher request
  
  
  const canManageStudents = hasFullAccess(profile) || profile?.department === "academic";
  body.innerHTML = `
    <h3 style="color:var(--sky);margin-bottom:12px;">Students</h3>
    <div class="search-bar">
      <input id="searchInput" value="${search}"/>
      <select id="classFilterSel"><option value="">All classes</option>${classes.map(c=>`<option value="${c.id}" ${classFilter===c.id?'selected':''}>${c.name}${c.section?(' '+c.section):''}</option>`).join("")}</select>
      ${sortSelectHtml("sortSel", sortBy, true)}
    </div>
    <div class="card" id="list"></div>
  `;
  bindLiveSearch(document.getElementById("searchInput"), container, (val)=>renderStudentRoster(body, container, {search:val,classFilter,sortBy}));
  document.getElementById("classFilterSel").onchange = (e)=>renderStudents(container,{search,classFilter:e.target.value,sortBy});
  document.getElementById("sortSel").onchange = (e)=>renderStudents(container,{search,classFilter,sortBy:e.target.value});
  const list = document.getElementById("list");
  list.innerHTML = students.length ? "" : emptyState("No students found.");
  students.forEach(s => {
    const row = el(`<div class="list-row">
      ${avatarHtml(s.full_name, s.photo_url)}
      <div class="list-main"><div class="list-title">${s.full_name}</div>
      <div class="list-sub">${sinText(s)} · ${s.classes ? (s.classes.name+(s.classes.section?(' '+s.classes.section):'')) : 'Unassigned'}</div></div>
      ${s.sin_status === "pending" ? `<span class="badge badge-amber">SIN pending</span>` : s.sin_status === "review" ? `<span class="badge badge-amber">Under review</span>` : s.sin_status === "rejected" ? `<span class="badge badge-red">Rejected</span>` : `<span class="badge ${s.status==='active'?'badge-green':'badge-grey'}">${s.status}</span>`}
    </div>`);
    const view = async () => {
      let info = null;
      try { info = await sinRpc("school_student_sin_info", { p_student_id: s.id }); } catch (e) { info = null; }
      const sinLabel = info && info.sin ? `<span style="font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;">${reqEsc(info.sin)}</span>`
        : s.sin_status === "review" ? `Under review by Mother${info && info.review_ref ? " (" + reqEsc(info.review_ref) + ")" : ""}`
        : s.sin_status === "rejected" ? "Rejected" : "SIN pending";
      const overlay = openViewModal(s.full_name, [
        ["Photo", s.photo_url ? `<img src="${s.photo_url}" style="width:56px;height:56px;border-radius:10px;object-fit:cover;"/>` : ""],
        ["SIN", sinLabel],
        ["Class", s.classes ? (s.classes.name+(s.classes.section?(' '+s.classes.section):'')) : 'Unassigned'],
        ["Gender", s.gender], ["Date of birth", s.date_of_birth],
        ["Parent/guardian", s.guardian_name], ["Relationship", s.guardian_relation], ["Guardian phone", s.guardian_contact],
        ["Medical information", s.medical_info],
        ["Village", s.village], ["Subcounty", s.sub_county], ["District", s.district],
        ["Emergency contact", s.emergency_name], ["Emergency relationship", s.emergency_relation], ["Emergency phone", s.emergency_contact],
        ["Status", s.status],
      ], canManageStudents ? (() => openStudentModal(container, classes, s)) : null, []);
      const fab = openParentQuickCompose(s);
      const cleanup = () => fab.remove();
      overlay.querySelectorAll("[id^='modalExtra']").forEach(b => b.addEventListener("click", cleanup));
      overlay.querySelector(".modal-close").addEventListener("click", cleanup);
      overlay.querySelector("#modalCancel").addEventListener("click", cleanup);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) cleanup(); });
      const editBtn = overlay.querySelector("#modalEditBtn");
      if (editBtn) editBtn.addEventListener("click", cleanup);
    };
    const edit = canManageStudents ? (() => openStudentModal(container, classes, s)) : null;
    const del = canManageStudents ? (async () => { if (await customConfirm(`Move ${s.full_name} to trash?`, { danger:true, okLabel:"Move to trash" })) safe(async()=>{ await softDelete("students", s.id); renderStudents(container,{search,classFilter,sortBy}); })(); }) : null;
    bindRowGestures(row, { onView:view, onEdit:edit, onDelete:del });
    list.appendChild(row);
  });
  if (canManageStudents) addFab(container, () => openStudentModal(container, classes, null));
}

function sinText(s) { return s && s.sin ? s.sin : "SIN pending"; }
function reqEsc(s) { return String(s==null?"":s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
const SIN_LEN = 10; // fixed — mirrors the server-side check (sin_is_valid)
function normalizeSIN(raw) {
  return String(raw || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
}
function sinLooksValid(sin) { return sin.length === SIN_LEN; }

async function sinRpc(name, args) {
  const res = await sb(`/rest/v1/rpc/${name}`, { method:"POST", body: JSON.stringify(args || {}) });
  if (res && res.success === false) throw new Error(res.error || "Something went wrong.");
  return res;
}

async function schoolFinalizeStudent(studentId) {
  const res = await sinRpc("school_finalize_student", { p_student: studentId });
  logActivity("students", "update", studentId, { note: "Student enrollment finalized (SIN confirmed)" });
  return res;

let sinSyncBusy = false;
async function syncPendingSins() {
  if (sinSyncBusy) return null;
  sinSyncBusy = true;
  try { return await sb(`/rest/v1/rpc/school_sync_pending_students`, { method:"POST", body:"{}" }); }
  catch (e) { return null; } // best-effort; the next roster load tries again
  finally { sinSyncBusy = false; }
}

function showRegistrationOutcome(name, res) {
  const st = res && res.status;
  if (st === "linked") {
    toast(`${reqEsc(name)} registered${res.issued ? " — a new SIN was issued" : ""}.`, false);
    const rows = [["Student", reqEsc(name)], ["SIN", `<span class="mono" style="font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;">${reqEsc(res.sin || "")}</span>`]];
    if (res.returning) rows.push(["Note", "This student is returning — the earlier record was restored."]);
    openViewModal("Registered", rows, null, []);
  } else if (st === "review") {
    openViewModal("SIN pending", [
      ["Student", reqEsc(name)],
      ["Status", "Saved as “SIN pending”. Mother is reviewing a possible match."],
      ["Reference", reqEsc(res.ref || "")],
    ], null, []);
  } else if (st === "duplicate") {
    toast(reqEsc(res.message || "That student is already registered here."), true);
  } else if (st === "rejected") {
    toast("Mother rejected this registration.", true);
  } else {
    toast("Saved.", false);
  }
}

  `, async (ov) => {

      const chosen = ov.querySelector("#f_photo_live").files[0] || ov.querySelector("#f_photo_pick").files[0];
      const photo_url = capturedPhotoDataUrl || (chosen ? await fileToPhotoDataURL(chosen) : (s.photo_url || null));
      await dbUpdate("students", s.id, { class_id: val(ov, "f_class") || null, status: val(ov, "f_status"), photo_url });
      renderStudents(container);
      return;
    }
    const sin = normalizeSIN(val(ov, "f_sin"));
    if (sin && !sinLooksValid(sin)) throw new Error(`A SIN is exactly ${SIN_LEN} letters/numbers. Clear the box if the student has none.`);
    requireFields(ov, [
      ["f_name","Full name"], ["f_dob","Date of birth"], ["f_class","Class"],
      ["f_gname","Parent/guardian name"], ["f_grel","Parent/guardian relationship"], ["f_gphone","Parent/guardian phone"],
      ["f_medical","Medical information"], ["f_village","Village"], ["f_subcounty","Subcounty"], ["f_district","District"],
    ]);
    const chosenFile = ov.querySelector("#f_photo_live").files[0] || ov.querySelector("#f_photo_pick").files[0];
    if (!isEdit && !capturedPhotoDataUrl && !chosenFile && !sinPhotoUrl) throw new Error("A registration photo is required — use Live or Pick, or check the SIN to fetch it.");
    const photo_url = capturedPhotoDataUrl || (chosenFile ? await fileToPhotoDataURL(chosenFile) : (sinPhotoUrl || s?.photo_url || null));
    const payload = {
      full_name: val(ov,"f_name"), date_of_birth: val(ov,"f_dob")||null,
      gender: val(ov,"f_gender"), class_id: val(ov,"f_class")||null,
      guardian_name: val(ov,"f_gname"), guardian_relation: val(ov,"f_grel"), guardian_contact: val(ov,"f_gphone"),
      medical_info: val(ov,"f_medical"),
      village: val(ov,"f_village"), sub_county: val(ov,"f_subcounty"), district: val(ov,"f_district"),
      emergency_name: val(ov,"f_ename"), emergency_relation: val(ov,"f_erel"), emergency_contact: val(ov,"f_ephone"),
      sin_entered: sin || null, photo_url,
    };
    if (isEdit) {
      payload.status = val(ov, "f_status");
      await dbUpdate("students", s.id, payload);
      renderStudents(container);
      return;
    }
    payload.status = "active";
    const rows = await dbInsert("students", payload);
    const saved = Array.isArray(rows) ? rows[0] : rows;
    let outcome = null;
    let finalizeErr = null;
    try { outcome = await schoolFinalizeStudent(saved.id); }
    catch (e) { finalizeErr = e; }
    renderStudents(container);
    if (outcome) showRegistrationOutcome(payload.full_name, outcome);
    else if (finalizeErr) toast(`Saved as “SIN pending”. Could not link it yet: ${reqEsc(finalizeErr.message || "")}`, true);
    else toast("Saved as “SIN pending”.", false);
  }, { saveLabel: isEdit ? "Save changes" : "Register" });

  wireDobField(document, "f_dob");
  const lockIdentity = (on) => {
    ["f_name","f_gname","f_grel","f_gphone","f_medical","f_village","f_subcounty","f_district","f_ename","f_erel","f_ephone"]
      .forEach(id => { const n = document.getElementById(id); if (n) n.readOnly = on; });
    ["f_gender","f_dob_y","f_dob_m","f_dob_d"].forEach(id => { const n = document.getElementById(id); if (n) n.disabled = on; });
  };
  if (linked) lockIdentity(true);
  const liveInput = document.getElementById("f_photo_live");
  const pickInput = document.getElementById("f_photo_pick");
  const setPreview = (dataUrl) => { document.getElementById("photoPreviewWrap").innerHTML = avatarHtml(s?.full_name, dataUrl, 72); };
  document.getElementById("liveBtn").onclick = () => {
    openCameraCapture(
      (dataUrl) => { capturedPhotoDataUrl = dataUrl; liveInput.value = ""; pickInput.value = ""; setPreview(dataUrl); },
      () => { toast("In-page camera isn't available here — opening the picker instead.", false); liveInput.click(); }
    );
  };
  document.getElementById("pickBtn").onclick = () => pickInput.click();
  liveInput.onchange = async () => {
    if (!liveInput.files[0]) return;
    capturedPhotoDataUrl = null; pickInput.value = "";
    const dataUrl = await fileToPhotoDataURL(liveInput.files[0]);
    if (dataUrl) setPreview(dataUrl);
  };
  pickInput.onchange = async () => {
    if (!pickInput.files[0]) return;
    capturedPhotoDataUrl = null; liveInput.value = "";
    const dataUrl = await fileToPhotoDataURL(pickInput.files[0]);
    if (dataUrl) setPreview(dataUrl);
  };
  if (linked) return;

  const sinInput = document.getElementById("f_sin");
  const statusEl = document.getElementById("sinStatus");
  const setStatus = (msg, kind) => {
    statusEl.textContent = msg;
    statusEl.style.color = kind === "ok" ? "var(--teal-dark)" : kind === "warn" ? "var(--amber-dark)" : kind === "err" ? "#C0392B" : "";
  };
  sinInput.oninput = () => {
    sinInput.value = normalizeSIN(sinInput.value).slice(0, SIN_LEN); // never more than 10
    if (prefilled) { prefilled = false; sinPhotoUrl = null; lockIdentity(false); }
    setStatus("", "");
    if (sinInput.value.length === SIN_LEN) runCheck(); // 10th character typed: search and fill automatically
  };

  const setField = (id, value) => {
    const node = document.getElementById(id);
    if (!node || value === undefined || value === null || String(value).trim() === "") return false;
    node.value = String(value).trim();
    return true;
  };
  const setDob = (iso) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
    if (!m) return false;
    document.getElementById("f_dob_y").value = m[1];
    document.getElementById("f_dob_m").value = String(Number(m[2]));
    document.getElementById("f_dob_d").value = String(Number(m[3]));
    document.getElementById("f_dob").value = `${m[1]}-${m[2]}-${m[3]}`;
    return true;
  };
  const setGender = (g) => {
    const wanted = String(g || "").trim().toLowerCase();
    const sel = document.getElementById("f_gender");
    const opt = [...sel.options].find(o => o.value.toLowerCase() === wanted || o.text.toLowerCase() === wanted);
    if (!opt) return false;
    sel.value = opt.value;
    return true;
  };

  let busy = false;
  const runCheck = async () => {
    if (busy) return;
    const sin = normalizeSIN(sinInput.value);
    sinInput.value = sin;
    if (sin && !sinLooksValid(sin)) { setStatus(`A SIN is exactly ${SIN_LEN} letters/numbers.`, "err"); return; }
    busy = true; setStatus("Checking…", "");
    try {
      const res = await schoolCheckStudent({
        sin, full_name: val(document, "f_name"), date_of_birth: val(document, "f_dob") || null,
        gender: val(document, "f_gender"), guardian_name: val(document, "f_gname"),
      });
      if (normalizeSIN(sinInput.value) !== sin) return; // the box changed while we were searching
      const st = res.status;
      if (st === "ok" || st === "match_exact") {
        const rec = res.identity || {};
        let filled = 0;
        if (setField("f_name", rec.full_name)) filled++;
        if (setDob(rec.date_of_birth)) filled++;
        if (setGender(rec.gender)) filled++;
        [["f_village","village"],["f_subcounty","sub_county"],["f_district","district"],
         ["f_gname","guardian_name"],["f_grel","guardian_relation"],["f_gphone","guardian_contact"],
         ["f_medical","medical_info"],["f_ename","emergency_name"],["f_erel","emergency_relation"],["f_ephone","emergency_contact"]
        ].forEach(([id,col]) => { if (setField(id, rec[col])) filled++; });
        if (rec.photo_url) { sinPhotoUrl = rec.photo_url; setPreview(rec.photo_url); filled++; }
        prefilled = true; lockIdentity(true);
        setStatus(`${res.returning ? "Returning student. " : ""}Record found — ${filled} field${filled===1?"":"s"} filled from the SIN record. Choose the class, then Register.`, "ok");
      } else if (st === "match_partial" || st === "need_details" || st === "no_match") {
        setStatus(res.message || "", st === "match_partial" ? "warn" : "");
      } else {
        setStatus(res.message || "Couldn't use that SIN.", "err"); // invalid_sin, unknown_sin, locked, already_here
      }
    } catch (e) {
      setStatus(e.message || "Couldn't check.", "err");
    } finally {
      busy = false;
      const now = normalizeSIN(sinInput.value);
      if (now.length === SIN_LEN && now !== sin) runCheck(); // a different SIN was typed meanwhile
    }
  };
  sinInput.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); runCheck(); } };
}

      matchBox.innerHTML = `<div class="field" style="background:var(--amber-tint);border-radius:10px;padding:8px 10px;">
        <div style="font-size:12px;font-weight:700;color:var(--amber-dark);margin-bottom:4px;">Possible existing AiO ID — is this the same teacher?</div>
        ${matches.map(m=>`<div class="list-row" data-nova="${m.nova_id}" style="padding:6px 0;">
          <div class="list-main"><div class="list-title" style="font-size:13px;">${m.full_name} · ${m.nova_id}</div>
          <div class="list-sub">${m.schools || 'No other school on file'}</div></div>
        </div>`).join("")}
      </div>`;
      matchBox.querySelectorAll("[data-nova]").forEach((row,i) => {
        row.onclick = () => {
          linkedIdentity = matches[i];
          nameInput.value = matches[i].full_name;
          matchBox.innerHTML = `<div class="field" style="background:var(--teal-tint);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--teal-dark);font-weight:700;">
            Linked to existing AiO ID ${matches[i].nova_id} — no duplicate will be created.
          </div>`;
        };
      });
    }, 400);
    nameInput.oninput = runMatch;
    ninInput.oninput = runMatch;
  }
}

const NOVA_TEACHER_IDENTITY_SQL = `-- AiO Teacher Identity: run once in Supabase -> SQL Editor, before TEACHER_PROFILE_SQL.

create table if not exists teacher_identities (
  id uuid primary key default gen_random_uuid(),
  nova_id text not null unique,
  full_name text not null,
  national_id_no text,
  date_of_birth date,
  gender text,
  photo_url text,
  created_at timestamptz not null default now()
);
-- Two different national ID numbers can never share an identity; blanks are fine.
create unique index if not exists teacher_identities_national_id_uq
  on teacher_identities (national_id_no) where national_id_no is not null and national_id_no <> '';
alter table teacher_identities enable row level security;
drop policy if exists "Anyone can read teacher_identities" on teacher_identities;
create policy "Anyone can read teacher_identities" on teacher_identities for select using (true);
drop policy if exists "Authenticated can manage teacher_identities" on teacher_identities;
create policy "Authenticated can manage teacher_identities" on teacher_identities for all using (true);

create sequence if not exists nova_teacher_id_seq start 1;

-- Link each per-school Staff record to a global identity. nova_teacher_id is
-- a denormalized copy of teacher_identities.nova_id so lists/search never
-- need a join. email is new too, alongside the phone this table already had.
alter table teachers add column if not exists teacher_identity_id uuid references teacher_identities(id);
alter table teachers add column if not exists nova_teacher_id text;
alter table teachers add column if not exists email text;
create index if not exists teachers_identity_idx on teachers (teacher_identity_id);

-- The ONLY place an AiO ID is ever generated. Matches an existing person by
-- National ID first (most reliable), then by exact name + date of birth, and
-- reuses their AiO ID instead of creating a new one — this is what stops a
-- teacher getting a duplicate identity just for joining another school.
drop function if exists find_or_create_teacher_identity(text, text, date, text, text);
create function find_or_create_teacher_identity(
  p_full_name text, p_national_id_no text default null, p_date_of_birth date default null,
  p_gender text default null, p_photo_url text default null
) returns teacher_identities
language plpgsql security definer as $find_or_create_teacher_identity$
declare found teacher_identities; new_nova_id text;
begin
  if p_national_id_no is not null and trim(p_national_id_no) <> '' then
    select * into found from teacher_identities where national_id_no = trim(p_national_id_no) limit 1;
  end if;
  if found.id is null and p_date_of_birth is not null then
    select * into found from teacher_identities
      where trim(lower(full_name)) = trim(lower(p_full_name)) and date_of_birth = p_date_of_birth
      limit 1;
  end if;
  if found.id is not null then
    -- Keep the identity's record current, but never blank out what's already on file.
    update teacher_identities set
      full_name = coalesce(nullif(trim(p_full_name), ''), full_name),
      national_id_no = coalesce(nullif(trim(p_national_id_no), ''), national_id_no),
      date_of_birth = coalesce(p_date_of_birth, date_of_birth),
      gender = coalesce(nullif(p_gender, ''), gender),
      photo_url = coalesce(nullif(p_photo_url, ''), photo_url)
      where id = found.id returning * into found;
    return found;
  end if;
  new_nova_id := 'NOVA-TCH-' || lpad(nextval('nova_teacher_id_seq')::text, 6, '0');
  insert into teacher_identities (nova_id, full_name, national_id_no, date_of_birth, gender, photo_url)
  values (new_nova_id, p_full_name, nullif(trim(p_national_id_no),''), p_date_of_birth, p_gender, p_photo_url)
  returning * into found;
  return found;
end;
$find_or_create_teacher_identity$;
grant execute on function find_or_create_teacher_identity(text,text,date,text,text) to anon, authenticated;

-- Powers the "check for an existing AiO ID" search in the Add Staff form —
-- matches by name, National ID, or phone across ALL schools, so an admin can
-- catch a likely duplicate (e.g. a typo'd National ID) before saving.
drop function if exists search_teacher_identities(text);
create function search_teacher_identities(p_query text)
returns table(id uuid, nova_id text, full_name text, national_id_no text, date_of_birth date, schools text)
language sql stable as $search_teacher_identities$
  select ti.id, ti.nova_id, ti.full_name, ti.national_id_no, ti.date_of_birth,
    coalesce(string_agg(distinct s.name, ', '), '') as schools
  from teacher_identities ti
  left join teachers t on t.teacher_identity_id = ti.id and t.deleted_at is null
  left join schools s on s.id = t.school_id
  where p_query is not null and trim(p_query) <> '' and (
    ti.full_name ilike '%' || p_query || '%'
    or ti.national_id_no ilike '%' || p_query || '%'
    or exists (select 1 from teachers t2 where t2.teacher_identity_id = ti.id and t2.phone ilike '%' || p_query || '%')
  )
  group by ti.id
  order by ti.full_name
  limit 8;
$search_teacher_identities$;
grant execute on function search_teacher_identities(text) to anon, authenticated;

-- One-time migration: every existing Staff row predates AiO IDs, so give
-- each one its own identity. Each becomes its own person for now — there's
-- no reliable field on file yet (no National ID captured historically) to
-- safely tell whether two existing rows across schools are the same human,
-- so the safe default is "don't guess and merge strangers together". From
-- this point on, every NEW teacher goes through find_or_create_teacher_identity()
-- above, so real duplicates are prevented going forward.
do $$
declare r record; new_nova_id text; new_identity_id uuid;
begin
  for r in select * from teachers where teacher_identity_id is null loop
    new_nova_id := 'NOVA-TCH-' || lpad(nextval('nova_teacher_id_seq')::text, 6, '0');
    insert into teacher_identities (nova_id, full_name, gender, photo_url)
    values (new_nova_id, r.full_name, r.gender, r.photo_url)
    returning id into new_identity_id;
    update teachers set teacher_identity_id = new_identity_id, nova_teacher_id = new_nova_id where id = r.id;
  end loop;
end $$;
`;

const TEACHER_EVALUATIONS_SQL = `-- Teacher Performance & Evaluations: run once in Supabase -> SQL Editor.

-- Bridges a teacher's login account (profiles) to their per-school
-- professional record (teachers), so a logged-in teacher can be shown only
-- their OWN evaluations. Nullable and admin-set — see openAccountControls().
alter table profiles add column if not exists linked_teacher_id uuid references teachers(id);

-- Per-school policy for how much of an evaluation a teacher is allowed to see
-- of their own record: 'hidden' (nothing), 'scores_only' (categories + overall
-- score, no comments), 'full' (everything). Never lets a teacher edit either way.
alter table school_settings add column if not exists teacher_eval_visibility text not null default 'scores_only';

create table if not exists teacher_evaluations (
  id uuid primary key default gen_random_uuid(),
  school_id uuid not null,
  teacher_id uuid not null references teachers(id) on delete cascade,
  evaluator_profile_id uuid references profiles(id),
  evaluator_name text, -- denormalized so history reads correctly even if the account is later removed
  evaluation_date date not null default current_date,
  evaluation_period text, -- e.g. "Term 1, 2026"
  scores jsonb not null default '{}'::jsonb, -- {"Teaching effectiveness": 4, "Punctuality": 5, ...}
  overall_score numeric(4,2), -- average of the scores actually entered, computed at save time
  strengths text,
  areas_for_improvement text,
  recommendation text,
  deleted_at timestamptz,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
alter table teacher_evaluations enable row level security;
drop policy if exists "Anyone can read teacher_evaluations" on teacher_evaluations;
create policy "Anyone can read teacher_evaluations" on teacher_evaluations for select using (true);
drop policy if exists "Authenticated can manage teacher_evaluations" on teacher_evaluations;
create policy "Authenticated can manage teacher_evaluations" on teacher_evaluations for all using (true);

-- Every create/update/delete of an evaluation writes one row here — a
-- permanent, un-editable log of who did what and when. Never updated or
-- deleted itself (no edit UI is ever built for this table).
create table if not exists teacher_evaluation_audit (
  id uuid primary key default gen_random_uuid(),
  school_id uuid not null,
  evaluation_id uuid not null references teacher_evaluations(id) on delete cascade,
  action text not null, -- 'created' | 'updated' | 'deleted'
  actor_profile_id uuid references profiles(id),
  actor_name text,
  snapshot jsonb, -- full evaluation content at the moment of this action
  created_at timestamptz not null default now()
);
alter table teacher_evaluation_audit enable row level security;
drop policy if exists "Anyone can read teacher_evaluation_audit" on teacher_evaluation_audit;
create policy "Anyone can read teacher_evaluation_audit" on teacher_evaluation_audit for select using (true);
drop policy if exists "Authenticated can manage teacher_evaluation_audit" on teacher_evaluation_audit;
create policy "Authenticated can manage teacher_evaluation_audit" on teacher_evaluation_audit for all using (true);
`;

const EVAL_CATEGORIES = [
  "Teaching effectiveness", "Attendance", "Punctuality", "Professionalism",
  "Lesson preparation", "Student engagement", "Assessment quality", "Responsibility", "Teamwork",
];

function calcOverallScore(scores) {
  const vals = EVAL_CATEGORIES
    .map(c => scores ? scores[c] : undefined)
    .filter(v => v !== null && v !== undefined && v !== "" && !Number.isNaN(Number(v)))
    .map(Number);
  if (!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b, 0) / vals.length) * 100) / 100;
}

function canManageEvaluations(p) { return hasFullAccess(p); }
function evalVisibilityPolicy() { return (schoolSettings && schoolSettings.teacher_eval_visibility) || "scores_only"; }

async function logEvalAudit(evaluationId, action, snapshot) {
  try {
    await dbInsert("teacher_evaluation_audit", {
      evaluation_id: evaluationId, action, actor_profile_id: profile?.id || null,
      actor_name: profile?.full_name || null, snapshot,
    });
  } catch (e) {  }
}

async function renderTeacherPerformance(body, container, teacher) {
  const isAdmin = canManageEvaluations(profile);
  const isSelf = !!(profile && profile.linked_teacher_id && profile.linked_teacher_id === teacher.id);
  const policy = evalVisibilityPolicy();
  if (!isAdmin && !isSelf) { body.innerHTML = emptyState("You don't have access to this teacher's performance record."); return; }
  if (!isAdmin && isSelf && policy === "hidden") { body.innerHTML = emptyState("Performance evaluations aren't visible to teachers at this school. Ask an administrator."); return; }
  const evals = await dbSelectActive("teacher_evaluations", { teacher_id:`eq.${teacher.id}`, order:"evaluation_date.desc" });
  body.innerHTML = `<div class="card" id="evalList"></div>`;
  const list = document.getElementById("evalList");
  list.innerHTML = evals.length ? "" : emptyState(isAdmin ? "No performance evaluations yet." : "No performance evaluations recorded yet.");
  evals.forEach(ev => {
    const row = el(`<div class="list-row">
      <div class="avatar">${ev.overall_score != null ? ev.overall_score : '—'}</div>
      <div class="list-main"><div class="list-title">${ev.evaluation_period || formatDate(ev.evaluation_date)}</div>
      <div class="list-sub">${formatDate(ev.evaluation_date)}${ev.evaluator_name ? (' · Evaluator: '+ev.evaluator_name) : ''}</div></div>
      <span class="badge badge-amber">${ev.overall_score != null ? ev.overall_score+'/5' : 'Unscored'}</span>
    </div>`);
    const view = () => openEvaluationViewModal(ev, isAdmin, body, container, teacher, policy);
    if (isAdmin) {
      const edit = () => openEvaluationModal(body, container, teacher, ev);
      const del = async () => { if (await customConfirm(`Delete this evaluation? This cannot be undone.`, { danger:true, okLabel:"Delete" })) safe(async()=>{
        await softDelete("teacher_evaluations", ev.id);
        await logEvalAudit(ev.id, "deleted", ev);
        renderTeacherPerformance(body, container, teacher);
      })(); };
      bindRowGestures(row, { onView:view, onEdit:edit, onDelete:del });
    } else {
      
      
      row.style.cursor = "pointer";
      row.onclick = view;
    }
    list.appendChild(row);
  });
  if (isAdmin) addFab(body, () => openEvaluationModal(body, container, teacher, null));
}

function openEvaluationViewModal(ev, isAdmin, body, container, teacher, policy) {
  const showFull = isAdmin || policy === "full";
  const rows = [
    ["Evaluation date", formatDate(ev.evaluation_date)],
    ["Evaluation period", ev.evaluation_period],
    ["Evaluator", ev.evaluator_name],
    ...EVAL_CATEGORIES.map(c => [c, (ev.scores && ev.scores[c] != null) ? `${ev.scores[c]}/5` : null]),
    ["Overall score", ev.overall_score != null ? `${ev.overall_score}/5` : "Not yet calculated"],
  ];
  if (showFull) {
    rows.push(["Strengths", ev.strengths], ["Areas for improvement", ev.areas_for_improvement], ["Professional recommendation", ev.recommendation]);
  } else if (!isAdmin) {
    rows.push(["Comments", "Not shared by your school's evaluation policy."]);
  }
  openViewModal(ev.evaluation_period || "Performance evaluation", rows, isAdmin ? () => openEvaluationModal(body, container, teacher, ev) : null);
}
function openEvaluationModal(body, container, teacher, ev) {
  const isEdit = !!ev;
  const scores = ev?.scores || {};
  openModal(isEdit ? "Edit evaluation" : "New performance evaluation", `
    <div class="grid2">
      <div class="field"><label>Evaluation date</label><input id="f_edate" type="date" value="${ev?.evaluation_date || new Date().toISOString().slice(0,10)}"/></div>
      <div class="field"><label>Evaluation period</label><input id="f_period" value="${ev?.evaluation_period||''}"/></div>
    </div>
    <div class="field" style="font-weight:700;color:var(--navy-2);margin-top:6px;">Categories (score out of 5)</div>
    ${EVAL_CATEGORIES.map((c,i)=>`
      <div class="field"><label>${c}</label>
        <select id="f_cat${i}">
          <option value="">— Not scored —</option>
          ${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(scores[c])===n?'selected':''}>${n}/5</option>`).join("")}
        </select>
      </div>`).join("")}
    <div class="field" id="overallPreview" style="font-weight:700;color:var(--navy-2);"></div>
    <div class="field"><label>Strengths</label><textarea id="f_strengths" rows="2">${ev?.strengths||''}</textarea></div>
    <div class="field"><label>Areas for improvement</label><textarea id="f_areas" rows="2">${ev?.areas_for_improvement||''}</textarea></div>
    <div class="field"><label>Professional recommendation</label><textarea id="f_reco" rows="2">${ev?.recommendation||''}</textarea></div>
  `, async (ov) => {
    const newScores = {};
    EVAL_CATEGORIES.forEach((c,i) => { const v = val(ov,`f_cat${i}`); if (v !== "") newScores[c] = Number(v); });
    const overall_score = calcOverallScore(newScores);
    const payload = {
      teacher_id: teacher.id,
      evaluator_profile_id: profile?.id || null, evaluator_name: profile?.full_name || null,
      evaluation_date: val(ov,"f_edate") || new Date().toISOString().slice(0,10),
      evaluation_period: val(ov,"f_period") || null,
      scores: newScores, overall_score,
      strengths: val(ov,"f_strengths") || null, areas_for_improvement: val(ov,"f_areas") || null,
      recommendation: val(ov,"f_reco") || null,
      updated_at: new Date().toISOString(),
    };
    let saved;
    if (isEdit) { const rows = await dbUpdate("teacher_evaluations", ev.id, payload); saved = (rows && rows[0]) || Object.assign({}, ev, payload); }
    else { const rows = await dbInsert("teacher_evaluations", payload); saved = rows[0]; }
    await logEvalAudit(saved.id, isEdit ? "updated" : "created", saved);
    renderTeacherPerformance(body, container, teacher);
  }, { saveLabel: isEdit ? "Save changes" : "Save evaluation" });
  
  const updatePreview = () => {
    const s = {};
    EVAL_CATEGORIES.forEach((c,i) => { const sel = document.getElementById(`f_cat${i}`); if (sel && sel.value !== "") s[c] = Number(sel.value); });
    const overall = calcOverallScore(s);
    const previewEl = document.getElementById("overallPreview");
    if (previewEl) previewEl.textContent = overall != null ? `Overall score: ${overall}/5` : "Overall score: — (no categories scored yet)";
  };
  EVAL_CATEGORIES.forEach((c,i) => { const sel = document.getElementById(`f_cat${i}`); if (sel) sel.onchange = updatePreview; });
  updatePreview();
}

async function findOrCreateTeacherIdentity(fullName, nationalId, dob, gender, photoUrl) {
  const rows = await sb(`/rest/v1/rpc/find_or_create_teacher_identity`, { method:"POST", body: JSON.stringify({
    p_full_name: fullName, p_national_id_no: nationalId || null, p_date_of_birth: dob || null,
    p_gender: gender || null, p_photo_url: photoUrl || null,
  })});
  return Array.isArray(rows) ? rows[0] : rows;
}

async function searchTeacherIdentities(query) {

  return sb(`/rest/v1/rpc/search_teacher_identities`, { method:"POST", body: JSON.stringify({ p_query: query.trim() }) }).catch(()=>[]);
