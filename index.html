      const badges = `${isSelf ? `<span class="badge badge-green">This is You</span>` : ""}${isDeleted ? `<span class="badge badge-grey">Deleted</span>` : isSuspended ? `<span class="badge badge-amber">Suspended</span>` : ""}${!isDeleted && p.approval_status === "pending" ? ` <span class="badge badge-amber">Pending Approval</span>` : ""}${!isDeleted && p.approval_status === "rejected" ? ` <span class="badge badge-red">Rejected</span>` : ""}`;
      const row = el(`<div class="list-row" style="flex-wrap:wrap;${isDeleted?'opacity:.6;':''}${isSelf?'':'cursor:pointer;'}">
        ${avatarHtml(p.full_name, p.photo_url)}
        <div class="list-main">
          <div class="list-title">${p.full_name} ${badges}</div>
          <div class="list-sub">${roleLabel}</div>
          ${isSelf ? "" : `<div class="tiny-note" style="margin-top:2px;"></div>`}
        </div>
      </div>`);
      if (!isSelf) row.onclick = () => openAccountControls(p, container, deptOptions, posOptions);
      list.appendChild(row);
    });
    return;
  }

  if (sub === "departments") {
    body.innerHTML = `<h3 style="color:var(--navy-2);margin-bottom:4px;">Departments</h3><div class="tiny-note" style="margin-bottom:10px;"></div><div class="card" id="deptCards"></div>`;
    renderDeptCards(profiles, container);
    return;
  }

  if (sub === "pendingreqs") {
    body.innerHTML = `<h3 style="color:var(--navy-2);margin-bottom:4px;">Pending Requests</h3><div class="tiny-note" style="margin-bottom:10px;"></div><div class="card" id="reqList"></div>`;
    const reqList = document.getElementById("reqList");
    if (!pendingReqs.length) {
      reqList.innerHTML = `<div class="tiny-note">No pending requests.</div>`;
    } else {
      reqList.innerHTML = pendingReqs.map(r => `<div class="list-row" style="flex-wrap:wrap;align-items:flex-start;">
        <div class="list-main">
          <div class="list-title">${r.full_name || "Unknown"} <span class="badge badge-amber">${DEPARTMENTS[r.department]?.label || r.department || "No department"}</span></div>
          <div class="list-sub">${r.message}</div>
          <div class="list-sub">${new Date(r.created_at).toLocaleString()}</div>
        </div>
        <button class="btn btn-ghost btn-sm dismissBtn" data-id="${r.id}">Dismiss</button>
        <button class="btn btn-primary btn-sm doneBtn" data-id="${r.id}">${ic.check} Mark done</button>
      </div>`).join("");
      reqList.querySelectorAll(".doneBtn").forEach(btn => btn.onclick = safe(async () => {
        await dbUpdate("account_change_requests", btn.dataset.id, { status:"resolved", resolved_at:new Date().toISOString() });
        toast("Request marked as done.", false);
        renderUsers(container);
      }));
      reqList.querySelectorAll(".dismissBtn").forEach(btn => btn.onclick = safe(async () => {
        await dbUpdate("account_change_requests", btn.dataset.id, { status:"dismissed", resolved_at:new Date().toISOString() });
        toast("Request dismissed.", false);
        renderUsers(container);
      }));
    }
    return;
  }

  if (sub === "regcontrols") {
    body.innerHTML = `<h3 style="color:var(--navy-2);margin-bottom:4px;">Registration Controls</h3><div class="tiny-note" style="margin-bottom:10px;"></div><div class="card" id="regToggleCard" style="margin-bottom:16px;"></div><div class="tiny-note" style="margin-bottom:10px;"></div><div class="card" id="deptLockCard"></div>`;
    renderRegToggleCard();
    renderDeptLockCard();
    return;
  }
}

function openAccountControls(p, container, deptOptions, posOptions) {
  const isDeleted = !!p.deleted_at;
  const isSuspended = !!p.suspended_at;
  const overlay = el(`<div class="overlay"><div class="modal">
    <button class="modal-close">&times;</button>
    <h3>${p.full_name}</h3>
    <div class="tiny-note" style="margin-bottom:12px;">${p.phone||''}${p.username?` · @${p.username}`:''}</div>
    ${isDeleted ? `<div class="tiny-note" style="margin-bottom:10px;">This account has been deleted.</div>` : `
      <div class="field"><label>Department</label><select id="ctrlDept">${deptOptions(p.department)}</select></div>
      <div class="field"><label>Position</label><select id="ctrlPos">${posOptions(p.department, p.position)}</select></div>
      <div class="field"><label title="">Legacy role</label>
        <select id="ctrlRole">${["admin","teacher","accountant","staff"].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${r}</option>`).join("")}</select>
      </div>
      ${p.role === "teacher" ? `<div class="field"><label>Linked Staff record</label><select id="ctrlLinkedTeacher"><option value="">Loading…</option></select>
        
      </div>` : ""}
    `}
    <div class="form-actions" style="flex-wrap:wrap;">
      <button class="btn btn-ghost" id="modalCancel">Close</button>
      ${isDeleted
        ? `<button class="btn btn-primary" id="recoverBtn">${ic.check} Recover account</button>`
        : `<button class="btn btn-ghost" id="suspendBtn">${isSuspended ? ic.check+' Unsuspend' : ic.keyLock+' Suspend'}</button>
           <button class="btn btn-ghost" id="deleteBtn" style="color:var(--red);">${ic.trash} Delete</button>`}
    </div>
  </div></div>`);
  document.body.appendChild(overlay);
  enableModalKeyboardHandling(overlay);
  const close = () => overlay.remove();
  overlay.querySelector(".modal-close").onclick = close;
  overlay.querySelector("#modalCancel").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  const refresh = () => { close(); renderUsers(container); };
  if (!isDeleted) {
    const deptSel = overlay.querySelector("#ctrlDept");
    const posSel = overlay.querySelector("#ctrlPos");
    deptSel.onchange = safe(async (e) => {
      const newDept = e.target.value || null;
      posSel.innerHTML = posOptions(newDept, null);
      await dbUpdate("profiles", p.id, { department: newDept, position: null });
      toast(`${p.full_name}'s department updated.`, false);
    });
    posSel.onchange = safe(async (e) => {
      await dbUpdate("profiles", p.id, { position: e.target.value || null });
      toast(`${p.full_name}'s position updated.`, false);
    });
    overlay.querySelector("#ctrlRole").onchange = safe(async (e) => {
      await dbUpdate("profiles", p.id, { role: e.target.value });
      toast(`${p.full_name}'s role updated.`, false);
    });
    const linkedSel = overlay.querySelector("#ctrlLinkedTeacher");
    if (linkedSel) {
      dbSelectActive("teachers", { order:"full_name.asc" }).then(teacherList => {
        linkedSel.innerHTML = `<option value="">— Not linked —</option>` +
          teacherList.map(t=>`<option value="${t.id}" ${p.linked_teacher_id===t.id?'selected':''}>${t.full_name}${t.nova_teacher_id?(' · '+t.nova_teacher_id):''}</option>`).join("");
      }).catch(()=>{ linkedSel.innerHTML = `<option value="">Couldn't load Staff list</option>`; });
      linkedSel.onchange = safe(async (e) => {
        await dbUpdate("profiles", p.id, { linked_teacher_id: e.target.value || null });
        toast(`${p.full_name}'s linked Staff record updated.`, false);
      });
    }
    overlay.querySelector("#suspendBtn").onclick = safe(async () => {
      if (isSuspended) {
        await dbUpdate("profiles", p.id, { suspended_at: null });
        toast(`${p.full_name}'s account unsuspended.`, false);
      } else {
        if (!(await customConfirm(`Suspend ${p.full_name}? They won't be able to log in until you unsuspend them.`, { danger:true, okLabel:"Suspend" }))) return;
        await dbUpdate("profiles", p.id, { suspended_at: new Date().toISOString() });
        toast(`${p.full_name}'s account suspended.`, false);
      }
      refresh();
    });
    overlay.querySelector("#deleteBtn").onclick = safe(async () => {
      if (!(await customConfirm(`Delete ${p.full_name}'s account? You can recover it later from this page.`, { danger:true, okLabel:"Delete" }))) return;
      await dbUpdate("profiles", p.id, { deleted_at: new Date().toISOString() });
      toast(`${p.full_name}'s account deleted.`, false);
      refresh();
    });
  } else {
    overlay.querySelector("#recoverBtn").onclick = safe(async () => {
      if (!(await customConfirm(`Restore ${p.full_name}'s account?`))) return;
      await dbUpdate("profiles", p.id, { deleted_at: null });
      toast(`${p.full_name}'s account restored.`, false);
      refresh();
    });
  }
}

  overlay.querySelector(".modal-close").onclick = close;
  overlay.querySelector("#modalCancel").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  const suspendBtn = overlay.querySelector("#suspendDeptBtn");
  const deleteBtn = overlay.querySelector("#deleteDeptBtn");

    await Promise.all(actionable.map(p => dbUpdate("profiles", p.id, { suspended_at: new Date().toISOString() })));
    toast(`${dept.label} suspended.`, false);

    toast(`${dept.label} deleted.`, false);
    close(); renderUsers(container);
  });
}

function openTransferOwnershipModal(profiles, container) {
  const candidates = profiles.filter(p => p.department === "administration" && p.id !== profile.id && !p.deleted_at && !p.suspended_at);
  const overlay = el(`<div class="overlay"><div class="modal">

      <div class="field"><label>New owner</label><select id="newOwnerSel">${candidates.map(p=>`<option value="${p.id}">${p.full_name}${p.username?` (@${p.username})`:""}</option>`).join("")}</select></div>

    `}
    <div class="form-actions">

      ${candidates.length ? `<button class="btn btn-primary" id="confirmTransferBtn">Transfer</button>` : ""}

  document.body.appendChild(overlay);
  enableModalKeyboardHandling(overlay);
  const close = () => overlay.remove();
  overlay.querySelector(".modal-close").onclick = close;
  overlay.querySelector("#modalCancel").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  const confirmBtn = overlay.querySelector("#confirmTransferBtn");
  if (confirmBtn) confirmBtn.onclick = safe(async () => {
    const newOwnerId = val(overlay, "newOwnerSel");
    const pw = val(overlay, "ownerConfirmPw");
    if (!pw) { toast("Enter your password to confirm.", true); return; }
    const chosen = candidates.find(p => p.id === newOwnerId);

    profile.is_owner = false;
    toast("Ownership transferred.", false);

  });

      `}

}
async function wirePushNotifCard(container) {
  const toggle = container.querySelector("#staffPushToggle");
  if (!toggle) return;
  const msg = container.querySelector("#staffPushMsg");
  try {
    const existing = await getExistingStaffPushSubscription();
    toggle.checked = !!existing;
  } catch (e) {}
  toggle.onchange = async () => {
    msg.innerHTML = "";
    toggle.disabled = true;
    try {
      if (toggle.checked) { await subscribeStaffPush(); msg.innerHTML = `<div class="msg-ok">Push notifications enabled on this device.</div>`; }
      else { await unsubscribeStaffPush(); msg.innerHTML = `<div class="tiny-note">Push notifications turned off for this device.</div>`; }
    } catch (e) {
      toggle.checked = !toggle.checked;
      msg.innerHTML = `<div class="err">${e.message}</div>`;
    }
    toggle.disabled = false;
  };
}

async function renderTrash(container) {
  setActiveRefresh(() => renderTrash(container));
  container.innerHTML = `<h3 style="color:var(--slate);margin-bottom:10px;">Trash</h3><div class="section-head"><div style="font-size:13px;color:var(--ink-soft);">Items stay here until restored or permanently deleted.</div><button class="btn btn-ghost btn-sm" id="emptyBtn">${ic.trash} Empty trash</button></div><div id="trashList"><div class="center-loading">Loading…</div></div>`;
  const listEl = document.getElementById("trashList");
  let allTrashed = [];
  await Promise.all(TRASH_TABLES.map(async (t) => {
    try {
      const rows = await dbSelect(t.table, { deleted_at:"not.is.null", order:"deleted_at.desc" });
      rows.forEach(r => allTrashed.push({ ...t, row:r }));
    } catch(e) {  }
  }));
  allTrashed.sort((a,b) => new Date(b.row.deleted_at) - new Date(a.row.deleted_at));
  if (!allTrashed.length) { listEl.innerHTML = emptyState("Trash is empty."); document.getElementById("emptyBtn").style.display="none"; return; }
  listEl.innerHTML = `<div class="card" id="list"></div>`;
  const list = document.getElementById("list");
  allTrashed.forEach(item => {
    const name = item.row[item.nameField] || "Untitled";
    const row = el(`<div class="list-row"><div class="avatar">${item.icon}</div>
      <div class="list-main"><div class="list-title">${name}</div>
      <div class="list-sub">${item.label} · deleted ${new Date(item.row.deleted_at).toLocaleDateString()}</div></div></div>`);
    row.onclick = () => openActionSheet([
      { label:"Restore", icon:ic.edit, onClick: safe(async()=>{ await restoreRecord(item.table, item.row.id); toast(`${name} restored.`, false); renderTrash(container); }) },
      { label:"Delete permanently", icon:ic.trash, danger:true, onClick: () => { customConfirm(`Permanently delete "${name}"? This cannot be undone.`, { danger:true, okLabel:"Delete permanently" }).then(ok => { if (ok) safe(async()=>{ await dbDelete(item.table, item.row.id); renderTrash(container); })(); }); } },
    ]);
    list.appendChild(row);
  });
  document.getElementById("emptyBtn").onclick = async () => {
    if (!(await customConfirm(`Permanently delete all ${allTrashed.length} item(s) in trash? This cannot be undone.`, { danger:true, okLabel:"Delete all" }))) return;
    safe(async () => {
      for (const item of allTrashed) { await dbDelete(item.table, item.row.id); }
      toast("Trash emptied.", false);
      renderTrash(container);
    })();
  };
}

function activityRoleBadge(role) {

function csvCell(v) {
  const s = v === null || v === undefined ? "" : String(v);
  return `"${s.replace(/"/g,'""')}"`;
}
function downloadTextFile(filename, text, mime) {
  const blob = new Blob([text], { type: mime || "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function loadActivityLog(filters) {
  const params = { select:"*", order:"created_at.desc", limit:"300" };
  if (filters.tableFilter) params.table_name = `eq.${filters.tableFilter}`;
  if (filters.actionFilter) params.action = `eq.${filters.actionFilter}`;
  if (filters.q) params.description = `ilike.*${filters.q.replace(/[%*,]/g,"")}*`;
  let path = `/rest/v1/activity_log?${qs(scopedParams("activity_log", params))}`;
  if (filters.from) path += `&created_at=gte.${filters.from}T00:00:00`;
  if (filters.to) path += `&created_at=lte.${filters.to}T23:59:59`;
  return await sb(path);
}

            <option value="update">Updated</option>

    <div class="row" style="gap:8px;margin-bottom:10px;flex-wrap:wrap;">

  const moduleSel = document.getElementById("alModule");
  Object.keys(ACTIVITY_LOG_TABLE_LABELS).sort((a,b)=>ACTIVITY_LOG_TABLE_LABELS[a].localeCompare(ACTIVITY_LOG_TABLE_LABELS[b])).forEach(t => {
    moduleSel.appendChild(el(`<option value="${t}">${ACTIVITY_LOG_TABLE_LABELS[t]}</option>`));
  });

  function selectedOrAllRows() {
    if (state.selected.size) return state.rows.filter(r => state.selected.has(r.id));
    return state.rows;
  }
  function rowsToCsv(rows) {
    const header = ["Date","Time","User","Role","Action","Module","Record ID","Description"];
    const lines = [header.map(csvCell).join(",")];
    rows.forEach(r => {
      const dt = new Date(r.created_at);
      lines.push([
        isNaN(dt.getTime()) ? "" : dt.toLocaleDateString(),
        isNaN(dt.getTime()) ? "" : dt.toLocaleTimeString(),
        r.actor_name || "", r.actor_role || "", ACTIVITY_ACTION_LABELS[r.action] || r.action || "",
        activityLogLabel(r.table_name), r.record_id || "", r.description || "",
      ].map(csvCell).join(","));
    });
    return lines.join("\r\n");
  }
  function showDetail(r) {
    const dt = new Date(r.created_at);
    let detailsHtml = "";
    if (r.details) {
      try { detailsHtml = `<pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--slate-tint);padding:10px;border-radius:8px;max-height:240px;overflow:auto;">${JSON.stringify(JSON.parse(r.details), null, 2)}</pre>`; }
      catch(e) { detailsHtml = ""; }
    }
    openViewModal("Activity Detail", [
      ["When", isNaN(dt.getTime()) ? r.created_at : dt.toLocaleString()],
      ["User", r.actor_name],
      ["Role", r.actor_role],
      ["Action", ACTIVITY_ACTION_LABELS[r.action] || r.action],
      ["Module", activityLogLabel(r.table_name)],
      ["Record ID", r.record_id],
      ["Description", r.description],
      ["Details", detailsHtml || null],
    ]);
  }

  async function load() {
    const listEl = document.getElementById("alList");
    listEl.innerHTML = `<div class="center-loading">Loading…</div>`;
    let rows = [];
    try { rows = await loadActivityLog(state); } catch (e) { listEl.innerHTML = `<div class="err">${e.message}</div>`; return; }
    state.rows = rows; state.selected.clear();
    if (!rows.length) { listEl.innerHTML = emptyState("No activity recorded yet for these filters."); return; }
    listEl.innerHTML = `${rows.length >= 300 ? `<div class="tiny-note" style="margin-bottom:8px;">Showing the latest 300 matching entries — narrow the filters above to see more.</div>` : ""}<div class="card" id="alListCard"></div>`;
    const listCard = document.getElementById("alListCard");
    rows.forEach(r => {
      const dt = new Date(r.created_at);
      const row = el(`<div class="list-row">
        <input type="checkbox" class="al-check" data-id="${r.id}" style="margin-right:10px;width:18px;height:18px;flex-shrink:0;"/>
        <div class="avatar">${ic.clock}</div>
        <div class="list-main">
          <div class="list-title">${r.description || activityLogLabel(r.table_name)}</div>
          <div class="list-sub">${r.actor_name || "Unknown"}${r.actor_role ? " · "+r.actor_role : ""} · ${isNaN(dt.getTime())?"":dt.toLocaleString()}</div>
        </div>
        ${activityRoleBadge(ACTIVITY_ACTION_LABELS[r.action] || r.action)}
      </div>`);
      row.querySelector(".al-check").onclick = (e) => {
        e.stopPropagation();
        if (e.target.checked) state.selected.add(r.id); else state.selected.delete(r.id);
      };
      row.onclick = (e) => { if (e.target.classList.contains("al-check")) return; showDetail(r); };
      listCard.appendChild(row);
    });
  }

  document.getElementById("alModule").onchange = (e) => { state.tableFilter = e.target.value; load(); };
  document.getElementById("alAction").onchange = (e) => { state.actionFilter = e.target.value; load(); };
  document.getElementById("alFrom").onchange = (e) => { state.from = e.target.value; load(); };
  document.getElementById("alTo").onchange = (e) => { state.to = e.target.value; load(); };
  let searchTimer = null;
  document.getElementById("alSearch").oninput = (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value;
    searchTimer = setTimeout(() => { state.q = q; load(); }, 350);
  };
  document.getElementById("alSelectAll").onclick = () => {
    state.rows.forEach(r => state.selected.add(r.id));
    document.querySelectorAll(".al-check").forEach(c => c.checked = true);
  };
  document.getElementById("alClearSel").onclick = () => {
    state.selected.clear();
    document.querySelectorAll(".al-check").forEach(c => c.checked = false);
  };
  document.getElementById("alDownload").onclick = () => {
    const rows = selectedOrAllRows();
    if (!rows.length) { toast("Nothing to download."); return; }
    const stamp = new Date().toISOString().slice(0,10);
    downloadTextFile(`activity-log-${stamp}.csv`, rowsToCsv(rows), "text/csv");
  };
  load();
}

function makeFabDraggable(fab, onTap) {
  fab.style.touchAction = "none"; 
  fab.draggable = false; 
  let startX = 0, startY = 0, origLeft = 0, origBottom = 0, fabW = 0, fabH = 0, moved = false;
  let pendingLeft = null, pendingBottom = null, rafId = null;
  const DRAG_TOL = 8;
  const applyPosition = () => {
    rafId = null;
    fab.style.left = pendingLeft + "px";
    fab.style.right = "auto";
    fab.style.bottom = pendingBottom + "px";
  };
  fab.addEventListener("pointerdown", (e) => {
    moved = false;
    startX = e.clientX; startY = e.clientY;
    const rect = fab.getBoundingClientRect();
    origLeft = rect.left;
    origBottom = window.innerHeight - rect.bottom;
    fabW = rect.width; fabH = rect.height; 
    fab.setPointerCapture(e.pointerId);
  });
  fab.addEventListener("pointermove", (e) => {
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > DRAG_TOL || Math.abs(dy) > DRAG_TOL) moved = true;
    if (moved) {
      pendingLeft = Math.min(window.innerWidth - fabW - 6, Math.max(6, origLeft + dx));
      
      
      pendingBottom = Math.min(window.innerHeight - fabH - 6, Math.max(6, origBottom - dy));
      if (rafId === null) rafId = requestAnimationFrame(applyPosition); 
    }
  });
  fab.addEventListener("pointerup", () => {
    if (rafId !== null) { cancelAnimationFrame(rafId); applyPosition(); }
    if (!moved) onTap();
  });
  return fab;
}

function addFab(container, onClick) {
  const fab = el(`<button type="button" class="fab">${ic.plus}</button>`);
  container.appendChild(fab);
  makeFabDraggable(fab, onClick);
  return fab;
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }

// Live-search helper for search boxes that trigger a server refresh as you type.
// Fixes: (1) losing what you typed if the refresh takes a moment — the input is
// never torn down mid-keystroke; (2) an older, slower server reply overwriting a
// newer one — replies are tagged with a generation number and stale ones are
// dropped; (3) "cannot set properties of null" — handlers are only re-attached
// to elements that still exist once the refresh finishes.
function bindLiveSearch(inputEl, container, runFn, ms = 350) {
  if (!inputEl) return;
  const inputId = inputEl.id;
  inputEl.oninput = (e) => {
    const val = e.target.value;
    clearTimeout(container.__searchTimer);
    container.__searchTimer = setTimeout(async () => {
      const active = document.activeElement;
      const wasFocused = !!(active && active.id === inputId);
      const selStart = wasFocused ? active.selectionStart : null;
      const selEnd = wasFocused ? active.selectionEnd : null;
      await runFn(val);
      if (wasFocused) {
        const freshInput = document.getElementById(inputId);
        if (freshInput) {
          freshInput.focus();
          try { freshInput.setSelectionRange(selStart, selEnd); } catch (_) {}
        }
      }
    }, ms);
  };
}
// Call at the top of an async render function that can be re-triggered mid-flight
// (e.g. by fast typing). Returns a token; check isStaleSearch(container, token)
// right after any `await` and bail out before touching the DOM if it's stale.
function beginSearchGen(container) { return (container.__searchGen = (container.__searchGen || 0) + 1); }
function isStaleSearch(container, token) { return container.__searchGen !== token; }

function toast(msg, isError=true) {
  const t = el(`<div style="position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:${isError?'#D6564F':'#2E9E7C'};color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 10px 28px rgba(0,0,0,.25);max-width:90%;text-align:center;">${msg}</div>`);
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .3s"; t.style.opacity="0"; setTimeout(()=>t.remove(),300); }, 3000);
}

function safe(fn) {
  return async (...args) => {
    try { await fn(...args); }
    catch (e) { toast(e.message || "Something went wrong. Please try again."); console.error(e); }
  };
}
window.addEventListener("unhandledrejection", (e) => {
  toast((e.reason && e.reason.message) || "Something went wrong. Please try again.");
  console.error(e.reason);
});
window.addEventListener("error", (e) => { console.error(e.error || e.message); });

let activeDateCal = null;
let activeDateInput = null;

function closeDateCalendar() {
  if (activeDateCal) { activeDateCal.remove(); activeDateCal = null; }
  document.removeEventListener("mousedown", onDateCalOutsideClick, true);
  document.removeEventListener("keydown", onDateCalKeydown, true);
  window.removeEventListener("resize", closeDateCalendar);
  window.removeEventListener("scroll", closeDateCalendar, true);
  activeDateInput = null;
}
function onDateCalOutsideClick(e) {
  if (activeDateCal && !activeDateCal.contains(e.target) && e.target !== activeDateInput) closeDateCalendar();
}
function onDateCalKeydown(e) { if (e.key === "Escape") closeDateCalendar(); }

function openDateCalendar(inputEl) {
  if (activeDateInput === inputEl) return; 
  closeDateCalendar();
  activeDateInput = inputEl;

  const todayD = new Date();
  const parsed = inputEl.value ? new Date(inputEl.value + "T00:00:00") : null;
  let viewYear = (parsed && !isNaN(parsed)) ? parsed.getFullYear() : todayD.getFullYear();
  let viewMonth = (parsed && !isNaN(parsed)) ? parsed.getMonth() : todayD.getMonth();
  let selectedIso = inputEl.value || null;

  const pop = document.createElement("div");
  pop.className = "date-cal-popup";
  document.body.appendChild(pop);
  activeDateCal = pop;

  const pad = n => String(n).padStart(2, "0");
  const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const todayIso = iso(todayD.getFullYear(), todayD.getMonth(), todayD.getDate());

  function position() {
    const r = inputEl.getBoundingClientRect();
    const w = pop.offsetWidth || 288, h = pop.offsetHeight || 320;
    let left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    let top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  function draw() {
    const first = new Date(viewYear, viewMonth, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const monthName = first.toLocaleString("default", { month: "long" });
    let cells = "";
    for (let i = 0; i < startDow; i++) cells += `<div class="dc-cell dc-empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dStr = iso(viewYear, viewMonth, d);
      const cls = ["dc-cell", "dc-day"];
      if (dStr === selectedIso) cls.push("dc-selected");
      if (dStr === todayIso) cls.push("dc-today");
      cells += `<div class="${cls.join(' ')}" data-date="${dStr}">${d}</div>`;
    }
    pop.innerHTML = `
      <div class="dc-header">
        <button type="button" class="dc-nav" id="dcPrev">&#8249;</button>
        <div class="dc-title">${monthName} ${viewYear}</div>
        <button type="button" class="dc-nav" id="dcNext">&#8250;</button>
      </div>
      <div class="dc-grid dc-dow"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
      <div class="dc-grid">${cells}</div>
      <div class="dc-footer">
        <button type="button" class="dc-link" id="dcToday">Today</button>
        <button type="button" class="dc-link dc-danger" id="dcClear">Clear</button>
      </div>`;
    pop.querySelectorAll(".dc-day").forEach(cell => {
      cell.onclick = () => choose(cell.dataset.date);
    });
    pop.querySelector("#dcPrev").onclick = () => { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } draw(); position(); };
    pop.querySelector("#dcNext").onclick = () => { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } draw(); position(); };
    pop.querySelector("#dcToday").onclick = () => { viewYear = todayD.getFullYear(); viewMonth = todayD.getMonth(); choose(todayIso); };
    pop.querySelector("#dcClear").onclick = () => choose("");
  }

  function choose(dStr) {
    selectedIso = dStr || null;
    inputEl.value = dStr;
    inputEl.dispatchEvent(new Event("input", { bubbles: true }));
    inputEl.dispatchEvent(new Event("change", { bubbles: true }));
    closeDateCalendar();
  }

  draw();
  position();
  setTimeout(() => {
    document.addEventListener("mousedown", onDateCalOutsideClick, true);
    document.addEventListener("keydown", onDateCalKeydown, true);
    window.addEventListener("resize", closeDateCalendar);
    window.addEventListener("scroll", closeDateCalendar, true);
  }, 0);
}

document.addEventListener("focusin", (e) => { if (e.target.matches && e.target.matches("input.datefield")) openDateCalendar(e.target); });

document.addEventListener("wheel", (e) => {
  const row = e.target.closest && e.target.closest(".pill-row");
  if (!row || row.scrollWidth <= row.clientWidth) return;
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; 
  row.scrollLeft += e.deltaY;
  e.preventDefault();
}, { passive: false });

  renderBootLoader(); // shown immediately so nothing white/blank ever appears
  startHeaderClock(); 
  await Promise.all([loadSchoolSettings(), tryRestoreRememberedSession()]);
  if (typeof sb === "function") { sb(`/rest/v1/rpc/purge_expired_trashed_schools`, { method:"POST", body: JSON.stringify({}) }).catch(() => {}); } 
  render(); // lands straight on the dashboard (home)
})();

</script>
