<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
    --navy:#16274A;
    --navy-2:#1E3563;
    --teal:#2E9E7C;
    --teal-dark:#227A61;
    --teal-tint:#E4F5EE;
    --amber:#E2A33D;
    --amber-dark:#A06A13;
    --amber-tint:#FDF1DE;
    --red:#D6564F;
    --red-tint:#FDECEC;
    --sky:#3E8EDE;
    --sky-tint:#E7F1FC;
    --purple:#7C6FE0;
    --purple-tint:#EFEDFC;
    --indigo:#5B5FCF;
    --indigo-tint:#ECEDFA;
    --slate:#6B7688;
    --slate-tint:#EEF1F5;
    --bg:#EEF2F9;
    --card:#FFFFFF;
    --card-alt:#F7F9FD;
    --ink:#1D2433;
    --ink-soft:#5B647A;
    --line:#E4E8EF;
    --radius:14px;
  }
  @keyframes fadeSlideDown{0%{opacity:0;transform:translateY(-8px);}100%{opacity:1;transform:translateY(0);}}
  @keyframes popScale{0%{opacity:0;transform:scale(.85);}100%{opacity:1;transform:scale(1);}}
  @keyframes slideInLeft{0%{opacity:0;transform:translateX(-14px);}100%{opacity:1;transform:translateX(0);}}
  @keyframes wiggleIn{0%{opacity:0;transform:rotate(-4deg) translateY(-6px);}100%{opacity:1;transform:rotate(0) translateY(0);}}
  @keyframes riseIn{0%{opacity:0;transform:translateY(10px) scale(.96);}100%{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes sheetUp{0%{opacity:0;transform:translateY(24px);}100%{opacity:1;transform:translateY(0);}}
  .pageTitleAnim{display:inline-block;}
  .action-sheet-overlay{position:fixed;inset:0;background:rgba(22,39,74,.35);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
  .action-sheet{background:#fff;width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));animation:sheetUp .18s ease;}
  @media(min-width:860px){.action-sheet-overlay{align-items:center;}.action-sheet{border-radius:16px;}}
  .action-sheet .as-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:2px auto 10px;}
  .action-sheet button{width:100%;text-align:left;padding:13px 14px;border-radius:10px;border:none;background:none;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;color:var(--ink);}
  .action-sheet button:hover{background:var(--card-alt);}
  .action-sheet button.as-danger{color:var(--red);}
  .action-sheet button.as-cancel{color:var(--ink-soft);margin-top:4px;border-top:1px solid var(--line);border-radius:0;}
  .view-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .view-row:last-child{border-bottom:none;}
  .view-row .vlabel{color:var(--ink-soft);font-weight:600;}
  .view-row .vvalue{color:var(--ink);font-weight:700;text-align:right;}
  .list-row{cursor:pointer;-webkit-user-select:none;user-select:none;}
  .list-row:active{background:var(--card-alt);}
  .trash-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  *{box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  body{margin:0;position:fixed;inset:0;width:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
  #app{display:block;}
  h1,h2,h3{font-weight:700;letter-spacing:-0.02em;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:#c9d0dc;border-radius:10px;}

  /* ---------- LOGIN ---------- */
  @keyframes gradientFlow{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
  .login-wrap{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 35%,var(--sky) 65%,var(--navy) 100%);background-size:300% 300%;animation:gradientFlow 14s ease infinite;padding:20px;}
  .login-card{background:var(--card);border-radius:20px;padding:36px 28px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 20px 60px rgba(10,20,50,.35);margin:auto;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;}
  .brand-badge{width:42px;height:42px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;overflow:hidden;}
  .brand-name{font-size:19px;font-weight:800;color:var(--navy);}
  .brand-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  /* ---- Auth form switching (login / signup / forgot): the whole form+footer
     block is re-inserted fresh on every mode change, so a CSS animation on it
     plays automatically each time — direction is picked in JS to feel like
     forward/back navigation rather than a generic fade. ---- */
  @keyframes authSlideLeftIn{0%{opacity:0;transform:translateX(22px);}100%{opacity:1;transform:translateX(0);}}
  @keyframes authSlideRightIn{0%{opacity:0;transform:translateX(-22px);}100%{opacity:1;transform:translateX(0);}}
  @keyframes authFadeUpIn{0%{opacity:0;transform:translateY(12px);}100%{opacity:1;transform:translateY(0);}}
  .auth-switch{animation-duration:.32s;animation-timing-function:cubic-bezier(.22,.85,.32,1);animation-fill-mode:both;}
  /* ---- Auth footer: every "switch mode" link lives in one consistent block
     below the form, separated by a divider, instead of scattered tiny-notes ---- */
  .auth-footer{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px;align-items:center;text-align:center;}
  .auth-footer-row{font-size:12.5px;color:var(--ink-soft);}
  .auth-footer-row.muted{font-size:11.5px;opacity:.85;}
  .auth-footer .link-btn{margin-left:4px;}
  .auth-forgot-row{text-align:right;margin-top:-6px;margin-bottom:2px;}
  /* ---- Full-screen status states: pending approval / suspended / deleted ---- */
  .status-badge-lg{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;}
  .status-badge-lg.tone-amber{background:var(--amber-tint);color:var(--amber-dark);}
  .status-badge-lg.tone-red{background:var(--red-tint);color:var(--red);}
  .status-badge-lg.tone-slate{background:var(--slate-tint);color:var(--slate);}
  .status-badge-lg svg{width:28px;height:28px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;background:#FAFBFD;outline:none;transition:border-color .15s;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);background:#fff;}
  .pwd-wrap{position:relative;}
  .pwd-wrap input{padding-right:42px;}
  .pwd-toggle{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:none;background:transparent;cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;border-radius:8px;opacity:.55;transition:opacity .15s,background .15s;}
  .pwd-toggle:hover{opacity:1;background:var(--card-alt);}
  .pwd-toggle.on{opacity:1;}
  input[type="time"],input[type="datetime-local"]{ color-scheme: light; }
  input[type="time"]::-webkit-calendar-picker-indicator,
  input[type="datetime-local"]::-webkit-calendar-picker-indicator{
    background-color: var(--teal);
    border-radius:6px;
    padding:5px;
    cursor:pointer;
    opacity:1;
    filter: brightness(0) invert(1);
  }

  /* ---------- CUSTOM DATE PICKER (fully app-styled, replaces native OS date picker
     so the "Set/Cancel" buttons are ours to colour, not the phone OS's) ---------- */
  input.datefield{
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%232E9E7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>');
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:18px 18px;
    padding-right:38px;
    cursor:pointer;
    caret-color:transparent;
  }
  input.datefield::placeholder{color:var(--ink-soft);}
  .date-cal-popup{
    position:fixed;z-index:500;background:#fff;border-radius:16px;
    box-shadow:0 16px 44px rgba(16,30,60,.28);border:1px solid var(--line);
    padding:14px;width:288px;animation:riseIn .14s ease;
  }
  /* ---------- TYPED DATE-OF-BIRTH INPUT (Day / Month / Year boxes) ----------
     Day/Month only ever need 2 digits, Year needs 4 — so the Year box (3rd
     child: see dobFieldHtml's Day, Month, Year order) is given noticeably
     more flex than the other two instead of splitting the row evenly. */
  .dob-input{display:flex;gap:8px;}
  .dob-input input{flex:1;min-width:0;padding:11px 8px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;background:#FAFBFD;outline:none;transition:border-color .15s;text-align:center;}
  .dob-input input:focus{border-color:var(--teal);background:#fff;}
  .dob-input input::-webkit-outer-spin-button,.dob-input input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .dob-input input[type="number"]{-moz-appearance:textfield;}
  .dob-input input:nth-child(3){flex:1.7;}

  /* ---------- CHAT WITH PARENT ---------- */
  .chat-icon-btn{border:none;background:var(--teal-tint);color:var(--teal-dark);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:4px;}
  .chat-icon-btn:hover{background:var(--teal);color:#fff;}
  .chat-modal{display:flex;flex-direction:column;max-height:82vh;}
  .chat-log{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;padding:6px 2px;margin:10px 0;min-height:180px;max-height:50vh;}
  .chat-bubble{max-width:78%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.4;word-wrap:break-word;}
  .chat-bubble.chat-in{align-self:flex-start;background:var(--card-alt);color:var(--ink);border-bottom-left-radius:4px;}
  .chat-bubble.chat-out{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px;}
  .chat-bubble .chat-meta{font-size:10.5px;opacity:.7;margin-top:3px;}
  .chat-input-row{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:10px;}
  .chat-input-row textarea{flex:1;resize:none;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:14px;background:#FAFBFD;outline:none;max-height:90px;}
  .chat-input-row textarea:focus{border-color:var(--teal);background:#fff;}
  .chat-input-row .btn{flex-shrink:0;}
  .dc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .dc-title{font-size:14.5px;font-weight:800;color:var(--navy);}
  .dc-nav{background:var(--teal-tint);color:var(--teal-dark);border:none;width:30px;height:30px;border-radius:9px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;}
  .dc-nav:hover{background:var(--teal);color:#fff;}
  .dc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .dc-dow{margin-bottom:4px;}
  .dc-dow div{font-size:11px;font-weight:700;color:var(--ink-soft);text-align:center;padding:4px 0;}
  .dc-cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink);border-radius:9px;cursor:pointer;}
  .dc-cell.dc-day:hover{background:var(--teal-tint);}
  .dc-cell.dc-today{color:var(--teal-dark);box-shadow:inset 0 0 0 1.5px var(--teal);}
  .dc-cell.dc-selected{background:var(--teal);color:#fff;box-shadow:none;}
  .dc-cell.dc-empty{cursor:default;}
  .dc-footer{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .dc-link{background:none;border:none;color:var(--teal-dark);font-weight:700;font-size:12.5px;padding:6px 8px;border-radius:8px;}
  .dc-link:hover{background:var(--teal-tint);}
  .dc-link.dc-danger{color:var(--red);}
  .dc-link.dc-danger:hover{background:var(--red-tint);}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s, transform .1s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--teal);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:var(--teal-tint);color:var(--teal-dark);border:1.5px solid var(--teal);}
  .btn-ghost:hover{background:var(--teal);color:#fff;}
  .btn-danger{background:#fde8e7;color:var(--red);}
  .btn-sm{padding:8px 12px;font-size:13px;}
  .confirm-box{max-width:340px;text-align:center;}
  .confirm-msg{font-size:14.5px;color:var(--ink);line-height:1.55;margin-bottom:18px;white-space:pre-wrap;}
  .confirm-box .form-actions{margin-top:0;}
  .link-btn{background:none;border:none;color:var(--teal-dark);font-weight:600;font-size:13.5px;padding:0;}
  .err{background:#fdecec;color:var(--red);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;}
  .msg-ok{background:#e9f7f1;color:var(--teal-dark);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;}
  .tiny-note{font-size:11.5px;color:var(--ink-soft);margin-top:16px;line-height:1.5;text-align:center;}

  /* ---------- SHELL ---------- */
  .shell{display:flex;height:100vh;height:100dvh;overflow:hidden;}
  .sidebar{width:230px;background:linear-gradient(200deg,var(--navy) 0%,var(--navy-2) 45%,#274b8a 100%);background-size:250% 250%;animation:gradientFlow 18s ease infinite;color:#fff;flex-direction:column;padding:22px 14px;position:fixed;top:0;bottom:0;left:0;display:none;z-index:40;}
  .sidebar .brand-name{color:#fff;}
  .sidebar .brand-sub{color:#9fb0d6;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:10px;color:#c7d3ee;font-size:14px;font-weight:600;margin-bottom:3px;transition:background .2s ease,color .2s ease,box-shadow .2s ease;}
  .nav-item svg{opacity:.9;flex-shrink:0;}
  .nav-item.active{background:var(--teal);color:#fff;box-shadow:0 4px 12px rgba(46,158,124,.35);}
  .nav-item:not(.active):hover{background:rgba(255,255,255,.08);color:#fff;}
  .main{flex:1;margin-left:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:20;box-shadow:0 1px 0 rgba(22,39,74,.03);}
  .topbar h1{font-size:19px;color:var(--navy);}
  .topbar .who{font-size:12.5px;color:var(--ink-soft);}
  @media(max-width:859px){.topbar{display:none;}}
  .content{padding:16px;padding-bottom:98px;max-width:1100px;margin:0 auto;width:100%;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}

  .bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow-x:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(22,39,74,.05);}
  .bn-item{flex:1 0 auto;min-width:64px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;color:var(--ink-soft);font-size:10.5px;font-weight:600;border-radius:10px;transition:background .25s ease,color .25s ease,transform .25s ease;}
  .bn-item.active{color:var(--teal-dark);background:var(--teal-tint);transform:translateY(-2px);}
  .bn-item svg{flex-shrink:0;transition:transform .25s ease;}
  .bn-item.active svg{transform:scale(1.08);}
  .bn-icon-wrap{position:relative;display:inline-flex;}
  .nav-badge-count{position:absolute;top:-6px;right:-9px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;line-height:1;min-width:15px;height:15px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px;box-shadow:0 0 0 2px #fff;animation:popScale .25s ease;}
  .nav-item .nav-badge-count{position:static;margin-left:auto;min-width:18px;height:18px;font-size:11px;box-shadow:none;}
  /* Rows inside the mobile "More" sheet (openMoreSheet) — same shape as .nav-item,
     but for a light modal card instead of the dark sidebar, so hover/active states
     don't turn the text white-on-white. */
  .more-sheet-item{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:10px;color:var(--navy-2);font-size:14.5px;font-weight:600;margin-bottom:3px;cursor:pointer;transition:background .15s ease;}
  .more-sheet-item svg{opacity:.85;flex-shrink:0;color:var(--ink-soft);}
  .more-sheet-item:hover{background:var(--surface-2);}
  .more-sheet-item:active{background:var(--slate-tint);}

  /* ---- Notification bell (top-right corner, staff + parent shells) ---- */
  .bell-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:none;background:rgba(22,39,74,.06);color:var(--navy);cursor:pointer;flex-shrink:0;}
  .bell-btn svg{width:19px;height:19px;}
  .bell-btn .nav-badge-count{position:absolute;top:1px;right:1px;box-shadow:0 0 0 2px #fff;}
  /* Live HH:MM:SS clock badge shown in the header, and the signed-in user's
     photo beside it. Base colors assume a light header (desktop .topbar);
     .masthead overrides both for its dark gradient background below. */
  .header-clock{display:flex;flex-direction:column;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:rgba(22,39,74,.035);border:1px solid rgba(22,39,74,.07);color:var(--navy);flex-shrink:0;line-height:1;font-variant-numeric:tabular-nums;user-select:none;}
  .header-clock .hc-hm{font-size:9px;font-weight:800;letter-spacing:.1px;}
  .header-clock .hc-s{font-size:6px;font-weight:700;opacity:.65;margin-top:1px;letter-spacing:.2px;}
  .masthead .header-clock{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff;}
  .header-avatar-wrap{width:36px;height:36px;border-radius:50%;flex-shrink:0;overflow:hidden;border:2px solid rgba(22,39,74,.12);}
  .header-avatar-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .header-avatar-wrap .header-avatar-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(22,39,74,.08);color:var(--navy);font-weight:800;font-size:13px;}
  .masthead .header-avatar-wrap{border-color:rgba(255,255,255,.4);}
  .masthead .header-avatar-wrap .header-avatar-fallback{background:rgba(255,255,255,.22);color:#fff;}
  .bell-panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,100vw);background:#fff;box-shadow:-8px 0 30px rgba(22,39,74,.18);z-index:200;display:flex;flex-direction:column;animation:bellSlideIn .22s ease;}
  @keyframes bellSlideIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  .bell-panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px;border-bottom:1px solid var(--line);}
  .bell-panel-body{flex:1;overflow-y:auto;padding:8px 14px 20px;}
  .bell-item{padding:11px 4px;border-bottom:1px solid var(--line);}
  .bell-item:last-child{border-bottom:none;}
  .bell-item .b-title{font-weight:700;font-size:13.5px;color:var(--navy);}
  .bell-item .b-body{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .bell-item .b-meta{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .bell-backdrop{position:fixed;inset:0;background:rgba(15,20,35,.35);z-index:190;}

  @media(min-width:860px){
    .sidebar{display:flex;}
    .main{margin-left:230px;}
    .bottomnav{display:none;}
    .content{padding-bottom:16px;}
  }

  /* ---------- COMPONENTS ---------- */
  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(22,39,74,.05);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .section-head h2{font-size:18px;color:var(--navy);}
  /* Native-style vertical panel list — used for every module's sub-navigation
     (Inventory's Property/Classroom/Lab/etc, Fees' Payments/Structures/etc,
     Library, Exams...). Each section is its own full-width tappable card,
     stacked top-to-bottom with a trailing chevron, like a native app's
     drill-down menu — instead of a horizontal row of chips. */
  .pill-row{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;background:transparent;border:none;padding:0;overflow:visible;}
  .pill-row::-webkit-scrollbar{display:none;}
  .pill{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;border-radius:14px;font-size:14px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--ink);box-shadow:0 1px 2px rgba(22,39,74,.04);text-align:left;flex-shrink:0;white-space:normal;transition:background .15s ease,border-color .15s ease,box-shadow .15s ease;}
  .pill::after{content:"\203A";font-size:19px;line-height:1;font-weight:400;color:var(--slate);margin-left:10px;flex-shrink:0;}
  .pill:active{transform:scale(.985);}
  .pill.active{background:var(--teal-tint);border-color:var(--teal);color:var(--teal-dark);box-shadow:0 2px 10px rgba(46,158,124,.15);}
  .pill.active::after{color:var(--teal-dark);}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
  .stat{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:16px;border-left:4px solid var(--teal);box-shadow:0 1px 3px rgba(22,39,74,.05);}
  .stat:nth-child(4n+2){border-left-color:var(--sky);}
  .stat:nth-child(4n+3){border-left-color:var(--amber);}
  .stat:nth-child(4n+4){border-left-color:var(--purple);}
  .stat .num{font-size:24px;font-weight:800;color:var(--navy);}
  .stat .lbl{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
  /* Every list item (inventory item, fee record, library book, exam, student
     row, etc.) is now its own tappable native-style card — rounded, its own
     shadow, a bit of breathing room between items — instead of a flat list
     divided by thin border lines. */
  .list-row{display:flex;align-items:center;gap:12px;padding:13px 12px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(22,39,74,.04);transition:box-shadow .15s ease,transform .1s ease;}
  .list-row:active{transform:scale(.985);box-shadow:0 1px 1px rgba(22,39,74,.03);}
  .list-row:last-child{margin-bottom:0;}
  .avatar{width:40px;height:40px;border-radius:11px;background:var(--sky-tint);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);font-size:14px;flex-shrink:0;}
  .list-main{flex:1;min-width:0;}
  .list-title{font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .list-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* Every module wraps its item list in <div class="card" id="list">. Now that
     each .list-row is its own native card, that wrapper just needs to be a
     plain spacing container — not a second nested card around every row. */
  .card#list{background:transparent;border:none;box-shadow:none;padding:0;margin-bottom:14px;}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .badge-green{background:#e5f6ee;color:var(--teal-dark);}
  .badge-amber{background:#fdf1de;color:#a06a13;}
  .badge-red{background:#fdecec;color:var(--red);}
  .badge-grey{background:#eef0f4;color:var(--ink-soft);}
  .icon-btn{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .search-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .search-bar input{flex:1;min-width:140px;}
  .search-bar select{flex:0 0 auto;min-width:108px;}
  .fab{position:fixed;right:18px;bottom:96px;width:46px;height:46px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(46,158,124,.45);border:none;z-index:25;touch-action:none;user-select:none;-webkit-user-select:none;}
  .fab svg{width:20px;height:20px;}
  @media(min-width:860px){.fab{bottom:28px;}}
  .empty{text-align:center;padding:40px 16px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 3px rgba(22,39,74,.05);}
  .empty svg{margin-bottom:10px;opacity:.5;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,22,40,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal{background:#fff;width:100%;max-width:480px;border-radius:18px;padding:22px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-size:17px;color:var(--navy);margin-bottom:16px;}
  .modal-close{float:right;background:none;border:none;font-size:20px;color:var(--ink-soft);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .form-actions{display:flex;gap:10px;margin-top:6px;}
  .form-actions .btn{flex:1;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:9px 8px;border-bottom:2px solid var(--line);}
  td{padding:9px 8px;border-bottom:1px solid var(--line);}
  .table-wrap{overflow-x:auto;}
  /* Excel-style colored columns for the fee payment history table */
  .fee-history-table{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:640px;}
  .fee-history-table thead th{color:#fff;font-weight:800;font-size:11px;border-bottom:none;padding:12px 16px;white-space:nowrap;}
  .fee-history-table thead th:first-child{border-radius:10px 0 0 0;}
  .fee-history-table thead th:last-child{border-radius:0 10px 0 0;}
  .fee-history-table tbody td{padding:13px 16px;font-weight:600;border-bottom:1px solid var(--card);vertical-align:middle;}
  .fee-history-table tbody tr:last-child td{border-bottom:none;}
  .fee-history-table th,.fee-history-table td{border-right:3px solid var(--card);}
  .fee-history-table th:last-child,.fee-history-table td:last-child{border-right:none;}
  .fee-history-table .col-date-h,.fee-history-table .col-date-d{width:16%;white-space:nowrap;}
  .fee-history-table .col-student-h,.fee-history-table .col-student-d{width:32%;}
  .fee-history-table .col-student-d{line-height:1.4;overflow-wrap:break-word;}
  .fee-history-table .col-term-h,.fee-history-table .col-term-d{width:18%;overflow-wrap:break-word;}
  .fee-history-table .col-amount-h,.fee-history-table .col-amount-d{width:18%;white-space:nowrap;}
  .fee-history-table .col-method-h,.fee-history-table .col-method-d{width:16%;white-space:nowrap;}

  /* ---------- PARENT PORTAL: digital receipt ---------- */
  .receipt-box{padding:4px 0 10px;position:relative;}
  .receipt-stamp{position:absolute;top:64px;right:6px;width:104px;height:104px;border-radius:50%;border:2.5px solid var(--teal);opacity:.6;transform:rotate(-16deg);display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2;}
  .receipt-stamp-inner{width:86px;height:86px;border-radius:50%;border:1.5px solid var(--teal);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;}
  .receipt-stamp .rs-line1{font-size:8px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--teal-dark);line-height:1.2;}
  .receipt-stamp .rs-line2{font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--teal-dark);margin:2px 0;}
  .receipt-stamp .rs-line3{font-size:7.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--teal-dark);}
  @media print{ .receipt-stamp{opacity:.7;} }
  .receipt-head{text-align:center;margin-bottom:14px;padding-bottom:14px;border-bottom:2px dashed var(--line);}
  .receipt-logo{width:44px;height:44px;border-radius:10px;object-fit:cover;margin-bottom:6px;}
  .receipt-school{font-size:17px;font-weight:800;color:var(--navy);}
  .receipt-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .receipt-title{font-size:12.5px;font-weight:700;color:var(--teal-dark);margin-top:8px;text-transform:uppercase;letter-spacing:.04em;}
  .receipt-amount{display:flex;justify-content:space-between;align-items:center;background:var(--teal-tint);border-radius:12px;padding:14px 16px;margin-top:14px;font-weight:800;color:var(--teal-dark);font-size:17px;}
  .receipt-foot{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:14px;}
  @media print{
    body *{visibility:hidden;}
    #receiptArea,#receiptArea *{visibility:visible;}
    #receiptArea{position:fixed;left:0;top:0;width:100%;margin:0;padding:24px;}
  }
  .col-date-h{background:var(--sky);}
  .col-date-d{background:var(--sky-tint);color:#1D5A96;}
  .col-student-h{background:var(--indigo);}
  .col-student-d{background:var(--indigo-tint);color:#3E4199;}
  .col-term-h{background:var(--purple);}
  .col-term-d{background:var(--purple-tint);color:#5B4FC4;}

function formatGeneratedId(prefix, seq, digits, gender) {
  if (!prefix) return "";
  const yy = String(new Date().getFullYear()).slice(-2);
  const letter = gender === "Female" ? "F" : "M";
  return `${prefix}${letter}${yy}${String(Number(seq)||0).padStart(Number(digits)||3,'0')}`;
}

function nextIdFor(kind, gender) {
  const s = schoolSettings || {};
  const prefix = s[`${kind}_id_prefix`];
  if (!prefix) return "";
  return formatGeneratedId(prefix, s[`${kind}_id_seq`] ?? 0, s[`${kind}_id_digits`] ?? 3, gender);
}

async function advanceIdSeq(kind) {
  const s = schoolSettings || {};
  if (!s[`${kind}_id_prefix`]) return;
  const payload = {};
  payload[`${kind}_id_seq`] = Number(s[`${kind}_id_seq`] ?? 0) + 1;
  try {
    await dbUpsert("school_settings", payload, "school_id");
    schoolSettings = Object.assign({}, schoolSettings, payload);
  } catch (e) {  }
}

let CURRENT_SCHOOL = null;
async function loadCurrentSchool() {
  if (!CURRENT_SCHOOL_ID) { CURRENT_SCHOOL = null; return; }
  try {
    try { await sb(`/rest/v1/rpc/enforce_subscription_expiry`, { method:"POST", body: JSON.stringify({ p_school_id: CURRENT_SCHOOL_ID }) }); } catch (e) { /* offline or not yet migrated — fall through and read whatever status is stored */ }
    const rows = await sb(`/rest/v1/rpc/get_my_school`, { method:"POST", body: JSON.stringify({}) });
    CURRENT_SCHOOL = (rows && rows[0]) || null;
    if (CURRENT_SCHOOL) offlineCachePut("school_snapshot::" + CURRENT_SCHOOL_ID, CURRENT_SCHOOL);
  } catch (e) {
    if (e instanceof OfflineError) {
      const cached = await offlineCacheGet("school_snapshot::" + CURRENT_SCHOOL_ID);
      CURRENT_SCHOOL = cached !== undefined ? cached : null;
    } else {
      CURRENT_SCHOOL = null;
    }
  }
}
function isFeatureEnabled(navId) {
  if (CORE_NAV_IDS.has(navId)) return true;
  const f = CURRENT_SCHOOL?.features;
  if (!f || typeof f !== "object") return true; 
  return f[navId] !== false;
}

function schoolIsActive() {
  if (!CURRENT_SCHOOL) return !CURRENT_SCHOOL_ID; // no school id at all (e.g. dev mode) = nothing to restrict; a school id we failed to resolve must NOT be treated as active
  if (CURRENT_SCHOOL.deleted_at) return false; 
  return CURRENT_SCHOOL.status === "active";
}
function schoolBlockedMessage() {
  if (CURRENT_SCHOOL?.deleted_at) {
    return `"${CURRENT_SCHOOL.name}" no longer exists in the system because it was permanently deleted. If you think this is a mistake, please contact us now.`;
  }
  const s = CURRENT_SCHOOL?.status;
  if (s === "pending") return "Your school's registration is still awaiting approval from TransApple. Please check back shortly.";
  if (s === "suspended") return "Access to this school has been suspended — often because a subscription payment is overdue. Please contact your administrator or TransApple support to renew.";
  if (s === "deactivated") return "This school's account has been deactivated by TransApple. Please contact TransApple support if you believe this is a mistake.";
  return "This school's account is not currently active. Please contact TransApple support.";
}

let __schoolSyncTimer = null;
function startSchoolSync() {
  stopSchoolSync();
  const tick = async () => {
    if (!CURRENT_SCHOOL_ID) return;
    const prevStatus = CURRENT_SCHOOL?.status;
    const prevFeatures = JSON.stringify(CURRENT_SCHOOL?.features || {});
    const prevUpgradeRequested = CURRENT_SCHOOL?.upgrade_requested_at || null;
    const prevUpgradeCompleted = CURRENT_SCHOOL?.upgrade_completed_at || null;
    const prevDeletedAt = CURRENT_SCHOOL?.deleted_at || null;
    await loadCurrentSchool();
    if (!auth) return; 
    const changed = prevStatus !== CURRENT_SCHOOL?.status
      || prevFeatures !== JSON.stringify(CURRENT_SCHOOL?.features || {})
      || prevUpgradeRequested !== (CURRENT_SCHOOL?.upgrade_requested_at || null)
      || prevUpgradeCompleted !== (CURRENT_SCHOOL?.upgrade_completed_at || null)
      || prevDeletedAt !== (CURRENT_SCHOOL?.deleted_at || null);
    if (changed) {
      if (!schoolIsActive()) { render(); return; } 
      if (!hasNavAccess(profile, tab)) tab = "dashboard";
      render();
    }
  };
  __schoolSyncTimer = setInterval(tick, 45000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") tick(); });
}
function stopSchoolSync() { if (__schoolSyncTimer) { clearInterval(__schoolSyncTimer); __schoolSyncTimer = null; } }

function deptAccess(p) {
  if (p?.role === "admin") return "all";
  const d = DEPARTMENTS[p?.department];
  if (d) return d.access;
  if (p?.role === "accountant") return ["dashboard","aio-ai","students","fees","contact"];
  if (p?.role === "teacher") return ["dashboard","aio-ai","students","teachers","attendance","exams","academic","contact"];
  return ["dashboard","aio-ai","contact"];
}

  const a = deptAccess(p);
  return a === "all" || a.includes(navId);
}

const PROFILES_MIGRATION_SQL = `-- lets Postgres hash/check passwords for us
create extension if not exists pgcrypto;

-- new columns this account system needs
alter table profiles add column if not exists username text unique;
alter table profiles add column if not exists phone text;
alter table profiles add column if not exists pin text;
alter table profiles add column if not exists password_hash text;
alter table profiles add column if not exists photo_url text;
alter table profiles add column if not exists suspended_at timestamptz;
alter table profiles add column if not exists deleted_at timestamptz;
-- profiles.id used to come from auth.users (via a foreign key) — accounts are
-- created directly here now, so that link has to go, and id needs to generate itself:
alter table profiles drop constraint if exists profiles_id_fkey;
alter table profiles alter column id set default gen_random_uuid();

-- Creates a new account. Called from the app's "Create account" screen.
drop function if exists create_account(text, text, text, text, text, text);
drop function if exists create_account(text, text, text, text, text, text, text);
create function create_account(
  p_full_name text, p_username text, p_department text,
  p_phone text, p_password text, p_pin text, p_photo_url text default null
) returns profiles
language plpgsql security definer as $create_account$
declare new_row profiles;
begin
  if p_username is null or trim(p_username) = '' then
    raise exception 'Username is required.';
  end if;
  if exists (select 1 from profiles where username = p_username) then
    raise exception 'That username is already taken.';
  end if;
  insert into profiles (full_name, username, department, phone, pin, password_hash, role, photo_url)
  values (p_full_name, p_username, nullif(p_department,''), nullif(p_phone,''), nullif(p_pin,''), crypt(p_password, gen_salt('bf')), 'staff', p_photo_url)
  returning * into new_row;
  new_row.password_hash := null;
  return new_row;
end;
$create_account$;
grant execute on function create_account(text,text,text,text,text,text,text) to anon, authenticated;

-- Checks a username + password and returns the profile on success.
drop function if exists verify_login(text, text);
create function verify_login(p_username text, p_password text) returns profiles
language plpgsql security definer as $verify_login$
declare found_row profiles;
begin
  select * into found_row from profiles where username = p_username;
  if found_row.id is null or found_row.password_hash is null
     or crypt(p_password, found_row.password_hash) <> found_row.password_hash then
    raise exception 'Incorrect username or password.';
  end if;
  if found_row.deleted_at is not null then
    raise exception 'This account has been deleted. Contact Administration.';
  end if;
  if found_row.suspended_at is not null then
    raise exception 'This account is suspended. Contact Administration.';
  end if;
  found_row.password_hash := null;
  return found_row;
end;
$verify_login$;
grant execute on function verify_login(text,text) to anon, authenticated;

-- "Forgot password" flow: identity is confirmed with the account's PIN
-- (no email involved), then the password is reset straight away.
drop function if exists reset_password(text, text, text);
create function reset_password(p_username text, p_pin text, p_new_password text) returns void
language plpgsql security definer as $reset_password$
declare found_row profiles;
begin
  select * into found_row from profiles where lower(username) = lower(p_username);
  if found_row.id is null then
    raise exception 'No account found with that username.';
  end if;
  if found_row.pin is null or found_row.pin = '' or found_row.pin <> p_pin then
    raise exception 'That PIN does not match our records.';
  end if;
  if p_new_password is null or length(p_new_password) < 6 then
    raise exception 'New password must be at least 6 characters.';
  end if;
  update profiles set password_hash = crypt(p_new_password, gen_salt('bf')) where id = found_row.id;
end;
$reset_password$;
grant execute on function reset_password(text,text,text) to anon, authenticated;`;

const STAFF_NOTIFY_FUNCTION_CODE = `// supabase/functions/staff-notify/index.ts
//
// Called by a Database Webhook whenever a new mother_announcements or
// parent_messages row is inserted. Sends a Web Push notification to every
// staff device subscribed via push_subscriptions_staff that should see it.
//
// Required secrets (Edge Functions -> staff-notify -> Secrets):
//   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, VAPID_PUBLIC_KEY,
//   VAPID_PRIVATE_KEY, VAPID_SUBJECT (e.g. "mailto:you@yourdomain.com")

import { createClient } from "npm:@supabase/supabase-js@2";
import webpush from "npm:web-push@3.6.7";

const SUPABASE_URL = Deno.env.get("SUPABASE_URL")!;
const SERVICE_ROLE_KEY = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!;
const VAPID_PUBLIC_KEY = Deno.env.get("VAPID_PUBLIC_KEY")!;
const VAPID_PRIVATE_KEY = Deno.env.get("VAPID_PRIVATE_KEY")!;
const VAPID_SUBJECT = Deno.env.get("VAPID_SUBJECT")!;

webpush.setVapidDetails(VAPID_SUBJECT, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY);
const supabase = createClient(SUPABASE_URL, SERVICE_ROLE_KEY);

Deno.serve(async (req) => {
  const payload = await req.json();
  const table = payload.table;
  const record = payload.record;
  if (!table || !record) return new Response("ignored", { status: 200 });

  let title = "New notification";
  let body = "";
  let query = supabase.from("push_subscriptions_staff").select("*");

  if (table === "mother_announcements") {
    title = record.title || "Announcement";
    body = record.body || "";
    // target_all -> every device. Otherwise only devices whose school_id is
    // in target_school_ids. Department narrows it further, except
    // Administration devices always get every department-targeted message.
    if (!record.target_all && Array.isArray(record.target_school_ids)) {
      query = query.in("school_id", record.target_school_ids);
    }
  } else if (table === "parent_messages") {
    title = \`\${record.parent_name || "A parent"}: \${record.subject}\`;
    body = record.message || "";
    if (record.department) {
      query = query.or(\`department.eq.\${record.department},department.eq.administration\`);
    }
  } else {
    return new Response("ignored", { status: 200 });
  }

  const { data: subs, error } = await query;
  if (error || !subs) return new Response("no subscriptions", { status: 200 });

  // Department filter for department-targeted mother_announcements happens
  // here (client-side, after the school filter above) so Administration
  // devices — regardless of the target department — still get it.
  const targetDept = table === "mother_announcements" ? record.target_department : null;
  const filtered = subs.filter((s: any) => {
    if (table !== "mother_announcements") return true;
    if (!targetDept || targetDept === "all") return true;
    if (s.department === "administration") return true;
    return s.department === targetDept;
  });

  const payloadBody = JSON.stringify({ title, body });
  let sent = 0;
  for (const sub of filtered) {
    const pushSubscription = { endpoint: sub.endpoint, keys: { p256dh: sub.p256dh, auth: sub.auth } };
    try {
      await webpush.sendNotification(pushSubscription, payloadBody);
      sent++;
    } catch (err: any) {
      if (err && (err.statusCode === 404 || err.statusCode === 410)) {
        await supabase.from("push_subscriptions_staff").delete().eq("endpoint", sub.endpoint);
      }
    }
  }
  return new Response(JSON.stringify({ sent }), { status: 200 });
});`;

-- Verifies a Student ID + the student's exact registered name match, then
-- links that student to a parent profile. Used both when adding a child
-- after sign-up and (inside create_parent_account below) during sign-up.
drop function if exists link_parent_child(uuid, text, text);
create function link_parent_child(p_parent_id uuid, p_admission_no text, p_student_name text) returns students
language plpgsql security definer as $link_parent_child$
declare found_student students;
begin
  select * into found_student from students
    where trim(lower(admission_no)) = trim(lower(p_admission_no))
      and trim(lower(full_name)) = trim(lower(p_student_name))
      and deleted_at is null
    limit 1;
  if found_student.id is null then
    raise exception 'We could not find a student with that Student ID and exact registered name. Please check with the school office.';
  end if;
  insert into parent_students (parent_id, student_id) values (p_parent_id, found_student.id)
    on conflict (parent_id, student_id) do nothing;
  return found_student;
end;
$link_parent_child$;
grant execute on function link_parent_child(uuid,text,text) to anon, authenticated;

-- Creates a parent account. The Student ID + exact registered name match is
-- verified FIRST — the account (and the link to the child) is only created
-- once that check passes.
drop function if exists create_parent_account(text, text, text, text, text, text, text, text);
create function create_parent_account(
  p_full_name text, p_username text, p_phone text, p_password text, p_pin text,
  p_photo_url text, p_admission_no text, p_student_name text
) returns profiles
language plpgsql security definer as $create_parent_account$
declare new_row profiles; found_student students;
begin
  select * into found_student from students
    where trim(lower(admission_no)) = trim(lower(p_admission_no))
      and trim(lower(full_name)) = trim(lower(p_student_name))
      and deleted_at is null
    limit 1;
  if found_student.id is null then
    raise exception 'We could not find a student with that Student ID and exact registered name. Please check with the school office.';
  end if;
  if p_username is null or trim(p_username) = '' then
    raise exception 'Username is required.';
  end if;
  if exists (select 1 from profiles where username = p_username) then
    raise exception 'That username is already taken.';
  end if;
  insert into profiles (full_name, username, phone, pin, password_hash, role, photo_url)
  values (p_full_name, p_username, nullif(p_phone,''), nullif(p_pin,''), crypt(p_password, gen_salt('bf')), 'parent', p_photo_url)
  returning * into new_row;
  insert into parent_students (parent_id, student_id) values (new_row.id, found_student.id)
    on conflict (parent_id, student_id) do nothing;
  new_row.password_hash := null;
  return new_row;
end;
$create_parent_account$;
grant execute on function create_parent_account(text,text,text,text,text,text,text,text) to anon, authenticated;`;

const SCHOOL_SELF_REGISTRATION_SQL = `-- Extra fields the registration screen collects about the school itself —
-- these live on the mother system's own \`schools\` table, not in this app's data.
alter table schools add column if not exists motto text;
alter table schools add column if not exists village text;
alter table schools add column if not exists sub_county text;
alter table schools add column if not exists district text;
alter table schools add column if not exists size_range text;

-- The human-facing School ID — letters, numbers, and underscores only. Generated
-- automatically inside register_school() below (TATNOVA followed by 7
-- random digits, retried until unique), shown to Administrators under Settings,
-- and never editable afterwards. Staff/parents key this in on the "Create your
-- account" screen so their account lands in the right school — this is the code
-- the TransApple Mother System uses to identify the school everywhere.
alter table schools add column if not exists school_code text;
do $$ begin
  if not exists (select 1 from pg_constraint where conname = 'schools_school_code_key') then
    alter table schools add constraint schools_school_code_key unique (school_code);
  end if;
  if not exists (select 1 from pg_constraint where conname = 'schools_school_code_format') then
    alter table schools add constraint schools_school_code_format check (school_code ~ '^[A-Za-z0-9_]+$');
  end if;
end $$;

-- Soft-delete and upgrade-tracking fields that schoolIsActive(), schoolBlockedMessage()
-- and the upgrade banner already read from CURRENT_SCHOOL, but which were never
-- actually created on the schools table until now.
alter table schools add column if not exists deleted_at timestamptz;
alter table schools add column if not exists upgrade_requested_at timestamptz;
alter table schools add column if not exists upgrade_completed_at timestamptz;

-- Lets an Administrator finish an upgrade that TransApple flagged (by setting
-- upgrade_requested_at externally) by confirming their password and filling
-- in any location/size fields that are still missing. Mirrors register_school's
-- school_code generation and verify_login's password check.
drop function if exists complete_school_upgrade(uuid, text, text, text, text, text, text, text);
create function complete_school_upgrade(
  p_school_id uuid, p_actor_username text, p_actor_password text,
  p_motto text default null, p_village text default null, p_subcounty text default null,
  p_district text default null, p_size_range text default null
) returns schools
language plpgsql security definer as $complete_school_upgrade$
declare actor profiles; target schools; candidate_code text; updated_row schools;
begin
  if p_school_id is null then
    raise exception 'No school selected.';
  end if;
  if p_actor_username is null or trim(p_actor_username) = '' then
    raise exception 'Not signed in.';
  end if;
  if p_actor_password is null or p_actor_password = '' then
    raise exception 'Enter your password to confirm.';
  end if;

  select * into actor from profiles where lower(username) = lower(p_actor_username);
  if actor.id is null or actor.password_hash is null
     or crypt(p_actor_password, actor.password_hash) <> actor.password_hash then
    raise exception 'Incorrect username or password.';
  end if;
  if actor.deleted_at is not null then
    raise exception 'This account has been deleted. Contact Administration.';
  end if;
  if actor.suspended_at is not null then
    raise exception 'This account is suspended. Contact Administration.';
  end if;
  if actor.school_id is distinct from p_school_id or actor.department <> 'administration' then
    raise exception 'You do not have permission to upgrade this school.';
  end if;

  select * into target from schools where id = p_school_id;
  if target.id is null then
    raise exception 'School not found.';
  end if;
  if target.school_code is not null or target.upgrade_requested_at is null or target.upgrade_completed_at is not null then
    raise exception 'This school is not pending an upgrade.';
  end if;

  loop
    candidate_code := 'TATNOVA' || lpad(floor(random() * 10000000)::text, 7, '0');
    exit when not exists (select 1 from schools where school_code = candidate_code);
  end loop;

  update schools set
    motto = coalesce(target.motto, nullif(trim(p_motto),'')),
    village = coalesce(target.village, nullif(trim(p_village),'')),
    sub_county = coalesce(target.sub_county, nullif(trim(p_subcounty),'')),
    district = coalesce(target.district, nullif(trim(p_district),'')),
    size_range = coalesce(target.size_range, nullif(p_size_range,'')),
    school_code = candidate_code,
    upgrade_completed_at = now()
  where id = p_school_id
  returning * into updated_row;

  return updated_row;
end;
$complete_school_upgrade$;
grant execute on function complete_school_upgrade(uuid,text,text,text,text,text,text,text) to anon, authenticated;

-- Extra contact fields for the first Administrator account. photo_url already
-- exists from the base PROFILES_MIGRATION_SQL.
alter table profiles add column if not exists whatsapp text;
alter table profiles add column if not exists email text;

-- Marks the account that has full ownership authority over the school — set
-- automatically for the founding Administrator inside register_school()
-- below. There's exactly one owner per school at a time; see transfer_ownership()
-- further down for how that authority moves to someone else. Only the owner
-- can suspend/delete an entire department at once (see openDepartmentModal in
-- the app) — every other Administration account still manages accounts one
-- at a time, same as before.
alter table profiles add column if not exists is_owner boolean not null default false;

-- Registers a brand-new school (written to the mother system's \`schools\`
-- table) AND creates its first Administrator account together, atomically —
-- if either half fails, nothing is created.
drop function if exists register_school(text,text,text,text,text,text,text,text,text,text,text,text,text);
drop function if exists register_school(text,text,text,text,text,text,text,text,text,text,text,text,text,text,text);
drop function if exists register_school(text,text,text,text,text,text,text,text,text,text,text,text,text,text);
create function register_school(
  p_school_name text, p_school_motto text,
  p_school_village text, p_school_subcounty text, p_school_district text,
  p_school_size_range text,
  p_admin_full_name text, p_admin_username text, p_admin_phone text,
  p_admin_whatsapp text, p_admin_email text,
  p_admin_password text, p_admin_pin text default null, p_admin_photo_url text default null
) returns profiles
language plpgsql security definer as $register_school$
declare new_school schools; new_admin profiles; candidate_code text;
begin
  if p_school_name is null or trim(p_school_name) = '' then
    raise exception 'School name is required.';
  end if;
  if p_admin_full_name is null or trim(p_admin_full_name) = '' then
    raise exception 'Administrator full name is required.';
  end if;
  if p_admin_username is null or trim(p_admin_username) = '' then
    raise exception 'Administrator username is required.';
  end if;
  if exists (select 1 from profiles where username = p_admin_username) then
    raise exception 'That username is already taken.';
  end if;
  if p_admin_password is null or length(p_admin_password) < 6 then
    raise exception 'Administrator password must be at least 6 characters.';
  end if;

  -- Build the School ID as TATNOVA followed by 7 random digits, retrying
  -- until it's unique.
  loop
    candidate_code := 'TATNOVA' || lpad(floor(random() * 10000000)::text, 7, '0');
    exit when not exists (select 1 from schools where school_code = candidate_code);
  end loop;

  -- School record: owned by the mother system, not this app's own tables.
  insert into schools (name, motto, village, sub_county, district, size_range, status, school_code)
  values (
    trim(p_school_name), nullif(trim(p_school_motto),''),
    nullif(trim(p_school_village),''), nullif(trim(p_school_subcounty),''), nullif(trim(p_school_district),''),
    nullif(p_school_size_range,''), 'active', candidate_code
  ) returning * into new_school;

  -- First Administrator — Administration department = full access to everything,
  -- and is_owner = true: they hold full authority over the school (including
  -- suspending/deleting whole departments) until they transfer it to someone else.
  insert into profiles (
    full_name, username, department, phone, whatsapp, email,
    pin, password_hash, role, photo_url, school_id, is_owner
  ) values (
    trim(p_admin_full_name), p_admin_username, 'administration',
    nullif(p_admin_phone,''), nullif(p_admin_whatsapp,''), nullif(p_admin_email,''),
    nullif(p_admin_pin,''), crypt(p_admin_password, gen_salt('bf')), 'staff', p_admin_photo_url, new_school.id, true
  ) returning * into new_admin;

  new_admin.password_hash := null;
  return new_admin;
end;
$register_school$;
grant execute on function register_school(text,text,text,text,text,text,text,text,text,text,text,text,text,text) to anon, authenticated;

-- Moves full ownership authority from the current owner to another active
-- Administration-department account at the same school. Verified against the
-- acting (current owner's) password, same trust model as reset_password().
drop function if exists transfer_ownership(text,text,uuid);
create function transfer_ownership(p_actor_username text, p_actor_password text, p_new_owner_id uuid)
returns void language plpgsql security definer as $$
declare actor profiles; new_owner profiles;
begin
  select * into actor from profiles where username = p_actor_username;
  if actor.id is null or actor.password_hash is null or crypt(p_actor_password, actor.password_hash) <> actor.password_hash then
    raise exception 'Your password could not be verified.';
  end if;
  if not actor.is_owner then
    raise exception 'Only the current owner can transfer ownership.';
  end if;

  select * into new_owner from profiles where id = p_new_owner_id and school_id = actor.school_id;
  if new_owner.id is null then
    raise exception 'That account was not found at your school.';
  end if;
  if new_owner.department <> 'administration' then
    raise exception 'Ownership can only be transferred to an Administration account.';
  end if;
  if new_owner.deleted_at is not null or new_owner.suspended_at is not null then
    raise exception 'That account is suspended or deleted.';
  end if;

  update profiles set is_owner = false where id = actor.id;
  update profiles set is_owner = true where id = new_owner.id;
end;
$$;
grant execute on function transfer_ownership(text,text,uuid) to anon, authenticated;`;

drop function if exists create_account(text, text, text, text, text, text, text, uuid);
create function create_account(
  p_full_name text, p_username text, p_department text,
  p_phone text, p_password text, p_pin text, p_photo_url text default null, p_school_id uuid default null
) returns profiles
language plpgsql security definer as $create_account$
declare new_row profiles; locked jsonb;
begin
  if p_username is null or trim(p_username) = '' then
    raise exception 'Username is required.';
  end if;
  if p_school_id is null then
    raise exception 'Select a school.';
  end if;
  if exists (select 1 from profiles where username = p_username) then
    raise exception 'That username is already taken.';
  end if;
  if p_department is not null and p_department <> '' then
    select locked_departments into locked from school_settings where school_id = p_school_id limit 1;
    if locked is not null and (locked ->> p_department) = 'true' then
      raise exception 'This department is currently closed for new registrations. Please contact your school Administration.';
    end if;
  end if;
  insert into profiles (full_name, username, department, phone, pin, password_hash, role, photo_url, school_id, approval_status)
  values (p_full_name, p_username, nullif(p_department,''), nullif(p_phone,''), nullif(p_pin,''), crypt(p_password, gen_salt('bf')), 'staff', p_photo_url, p_school_id, 'pending')
  returning * into new_row;
  new_row.password_hash := null;
  return new_row;
end;
$create_account$;
grant execute on function create_account(text,text,text,text,text,text,text,uuid) to anon, authenticated;

-- Self-signup parent accounts now start pending too.
drop function if exists create_parent_account(text, text, text, text, text, text, text, text, uuid);
create function create_parent_account(
  p_full_name text, p_username text, p_phone text, p_password text, p_pin text,
  p_photo_url text, p_admission_no text, p_student_name text, p_school_id uuid default null
) returns profiles
language plpgsql security definer as $create_parent_account$
declare new_row profiles; found_student students;
begin
  if p_school_id is null then
    raise exception 'Select a school.';
  end if;
  select * into found_student from students
    where trim(lower(admission_no)) = trim(lower(p_admission_no))
      and trim(lower(full_name)) = trim(lower(p_student_name))
      and school_id = p_school_id
      and deleted_at is null
    limit 1;
  if found_student.id is null then
    raise exception 'We could not find a student with that Student ID and exact registered name at that school. Please check with the school office.';
  end if;
  if p_username is null or trim(p_username) = '' then
    raise exception 'Username is required.';
  end if;
  if exists (select 1 from profiles where username = p_username) then
    raise exception 'That username is already taken.';
  end if;
  insert into profiles (full_name, username, phone, pin, password_hash, role, photo_url, school_id, approval_status)
  values (p_full_name, p_username, nullif(p_phone,''), nullif(p_pin,''), crypt(p_password, gen_salt('bf')), 'parent', p_photo_url, p_school_id, 'pending')
  returning * into new_row;
  insert into parent_students (parent_id, student_id, school_id) values (new_row.id, found_student.id, p_school_id)
    on conflict (parent_id, student_id) do nothing;
  new_row.password_hash := null;
  return new_row;
end;
$create_parent_account$;
grant execute on function create_parent_account(text,text,text,text,text,text,text,text,uuid) to anon, authenticated;

-- Approves a pending registration. Must be called by an existing Administrator
-- at the same school as the account being approved.
drop function if exists approve_registration(uuid, uuid);
create function approve_registration(p_admin_id uuid, p_profile_id uuid)
returns profiles language plpgsql security definer as $$
declare admin_row profiles; target_row profiles;
begin
  select * into admin_row from profiles where id = p_admin_id and department = 'administration' and deleted_at is null;
  if admin_row.id is null then
    raise exception 'Only a school Administrator can approve registrations.';
  end if;
  select * into target_row from profiles where id = p_profile_id and school_id = admin_row.school_id;
  if target_row.id is null then
    raise exception 'That registration was not found at this school.';
  end if;
  update profiles set approval_status = 'approved' where id = p_profile_id returning * into target_row;
  target_row.password_hash := null;
  return target_row;
end;
$$;
grant execute on function approve_registration(uuid,uuid) to anon, authenticated;

-- Rejects a pending registration (kept on file, marked 'rejected', blocked at login).
drop function if exists reject_registration(uuid, uuid);
create function reject_registration(p_admin_id uuid, p_profile_id uuid)
returns profiles language plpgsql security definer as $$
declare admin_row profiles; target_row profiles;
begin
  select * into admin_row from profiles where id = p_admin_id and department = 'administration' and deleted_at is null;
  if admin_row.id is null then
    raise exception 'Only a school Administrator can reject registrations.';
  end if;
  select * into target_row from profiles where id = p_profile_id and school_id = admin_row.school_id;
  if target_row.id is null then
    raise exception 'That registration was not found at this school.';
  end if;
  update profiles set approval_status = 'rejected' where id = p_profile_id returning * into target_row;
  target_row.password_hash := null;
  return target_row;
end;
$$;
grant execute on function reject_registration(uuid,uuid) to anon, authenticated;

-- Final verify_login: builds on every prior upgrade (deleted/suspended checks,
-- school-status checks, last_login_at, school_login_log) and adds the new
-- approval_status gate, plus the school-level Trash check (see
-- SCHOOL_TRASH_SQL / soft_delete_school in the Mother App) — checked first,
-- since once the school itself has been deleted nothing else about the
-- account matters. Blocks a login before it ever reaches the app shell.
drop function if exists verify_login(text, text);
create function verify_login(p_username text, p_password text) returns profiles
language plpgsql security definer as $verify_login$
declare found_row profiles; school_row schools;
begin
  select * into found_row from profiles where lower(username) = lower(p_username);
  if found_row.id is null or found_row.password_hash is null
     or crypt(p_password, found_row.password_hash) <> found_row.password_hash then
    if to_regclass('school_login_log') is not null then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
    end if;
    raise exception 'Incorrect username or password.';
  end if;
  if found_row.school_id is not null then
    select * into school_row from schools where id = found_row.school_id;
  end if;
  -- The whole school was deleted (moved to Trash by a Mother App admin) —
  -- this overrides every other check below, and the school row/name is
  -- still around to name-check against during its 30-day Trash window.
  if school_row.id is not null and school_row.deleted_at is not null then
    if to_regclass('school_login_log') is not null then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
    end if;
    raise exception '"%" no longer exists in the system because it was permanently deleted. If you think this is a mistake, please contact us now.', school_row.name;
  end if;
  if found_row.deleted_at is not null then
    if to_regclass('school_login_log') is not null then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
    end if;
    raise exception 'This account has been deleted. Contact Administration.';
  end if;
  if found_row.suspended_at is not null then
    if to_regclass('school_login_log') is not null then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
    end if;
    raise exception 'This account is suspended. Contact Administration.';
  end if;
  if found_row.approval_status = 'pending' then
    if to_regclass('school_login_log') is not null then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
    end if;
    raise exception 'Your registration is awaiting approval from your school Administrator.';
  end if;
  if found_row.approval_status = 'rejected' then
    if to_regclass('school_login_log') is not null then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
    end if;
    raise exception 'Your registration was not approved. Contact your school Administrator for more information.';
  end if;
  if school_row.id is not null then
    if school_row.status = 'pending' then
      raise exception 'Your school is still awaiting approval by TransApple. Please check back soon.';
    elsif school_row.status = 'rejected' then
      raise exception 'Your school''s registration was not approved. Contact TransApple for more information.';
    elsif school_row.status = 'suspended' then
      raise exception 'Your school''s account is suspended. Contact TransApple to resolve this.';
    elsif school_row.status = 'deactivated' then
      raise exception 'Your school''s account has been deactivated. Contact TransApple for help.';
    end if;
  end if;
  if to_regclass('profiles') is not null then
    begin
      update profiles set last_login_at = now() where id = found_row.id;
    exception when undefined_column then null;
    end;
  end if;
  if to_regclass('school_login_log') is not null then
    insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, true);
  end if;
  found_row.password_hash := null;
  return found_row;
end;
$verify_login$;
grant execute on function verify_login(text,text) to anon, authenticated;`;

class OfflineError extends Error {}
async function sb(path, opts = {}) {
  
  
  const headers = Object.assign({
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
  }, SESSION_TOKEN ? { "x-session-token": SESSION_TOKEN } : {}, opts.headers || {});
  let res;
  
  
  
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
  try {
    res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, { headers, signal: controller.signal }));
  } catch (e) {
    
    
    
    throw new OfflineError("Couldn't connect right now. Please try again.");
  } finally {
    clearTimeout(timeoutId);
  }
  if (offlineBannerStickyUntilOnline) {
    offlineBannerStickyUntilOnline = false;
    updateNetStatusPill();
  }
  let data = null;
  try { data = await res.json(); } catch(e) { data = null; }
  if (!res.ok) {
    const msg = (data && (data.error_description || data.msg || data.message)) || "Request failed";
    throw new Error(msg);
  }
  return data;
}

const OFFLINE_DB_NAME = "novaOfflineCache";
const OFFLINE_DB_VERSION = 2;
const OFFLINE_STORE = "reads";
const OUTBOX_STORE = "outbox";
let offlineDBPromise = null;
function openOfflineDB() {
  if (offlineDBPromise) return offlineDBPromise;
  offlineDBPromise = new Promise((resolve) => {
    if (!("indexedDB" in window)) { resolve(null); return; }
    let req;
    try { req = indexedDB.open(OFFLINE_DB_NAME, OFFLINE_DB_VERSION); } catch (e) { resolve(null); return; }
    req.onupgradeneeded = () => {
      const db = req.result;
      try { if (!db.objectStoreNames.contains(OFFLINE_STORE)) db.createObjectStore(OFFLINE_STORE); } catch (e) {}
      try { if (!db.objectStoreNames.contains(OUTBOX_STORE)) db.createObjectStore(OUTBOX_STORE, { keyPath: "localId", autoIncrement: true }); } catch (e) {}
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
  return offlineDBPromise;
}
async function offlineCachePut(key, value) {
  try {
    const db = await openOfflineDB(); if (!db) return;
    await new Promise((resolve) => {
      const tx = db.transaction(OFFLINE_STORE, "readwrite");
      tx.objectStore(OFFLINE_STORE).put({ value, savedAt: Date.now() }, key);
      tx.oncomplete = resolve; tx.onerror = resolve; tx.onabort = resolve;
    });
  } catch (e) {}
}
async function offlineCacheGet(key) {
  try {
    const db = await openOfflineDB(); if (!db) return undefined;
    return await new Promise((resolve) => {
      const tx = db.transaction(OFFLINE_STORE, "readonly");
      const req = tx.objectStore(OFFLINE_STORE).get(key);
      req.onsuccess = () => resolve(req.result ? req.result.value : undefined);
      req.onerror = () => resolve(undefined);
    });
  } catch (e) { return undefined; }
}
async function offlineCacheEntriesForTable(table) {
  try {
    const db = await openOfflineDB(); if (!db) return [];
    const prefix = table + "::";
    return await new Promise((resolve) => {
      const out = [];
      const tx = db.transaction(OFFLINE_STORE, "readonly");
      const range = IDBKeyRange.bound(prefix, prefix + "\uffff");
      const req = tx.objectStore(OFFLINE_STORE).openCursor(range);
      req.onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) { out.push({ key: cursor.key, value: cursor.value.value }); cursor.continue(); }
        else resolve(out);
      };
      req.onerror = () => resolve(out);
    });
  } catch (e) { return []; }
}
async function offlineCacheMutateTable(table, mutateFn) {
  const entries = await offlineCacheEntriesForTable(table);
  for (const entry of entries) {
    const rows = Array.isArray(entry.value) ? entry.value : null;
    if (!rows) continue;
    const next = mutateFn(rows);
    if (next) await offlineCachePut(entry.key, next);
  }
}
async function applyOptimisticInsert(table, row) {
  if (table === "students" && row.admission_no == null) row = Object.assign({}, row, { admission_no: "Pending sync" });
  await offlineCacheMutateTable(table, (rows) => [row, ...rows]);
}
async function applyOptimisticUpdate(table, id, patch) {
  await offlineCacheMutateTable(table, (rows) => {
    let changed = false;
    const next = rows.map(r => { if (r && r.id === id) { changed = true; return Object.assign({}, r, patch); } return r; });
    return changed ? next : null;
  });
}
async function applyOptimisticDelete(table, id) {
  await offlineCacheMutateTable(table, (rows) => {
    if (!rows.some(r => r && r.id === id)) return null;
    return rows.filter(r => !(r && r.id === id));
  });
}
async function reconcileTempId(table, tempId, realRow) {
  await offlineCacheMutateTable(table, (rows) => {
    let changed = false;
    const next = rows.map(r => { if (r && r.id === tempId) { changed = true; return realRow; } return r; });
    return changed ? next : null;
  });
}

async function outboxAdd(entry) {
  try {
    const db = await openOfflineDB(); if (!db) return null;
    return await new Promise((resolve) => {
      const tx = db.transaction(OUTBOX_STORE, "readwrite");
      const req = tx.objectStore(OUTBOX_STORE).add(entry);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}
async function outboxAll() {
  try {
    const db = await openOfflineDB(); if (!db) return [];
    return await new Promise((resolve) => {
      const tx = db.transaction(OUTBOX_STORE, "readonly");
      const req = tx.objectStore(OUTBOX_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => resolve([]);
    });
  } catch (e) { return []; }
}
async function outboxCount() {
  try {
    const db = await openOfflineDB(); if (!db) return 0;
    return await new Promise((resolve) => {
      const tx = db.transaction(OUTBOX_STORE, "readonly");
      const req = tx.objectStore(OUTBOX_STORE).count();
      req.onsuccess = () => resolve(req.result || 0);
      req.onerror = () => resolve(0);
    });
  } catch (e) { return 0; }
}
async function outboxRemove(localId) {
  try {
    const db = await openOfflineDB(); if (!db) return;
    await new Promise((resolve) => {
      const tx = db.transaction(OUTBOX_STORE, "readwrite");
      tx.objectStore(OUTBOX_STORE).delete(localId);
      tx.oncomplete = resolve; tx.onerror = resolve; tx.onabort = resolve;
    });
  } catch (e) {}
}
async function outboxUpdate(localId, patch) {
  try {
    const db = await openOfflineDB(); if (!db) return;
    await new Promise((resolve) => {
      const tx = db.transaction(OUTBOX_STORE, "readwrite");
      const store = tx.objectStore(OUTBOX_STORE);
      const req = store.get(localId);
      req.onsuccess = () => {
        const row = req.result; if (!row) { resolve(); return; }
        store.put(Object.assign({}, row, patch));
      };
      tx.oncomplete = resolve; tx.onerror = resolve; tx.onabort = resolve;
    });
  } catch (e) {}
}
async function reconcileOutboxRefs(tempId, realId) {
  const entries = await outboxAll();
  for (const entry of entries) {
    let changed = false;
    let targetId = entry.targetId;
    if (targetId === tempId) { targetId = realId; changed = true; }
    let body = entry.body;
    if (body && typeof body === "object") {
      const rewrite = (obj) => {
        const out = Array.isArray(obj) ? obj.slice() : Object.assign({}, obj);
        for (const k of Object.keys(out)) {
          if (out[k] === tempId) { out[k] = realId; changed = true; }
        }
        return out;
      };
      body = Array.isArray(body) ? body.map(rewrite) : rewrite(body);
    }
    if (changed) await outboxUpdate(entry.localId, { targetId, body });
  }
}
const qs = (obj) => Object.entries(obj).filter(([,v])=>v!==undefined && v!==null && v!=="").map(([k,v])=>`${k}=${v}`).join("&");

function scopedParams(table, params) {
  const p = Object.assign({}, params);
  if (CURRENT_SCHOOL_ID && !SCHOOL_SCOPE_EXEMPT.has(table)) p.school_id = `eq.${CURRENT_SCHOOL_ID}`;
  return p;
}
function scopedBody(table, body) {
  if (!CURRENT_SCHOOL_ID || SCHOOL_SCOPE_EXEMPT.has(table)) return body;
  if (Array.isArray(body)) return body.map(row => Object.assign({ school_id: CURRENT_SCHOOL_ID }, row));
  return Object.assign({ school_id: CURRENT_SCHOOL_ID }, body);
}
async function dbSelect(table, params={}) {
  const path = `/rest/v1/${table}?${qs(scopedParams(table, Object.assign({select:"*"}, params)))}`;
  const offlineKey = table + "::" + path;
  const cached = await offlineCacheGet(offlineKey);
  if (cached !== undefined) {
    sb(path).then(fresh => offlineCachePut(offlineKey, fresh)).catch(() => {});
    return cached;
  }
  try {
    const data = await sb(path);
    offlineCachePut(offlineKey, data);
    return data;
  } catch (e) {
    if (e instanceof OfflineError) {
      noteOfflineDataServed();
      return [];
    }
    throw e;
  }
}
function genLocalId() { return "local_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
async function dbInsert(table, body) {
  const scoped = scopedBody(table, body);
  try {
    return await sb(`/rest/v1/${table}`, { method:"POST", body: JSON.stringify(scoped), headers:{ "Prefer":"return=representation" } });
  } catch (e) {
    if (!(e instanceof OfflineError)) throw e;
    const rows = (Array.isArray(scoped) ? scoped : [scoped]).map(r => Object.assign({ id: genLocalId(), created_at: new Date().toISOString() }, r));
    for (const row of rows) {
      await applyOptimisticInsert(table, row);
      await outboxAdd({ table, op:"insert", body: row, createdAt: Date.now() });
    }
    noteOfflineDataServed(); queueSyncAttempt();
    return rows;
  }
}
async function dbUpdate(table, id, body) {
  try {
    return await sb(`/rest/v1/${table}?${qs(scopedParams(table, {id:`eq.${id}`}))}`, { method:"PATCH", body: JSON.stringify(body), headers:{ "Prefer":"return=representation" } });
  } catch (e) {
    if (!(e instanceof OfflineError)) throw e;
    await applyOptimisticUpdate(table, id, body);
    await outboxAdd({ table, op:"update", targetId:id, body, createdAt: Date.now() });
    noteOfflineDataServed(); queueSyncAttempt();
    return [Object.assign({ id }, body)];
  }
}
async function dbUpsert(table, body, onConflict) {
  const scoped = scopedBody(table, body);
  try {
    return await sb(`/rest/v1/${table}?on_conflict=${onConflict}`, { method:"POST", body: JSON.stringify(scoped), headers:{ "Prefer":"resolution=merge-duplicates,return=representation" } });
  } catch (e) {

const OUTBOX_MAX_ATTEMPTS = 5;
let outboxSyncing = false;
let outboxSyncScheduled = false;
function queueSyncAttempt() {
  updateSyncBadge();
  if (outboxSyncScheduled) return;
  outboxSyncScheduled = true;
  setTimeout(() => { outboxSyncScheduled = false; flushOutbox(); }, 300);
}
async function outboxCounts() {
  const all = await outboxAll();
  const failed = all.filter(e => e.failed).length;
  return { pending: all.length - failed, failed, total: all.length };
}
async function outboxRetryFailed() {
  const all = await outboxAll();
  for (const entry of all) {
    if (entry.failed) await outboxUpdate(entry.localId, { failed: false, attempts: 0, lastError: null });
  }
  flushOutbox();
}
async function flushOutbox() {
  if (outboxSyncing || !navigator.onLine) return;
  outboxSyncing = true;
  updateSyncBadge();
  try {
    const entries = (await outboxAll()).sort((a, b) => a.createdAt - b.createdAt);
    for (const entry of entries) {
      if (entry.failed) continue; // gave up after repeated non-connectivity errors; wait for manual retry
      try {
        if (entry.op === "insert") {
          const { id: tempId, ...rest } = entry.body;
          const rows = await sb(`/rest/v1/${entry.table}`, { method:"POST", body: JSON.stringify(rest), headers:{ "Prefer":"return=representation" } });
          const real = Array.isArray(rows) ? rows[0] : rows;
          if (real) { await reconcileTempId(entry.table, tempId, real); await reconcileOutboxRefs(tempId, real.id); }
        } else if (entry.op === "update") {
          await sb(`/rest/v1/${entry.table}?${qs(scopedParams(entry.table, {id:`eq.${entry.targetId}`}))}`, { method:"PATCH", body: JSON.stringify(entry.body), headers:{ "Prefer":"return=representation" } });
        } else if (entry.op === "upsert") {
          await sb(`/rest/v1/${entry.table}?on_conflict=${entry.onConflict}`, { method:"POST", body: JSON.stringify(entry.body), headers:{ "Prefer":"resolution=merge-duplicates,return=representation" } });
        } else if (entry.op === "delete") {
          await sb(`/rest/v1/${entry.table}?${qs(scopedParams(entry.table, {id:`eq.${entry.targetId}`}))}`, { method:"DELETE" });
        } else if (entry.op === "deleteWhere") {
          await sb(`/rest/v1/${entry.table}?${qs(deleteWhereParams(entry.table, entry.filter))}`, { method:"DELETE" });
        }
        await outboxRemove(entry.localId);
        if (entry.table === "students" && entry.op === "insert") { try { await syncPendingSins(); } catch (e2) { /* best-effort */ } }
      } catch (e) {
        if (e instanceof OfflineError) break; // connectivity dropped again mid-sync — stop, the next trigger will retry
        const attempts = (entry.attempts || 0) + 1;
        const failed = attempts >= OUTBOX_MAX_ATTEMPTS;
        await outboxUpdate(entry.localId, { attempts, lastError: e.message || "Sync failed", erroredAt: Date.now(), failed });
      }
    }
  } finally {
    outboxSyncing = false;
    updateSyncBadge();
    refreshActiveView();
  }
}

const REMEMBER_KEY = "novaRememberedUsername";

function persistSessionToken(token) {

}

async function login(username, password, remember) {
