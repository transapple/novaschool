async function tryRestoreRememberedSession() {
  const username = getRememberedSession();
  const token = getPersistedSessionToken();
  if (!username || !token) { clearRememberedSession(); persistSessionToken(null); return false; }
  try {
    SESSION_TOKEN = token;
    const row = await sb(`/rest/v1/rpc/restore_session`, { method:"POST", body: JSON.stringify({ p_token: token }) });
    if (!row || !row.id) { clearRememberedSession(); persistSessionToken(null); return false; }
    profile = scrubProfile(row);
    setCurrentSchool(profile.school_id);
    await loadCurrentSchool();
    auth = { user: { id: profile.id } };
    await offlineCachePut("profile_snapshot::" + username, profile);
    markDeviceSeen();
    pinLocked = false;
    startSchoolSync();
    flushOutbox();
    primeSchoolCache();
    return true;
  } catch (e) {
    if (e instanceof OfflineError) {
      const cachedProfile = await offlineCacheGet("profile_snapshot::" + username);
      if (cachedProfile) {
        profile = cachedProfile;
        setCurrentSchool(profile.school_id);
        await loadCurrentSchool();
        auth = { user: { id: profile.id } };
        markDeviceSeen();
        pinLocked = false;
        offlineBannerStickyUntilOnline = true; updateNetStatusPill();
        startSchoolSync();
        return true;
      }
      return false;
    }
    clearRememberedSession();
    persistSessionToken(null);
    return false;
  }
}

function wrapPasswordField(input) {

  input.dataset.pwdWrapped = "1";
  const wrap = document.createElement("div");
  wrap.className = "pwd-wrap";
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "pwd-toggle";
  
  
  
  const syncIcon = () => {
    const hidden = input.type === "password";
    btn.innerHTML = hidden ? ic.eyeOff : ic.eye;
    btn.title = hidden ? "Show password" : "Hide password";

    btn.classList.toggle("on", !hidden);

  syncIcon();

  wrap.appendChild(btn);

(function initPasswordToggleObserver() {

        m.addedNodes.forEach((node) => {
          if (node.nodeType !== 1) return;
          if (node.matches && node.matches('input[type="password"]')) wrapPasswordField(node);

function fileToPhotoDataURL(file, maxDim = 480, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, maxDim / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
        const w = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
        const h = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", quality));
      } catch (e) { reject(new Error("Could not read image file.")); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read image file.")); };
    img.src = url;
  });
}
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error("Could not read image file."));
    r.readAsDataURL(file);
  });
}

      <h3>Take photo</h3>
      <div style="border-radius:12px;overflow:hidden;background:#000;margin-top:10px;position:relative;">
        <video id="camVideo" autoplay playsinline style="width:100%;display:block;max-height:60vh;object-fit:cover;"></video>
        <button type="button" class="btn btn-ghost btn-sm" id="camSwitch" style="position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);">${ic.camera} Switch</button>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" id="camCancel">Cancel</button>
        <button class="btn btn-primary" id="camCapture">Capture</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const video = overlay.querySelector("#camVideo");
  let stream = null, settled = false, facing = "user";
  const stop = () => { if (stream) stream.getTracks().forEach(t => t.stop()); };
  const close = () => { stop(); overlay.remove(); };
  overlay.querySelector(".modal-close").onclick = close;
  overlay.querySelector("#camCancel").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  
  const startCamera = (mode) => {
    stop();
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: mode }, audio: false })
      .then(s => { if (settled) { s.getTracks().forEach(t=>t.stop()); return; } stream = s; video.srcObject = s; })
      .catch(() => {
        
        if (mode !== "user") return navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then(s => { if (settled) { s.getTracks().forEach(t=>t.stop()); return; } stream = s; video.srcObject = s; })
          .catch(() => { settled = true; close(); onUnavailable && onUnavailable(); });
        settled = true; close(); onUnavailable && onUnavailable();
      });
  };
  startCamera(facing);
  overlay.querySelector("#camSwitch").onclick = () => {
    facing = facing === "user" ? "environment" : "user";
    startCamera(facing);
  };
  overlay.querySelector("#camCapture").onclick = () => {
    if (!stream) return;
    settled = true;
    const canvas = document.createElement("canvas");
    const vw = video.videoWidth || 480, vh = video.videoHeight || 480, sc = Math.min(1, 480 / Math.max(vw, vh));
    canvas.width = Math.max(1, Math.round(vw * sc)); canvas.height = Math.max(1, Math.round(vh * sc));
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
    close();
    onCapture(dataUrl);
  };
}

function scrollIntoViewIfHidden(container, item) {
  if (!container || !item) return;
  const cRect = container.getBoundingClientRect();
  const iRect = item.getBoundingClientRect();
  const fullyVisible = iRect.left >= cRect.left - 0.5 && iRect.right <= cRect.right + 0.5;
  if (!fullyVisible) item.scrollIntoView({ behavior: "smooth", inline: "nearest", block: "nearest" });
}

function restoreBottomNavScroll(container, prevScrollLeft) {
  if (!container) return;
  if (typeof prevScrollLeft === "number") container.scrollLeft = prevScrollLeft;
  scrollIntoViewIfHidden(container, container.querySelector(".bn-item.active"));
}

function enableModalKeyboardHandling(overlay) {
  const modal = overlay.querySelector(".modal");
  const vv = window.visualViewport;
  if (!modal) return;
  
  
  const revealTail = () => {
    const remaining = modal.scrollHeight - (modal.scrollTop + modal.clientHeight);
    if (remaining > 0 && remaining < 160) modal.scrollTo({ top: modal.scrollHeight, behavior: "smooth" });
  };
  modal.addEventListener("focusin", (e) => {
    const t = e.target;
    if (!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    
    setTimeout(() => {
      t.scrollIntoView({ block: "center", behavior: "smooth" });
      setTimeout(revealTail, 300);
    }, 250);
  });
  if (!vv) return;
  const resize = () => {
    overlay.style.height = vv.height + "px";
    overlay.style.top = vv.offsetTop + "px";
    overlay.style.bottom = "auto";
    modal.style.maxHeight = Math.round(vv.height * 0.9) + "px";
    if (document.activeElement && modal.contains(document.activeElement)) revealTail();
  };
  vv.addEventListener("resize", resize);
  vv.addEventListener("scroll", resize);
  resize();
  const stop = new MutationObserver(() => {
    if (document.body.contains(overlay)) return;
    vv.removeEventListener("resize", resize);
    vv.removeEventListener("scroll", resize);
    stop.disconnect();
  });
  stop.observe(document.body, { childList: true });
}

function enableAuthKeyboardHandling() {
  const wrap = document.querySelector(".login-wrap");
  const card = document.querySelector(".login-card");
  if (!wrap || !card) return;
  const vv = window.visualViewport;
  const revealTail = () => {
    const remaining = card.scrollHeight - (card.scrollTop + card.clientHeight);
    if (remaining > 0 && remaining < 160) card.scrollTo({ top: card.scrollHeight, behavior: "smooth" });
  };
  wrap.addEventListener("focusin", (e) => {
    const t = e.target;
    if (!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    setTimeout(() => {
      t.scrollIntoView({ block: "center", behavior: "smooth" });
      setTimeout(revealTail, 300);
    }, 250);
  });
  if (!vv) return;
  const resize = () => {
    wrap.style.height = vv.height + "px";
    wrap.style.top = vv.offsetTop + "px";
    card.style.maxHeight = Math.round(vv.height * 0.92) + "px";

  };

}

function customConfirm(message, opts={}) {
  return new Promise((resolve) => {
    const danger = !!opts.danger;
    const overlay = el(`<div class="overlay">
      <div class="modal confirm-box">
        <div class="confirm-msg">${message}</div>
        <div class="form-actions">
          <button class="btn btn-ghost" id="confirmNo">${opts.cancelLabel || "Cancel"}</button>

        </div>
      </div>
    </div>`);
    document.body.appendChild(overlay);
    enableModalKeyboardHandling(overlay);
    let done = false;
    const finish = (v) => { if (done) return; done = true; overlay.remove(); resolve(v); };
    overlay.querySelector("#confirmNo").onclick = () => finish(false);
    overlay.querySelector("#confirmYes").onclick = () => finish(true);
    overlay.onclick = (e) => { if (e.target === overlay) finish(false); };
  });
}

function bindRowGestures(rowEl, { onView, onEdit, onDelete }) {
  rowEl.oncontextmenu = (e) => e.preventDefault();
  let timer = null, longFired = false, startX = 0, startY = 0;
  const LONG_MS = 550, MOVE_TOL = 10;
  const start = (x,y) => {
    longFired = false; startX = x; startY = y;
    timer = setTimeout(() => {
      longFired = true;
      const actions = [];
      if (onEdit) actions.push({ label:"Edit", icon:ic.edit, onClick:onEdit });
      if (onDelete) actions.push({ label:"Delete", icon:ic.trash, danger:true, onClick:onDelete });
      if (actions.length) openActionSheet(actions);
    }, LONG_MS);
  };
  const cancel = () => { clearTimeout(timer); };
  const move = (x,y) => { if (Math.abs(x-startX)>MOVE_TOL || Math.abs(y-startY)>MOVE_TOL) cancel(); };
  rowEl.addEventListener("pointerdown", (e) => start(e.clientX, e.clientY));
  rowEl.addEventListener("pointermove", (e) => move(e.clientX, e.clientY));
  rowEl.addEventListener("pointerup", () => { cancel(); if (!longFired && onView) onView(); });
  rowEl.addEventListener("pointercancel", cancel);
  rowEl.addEventListener("pointerleave", cancel);
}

function bindTapHold(rowEl, { onTap, onHold }) {
  rowEl.oncontextmenu = (e) => e.preventDefault();
  let timer = null, longFired = false, startX = 0, startY = 0;
  const LONG_MS = 550, MOVE_TOL = 10;
  const start = (x,y) => {
    longFired = false; startX = x; startY = y;
    timer = setTimeout(() => { longFired = true; if (onHold) onHold(); }, LONG_MS);
  };
  const cancel = () => { clearTimeout(timer); };
  const move = (x,y) => { if (Math.abs(x-startX)>MOVE_TOL || Math.abs(y-startY)>MOVE_TOL) cancel(); };
  rowEl.addEventListener("pointerdown", (e) => start(e.clientX, e.clientY));
  rowEl.addEventListener("pointermove", (e) => move(e.clientX, e.clientY));
  rowEl.addEventListener("pointerup", () => { cancel(); if (!longFired && onTap) onTap(); });
  rowEl.addEventListener("pointercancel", cancel);
  rowEl.addEventListener("pointerleave", cancel);
}

async function openChatThread(other, student, onClose) {
  const meIsParent = profile.role === "parent" || profile.department === "parents";
  const parentId = meIsParent ? profile.id : other.id;
  const parentName = meIsParent ? profile.full_name : other.full_name;
  const staffId = meIsParent ? other.id : profile.id;
  const staffName = meIsParent ? other.full_name : profile.full_name;

  const overlay = el(`<div class="overlay"><div class="modal chat-modal">
    <button class="modal-close">&times;</button>
    <h3>${ic.chat} ${other.full_name}${student ? ` <span style="font-weight:600;color:var(--ink-soft);font-size:12.5px;">— ${student.full_name}</span>` : ""}</h3>
    <div class="chat-log" id="chatLog"><div class="center-loading">Loading…</div></div>
    <div class="chat-input-row">
      <textarea id="chatInput" rows="1"></textarea>
      <button class="btn btn-primary" id="chatSendBtn">Send</button>
    </div>
  </div></div>`);
  document.body.appendChild(overlay);
  enableModalKeyboardHandling(overlay);
  const close = () => { overlay.remove(); if (onClose) onClose(); };
  overlay.querySelector(".modal-close").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };

  const log = overlay.querySelector("#chatLog");
  async function load() {
    try {
      const msgs = await dbSelect("private_messages", { parent_id:`eq.${parentId}`, recipient_id:`eq.${staffId}`, order:"created_at.asc", limit:"200" });
      log.innerHTML = msgs.length ? msgs.map(m => {
        const mine = meIsParent ? m.sender_role === "parent" : m.sender_role !== "parent";
        return `<div class="chat-bubble ${mine?'chat-out':'chat-in'}">
          <div>${String(m.message||'').replace(/</g,"&lt;")}</div>
          <div class="chat-meta">${formatDate(m.created_at)}</div>
        </div>`;
      }).join("") : `<div class="empty" style="padding:24px 0;">${ic.empty}<div>No messages yet — say hello.</div></div>`;
      log.scrollTop = log.scrollHeight;
      
      msgs.filter(m => m.status === "unread" && (meIsParent ? m.sender_role !== "parent" : m.sender_role === "parent"))
        .forEach(m => { dbUpdate("private_messages", m.id, { status:"read" }).catch(()=>{}); });
    } catch (e) {
      log.innerHTML = missingSetupHtml("Chat isn't available for your school yet.");
    }
  }
  await load();

  const send = safe(async () => {
    const input = overlay.querySelector("#chatInput");
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    await dbInsert("private_messages", {
      parent_id: parentId, parent_name: parentName,
      recipient_id: staffId, recipient_name: staffName,
      subject: student ? `Chat — ${student.full_name}` : "Chat",
      message, sender_role: meIsParent ? "parent" : "staff",
      student_id: student ? student.id : null,
    });
    await load();
  });
  overlay.querySelector("#chatSendBtn").onclick = send;
  overlay.querySelector("#chatInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

async function refreshStaffBell() {
  document.querySelectorAll('[data-bell="staff"]').forEach(btn => {
    const badge = btn.querySelector(".nav-badge-count");
    if (badge) badge.remove();
  });
  if (!staffNotifEligible()) return;
  let announcements = [], messages = [], latestChangelog = null;
  try { announcements = await fetchStaffAnnouncements(); } catch (e) {}
  try { messages = await fetchStaffMessages(); } catch (e) {}
  try { latestChangelog = await fetchLatestChangelog(); } catch (e) {}
  const read = getStaffReadIds();
  const dismissed = getBellDismissedIds();
  const unreadAnnCount = announcements.filter(a => !read.has(`ann:${a.id}`) && !dismissed.has(`ann:${a.id}`)).length;
  const unreadMsgCount = messages.filter(m => m.status === "unread" && !dismissed.has(`msg:${m.id}`)).length;
  const updateUnseen = latestChangelog && isUpdateNotifFresh(latestChangelog) && String(latestChangelog.id) !== getSeenChangelogId() && !dismissed.has(`upd:${latestChangelog.id}`);
  const upgradePending = profile?.department === "administration" && schoolUpgradePending() && !dismissed.has(`schoolupg:${CURRENT_SCHOOL_ID}`);
  const count = unreadAnnCount + unreadMsgCount + (updateUnseen ? 1 : 0) + (upgradePending ? 1 : 0);
  document.querySelectorAll('[data-bell="staff"]').forEach(btn => {
    if (count > 0) btn.appendChild(el(`<span class="nav-badge-count">${count > 99 ? "99+" : count}</span>`));
  });
}

  const updateItemHtml = (latestChangelog && !updateDismissed && !updateExpired) ? `

    </div>` : "";

  
  
  const upgradePendingNow = profile?.department === "administration" && schoolUpgradePending();
  const upgradeDismissed = getBellDismissedIds().has(`schoolupg:${CURRENT_SCHOOL_ID}`);
  const upgradeItemHtml = (upgradePendingNow && !upgradeDismissed) ? `
    <div class="bell-item" id="bellUpgradeItem" style="border:1px solid var(--line);border-radius:10px;">
      <div class="b-title">🏫 School upgrade available</div>
      <div class="b-body">TransApple has moved to a new registration format. Complete a short form to finish upgrading — your students, staff, fees, exams and settings are all preserved.</div>

      <button class="btn btn-primary btn-sm" id="bellUpgradeBtn" style="margin-top:8px;width:100%;">Complete Upgrade</button>

  const itemsHtml = items.map(i => `
    <div class="bell-item" data-id="${i.id}">
      <div class="b-title">${i.kind === "Message" ? "" : "📣 "}${i.title}</div>
      <div class="b-body">${i.body}</div>
      <div class="b-meta">${i.kind} · ${new Date(i.when).toLocaleString()}</div>
    </div>`).join("");

  function renderBellBody() {
    body.innerHTML = (updateItemHtml || upgradeItemHtml || itemsHtml) ? `${updateItemHtml}${upgradeItemHtml}${itemsHtml}` : `<div class="empty">No notifications yet.</div>`;
  }
  function showEmptyIfNothingLeft() {
    if (!body.querySelector(".bell-item")) body.innerHTML = `<div class="empty">No notifications yet.</div>`;
  }
  renderBellBody();

  
  
  
  const updateBtn = document.getElementById("bellUpdateBtn");

    markChangelogSeen(latestChangelog.id);
    markBellDismissed(`upd:${latestChangelog.id}`);
    openUpdateSite();
    document.getElementById("bellUpdateItem")?.remove();
    showEmptyIfNothingLeft();
    refreshStaffBell();
  };

  
  
  
  const upgradeBtn = document.getElementById("bellUpgradeBtn");

    closeStaffBellPanel();

  };

  
  
  body.querySelectorAll(".bell-item[data-id]").forEach(rowEl => {
    bindRowGestures(rowEl, {
      onDelete: () => {
        markBellDismissed(rowEl.dataset.id);
        rowEl.remove();
        showEmptyIfNothingLeft();
        refreshStaffBell();
      },
    });
  });

  
  markStaffReadIds(announcements.map(a => `ann:${a.id}`));
  const unreadMsgIds = messages.filter(m => m.status === "unread").map(m => m.id);
  await Promise.all(unreadMsgIds.map(id => dbUpdate("parent_messages", id, { status: "read" }).catch(() => {})));
  refreshStaffBell();
}

const VAPID_PUBLIC_KEY = "BN1vsx9nDlrhKcKHTHtTSFfj7Dpwbyc45d3JJwB0clU2NkP8RBkn95axxN4ETd9_47haCWHoebERdaU2oIFAf6I";
function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function getExistingStaffPushSubscription() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return null;
  const reg = await navigator.serviceWorker.ready;
  return reg.pushManager.getSubscription();
}
async function subscribeStaffPush() {
  const reg = await navigator.serviceWorker.ready;
  const permission = await Notification.requestPermission();
  if (permission !== "granted") throw new Error("Notification permission was not granted.");
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
  });
  const json = sub.toJSON();
  await sb(`/rest/v1/push_subscriptions_staff`, { method: "POST", headers: { "Prefer": "resolution=merge-duplicates" }, body: JSON.stringify({
    endpoint: json.endpoint, p256dh: json.keys.p256dh, auth: json.keys.auth,
    school_id: CURRENT_SCHOOL_ID, profile_id: profile?.id || null, department: profile?.department || null,
  }) });
  return sub;
}
async function unsubscribeStaffPush() {
  const sub = await getExistingStaffPushSubscription();
  if (!sub) return;
  const endpoint = sub.endpoint;
  await sub.unsubscribe();
  try { await sb(`/rest/v1/push_subscriptions_staff?endpoint=eq.${encodeURIComponent(endpoint)}`, { method: "DELETE" }); } catch (e) {}
}

const UPDATE_NOTIF_WINDOW_MS = 2 * 24 * 60 * 60 * 1000;
function isUpdateNotifFresh(changelog) {
  if (!changelog || !changelog.created_at) return false;
  const releasedAt = new Date(changelog.created_at).getTime();
  if (Number.isNaN(releasedAt)) return false;
  return (Date.now() - releasedAt) < UPDATE_NOTIF_WINDOW_MS;
}

async function computeChildFeeSummary(studentId, classId) {
  const [structure, payments] = await Promise.all([
    dbSelect("fee_structures", { class_id:`eq.${classId||'null'}`, select:"amount,term_id" }).catch(()=>[]),
    dbSelect("fee_payments", { student_id:`eq.${studentId}`, select:"amount_paid,term_id" }).catch(()=>[]),
  ]);
  const totalAssigned = structure.reduce((a,b)=>a+Number(b.amount||0),0);

  return { totalAssigned, totalPaid, totalDue: Math.max(totalAssigned-totalPaid,0) };
}

async function renderParentChildFeeDetail(container, child) {
  container.innerHTML = `<div class="center-loading">Loading…</div>`;

    dbSelect("fee_payments", { student_id:`eq.${child.id}`, select:"*,terms(name)", order:"payment_date.desc" }).catch(()=>[]),
  ]);
  const totalAssigned = structure.reduce((a,b)=>a+Number(b.amount||0),0);
  const totalPaid = payments.reduce((a,b)=>a+Number(b.amount_paid||0),0);

  const termIds = [...new Set(structure.map(s=>s.term_id))];
  const termRowsHtml = termIds.map(tid => {

    const paidForTerm = payments.filter(p=>p.term_id===tid).reduce((a,b)=>a+Number(b.amount_paid||0),0);
    const bal = Math.max(due-paidForTerm,0);
    return `<div class="view-row"><div class="vlabel">${termName}</div><div class="vvalue">${currency()}${paidForTerm.toLocaleString()} / ${currency()}${due.toLocaleString()} <span style="color:${bal>0?'var(--red)':'var(--teal-dark)'};">(${currency()}${bal.toLocaleString()} due)</span></div></div>`;

async function getOrAssignReceiptNo(payment) {
  if (payment.receipt_no) return payment.receipt_no;
  const s = schoolSettings || {};
  try {
    const prefix = s.receipt_prefix || "RCT";
    const digits = s.receipt_digits || 6;
    const next = s.receipt_next_number || 1;
    const receiptNo = `${prefix}-${String(next).padStart(digits, "0")}`;
    await dbUpdate("fee_payments", payment.id, { receipt_no: receiptNo });
    await dbUpsert("school_settings", { receipt_next_number: next + 1 }, "school_id");
    await loadSchoolSettings();
    payment.receipt_no = receiptNo;
    return receiptNo;
  } catch (e) {
    return `RCT-${String(payment.id).slice(0,8).toUpperCase()}`;
  }
}

  const today = new Date().toISOString().slice(0,10);

function openGradeModal(body, existingGrades, g) {
  const isEdit = !!g;
  openModal(isEdit ? "Edit grade" : "New grade", `
    <div class="field"><label>Grade (e.g. A+, A, B+)</label><input id="f_grade" value="${g?.grade||''}"/></div>
    <div class="grid2">
      <div class="field"><label>Min score (%)</label><input id="f_min" type="number" min="0" max="100" step="1" value="${g?.min_score??''}"/></div>
      <div class="field"><label>Max score (%)</label><input id="f_max" type="number" min="0" max="100" step="1" value="${g?.max_score??''}"/></div>
    </div>
    <div class="field"><label>Remark</label><input id="f_remark" value="${g?.remark||''}"/></div>
  `, async (ov) => {
    const grade = val(ov,"f_grade").trim();
    const min_score = Number(val(ov,"f_min"));
    const max_score = Number(val(ov,"f_max"));
    if (!grade) throw new Error("Enter a grade label.");
    if (val(ov,"f_min")==="" || val(ov,"f_max")==="" || Number.isNaN(min_score) || Number.isNaN(max_score)) throw new Error("Enter both a min and max score.");
    if (min_score > max_score) throw new Error("Min score can't be greater than max score.");
    const dupeName = existingGrades.find(e => e.grade.toLowerCase()===grade.toLowerCase() && (!isEdit || e.id!==g.id));
    if (dupeName) throw new Error(`"${grade}" already exists. Edit that one instead of adding a duplicate.`);
    const overlap = existingGrades.find(e => (!isEdit || e.id!==g.id) && min_score <= Number(e.max_score) && max_score >= Number(e.min_score));
    if (overlap) throw new Error(`That range overlaps with "${overlap.grade}" (${overlap.min_score}–${overlap.max_score}%). Adjust the range so ranges don't repeat.`);
    const payload = { grade, min_score, max_score, remark: val(ov,"f_remark").trim() || null };
    if (isEdit) await dbUpdate("grades", g.id, payload); else await dbInsert("grades", payload);
    gradesCache = null;
    renderGrades(body);
  }, { saveLabel: isEdit ? "Save changes" : "Add" });
}

function openSubjectModal(body, classes, s, linkedClassIds) {
  const isEdit = !!s;
  openModal(isEdit ? "Edit subject" : "New subject", `
    <div class="field"><label>Subject name</label><input id="f_name" value="${s?.name||''}"/></div>
    <div class="field"><label>Code</label><input id="f_code" value="${s?.code||''}"/></div>
    <div class="field"><label>Linked classes</label>
      <div style="max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:8px;">
        ${classes.length ? classes.map(c=>`
          <label style="display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:13.5px;">
            <input type="checkbox" class="f_classlink" value="${c.id}" style="width:auto;" ${linkedClassIds.includes(c.id)?'checked':''}/>
            ${c.name}${c.section?(' '+c.section):''}
          </label>
        `).join("") : `<div style="color:var(--ink-soft);font-size:13px;padding:4px;">Create a class first in Setup.</div>`}
      </div>
    </div>
  `, async (ov) => {
    const payload = { name: val(ov,"f_name"), code: val(ov,"f_code") };
    let subjectId = s?.id;
    if (isEdit) await dbUpdate("subjects", subjectId, payload);
    else { const created = await dbInsert("subjects", payload); subjectId = created[0].id; }
    const selectedIds = [...ov.querySelectorAll(".f_classlink:checked")].map(cb=>cb.value);
    const toAdd = selectedIds.filter(id => !linkedClassIds.includes(id));
    const toRemove = linkedClassIds.filter(id => !selectedIds.includes(id));
    if (toAdd.length) await dbInsert("class_subjects", toAdd.map(class_id => ({ class_id, subject_id: subjectId })));
    for (const class_id of toRemove) { await dbDeleteWhere("class_subjects", { class_id, subject_id: subjectId }); }
    renderSubjects(body);
  }, { saveLabel: isEdit ? "Save changes" : "Add" });
}

function emptyState(text) { return `<div class="empty">${ic.empty}<div>${text}</div></div>`; }

function sortSelectHtml(id, selected, includeGender=true) {
  const opts = [["newest","Newest"],["oldest","Oldest"],["az","A–Z"],["za","Z–A"]];
  if (includeGender) opts.push(["male","Male"],["female","Female"]);
  return `<select id="${id}">${opts.map(([v,l])=>`<option value="${v}" ${selected===v?'selected':''}>${l}</option>`).join("")}</select>`;
}

function sortToParams(sortBy, nameCol, dateCol, genderCol="gender") {
  const params = {};
  switch (sortBy) {
    case "oldest": params.order = `${dateCol}.asc`; break;
    case "az": params.order = `${nameCol}.asc`; break;
    case "za": params.order = `${nameCol}.desc`; break;
    case "male": params.order = `${nameCol}.asc`; params[genderCol] = "eq.Male"; break;
    case "female": params.order = `${nameCol}.asc`; params[genderCol] = "eq.Female"; break;
    case "newest": default: params.order = `${dateCol}.desc`; break;
  }
  return params;
}

  lab:        { label:"Laboratory Equipment",   itemNoun:"item",           categoryLabel:"Lab (e.g. Physics, Chemistry, Biology, Computer)",   locationLabel:"Location / bench" },

};
async function renderInventory(container, sub="property") {

  container.innerHTML = `<div class="pill-row" id="pills"></div><div id="secBody"><div class="center-loading">Loading…</div></div>`;
  const pillDefs = [["property","Property Register"],["classroom","Classroom Equipment"],["lab","Laboratory Equipment"],["stationery","Stationery Store"],["maintenance","Asset Maintenance"],["stock","Stock Levels"]];
  const pills = document.getElementById("pills");
  pillDefs.forEach(([id,label])=>{
    const p = el(`<div class="pill ${sub===id?'active':''}">${label}</div>`);

async function renderInventoryModule(body, moduleKey, opts={}) {
  const def = INVENTORY_MODULE_DEFS[moduleKey];
  const search = opts.search || "";
  const sortBy = opts.sortBy || "az";
  let items = [];
  let missingTable = false;
  try {
    const params = { module:`eq.${moduleKey}`, order: sortToParams(sortBy,"name","created_at").order };
    if (search) params.name = `ilike.*${search}*`;
    items = await dbSelectActive("inventory_items", params);
  } catch (e) { missingTable = true; }

  if (missingTable) {
    body.innerHTML = missingSetupHtml("Inventory & Assets isn't available for your school yet.") +
      `<button class="btn btn-primary" id="retryInvBtn" style="margin-top:12px;">Refresh</button>`;
    document.getElementById("retryInvBtn").onclick = () => renderInventoryModule(body, moduleKey, opts);
    return;
  }

  body.innerHTML = `<div class="section-head"><h3 style="color:var(--navy);">${def.label}</h3><button class="btn btn-primary btn-sm" id="addBtn">${ic.plus} Add ${def.itemNoun}</button></div>

      <input id="searchInput" value="${search}" style="flex:1;"/>
      ${sortSelectHtml("sortSel", sortBy, false)}

    <div class="card" id="list"></div>`;
  document.getElementById("searchInput").oninput = debounce((e)=>renderInventoryModule(body, moduleKey, {search:e.target.value, sortBy}), 350);
  document.getElementById("sortSel").onchange = (e)=>renderInventoryModule(body, moduleKey, {search, sortBy:e.target.value});

  const list = document.getElementById("list");
  list.innerHTML = items.length ? "" : emptyState(`No ${def.itemNoun}s yet. Add your first one to start tracking it.`);
  const condCls = c => c==="New"?"badge-green":c==="Good"?"badge-green":c==="Fair"?"badge-amber":"badge-red";
  items.forEach(it => {
    const low = it.reorder_level != null && Number(it.quantity) <= Number(it.reorder_level);
    const row = el(`<div class="list-row"><div class="avatar">${initials(it.name)}</div>
      <div class="list-main"><div class="list-title">${it.name} ${low?'<span class="badge badge-red">Low stock</span>':''}</div>
      <div class="list-sub">${it.category ? it.category+" · " : ""}${it.location ? it.location+" · " : ""}Qty: ${it.quantity} ${it.unit||""} <span class="badge ${condCls(it.condition)}">${it.condition||"—"}</span></div></div></div>`);
    const view = () => openViewModal(it.name, [
      [def.categoryLabel.split(" (")[0], it.category], [def.locationLabel, it.location],

      ["Acquired", it.acquired_date], ["Notes", it.notes],
    ], () => openInventoryItemModal(body, moduleKey, def, it, {search,sortBy}));
    const edit = () => openInventoryItemModal(body, moduleKey, def, it, {search,sortBy});
    const del = async () => { if (await customConfirm(`Move "${it.name}" to trash?`, { danger:true, okLabel:"Move to trash" })) safe(async()=>{ await softDelete("inventory_items", it.id); renderInventoryModule(body, moduleKey, {search,sortBy}); })(); };
    bindRowGestures(row, { onView:view, onEdit:edit, onDelete:del });
    list.appendChild(row);
  });
  document.getElementById("addBtn").onclick = () => openInventoryItemModal(body, moduleKey, def, null, {search,sortBy});
}
function openInventoryItemModal(body, moduleKey, def, it, opts) {

function daysOverdue(dueDate) {
  const due = new Date(dueDate + "T00:00:00");
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((today - due) / 86400000);
}
async function renderLibrary(container, sub="catalog") {
  setActiveRefresh(() => renderLibrary(container, sub));
  const prevPillScroll = document.getElementById("pills")?.scrollLeft;
  container.innerHTML = `<div class="pill-row" id="pills"></div><div id="secBody"><div class="center-loading">Loading…</div></div>`;
  const pillDefs = [["catalog","Book Catalog"],["borrowing","Borrowing & Returns"],["overdue","Overdue Books"],["fines","Library Fines"]];
  const pills = document.getElementById("pills");
  pillDefs.forEach(([id,label])=>{
    const p = el(`<div class="pill ${sub===id?'active':''}">${label}</div>`);
    p.onclick = () => renderLibrary(container, id);
    pills.appendChild(p);
  });
  if (typeof prevPillScroll === "number") pills.scrollLeft = prevPillScroll;
  scrollIntoViewIfHidden(pills, pills.querySelector(".pill.active"));
  const body = document.getElementById("secBody");
  if (sub==="borrowing") return renderLibraryBorrowing(body);
  if (sub==="overdue") return renderLibraryOverdue(body);
  if (sub==="fines") return renderLibraryFines(body);
  return renderBookCatalog(body);
}

async function renderBookCatalog(body, opts={}) {
  const search = opts.search || "";
  const sortBy = opts.sortBy || "az";
  let books = [];
  let missingTable = false;
  try {
    const params = { order: sortToParams(sortBy,"title","created_at").order };
    if (search) params.title = `ilike.*${search}*`;
    books = await dbSelectActive("library_books", params);
  } catch (e) { missingTable = true; }

  if (missingTable) {
    body.innerHTML = missingSetupHtml("Library isn't available for your school yet.") +
      `<button class="btn btn-primary" id="retryLibBtn" style="margin-top:12px;">Refresh</button>`;
    document.getElementById("retryLibBtn").onclick = () => renderBookCatalog(body, opts);
    return;
  }

  body.innerHTML = `<div class="section-head"><h3 style="color:var(--navy);">Book Catalog</h3><button class="btn btn-primary btn-sm" id="addBtn">${ic.plus} Add book</button></div>
    <div class="filters-row" style="display:flex;gap:8px;margin-bottom:10px;">
      <input id="searchInput" value="${search}" style="flex:1;"/>
      ${sortSelectHtml("sortSel", sortBy, false)}
    </div>
    <div class="card" id="list"></div>`;
  document.getElementById("searchInput").oninput = debounce((e)=>renderBookCatalog(body,{search:e.target.value,sortBy}),350);
  document.getElementById("sortSel").onchange = (e)=>renderBookCatalog(body,{search,sortBy:e.target.value});

  const list = document.getElementById("list");
  list.innerHTML = books.length ? "" : emptyState("No books yet. Add your first title to start the catalog.");
  const condCls = c => (c==="New"||c==="Good") ? "badge-green" : c==="Fair" ? "badge-amber" : "badge-red";
  books.forEach(b => {
    const outOfStock = Number(b.available_copies) <= 0;
    const row = el(`<div class="list-row"><div class="avatar">${initials(b.title)}</div>
      <div class="list-main"><div class="list-title">${b.title} ${outOfStock?'<span class="badge badge-red">All borrowed</span>':''}</div>
      <div class="list-sub">${b.author ? b.author+" · " : ""}${b.category ? b.category+" · " : ""}Available: ${b.available_copies}/${b.total_copies} <span class="badge ${condCls(b.condition)}">${b.condition||"—"}</span></div></div></div>`);
    const view = () => openViewModal(b.title, [
      ["Author", b.author], ["ISBN", b.isbn], ["Category", b.category], ["Publisher", b.publisher],
      ["Copies", `${b.available_copies} available of ${b.total_copies}`], ["Shelf location", b.shelf_location],
      ["Condition", b.condition], ["Notes", b.notes],
    ], () => openBookModal(body, b, {search,sortBy}));
    const edit = () => openBookModal(body, b, {search,sortBy});
    const del = async () => { if (await customConfirm(`Move "${b.title}" to trash?`, { danger:true, okLabel:"Move to trash" })) safe(async()=>{ await softDelete("library_books", b.id); renderBookCatalog(body,{search,sortBy}); })(); };
    bindRowGestures(row, { onView:view, onEdit:edit, onDelete:del });
    list.appendChild(row);
  });
  document.getElementById("addBtn").onclick = () => openBookModal(body, null, {search,sortBy});
}
function openBookModal(body, b, opts) {
  const isEdit = !!b;
  openModal(isEdit ? "Edit book" : "New book", `
    <div class="field"><label>Title</label><input id="f_title" value="${b?.title||''}"/></div>
    <div class="grid2">
      <div class="field"><label>Author</label><input id="f_author" value="${b?.author||''}"/></div>
      <div class="field"><label>ISBN (optional)</label><input id="f_isbn" value="${b?.isbn||''}"/></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Category</label><input id="f_category" value="${b?.category||''}"/></div>
      <div class="field"><label>Publisher</label><input id="f_publisher" value="${b?.publisher||''}"/></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Total copies</label><input id="f_copies" type="number" min="1" step="1" value="${b?.total_copies??1}"/></div>
      <div class="field"><label>Shelf location</label><input id="f_shelf" value="${b?.shelf_location||''}"/></div>
    </div>
    <div class="field"><label>Condition</label><select id="f_condition">${["New","Good","Fair","Poor","Damaged"].map(c=>`<option value="${c}" ${b?.condition===c?'selected':''}>${c}</option>`).join("")}</select></div>
    <div class="field"><label>Notes</label><textarea id="f_notes" rows="2">${b?.notes||''}</textarea></div>
  `, async (ov) => {
    const title = val(ov,"f_title").trim();
    if (!title) throw new Error("Enter a title.");
    const total_copies = Number(val(ov,"f_copies"));
    if (val(ov,"f_copies")==="" || Number.isNaN(total_copies) || total_copies < 1) throw new Error("Enter a valid number of copies.");
    let available_copies = total_copies;
    if (isEdit) {
      
      
      const delta = total_copies - Number(b.total_copies);
      available_copies = Math.max(0, Math.min(total_copies, Number(b.available_copies) + delta));
    }
    const payload = {
      title, author: val(ov,"f_author").trim() || null, isbn: val(ov,"f_isbn").trim() || null,
      category: val(ov,"f_category").trim() || null, publisher: val(ov,"f_publisher").trim() || null,
      total_copies, available_copies,
      shelf_location: val(ov,"f_shelf").trim() || null, condition: val(ov,"f_condition"),
      notes: val(ov,"f_notes").trim() || null,
    };
    if (isEdit) await dbUpdate("library_books", b.id, payload); else await dbInsert("library_books", payload);
    renderBookCatalog(body, opts);
  }, { saveLabel: isEdit ? "Save changes" : "Add" });
}

async function renderLibraryBorrowing(body, opts={}) {
  const search = opts.search || "";
  let loans = [], books = [];
  let missingTable = false;
  try {
    const params = { order:"borrowed_at.desc" };
    if (search) params.or = `(borrower_name.ilike.*${encodeURIComponent(search)}*,book_title.ilike.*${encodeURIComponent(search)}*)`;
    loans = await dbSelectActive("library_loans", params);
    books = await dbSelectActive("library_books", { order:"title.asc" });
  } catch (e) { missingTable = true; }

  if (missingTable) {
    body.innerHTML = missingSetupHtml("Library isn't available for your school yet.") +
      `<button class="btn btn-primary" id="retryLoanBtn" style="margin-top:12px;">Refresh</button>`;
    document.getElementById("retryLoanBtn").onclick = () => renderLibraryBorrowing(body, opts);
    return;
  }

  body.innerHTML = `<div class="section-head"><h3 style="color:var(--navy);">Borrowing &amp; Returns</h3><button class="btn btn-primary btn-sm" id="addBtn">${ic.plus} New loan</button></div>
    <input id="searchInput" value="${search}" style="margin-bottom:10px;"/>
    <div class="card" id="list"></div>`;
  document.getElementById("searchInput").oninput = debounce((e)=>renderLibraryBorrowing(body,{search:e.target.value}),350);

  const list = document.getElementById("list");
  list.innerHTML = loans.length ? "" : emptyState("No loans yet. Borrow a book to start tracking it.");
  loans.forEach(l => {
    const isOut = !l.returned_at;
    const overdue = isOut && daysOverdue(l.due_date) > 0;
    const statusBadge = !isOut ? '<span class="badge badge-green">Returned</span>' : overdue ? `<span class="badge badge-red">Overdue ${daysOverdue(l.due_date)}d</span>` : '<span class="badge badge-amber">Borrowed</span>';
    const row = el(`<div class="list-row" style="flex-wrap:wrap;align-items:flex-start;"><div class="avatar">${initials(l.book_title)}</div>
      <div class="list-main"><div class="list-title">${l.book_title} ${statusBadge}</div>
      <div class="list-sub">${l.borrower_name} (${l.borrower_type}) · Due ${l.due_date}${l.returned_at ? " · Returned "+l.returned_at.slice(0,10) : ""}</div></div>
      ${isOut ? `<button class="btn btn-primary btn-sm returnBtn" data-id="${l.id}">${ic.check} Return</button>` : ""}
      </div>`);
    
    
    
    
    bindTapHold(row, {
      onTap: () => openViewModal(l.book_title, [
        ["Borrower", `${l.borrower_name} (${l.borrower_type})`], ["Borrowed", l.borrowed_at ? l.borrowed_at.slice(0,10) : "—"], ["Due", l.due_date],
        ["Returned", l.returned_at ? l.returned_at.slice(0,10) : "Not yet returned"], ["Fine", l.fine_amount ? `${currency()}${l.fine_amount} (${l.fine_paid?"paid":"unpaid"})` : "None"],
        ["Notes", l.notes],
      ], () => openLoanEditModal(body, l, opts)),
      onHold: () => openActionSheet([
        { label:"Edit", icon:ic.edit, onClick:() => openLoanEditModal(body, l, opts) },
        { label:"Delete", icon:ic.trash, danger:true, onClick: async () => { if (await customConfirm(`Delete this loan record for "${l.book_title}"?`, { danger:true, okLabel:"Move to trash" })) safe(async()=>{ await softDelete("library_loans", l.id); renderLibraryBorrowing(body, opts); })(); } },
      ]),
    });
    const returnBtn = row.querySelector(".returnBtn");
    if (returnBtn) {
      
      
      
      ["pointerdown","pointerup","pointermove","click"].forEach(evt => returnBtn.addEventListener(evt, e => e.stopPropagation()));
      returnBtn.onclick = safe(async () => {
        await returnLoan(l);
        toast("Marked as returned.", false);
        renderLibraryBorrowing(body, opts);
      });
    }
    list.appendChild(row);
  });
  document.getElementById("addBtn").onclick = () => openLoanModal(body, books, opts);
}
async function returnLoan(loan) {
  await dbUpdate("library_loans", loan.id, { returned_at: new Date().toISOString() });
  if (loan.book_id) {
    try {
      const rows = await dbSelect("library_books", { id:`eq.${loan.book_id}`, select:"id,total_copies,available_copies" });
      const b = rows[0];
      if (b) await dbUpdate("library_books", b.id, { available_copies: Math.min(Number(b.total_copies), Number(b.available_copies) + 1) });
    } catch (e) {  }
  }
}

async function renderStudents(container, opts={}) {
  const sub = opts.sub || "roster";
  setActiveRefresh(() => renderStudents(container, opts));
  const prevPillScroll = document.getElementById("pills")?.scrollLeft;
  container.innerHTML = `<div class="pill-row" id="pills"></div><div id="secBody"><div class="center-loading">Loading…</div></div>`;
  const pillDefs = [["roster","Roster"],["previous","Previous"],["requests","Requests"]];
  const pills = document.getElementById("pills");
  pillDefs.forEach(([id,label])=>{
    const p = el(`<div class="pill ${sub===id?'active':''}">${label}</div>`);
    p.onclick = () => renderStudents(container, {sub:id});
    pills.appendChild(p);
  });
  if (typeof prevPillScroll === "number") pills.scrollLeft = prevPillScroll;
  scrollIntoViewIfHidden(pills, pills.querySelector(".pill.active"));
  const body = document.getElementById("secBody");
  if (sub === "requests") return renderStudentRequests(body, container, opts);
  if (sub === "previous") return renderStudentPrevious(body, container, opts);
  return renderStudentRoster(body, container, opts);
}
async function renderStudentRoster(body, container, opts={}) {
  const search = opts.search || "";

  const sortBy = opts.sortBy || "az";
  let params = { select:"*,classes(name,section)", ...sortToParams(sortBy, "full_name", "created_at", "gender") };
  if (search) params.or = `(full_name.ilike.*${encodeURIComponent(search)}*,admission_no.ilike.*${encodeURIComponent(search)}*)`;
  if (classFilter) params.class_id = `eq.${classFilter}`;
  params.status = "neq.transferred";
  syncPendingSins().then(r => { if (r && r.success && (r.linked || r.rejected)) renderStudents(container, opts); });
  const [classes, students] = await Promise.all([
    dbSelectActive("classes", { order:"name.asc" }),

  students.forEach(s => {

    </div>`);

      let info = null;
      try { info = await sinRpc("school_student_sin_info", { p_student_id: s.id }); } catch (e) { info = null; }
      const sinLabel = info && info.sin ? `<span style="font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;">${reqEsc(info.sin)}</span>`
        : s.sin_status === "review" ? `Under review by Mother${info && info.review_ref ? " (" + reqEsc(info.review_ref) + ")" : ""}`
        : s.sin_status === "rejected" ? "Rejected" : "SIN pending";
      const openCorr = info && info.open_correction;
      const overlay = openViewModal(s.full_name, [
        ["Photo", s.photo_url ? `<img src="${s.photo_url}" style="width:56px;height:56px;border-radius:10px;object-fit:cover;"/>` : ""],
        ["Admission no.", reqEsc(s.admission_no)], ["SIN", sinLabel],
        ["Open correction", openCorr ? reqEsc(openCorr.ref) + " — waiting for Mother" : ""],
        ["Class", s.classes ? (s.classes.name+(s.classes.section?(' '+s.classes.section):'')) : 'Unassigned'],
        ["Gender", s.gender], ["Date of birth", s.date_of_birth],
        ["Parent/guardian", s.guardian_name], ["Relationship", s.guardian_relation], ["Guardian phone", s.guardian_contact],
        ["Medical information", s.medical_info],
        ["Village", s.village], ["Subcounty", s.sub_county], ["District", s.district],
        ["Emergency contact", s.emergency_name], ["Emergency relationship", s.emergency_relation], ["Emergency phone", s.emergency_contact],
        ["Status", s.status],
      ], canManageStudents ? (() => openStudentModal(container, classes, s)) : null,
      (canManageStudents && s.student_identity_id && s.status === "active")
        ? [{ label:"Request correction", onClick: () => { if (openCorr) toast(`A correction is already open (${reqEsc(openCorr.ref)}). Wait for Mother to resolve it.`, true); else openCorrectionModal(container, s); } },
           { label:"Corrections", onClick: () => openCorrectionHistory(s) }]
        : (s.student_identity_id ? [{ label:"Corrections", onClick: () => openCorrectionHistory(s) }] : []));
      
      
      
      const fab = openParentQuickCompose(s);
      const cleanup = () => fab.remove();
      overlay.querySelectorAll("[id^='modalExtra']").forEach(b => b.addEventListener("click", cleanup));
      overlay.querySelector(".modal-close").addEventListener("click", cleanup);
      overlay.querySelector("#modalCancel").addEventListener("click", cleanup);

  });
  if (canManageStudents) addFab(container, () => openStudentModal(container, classes, null));

function reqEsc(s) { return String(s==null?"":s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
const REQ_APP_KIND_LABEL = { registration:"Registration", transfer:"Transfer", class_change:"Class change", document_update:"Document update" };
const REQ_AUTH_KIND_LABEL = { access_grant:"Access grant", transfer_request:"Transfer request", data_release:"Data release" };
const REQ_STATUS_CLS = { pending:"badge-amber", approved:"badge-green", rejected:"badge-red", withdrawn:"badge-grey", revoked:"badge-grey" };

async function renderStudentRequests(body, container, opts={}) {
  const kind = opts.reqKind || "applications";
  const statusFilter = opts.reqStatus || "pending";
  body.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
      <div class="pill-row" id="reqPills" style="margin:0;"></div>
      <select id="reqStatusSel"><option value="pending" ${statusFilter==="pending"?"selected":""}>Pending</option><option value="all" ${statusFilter==="all"?"selected":""}>All</option></select>
    </div>
    <div class="card" id="reqList"><div class="center-loading">Loading…</div></div>
  `;
  const rp = document.getElementById("reqPills");
  [["applications","Applications"],["authorizations","Authorizations"]].forEach(([id,label])=>{
    const p = el(`<div class="pill ${kind===id?'active':''}">${label}</div>`);
    p.onclick = () => renderStudents(container, {sub:"requests", reqKind:id, reqStatus:statusFilter});
    rp.appendChild(p);
  });
  document.getElementById("reqStatusSel").onchange = (e) => renderStudents(container, {sub:"requests", reqKind:kind, reqStatus:e.target.value});

  const list = document.getElementById("reqList");
  const canResolve = hasFullAccess(profile) || profile?.department === "academic";
  const p_status = statusFilter === "all" ? null : "pending";
  const rpcName = kind === "applications" ? "school_list_student_applications" : "school_list_student_authorizations";
  let rows;
  try {
    rows = await sb(`/rest/v1/rpc/${rpcName}`, { method:"POST", body: JSON.stringify({ p_status }) });
  } catch (e) {
    list.innerHTML = emptyState(e.message || "Couldn't load requests.");
    return;
  }
  rows = Array.isArray(rows) ? rows : [];
  list.innerHTML = rows.length ? "" : emptyState(statusFilter==="pending" ? "No pending requests." : "No requests yet.");
  const KIND_LABEL = kind === "applications" ? REQ_APP_KIND_LABEL : REQ_AUTH_KIND_LABEL;
  rows.forEach(r => {
    const when = r.submitted_at || r.requested_at;
    const row = el(`<div class="list-row" style="cursor:pointer;">
      <div class="list-main">
        <div class="list-title">${reqEsc(r.student_full_name || "Unknown student")} <span class="tiny-note">${reqEsc(r.student_sin || "")}</span></div>
        <div class="list-sub">${KIND_LABEL[r.kind] || reqEsc(r.kind)}${r.notes ? " — " + reqEsc(r.notes) : ""} · ${when ? new Date(when).toLocaleString() : ""}</div>
      </div>
      <span class="badge ${REQ_STATUS_CLS[r.status] || 'badge-grey'}">${r.status}</span>
    </div>`);
    row.onclick = () => {
      const extra = (canResolve && r.status === "pending")
        ? [ { label:"Reject", run: () => askResolveStudentRequest(kind, r, false, container, opts) },
            { label:"Approve", primary:true, run: () => askResolveStudentRequest(kind, r, true, container, opts) } ]
        : [];
      const overlay = openViewModal(r.student_full_name || "Request", [
        ["Student", r.student_full_name], ["SIN", r.student_sin],
        ["Type", KIND_LABEL[r.kind] || r.kind], ["Status", r.status],
        ["Student's notes", r.notes], ["School's notes", r.resolution_notes],
        ["Submitted", when ? new Date(when).toLocaleString() : ""],
        ["Resolved", r.resolved_at ? new Date(r.resolved_at).toLocaleString() : ""],
      ], null, extra);
      extra.forEach((b,i) => { const btn = overlay.querySelector(`#modalExtra${i}`); if (btn) btn.onclick = () => { overlay.remove(); b.run(); }; });
    };
    list.appendChild(row);
  });
}

function askResolveStudentRequest(kind, r, approve, container, opts) {
  const rpcName = kind === "applications" ? "school_resolve_student_application" : "school_resolve_student_authorization";
  openModal(approve ? "Approve request" : "Reject request",
    `<p style="margin-bottom:10px;">${approve ? "Approve" : "Reject"} the ${(kind==="applications"?REQ_APP_KIND_LABEL:REQ_AUTH_KIND_LABEL)[r.kind] || r.kind} request from <b>${reqEsc(r.student_full_name)}</b>?</p>
     <div class="field"><label>Note to the student (optional)</label><textarea id="m_notes" rows="3"></textarea></div>`,
    async (ov) => {
      const notes = val(ov, "m_notes");
      const res = await sb(`/rest/v1/rpc/${rpcName}`, { method:"POST", body: JSON.stringify({ p_id: r.id, p_approve: approve, p_notes: notes || null }) });
      if (!res || res.success === false) throw new Error((res && res.error) || "Could not resolve the request.");
      toast(approve ? "Request approved" : "Request rejected", false);
      renderStudents(container, opts);
    },
    { saveLabel: approve ? "Approve" : "Reject" }
  );
}
const SIN_LEN = 10; // fixed — mirrors the server-side check (sin_is_valid)
function normalizeSIN(raw) {
  return String(raw || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase();
}
function sinLooksValid(sin) { return sin.length === SIN_LEN; }

async function sinRpc(name, args) {
  const res = await sb(`/rest/v1/rpc/${name}`, { method:"POST", body: JSON.stringify(args || {}) });
  if (res && res.success === false) throw new Error(res.error || "Something went wrong.");
  return res;
}

let sinSyncBusy = false;

function showRegistrationOutcome(name, res) {
  const st = res && res.status;
  if (st === "linked") {
    toast(`${reqEsc(name)} registered${res.issued ? " — a new SIN was issued" : ""}.`, false);
    const rows = [["Student", reqEsc(name)], ["SIN", `<span class="mono" style="font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;">${reqEsc(res.sin || "")}</span>`]];
    if (res.returning) rows.push(["Note", "This student is returning — the earlier record was restored."]);
    openViewModal("Registered", rows, null, []);
  } else if (st === "review") {
    openViewModal("SIN pending", [
      ["Student", reqEsc(name)],
      ["Status", "Saved as “SIN pending”. Mother is reviewing a possible match."],
      ["Reference", reqEsc(res.ref || "")],
    ], null, []);
  } else if (st === "duplicate") {
    toast(reqEsc(res.message || "That student is already registered here."), true);
  } else if (st === "rejected") {
    toast("Mother rejected this registration.", true);
  } else {
    toast("Saved.", false);
  }
}

const CORRECTION_FIELDS = [
  ["full_name","Full name","text"], ["date_of_birth","Date of birth","date"], ["gender","Gender","gender"],
  ["guardian_name","Parent/guardian name","text"], ["guardian_relation","Relationship","text"], ["guardian_contact","Guardian phone","text"],
  ["village","Village","text"], ["sub_county","Subcounty","text"], ["district","District","text"],
  ["medical_info","Medical information","area"],
  ["emergency_name","Emergency contact name","text"], ["emergency_relation","Emergency relationship","text"], ["emergency_contact","Emergency phone","text"],
];
const CORRECTION_LABEL = Object.fromEntries(CORRECTION_FIELDS.map(([k,l]) => [k,l]));
const CORRECTION_STATUS = { pending:"Pending", approved:"Approved", rejected:"Rejected" };

function openCorrectionModal(container, s) {
  const inputs = CORRECTION_FIELDS.map(([k, label, type]) => {
    const v = reqEsc(s[k] == null ? "" : s[k]);
    if (type === "gender") return `<div class="field"><label>${label}</label><select id="c_${k}">${["Male","Female"].map(g => `<option ${s[k]===g?"selected":""}>${g}</option>`).join("")}</select></div>`;
    if (type === "area") return `<div class="field"><label>${label}</label><textarea id="c_${k}" rows="2">${v}</textarea></div>`;
    return `<div class="field"><label>${label}</label><input id="c_${k}" type="${type}" value="${v}"/></div>`;
  }).join("");
  openModal(`Request correction — ${reqEsc(s.full_name)}`,
    `<p class="tiny-note" style="text-align:left;margin-bottom:10px;">Change only what is wrong. Mother reviews the request; nothing changes until it is approved. Only one request can be open per student.</p>
     ${inputs}
     <div class="field"><label>Why is this correction needed?</label><textarea id="c_reason" rows="2"></textarea></div>`,
    async (ov) => {
      const changes = {};
      CORRECTION_FIELDS.forEach(([k]) => {
        const now = String(ov.querySelector(`#c_${k}`).value || "").trim();
        if (now !== String(s[k] == null ? "" : s[k]).trim()) changes[k] = now || null;
      });
      if (!Object.keys(changes).length) throw new Error("Change at least one detail first.");
      const reason = val(ov, "c_reason").trim();
      if (!reason) throw new Error("Give a reason for the correction.");
      const res = await sinRpc("school_submit_correction", { p_student_id: s.id, p_changes: changes, p_reason: reason });
      toast(`Correction ${reqEsc(res.ref || "")} sent to Mother.`, false);
      renderStudents(container);
    }, { saveLabel: "Send to Mother" });
}

async function openCorrectionHistory(s) {
  let list = [];
  try { list = await sinRpc("school_list_corrections", { p_student_id: s.id }); }
  catch (e) { toast(e.message || "Couldn't load corrections.", true); return; }
  const rows = (Array.isArray(list) ? list : []).map(c => {
    const what = Object.keys(c.changes || {}).map(k => CORRECTION_LABEL[k] || k).join(", ");
    return [`${reqEsc(c.ref)} · ${CORRECTION_STATUS[c.status] || reqEsc(c.status)}`,
      `${reqEsc(what)}<br/><span class="tiny-note" style="text-align:left;">${reqEsc(c.reason || "")}${c.resolution_notes ? " — Mother: " + reqEsc(c.resolution_notes) : ""}</span>`];
  });
  openViewModal(`Corrections — ${reqEsc(s.full_name)}`, rows.length ? rows : [["", "No corrections yet."]], null, []);
}

      <div class="field"><label>Subcounty</label><input id="f_subcounty" required ${ro} value="${esc(s?.sub_county||'')}"/></div>
    </div>
    <div class="field"><label>District</label><input id="f_district" required ${ro} value="${esc(s?.district||'')}"/></div>

    <div class="field" style="font-weight:700;color:var(--navy-2);margin-top:6px;">Emergency contact</div>
    <div class="grid2">
      <div class="field"><label>Name</label><input id="f_ename" ${ro} value="${esc(s?.emergency_name||'')}"/></div>
      <div class="field"><label>Relationship</label><input id="f_erel" ${ro} value="${esc(s?.emergency_relation||'')}"/></div>
    </div>
    <div class="field"><label>Phone number</label><input id="f_ephone" ${ro} value="${esc(s?.emergency_contact||'')}"/></div>

    ${isEdit ? `<div class="field"><label>Status</label><select id="f_status" required>
      ${["active","inactive","graduated"].map(v=>`<option value="${v}" ${s?.status===v?'selected':''}>${v}</option>`).join("")}</select></div>` : ""}
  `, async (ov) => {
    if (linked) {
      if (!val(ov, "f_class")) throw new Error("Class is required.");
      const chosen = ov.querySelector("#f_photo_live").files[0] || ov.querySelector("#f_photo_pick").files[0];
      const photo_url = capturedPhotoDataUrl || (chosen ? await fileToPhotoDataURL(chosen) : (s.photo_url || null));
      await dbUpdate("students", s.id, { class_id: val(ov, "f_class") || null, status: val(ov, "f_status"), photo_url });
      renderStudents(container);
      return;
    }
    const sin = normalizeSIN(val(ov, "f_sin"));
    if (sin && !sinLooksValid(sin)) throw new Error(`A SIN is exactly ${SIN_LEN} letters/numbers. Clear the box if the student has none.`);
    requireFields(ov, [
      ["f_name","Full name"], ["f_dob","Date of birth"], ["f_class","Class"],
      ["f_gname","Parent/guardian name"], ["f_grel","Parent/guardian relationship"], ["f_gphone","Parent/guardian phone"],
      ["f_medical","Medical information"], ["f_village","Village"], ["f_subcounty","Subcounty"], ["f_district","District"],
    ]);
    const chosenFile = ov.querySelector("#f_photo_live").files[0] || ov.querySelector("#f_photo_pick").files[0];
    if (!isEdit && !capturedPhotoDataUrl && !chosenFile && !sinPhotoUrl) throw new Error("A registration photo is required — use Live or Pick, or check the SIN to fetch it.");
    const photo_url = capturedPhotoDataUrl || (chosenFile ? await fileToPhotoDataURL(chosenFile) : (sinPhotoUrl || s?.photo_url || null));
    const payload = {
      full_name: val(ov,"f_name"), date_of_birth: val(ov,"f_dob")||null,
      gender: val(ov,"f_gender"), class_id: val(ov,"f_class")||null,
      guardian_name: val(ov,"f_gname"), guardian_relation: val(ov,"f_grel"), guardian_contact: val(ov,"f_gphone"),
      medical_info: val(ov,"f_medical"),
      village: val(ov,"f_village"), sub_county: val(ov,"f_subcounty"), district: val(ov,"f_district"),
      emergency_name: val(ov,"f_ename"), emergency_relation: val(ov,"f_erel"), emergency_contact: val(ov,"f_ephone"),
      sin_entered: sin || null, photo_url,
    };
    if (isEdit) {
      payload.status = val(ov, "f_status");
      await dbUpdate("students", s.id, payload);
      renderStudents(container);
      return;
    }
    payload.status = "active";
    const rows = await dbInsert("students", payload);
    const saved = Array.isArray(rows) ? rows[0] : rows;
    if (!saved || String(saved.id).startsWith("local_")) {
      toast("Saved offline as “SIN pending”. It will be linked when you are back online.", false);
      renderStudents(container);
      return;
    }
    let outcome = null;
    let finalizeErr = null;
    try { outcome = await schoolFinalizeStudent(saved.id); }
    catch (e) { finalizeErr = e; }
    renderStudents(container);
    if (outcome) showRegistrationOutcome(payload.full_name, outcome);
    else if (finalizeErr && !(finalizeErr instanceof OfflineError)) toast(`Saved as “SIN pending”. Could not link it yet: ${reqEsc(finalizeErr.message || "")}`, true);
    else toast("Saved as “SIN pending”. It will be linked when you are back online.", false);
  }, { saveLabel: isEdit ? "Save changes" : "Register" });

  wireDobField(document, "f_dob");
  const lockIdentity = (on) => {
    ["f_name","f_gname","f_grel","f_gphone","f_medical","f_village","f_subcounty","f_district","f_ename","f_erel","f_ephone"]
      .forEach(id => { const n = document.getElementById(id); if (n) n.readOnly = on; });
    ["f_gender","f_dob_y","f_dob_m","f_dob_d"].forEach(id => { const n = document.getElementById(id); if (n) n.disabled = on; });
  };
  if (linked) lockIdentity(true);
  const liveInput = document.getElementById("f_photo_live");
  const pickInput = document.getElementById("f_photo_pick");
  const setPreview = (dataUrl) => { document.getElementById("photoPreviewWrap").innerHTML = avatarHtml(s?.full_name, dataUrl, 72); };
  document.getElementById("liveBtn").onclick = () => {
    openCameraCapture(
      (dataUrl) => { capturedPhotoDataUrl = dataUrl; liveInput.value = ""; pickInput.value = ""; setPreview(dataUrl); },
      () => { toast("In-page camera isn't available here — opening the picker instead.", false); liveInput.click(); }
    );
  };
  document.getElementById("pickBtn").onclick = () => pickInput.click();
  liveInput.onchange = async () => {
    if (!liveInput.files[0]) return;
    capturedPhotoDataUrl = null; pickInput.value = "";
    const dataUrl = await fileToPhotoDataURL(liveInput.files[0]);
    if (dataUrl) setPreview(dataUrl);
  };
  pickInput.onchange = async () => {
    if (!pickInput.files[0]) return;
    capturedPhotoDataUrl = null; liveInput.value = "";
    const dataUrl = await fileToPhotoDataURL(pickInput.files[0]);
    if (dataUrl) setPreview(dataUrl);
  };
  if (linked) return;

  const sinInput = document.getElementById("f_sin");
  const checkBtn = document.getElementById("sinCheckBtn");
  const statusEl = document.getElementById("sinStatus");
  const setStatus = (msg, kind) => {
    statusEl.textContent = msg;
    statusEl.style.color = kind === "ok" ? "var(--teal-dark)" : kind === "warn" ? "var(--amber-dark)" : kind === "err" ? "#C0392B" : "";
  };
  sinInput.oninput = () => { sinInput.value = normalizeSIN(sinInput.value); if (prefilled) { prefilled = false; sinPhotoUrl = null; lockIdentity(false); } setStatus("", ""); };

  const setField = (id, value) => {
    const node = document.getElementById(id);
    if (!node || value === undefined || value === null || String(value).trim() === "") return false;
    node.value = String(value).trim();
    return true;
  };
  const setDob = (iso) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
    if (!m) return false;
    document.getElementById("f_dob_y").value = m[1];
    document.getElementById("f_dob_m").value = String(Number(m[2]));
    document.getElementById("f_dob_d").value = String(Number(m[3]));
    document.getElementById("f_dob").value = `${m[1]}-${m[2]}-${m[3]}`;
    return true;
  };
  const setGender = (g) => {
    const wanted = String(g || "").trim().toLowerCase();
    const sel = document.getElementById("f_gender");
    const opt = [...sel.options].find(o => o.value.toLowerCase() === wanted || o.text.toLowerCase() === wanted);
    if (!opt) return false;
    sel.value = opt.value;
    return true;
  };

  let busy = false;
  const runCheck = async () => {
    if (busy) return;
    const sin = normalizeSIN(sinInput.value);
    sinInput.value = sin;
    if (sin && !sinLooksValid(sin)) { setStatus(`A SIN is exactly ${SIN_LEN} letters/numbers.`, "err"); return; }
    busy = true; checkBtn.disabled = true; setStatus("Checking…", "");
    try {
      const res = await schoolCheckStudent({
        sin, full_name: val(document, "f_name"), date_of_birth: val(document, "f_dob") || null,
        gender: val(document, "f_gender"), guardian_name: val(document, "f_gname"),
      });
      const st = res.status;
      if (st === "ok" || st === "match_exact") {
        const rec = res.identity || {};
        let filled = 0;
        if (setField("f_name", rec.full_name)) filled++;
        if (setDob(rec.date_of_birth)) filled++;
        if (setGender(rec.gender)) filled++;
        [["f_village","village"],["f_subcounty","sub_county"],["f_district","district"],
         ["f_gname","guardian_name"],["f_grel","guardian_relation"],["f_gphone","guardian_contact"],
         ["f_medical","medical_info"],["f_ename","emergency_name"],["f_erel","emergency_relation"],["f_ephone","emergency_contact"]
        ].forEach(([id,col]) => { if (setField(id, rec[col])) filled++; });
        if (rec.photo_url) { sinPhotoUrl = rec.photo_url; setPreview(rec.photo_url); filled++; }
        prefilled = true; lockIdentity(true);
        setStatus(`${res.returning ? "Returning student. " : ""}Record found — ${filled} field${filled===1?"":"s"} filled from the SIN record. Choose the class, then Register.`, "ok");
      } else if (st === "match_partial" || st === "need_details" || st === "no_match") {
        setStatus(res.message || "", st === "match_partial" ? "warn" : "");
      } else {
        setStatus(res.message || "Couldn't use that SIN.", "err"); // invalid_sin, unknown_sin, locked, already_here
      }
    } catch (e) {
      setStatus(e instanceof OfflineError ? "You're offline — checking needs a connection. You can still register; it will be saved as “SIN pending”." : (e.message || "Couldn't check."), e instanceof OfflineError ? "warn" : "err");
    } finally { busy = false; checkBtn.disabled = false; }
  };
  checkBtn.onclick = runCheck;
  sinInput.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); runCheck(); } };
}

async function renderTeachers(container, opts={}) {
  setActiveRefresh(() => renderTeachers(container, opts));
  const search = opts.search || "";
  const sortBy = opts.sortBy || "az";
  let params = { ...sortToParams(sortBy, "full_name", "created_at", "gender") };
  if (search) params.full_name = `ilike.*${encodeURIComponent(search)}*`;
  const teachers = await dbSelectActive("teachers", params);
  container.innerHTML = `
    <h3 style="color:var(--purple);margin-bottom:12px;">Staff</h3>
    <div class="search-bar">
      <input id="searchInput" value="${search}"/>
      ${sortSelectHtml("sortSel", sortBy, true)}
    </div>
    <div class="card" id="list"></div>
  `;
  document.getElementById("searchInput").oninput = debounce((e)=>renderTeachers(container,{search:e.target.value,sortBy}),350);
  document.getElementById("sortSel").onchange = (e)=>renderTeachers(container,{search,sortBy:e.target.value});
  const list = document.getElementById("list");
  list.innerHTML = teachers.length ? "" : emptyState("No staff yet.");
  const allClasses = await dbSelectActive("classes", { order:"name.asc" }).catch(()=>[]);
  teachers.forEach(t => {
    const classesTaught = allClasses.filter(c=>c.class_teacher_id===t.id);
    const classNames = classesTaught.map(c=>c.name+(c.section?(' '+c.section):'')).join(", ");
    const row = el(`<div class="list-row">
      ${avatarHtml(t.full_name, t.photo_url)}
      <div class="list-main"><div class="list-title">${t.full_name}</div>
      <div class="list-sub">${t.specialty||'General'} ${t.staff_no?('· '+t.staff_no):''} ${t.nova_teacher_id?('· '+t.nova_teacher_id):''}</div></div>
      <span class="badge ${t.status==='active'?'badge-green':'badge-grey'}">${t.status}</span>
    </div>`);
    const view = () => openViewModal(t.full_name, [
      ["Photo", t.photo_url ? `<img src="${t.photo_url}" style="width:56px;height:56px;border-radius:10px;object-fit:cover;"/>` : ""],
      ["AiO Teacher ID", t.nova_teacher_id],
      ["Staff no.", t.staff_no], ["Phone", t.phone], ["Email", t.email], ["Gender", t.gender], ["Grade", t.grade],
      ["Specialty", t.specialty], ["Qualification", t.qualification],
      ["Village", t.village], ["Subcounty", t.subcounty], ["District", t.district],
      ["Emergency contact", t.emergency_name], ["Emergency relationship", t.emergency_relationship], ["Emergency phone", t.emergency_phone],
      ["Class teacher of", classNames || "Not assigned to a class"],
      ["Status", t.status],
    ], () => openTeacherModal(container, t), [
      { label:"Full profile", icon:ic.teacher, onClick: () => { pushNavState(() => renderTeachers(container).catch(errShow(container))); renderTeacherProfile(container, t).catch(errShow(container)); } },
    ]);
    const edit = () => openTeacherModal(container, t);
    const del = async () => { if (await customConfirm(`Move ${t.full_name} to trash?`, { danger:true, okLabel:"Move to trash" })) safe(async()=>{ await softDelete("teachers", t.id); renderTeachers(container,{search,sortBy}); })(); };
    bindRowGestures(row, { onView:view, onEdit:edit, onDelete:del });
    list.appendChild(row);
  });
  addFab(container, () => openTeacherModal(container, null));
}

        };
      });
    }, 400);
    nameInput.oninput = runMatch;
    ninInput.oninput = runMatch;
  }
}

const NOVA_TEACHER_IDENTITY_SQL = `-- AiO Teacher Identity: run once in Supabase -> SQL Editor, before TEACHER_PROFILE_SQL.

create table if not exists teacher_identities (
  id uuid primary key default gen_random_uuid(),
  nova_id text not null unique,
  full_name text not null,
  national_id_no text,
  date_of_birth date,
  gender text,
  photo_url text,
  created_at timestamptz not null default now()
);
-- Two different national ID numbers can never share an identity; blanks are fine.
create unique index if not exists teacher_identities_national_id_uq
  on teacher_identities (national_id_no) where national_id_no is not null and national_id_no <> '';
alter table teacher_identities enable row level security;
drop policy if exists "Anyone can read teacher_identities" on teacher_identities;
create policy "Anyone can read teacher_identities" on teacher_identities for select using (true);
drop policy if exists "Authenticated can manage teacher_identities" on teacher_identities;
create policy "Authenticated can manage teacher_identities" on teacher_identities for all using (true);

create sequence if not exists nova_teacher_id_seq start 1;

-- Link each per-school Staff record to a global identity. nova_teacher_id is
-- a denormalized copy of teacher_identities.nova_id so lists/search never
-- need a join. email is new too, alongside the phone this table already had.
alter table teachers add column if not exists teacher_identity_id uuid references teacher_identities(id);
alter table teachers add column if not exists nova_teacher_id text;
alter table teachers add column if not exists email text;
create index if not exists teachers_identity_idx on teachers (teacher_identity_id);

-- The ONLY place an AiO ID is ever generated. Matches an existing person by
-- National ID first (most reliable), then by exact name + date of birth, and
-- reuses their AiO ID instead of creating a new one — this is what stops a
-- teacher getting a duplicate identity just for joining another school.
drop function if exists find_or_create_teacher_identity(text, text, date, text, text);
create function find_or_create_teacher_identity(
  p_full_name text, p_national_id_no text default null, p_date_of_birth date default null,
  p_gender text default null, p_photo_url text default null
) returns teacher_identities
language plpgsql security definer as $find_or_create_teacher_identity$
declare found teacher_identities; new_nova_id text;
begin
  if p_national_id_no is not null and trim(p_national_id_no) <> '' then
    select * into found from teacher_identities where national_id_no = trim(p_national_id_no) limit 1;
  end if;
  if found.id is null and p_date_of_birth is not null then
    select * into found from teacher_identities
      where trim(lower(full_name)) = trim(lower(p_full_name)) and date_of_birth = p_date_of_birth
      limit 1;
  end if;
  if found.id is not null then
    -- Keep the identity's record current, but never blank out what's already on file.
    update teacher_identities set
      full_name = coalesce(nullif(trim(p_full_name), ''), full_name),
      national_id_no = coalesce(nullif(trim(p_national_id_no), ''), national_id_no),
      date_of_birth = coalesce(p_date_of_birth, date_of_birth),
      gender = coalesce(nullif(p_gender, ''), gender),
      photo_url = coalesce(nullif(p_photo_url, ''), photo_url)
      where id = found.id returning * into found;
    return found;
  end if;
  new_nova_id := 'NOVA-TCH-' || lpad(nextval('nova_teacher_id_seq')::text, 6, '0');
  insert into teacher_identities (nova_id, full_name, national_id_no, date_of_birth, gender, photo_url)
  values (new_nova_id, p_full_name, nullif(trim(p_national_id_no),''), p_date_of_birth, p_gender, p_photo_url)
  returning * into found;
  return found;
end;
$find_or_create_teacher_identity$;
grant execute on function find_or_create_teacher_identity(text,text,date,text,text) to anon, authenticated;

-- Powers the "check for an existing AiO ID" search in the Add Staff form —
-- matches by name, National ID, or phone across ALL schools, so an admin can
-- catch a likely duplicate (e.g. a typo'd National ID) before saving.
drop function if exists search_teacher_identities(text);
create function search_teacher_identities(p_query text)
returns table(id uuid, nova_id text, full_name text, national_id_no text, date_of_birth date, schools text)
language sql stable as $search_teacher_identities$
  select ti.id, ti.nova_id, ti.full_name, ti.national_id_no, ti.date_of_birth,
    coalesce(string_agg(distinct s.name, ', '), '') as schools
  from teacher_identities ti
  left join teachers t on t.teacher_identity_id = ti.id and t.deleted_at is null
  left join schools s on s.id = t.school_id
  where p_query is not null and trim(p_query) <> '' and (
    ti.full_name ilike '%' || p_query || '%'
    or ti.national_id_no ilike '%' || p_query || '%'
    or exists (select 1 from teachers t2 where t2.teacher_identity_id = ti.id and t2.phone ilike '%' || p_query || '%')
  )
  group by ti.id
  order by ti.full_name
  limit 8;
$search_teacher_identities$;
grant execute on function search_teacher_identities(text) to anon, authenticated;

-- One-time migration: every existing Staff row predates AiO IDs, so give
-- each one its own identity. Each becomes its own person for now — there's
-- no reliable field on file yet (no National ID captured historically) to
-- safely tell whether two existing rows across schools are the same human,
-- so the safe default is "don't guess and merge strangers together". From
-- this point on, every NEW teacher goes through find_or_create_teacher_identity()
-- above, so real duplicates are prevented going forward.
do $$
declare r record; new_nova_id text; new_identity_id uuid;
begin
  for r in select * from teachers where teacher_identity_id is null loop
    new_nova_id := 'NOVA-TCH-' || lpad(nextval('nova_teacher_id_seq')::text, 6, '0');
    insert into teacher_identities (nova_id, full_name, gender, photo_url)
    values (new_nova_id, r.full_name, r.gender, r.photo_url)
    returning id into new_identity_id;
    update teachers set teacher_identity_id = new_identity_id, nova_teacher_id = new_nova_id where id = r.id;
  end loop;
end $$;
`;
