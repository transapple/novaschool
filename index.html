<style>
:root{

  @keyframes fadeSlideDown{0%{opacity:0;transform:translateY(-8px);}100%{opacity:1;transform:translateY(0);}}

  @keyframes sheetUp{0%{opacity:0;transform:translateY(24px);}100%{opacity:1;transform:translateY(0);}}
  .pageTitleAnim{display:inline-block;}
  .action-sheet-overlay{position:fixed;inset:0;background:rgba(22,39,74,.35);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
  .action-sheet{background:#fff;width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));animation:sheetUp .18s ease;}
  @media(min-width:860px){.action-sheet-overlay{align-items:center;}.action-sheet{border-radius:16px;}}
  .action-sheet .as-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:2px auto 10px;}
  .action-sheet button{width:100%;text-align:left;padding:13px 14px;border-radius:10px;border:none;background:none;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;color:var(--ink);}
  .action-sheet button:hover{background:var(--card-alt);}
  .action-sheet button.as-danger{color:var(--red);}
  .action-sheet button.as-cancel{color:var(--ink-soft);margin-top:4px;border-top:1px solid var(--line);border-radius:0;}
  .view-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .view-row:last-child{border-bottom:none;}
  .view-row .vlabel{color:var(--ink-soft);font-weight:600;}

  .list-row{cursor:pointer;-webkit-user-select:none;user-select:none;}

  .trash-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  *{box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  body{margin:0;position:fixed;inset:0;width:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
  #app{display:block;}
  h1,h2,h3{font-weight:700;letter-spacing:-0.02em;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:#c9d0dc;border-radius:10px;}

  /* ---------- LOGIN ---------- */
  @keyframes gradientFlow{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
  .login-wrap{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 35%,var(--sky) 65%,var(--navy) 100%);background-size:300% 300%;animation:gradientFlow 14s ease infinite;padding:20px;}
  .login-card{background:var(--card);border-radius:20px;padding:36px 28px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 20px 60px rgba(10,20,50,.35);margin:auto;}

  .auth-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;cursor:pointer;}
  .login-card .link-btn{cursor:pointer;}
  .login-card .btn[disabled]{opacity:.6;cursor:default;}
  .auth-chip{display:none;margin-top:7px;padding:7px 10px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--slate-tint);color:var(--ink-soft);}

  /* ---- Full-screen status states: pending approval / suspended / deleted ---- */
  .status-badge-lg{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;}
  .status-badge-lg.tone-amber{background:var(--amber-tint);color:var(--amber-dark);}
  .status-badge-lg.tone-red{background:var(--red-tint);color:var(--red);}
  .status-badge-lg.tone-slate{background:var(--slate-tint);color:var(--slate);}
  .status-badge-lg svg{width:28px;height:28px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;background:#FAFBFD;outline:none;transition:border-color .15s;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);background:#fff;}
  .pwd-wrap{position:relative;}
  .pwd-wrap input{padding-right:42px;}

  input[type="time"],input[type="datetime-local"]{ color-scheme: light; }

  }

  /* ---------- CUSTOM DATE PICKER (fully app-styled, replaces native OS date picker
     so the "Set/Cancel" buttons are ours to colour, not the phone OS's) ---------- */
  input.datefield{
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%232E9E7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>');

  input.datefield::placeholder{color:var(--ink-soft);}

    position:fixed;z-index:500;background:#fff;border-radius:16px;
    box-shadow:0 16px 44px rgba(16,30,60,.28);border:1px solid var(--line);
    padding:14px;width:288px;animation:riseIn .14s ease;

  /* ---------- TYPED DATE-OF-BIRTH INPUT (Day / Month / Year boxes) ----------

  /* ---------- CHAT WITH PARENT ---------- */
  .chat-icon-btn{border:none;background:var(--teal-tint);color:var(--teal-dark);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:4px;}

  .masthead .header-avatar-wrap{border-color:rgba(255,255,255,.4);}
  .masthead .header-avatar-wrap .header-avatar-fallback{background:rgba(255,255,255,.22);color:#fff;}
  .bell-panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,100vw);background:#fff;box-shadow:-8px 0 30px rgba(22,39,74,.18);z-index:200;display:flex;flex-direction:column;animation:bellSlideIn .22s ease;}
  @keyframes bellSlideIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  .bell-panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px;border-bottom:1px solid var(--line);}
  .bell-panel-body{flex:1;overflow-y:auto;padding:8px 14px 20px;}
  .bell-item{padding:11px 4px;border-bottom:1px solid var(--line);}
  .bell-item:last-child{border-bottom:none;}
  .bell-item .b-title{font-weight:700;font-size:13.5px;color:var(--navy);}
  .bell-item .b-body{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .bell-item .b-meta{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .bell-backdrop{position:fixed;inset:0;background:rgba(15,20,35,.35);z-index:190;}

  @media(min-width:860px){
    .sidebar{display:flex;}
    .main{margin-left:230px;}
    .bottomnav{display:none;}
    .content{padding-bottom:16px;}
  }

  /* ---------- COMPONENTS ---------- */
  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(22,39,74,.05);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .section-head h2{font-size:18px;color:var(--navy);}
  /* Horizontal scrolling chip row — used for every module's sub-navigation
     (Inventory's Property/Classroom/Lab/etc, Fees' Payments/Structures/etc,
     Library, Exams...). Chips sit in a single row at the top and the row
     scrolls sideways when there are more than fit on screen. */
  .pill-row{display:flex;flex-direction:row;flex-wrap:nowrap;gap:8px;margin-bottom:16px;background:transparent;border:none;padding:2px 0 8px;overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .pill-row::-webkit-scrollbar{display:none;}
  .pill{display:flex;align-items:center;justify-content:center;width:auto;padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--ink);box-shadow:0 1px 2px rgba(22,39,74,.04);text-align:center;flex-shrink:0;white-space:nowrap;transition:background .15s ease,border-color .15s ease,box-shadow .15s ease;}
  .pill:active{transform:scale(.985);}
  .pill.active{background:var(--teal-tint);border-color:var(--teal);color:var(--teal-dark);box-shadow:0 2px 10px rgba(46,158,124,.15);}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
  .stat{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:16px;border-left:4px solid var(--teal);box-shadow:0 1px 3px rgba(22,39,74,.05);}
  .stat:nth-child(4n+2){border-left-color:var(--sky);}
  .stat:nth-child(4n+3){border-left-color:var(--amber);}
  .stat:nth-child(4n+4){border-left-color:var(--purple);}
  .stat .num{font-size:24px;font-weight:800;color:var(--navy);}
  .stat .lbl{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
  /* Every list item (inventory item, fee record, library book, exam, student
     row, etc.) is now its own tappable native-style card — rounded, its own
     shadow, a bit of breathing room between items — instead of a flat list
     divided by thin border lines. */
  .list-row{display:flex;align-items:center;gap:12px;padding:13px 12px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(22,39,74,.04);transition:box-shadow .15s ease,transform .1s ease;}
  .list-row:active{transform:scale(.985);box-shadow:0 1px 1px rgba(22,39,74,.03);}
  .list-row:last-child{margin-bottom:0;}
  .avatar{width:40px;height:40px;border-radius:11px;background:var(--sky-tint);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);font-size:14px;flex-shrink:0;}
  .list-main{flex:1;min-width:0;}
  .list-title{font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .list-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* Every module wraps its item list in <div class="card" id="list">. Now that
     each .list-row is its own native card, that wrapper just needs to be a
     plain spacing container — not a second nested card around every row. */
  .card#list{background:transparent;border:none;box-shadow:none;padding:0;margin-bottom:14px;}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .badge-green{background:#e5f6ee;color:var(--teal-dark);}
  .badge-amber{background:#fdf1de;color:#a06a13;}
  .badge-red{background:#fdecec;color:var(--red);}
  .badge-grey{background:#eef0f4;color:var(--ink-soft);}
  .icon-btn{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .search-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .search-bar input{flex:1;min-width:140px;}
  .search-bar select{flex:0 0 auto;min-width:108px;}
  .fab{position:fixed;right:18px;bottom:96px;width:46px;height:46px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(46,158,124,.45);border:none;z-index:25;touch-action:none;user-select:none;-webkit-user-select:none;}
  .fab svg{width:20px;height:20px;}
  @media(min-width:860px){.fab{bottom:28px;}}
  .empty{text-align:center;padding:40px 16px;color:var(--ink-soft);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 3px rgba(22,39,74,.05);}
  .empty svg{margin-bottom:10px;opacity:.5;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,22,40,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal{background:#fff;width:100%;max-width:480px;border-radius:18px;padding:22px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-size:17px;color:var(--navy);margin-bottom:16px;}
  .modal-close{float:right;background:none;border:none;font-size:20px;color:var(--ink-soft);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .form-actions{display:flex;gap:10px;margin-top:6px;}
  .form-actions .btn{flex:1;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:9px 8px;border-bottom:2px solid var(--line);}
  td{padding:9px 8px;border-bottom:1px solid var(--line);}
  .table-wrap{overflow-x:auto;}
  /* Excel-style colored columns for the fee payment history table */
  .fee-history-table{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:640px;}
  .fee-history-table thead th{color:#fff;font-weight:800;font-size:11px;border-bottom:none;padding:12px 16px;white-space:nowrap;}
  .fee-history-table thead th:first-child{border-radius:10px 0 0 0;}
  .fee-history-table thead th:last-child{border-radius:0 10px 0 0;}
  .fee-history-table tbody td{padding:13px 16px;font-weight:600;border-bottom:1px solid var(--card);vertical-align:middle;}
  .fee-history-table tbody tr:last-child td{border-bottom:none;}
  .fee-history-table th,.fee-history-table td{border-right:3px solid var(--card);}
  .fee-history-table th:last-child,.fee-history-table td:last-child{border-right:none;}
  .fee-history-table .col-date-h,.fee-history-table .col-date-d{width:16%;white-space:nowrap;}
  .fee-history-table .col-student-h,.fee-history-table .col-student-d{width:32%;}
  .fee-history-table .col-student-d{line-height:1.4;overflow-wrap:break-word;}
  .fee-history-table .col-term-h,.fee-history-table .col-term-d{width:18%;overflow-wrap:break-word;}
  .fee-history-table .col-amount-h,.fee-history-table .col-amount-d{width:18%;white-space:nowrap;}
  .fee-history-table .col-method-h,.fee-history-table .col-method-d{width:16%;white-space:nowrap;}

  /* ---------- PARENT PORTAL: digital receipt ---------- */
  .receipt-box{padding:4px 0 10px;position:relative;}
  .receipt-stamp{position:absolute;top:64px;right:6px;width:104px;height:104px;border-radius:50%;border:2.5px solid var(--teal);opacity:.6;transform:rotate(-16deg);display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2;}
  .receipt-stamp-inner{width:86px;height:86px;border-radius:50%;border:1.5px solid var(--teal);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;}
  .receipt-stamp .rs-line1{font-size:8px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--teal-dark);line-height:1.2;}
  .receipt-stamp .rs-line2{font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--teal-dark);margin:2px 0;}
  .receipt-stamp .rs-line3{font-size:7.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--teal-dark);}
  @media print{ .receipt-stamp{opacity:.7;} }
  .receipt-head{text-align:center;margin-bottom:14px;padding-bottom:14px;border-bottom:2px dashed var(--line);}
  .receipt-logo{width:44px;height:44px;border-radius:10px;object-fit:cover;margin-bottom:6px;}
  .receipt-school{font-size:17px;font-weight:800;color:var(--navy);}
  .receipt-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .receipt-title{font-size:12.5px;font-weight:700;color:var(--teal-dark);margin-top:8px;text-transform:uppercase;letter-spacing:.04em;}
  .receipt-amount{display:flex;justify-content:space-between;align-items:center;background:var(--teal-tint);border-radius:12px;padding:14px 16px;margin-top:14px;font-weight:800;color:var(--teal-dark);font-size:17px;}
  .receipt-foot{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:14px;}
  @media print{
    body *{visibility:hidden;}
    #receiptArea,#receiptArea *{visibility:visible;}
    #receiptArea{position:fixed;left:0;top:0;width:100%;margin:0;padding:24px;}
  }
  .col-date-h{background:var(--sky);}
  .col-date-d{background:var(--sky-tint);color:#1D5A96;}
  .col-student-h{background:var(--indigo);}
  .col-student-d{background:var(--indigo-tint);color:#3E4199;}
  .col-term-h{background:var(--purple);}
  .col-term-d{background:var(--purple-tint);color:#5B4FC4;}
  .col-amount-h{background:var(--teal);}
  .col-amount-d{background:var(--teal-tint);color:var(--teal-dark);font-weight:800;}
  .col-method-h{background:var(--amber);}
  .col-method-d{background:var(--amber-tint);color:var(--amber-dark);}
  .att-btns{display:flex;gap:5px;flex-wrap:wrap;}
  .att-btn{padding:6px 10px;border-radius:8px;font-size:11.5px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);}
  /* Roll call: full name on its own line (no truncation), Present/Absent stacked below it. */
  .roll-row{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:12px 6px;border-bottom:1px solid var(--line);cursor:default;}
  .roll-row:last-child{border-bottom:none;}
  .roll-top{display:flex;align-items:center;gap:12px;}
  .roll-name{font-weight:700;font-size:14.5px;color:var(--ink);white-space:normal;overflow:visible;word-break:break-word;}
  .roll-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .roll-row .att-btns{width:100%;}
  .roll-row .att-btn{flex:1;padding:5px 6px;font-size:10px;text-align:center;}
  .att-btn.p.on{background:#e5f6ee;color:var(--teal-dark);border-color:var(--teal);}

  /* ---- Masthead (mobile branding strip; sidebar handles this on desktop) ---- */
  .masthead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 18px;background:linear-gradient(200deg,var(--navy) 0%,var(--navy-2) 45%,#274b8a 100%);background-size:250% 250%;animation:gradientFlow 18s ease infinite;color:#fff;flex-shrink:0;position:relative;overflow:hidden;}
  .masthead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--teal),var(--amber),var(--sky));opacity:.85;}
  .masthead-logo{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;font-weight:800;font-size:12px;}
  .masthead-logo img{width:100%;height:100%;object-fit:cover;display:block;}
  .masthead .bell-btn{background:rgba(255,255,255,.16);color:#fff;}
  .masthead-right{display:flex;align-items:center;gap:8px;flex-shrink:0;z-index:1;}
  @media(min-width:860px){.masthead{display:none;}}

  /* ---- Settings page ---- */
  .settings-card-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
  .settings-card-head .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .settings-card-head h3{font-size:15.5px;}
  .settings-card-head p{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  /* ---- Settings: tabbed panels (each panel keeps a distinct accent color
     so the sections read as unique places rather than one long scroll) ---- */
  .settings-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:14px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .settings-tabs::-webkit-scrollbar{display:none;}
  .settings-tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:700;color:var(--ink-soft);white-space:nowrap;transition:background .15s,border-color .15s,color .15s,box-shadow .15s;}
  .settings-tab svg{width:15px;height:15px;flex-shrink:0;}
  .settings-tab:active{transform:scale(.97);}
  .settings-tab.active{color:#fff;border-color:transparent;box-shadow:0 4px 12px -2px rgba(20,30,60,.35);}
  .settings-panels{position:relative;}
  .settings-panel{display:none;}
  .settings-panel.active{display:block;animation:riseIn .16s ease;}
  .settings-panel-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:4px 10px;border-radius:999px;margin-bottom:12px;}
  .logo-upload{width:84px;height:84px;border-radius:16px;background:var(--sky-tint);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;flex-shrink:0;overflow:hidden;font-weight:800;font-size:24px;color:var(--navy);border:2px dashed var(--line);transition:border-color .15s;}
  .logo-upload:hover{border-color:var(--teal);}
  .logo-upload img{width:100%;height:100%;object-fit:cover;}
  .logo-upload .cam{position:absolute;right:0;bottom:0;left:0;background:rgba(22,39,74,.72);color:#fff;font-size:10px;font-weight:700;text-align:center;padding:4px 0;letter-spacing:.2px;}
  .stamp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:16px;}
  .stamp-tile{text-align:center;}
  .stamp-tile .logo-upload{width:84px;height:84px;border-radius:50%;margin:0 auto 8px;background:var(--teal-tint);}
  .stamp-tile .stamp-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);}
  .stamp-tile .stamp-del{margin-top:4px;background:none;border:none;color:var(--red);font-size:11px;font-weight:700;padding:2px 6px;}
  .stamp-tile .stamp-del:hover{text-decoration:underline;}
  .receipt-preview-chip{display:inline-block;background:var(--teal-tint);color:var(--teal-dark);font-weight:800;font-size:13px;letter-spacing:.03em;padding:6px 12px;border-radius:8px;margin-top:6px;}
  .receipt-stamp-img{position:absolute;top:56px;right:10px;width:96px;height:96px;object-fit:contain;opacity:.85;transform:rotate(-10deg);pointer-events:none;z-index:2;}
  @media print{ .receipt-stamp-img{opacity:.9;} }
  .swatch-row{display:flex;gap:10px;flex-wrap:wrap;}
  .swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;display:flex;align-items:center;justify-content:center;transition:transform .12s ease;box-shadow:0 1px 3px rgba(22,39,74,.15);}
  .swatch:hover{transform:scale(1.08);}
  .swatch.on{border-color:var(--navy);}
  .swatch svg{opacity:0;width:15px;height:15px;stroke:#fff;}
  .swatch.on svg{opacity:1;}
  .header-preview{border-radius:14px;overflow:hidden;border:1px solid var(--line);}
  .header-preview .hp-inner{display:flex;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(200deg,var(--navy) 0%,var(--navy-2) 45%,#274b8a 100%);color:#fff;}
  .header-preview .hp-logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;overflow:hidden;flex-shrink:0;}
  .header-preview .hp-logo img{width:100%;height:100%;object-fit:cover;}
  .header-preview .hp-name{font-weight:800;font-size:14px;}
  .header-preview .hp-motto{font-size:11.5px;color:#c9d4ea;font-style:italic;margin-top:1px;}
  .about-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .about-row:last-child{border-bottom:none;}
  .about-row .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);font-weight:700;min-width:92px;flex-shrink:0;padding-top:1px;}
  .about-row .val{font-size:13.5px;color:var(--ink);line-height:1.55;white-space:pre-wrap;}
  .att-btn.a.on{background:#fdecec;color:var(--red);border-color:var(--red);}
  .att-btn.l.on{background:#fdf1de;color:#a06a13;border-color:var(--amber);}
  .att-btn.e.on{background:#eef0f4;color:var(--ink-soft);border-color:#b7bfcf;}
  .center-loading{display:flex;align-items:center;justify-content:center;padding:60px 0;color:var(--ink-soft);font-size:13.5px;}

  /* ---- Content protection: no text selection, no copy/cut, no long-press
     callout/context menu anywhere in the app. Inputs/textareas/contenteditable
     are explicitly excluded so typing, editing and selecting your own entered
     text still works normally. -webkit-touch-callout:none stops iOS Safari's
     long-press "Copy/Look Up" bubble, which is also what triggers the
     long-press haptic buzz on those devices; combined with the JS guards
     below (contextmenu/selectstart/copy/cut) this covers Android + desktop
     too. ---- */
  html,body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;}
  input,textarea,[contenteditable="true"],[contenteditable=""]{-webkit-user-select:text;-moz-user-select:text;-ms-user-select:text;user-select:text;-webkit-touch-callout:default;}

  /* ================= AiO ai — Chat ================= */
  /* Re-themed to the app's real palette (--card/--card-alt/--line/--teal/--ink)
     instead of the standalone prototype's dark --panel/--accent variables. */
  .nav-item-ai{background:linear-gradient(135deg,var(--teal-tint),rgba(46,158,124,.14));border:1px solid rgba(46,158,124,.22);}
  .nav-item-ai:not(.active):hover{background:linear-gradient(135deg,var(--teal-tint),rgba(46,158,124,.20));}
  .nav-item-ai.active{background:var(--teal);}
  .nav-item-ai .nav-ai-badge{margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--teal-dark);background:#fff;border-radius:5px;padding:2px 5px;}
  .nav-item-ai.active .nav-ai-badge{color:var(--teal-dark);}

  .aio-shell{display:grid;grid-template-columns:250px 1fr;gap:16px;height:100%;min-height:480px;}
  .aio-history{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;min-height:0;}
  .aio-history-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px 14px;font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
  .aio-new-chat-btn{display:flex;align-items:center;gap:5px;background:var(--teal-tint);color:var(--teal-dark);border:1px solid transparent;border-radius:7px;padding:5px 9px;font-size:11.5px;font-weight:600;}
  .aio-new-chat-btn:hover{filter:brightness(1.05);}
  .aio-new-chat-btn svg{width:12px;height:12px;}
  .aio-history-list{flex:1;overflow-y:auto;padding:0 8px 10px 8px;display:flex;flex-direction:column;gap:3px;}
  .aio-history-item{display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:9px 10px;width:100%;color:var(--ink);}
  .aio-history-item:hover{background:var(--card-alt);}
  .aio-history-item.active{background:var(--teal-tint);border-color:rgba(46,158,124,.25);}
  .aio-history-item .t{font-size:12.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .aio-history-item.active .t{color:var(--teal-dark);}
  .aio-history-item .s{font-size:11px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .aio-history-empty{padding:16px 12px;font-size:12px;color:var(--ink-soft);text-align:center;}
  .aio-history-backdrop{display:none;}

  .aio-chat{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .aio-chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .aio-chat-head-spacer{flex:1;}
  .aio-history-toggle{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:32px;height:32px;align-items:center;justify-content:center;color:var(--ink-soft);}
  .aio-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--teal),var(--sky));display:flex;align-items:center;justify-content:center;color:#fff;}
  .aio-avatar svg{width:16px;height:16px;}

  .aio-messages{flex:1;min-height:0;overflow-y:auto;padding:18px 18px 6px 18px;display:flex;flex-direction:column;gap:14px;}
  .aio-messages.is-empty{overflow:hidden;justify-content:flex-start;flex:1;padding-bottom:6px;}

  .aio-empty{margin:0 auto 30px auto;width:100%;box-sizing:border-box;text-align:center;max-width:480px;padding:32px 20px 0 20px;}
  .aio-empty .aio-avatar{width:44px;height:44px;border-radius:50%;margin:0 auto 14px auto;}
  .aio-empty .aio-avatar svg{width:22px;height:22px;}
  .aio-empty h3{margin:0 0 6px 0;font-size:16.5px;font-weight:700;color:var(--navy);}
  .aio-empty p{margin:0 0 34px 0;color:var(--ink-soft);font-size:13px;}
  .aio-suggestions{display:flex;gap:6px;text-align:left;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px;margin-bottom:30px;}
  .aio-suggestions::-webkit-scrollbar{display:none;}
  .aio-suggest-chip{flex:0 0 auto;width:200px;background:var(--card-alt);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:normal;text-align:left;transition:border-color .15s ease;}
  .aio-suggest-chip:hover{border-color:var(--teal);color:var(--teal-dark);}
  .aio-suggest-chip svg{width:13px;height:13px;flex-shrink:0;color:var(--teal);}

  .aio-msg{display:flex;gap:10px;max-width:82%;}
  .aio-msg.user{align-self:flex-end;flex-direction:row-reverse;max-width:78%;}
  .aio-msg .aio-msg-mark{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--card-alt);border:1px solid var(--line);color:var(--ink-soft);font-size:10.5px;font-weight:600;}
  .aio-msg.assistant .aio-msg-mark{background:linear-gradient(135deg,var(--teal),var(--sky));border:none;color:#fff;}
  .aio-msg.assistant .aio-msg-mark svg{width:13px;height:13px;}
  .aio-msg-bubble{border-radius:14px;padding:11px 14px;font-size:13.5px;line-height:1.55;}
  .aio-msg.user .aio-msg-bubble{background:var(--teal);color:#fff;border-radius:14px 14px 3px 14px;font-weight:500;}
  .aio-msg.assistant .aio-msg-bubble{background:var(--card-alt);border:1px solid var(--line);border-radius:14px 14px 14px 3px;color:var(--ink);}
  .aio-msg-bubble p{margin:0 0 8px 0;}
  .aio-msg-bubble p:last-child{margin-bottom:0;}
  .aio-msg-time{font-size:10px;color:var(--ink-soft);margin-top:5px;}
  .aio-msg.user .aio-msg-time{text-align:right;}

  .aio-thinking .aio-msg-bubble{display:flex;align-items:center;gap:5px;padding:13px 16px;}
  .aio-thinking .aio-msg-mark{animation:aio-logo-spin 1.4s linear infinite;}
  @keyframes aio-logo-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  .aio-think-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);animation:aio-bounce 1.1s infinite ease-in-out;}
  .aio-think-dot:nth-child(2){animation-delay:.15s;}
  .aio-think-dot:nth-child(3){animation-delay:.3s;}
  @keyframes aio-bounce{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}

  .aio-error .aio-msg-bubble{background:var(--red-tint);border:1px solid rgba(214,86,79,.3);color:var(--ink);display:flex;flex-direction:column;gap:8px;}
  .aio-error-head{display:flex;align-items:center;gap:7px;color:var(--red);font-weight:600;font-size:13px;}
  .aio-error-head svg{width:14px;height:14px;}
  .aio-retry-btn{align-self:flex-start;display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--red);color:var(--red);border-radius:7px;padding:6px 11px;font-size:12px;font-weight:600;}
  .aio-retry-btn:hover{background:var(--red-tint);}
  .aio-retry-btn svg{width:12px;height:12px;}

  .aio-composer{border-top:1px solid var(--line);padding:12px 16px 14px 16px;flex-shrink:0;}
  .aio-quick-prompts{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none;}
  .aio-quick-prompts::-webkit-scrollbar{display:none;}
  .aio-quick-prompts.hide{display:none;}
  .aio-qp-chip{flex-shrink:0;background:var(--card-alt);border:1px solid var(--line);color:var(--ink-soft);border-radius:999px;padding:6px 12px;font-size:11.5px;white-space:nowrap;}
  .aio-qp-chip:hover{color:var(--teal-dark);border-color:var(--teal);}
  .aio-input-row{display:flex;align-items:flex-end;gap:8px;background:var(--card-alt);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;}
  .aio-input-row:focus-within{border-color:var(--teal);}
  .aio-input-row textarea{flex:1;background:none;border:none;outline:none;resize:none;color:var(--ink);font-family:inherit;font-size:13.5px;line-height:1.4;max-height:120px;padding:6px 0;}
  .aio-input-row textarea::placeholder{color:var(--ink-soft);}
  .aio-send-btn{width:34px;height:34px;border-radius:9px;flex-shrink:0;border:none;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .15s ease;}
  .aio-send-btn:hover{filter:brightness(1.06);}
  .aio-send-btn:disabled{opacity:.4;cursor:default;}
  .aio-send-btn svg{width:15px;height:15px;}
  .aio-disclaimer{margin-top:9px;font-size:10.5px;color:var(--ink-soft);text-align:center;}

  @media (max-width:900px){
    .aio-shell{grid-template-columns:1fr;height:100%;}
    .aio-history{position:fixed;top:0;left:-280px;bottom:0;width:260px;z-index:250;border-radius:0;transition:left .2s ease;box-shadow:0 0 40px rgba(0,0,0,.4);}
    body.aio-history-open .aio-history{left:0;}
    .aio-history-backdrop{display:none;position:fixed;inset:0;background:rgba(15,22,40,.55);z-index:240;}
    body.aio-history-open .aio-history-backdrop{display:block;}
    .aio-history-toggle{display:flex;}
    .aio-msg{max-width:92%;}
    .aio-msg.user{max-width:88%;}
    .aio-suggest-chip{width:70vw;max-width:260px;}
    .aio-empty{padding:20px 12px 12px 12px;}
    .aio-empty .aio-avatar{width:36px;height:36px;margin:0 auto 10px auto;}
    .aio-empty .aio-avatar svg{width:18px;height:18px;}
    .aio-empty h3{font-size:15px;}
    .aio-empty p{margin:0 0 30px 0;font-size:12.5px;}
  }
</style>

<div id="pgGate" role="dialog" aria-modal="true" aria-label="My School">
  <div class="pg-box">
    <img class="pg-logo" src="icon-192.png" alt="My School logo" width="128" height="128">
    <div class="pg-name">My School</div>
    <button type="button" id="pgInstall" class="pg-install">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Install</span>
    </button>
    <a href="#" id="pgContinue" class="pg-continue">Continue in browser</a>
    <p id="pgMsg" class="pg-msg" role="status" aria-live="polite" hidden></p>

<script>
// ---------- PWA: install page + install button + service worker ----------
(function () {
  var root = document.documentElement;
  var btn = document.getElementById("pgInstall");
  var label = btn.querySelector("span");
  var cont = document.getElementById("pgContinue");
  var msg = document.getElementById("pgMsg");
  var logo = document.querySelector("#pgGate .pg-logo");
  var fab = document.getElementById("pwaInstallBtn"); // small floating button, used after "Continue in browser"
  var ua = navigator.userAgent || "";
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var deferred = null, waiters = [], busy = false, installedNow = false;

  function isStandalone() {
    var m = function (q) { return window.matchMedia && window.matchMedia(q).matches; };
    return m("(display-mode: standalone)") || m("(display-mode: fullscreen)") || m("(display-mode: minimal-ui)") || window.navigator.standalone === true;
  }
  function getFlag() { try { return localStorage.getItem("pgInstalled") === "1"; } catch (e) { return false; } }
  function setFlag(on) { try { on ? localStorage.setItem("pgInstalled", "1") : localStorage.removeItem("pgInstalled"); } catch (e) {} }
  function gateVisible() { return root.classList.contains("pg-on"); }

  function toast(text) {
    var t = document.getElementById("pwaToast");
    if (!t) {
      t = document.createElement("div");
      t.id = "pwaToast";
      t.style.cssText = "position:fixed;left:50%;bottom:84px;transform:translateX(-50%);max-width:88vw;background:#161A26;color:#fff;padding:12px 16px;border-radius:12px;font:600 13.5px/1.4 system-ui,sans-serif;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:center;";
      document.body.appendChild(t);
    }
    t.textContent = text;
    t.style.display = "block";
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.style.display = "none"; }, 8000);
  }
  function notify(text) {
    if (gateVisible()) { msg.textContent = text; msg.hidden = false; } else { toast(text); }
  }
  function setBusy(on, text) { busy = on; btn.disabled = on; label.textContent = text || "Install"; }
  function syncFab() {
    if (!fab) return;
    fab.style.display = (!isStandalone() && !installedNow && (deferred || isIOS)) ? "flex" : "none";
  }
  function waitForPrompt(ms) {
    return new Promise(function (resolve) {
      var done = false;
      var t = setTimeout(function () { if (!done) { done = true; resolve(null); } }, ms);
      waiters.push(function (e) { if (!done) { done = true; clearTimeout(t); resolve(e); } });
    });
  }

  async function doInstall() {
    if (busy) return;
    var p = deferred;
    if (!p) {
      if (isIOS) { notify("To install: tap the Share icon, then \u201CAdd to Home Screen\u201D."); return; }
      if (installedNow || getFlag()) { notify("My School is already installed on this device. Open it from your home screen or app list."); return; }
      // The browser can take a second or two after the first visit before it allows the install.
      setBusy(true, "Preparing\u2026");
      p = await waitForPrompt(3500);
      setBusy(false);
      if (!p) { notify("To install, open your browser menu (\u22EE) and tap \u201CInstall app\u201D or \u201CAdd to Home screen\u201D."); return; }
    }
    deferred = null; // a prompt can only be used once
    try {
      p.prompt();
      var choice = await p.userChoice;
      if (choice && choice.outcome === "accepted") {
        setBusy(true, "Installing\u2026");
        notify("Installing\u2026 My School will appear on your home screen in a few moments.");
        setTimeout(function () { if (busy && !installedNow) setBusy(false); }, 90000); // safety: never leave the button stuck
      } else {
        notify("Install cancelled. You can install any time from your browser menu (\u22EE) \u2192 \u201CInstall app\u201D.");
      }
    } catch (err) {
      notify("Couldn\u2019t start the install. Open your browser menu (\u22EE) and tap \u201CInstall app\u201D or \u201CAdd to Home screen\u201D.");
    }
    syncFab();
  }

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    setFlag(false); // the browser only offers this when the app is NOT installed
    waiters.splice(0).forEach(function (fn) { fn(e); });
    syncFab();
  });
  window.addEventListener("appinstalled", function () {
    installedNow = true;
    deferred = null;
    setFlag(true);
    setBusy(true, "Installed \u2713");
    notify("My School is installed. Open it from your home screen or app list.");
    syncFab();
  });

  btn.addEventListener("click", doInstall);
  if (fab) fab.addEventListener("click", doInstall);
  cont.addEventListener("click", function (e) {
    e.preventDefault();
    try { sessionStorage.setItem("pgContinue", "1"); } catch (err) {}
    root.classList.remove("pg-on");
    syncFab();
  });

  // If the bundled icon file is missing, fall back to the logo embedded in this page.
  logo.addEventListener("error", function () {
    var l = document.querySelector('link[rel="apple-touch-icon"]');
    if (l && logo.src !== l.href) logo.src = l.href;
  });

  if (isStandalone()) setFlag(true); // remember that the app exists on this device
  syncFab();

  if ("serviceWorker" in navigator) {
    // A real same-origin file (blob: URLs are rejected for service workers). Upload sw.js next to this file.
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function (err) { console.warn("SW registration failed:", err); });
    });
  }
})();
</script>

const SCHOOL_LEVELS = {
  pre_primary: "Pre-Primary / Nursery",
  primary: "Primary",
  secondary: "Secondary",
};
const SCHOOL_LEVEL_SHORT = {
  pre_primary: "Nur",
  primary: "Pri",
  secondary: "Sec",
};
function offeredSchoolLevels() {
  const s = schoolSettings || {};
  return (s.school_levels || []).filter(k => SCHOOL_LEVELS[k]);
}
function activeSchoolLevel() {
  const levels = offeredSchoolLevels();
  if (!levels.length) return null;
  const s = schoolSettings || {};
  return levels.includes(s.active_level) ? s.active_level : levels[0];
}
async function setActiveSchoolLevel(level) {
  await dbUpsert("school_settings", { active_level: level }, "school_id");
  schoolSettings = Object.assign({}, schoolSettings, { active_level: level });
}
function levelSwitchBtnHtml() {
  const levels = offeredSchoolLevels();
  if (levels.length < 2 || !hasFullAccess(profile)) return "";
  const active = activeSchoolLevel();
  return `<button type="button" class="btn btn-ghost btn-sm" id="levelSwitchBtn" title="Tap to switch the active school level" style="font-weight:700;">${SCHOOL_LEVEL_SHORT[active] || active}</button>`;
}
function wireLevelSwitchBtn(onSwitch) {
  const btn = document.getElementById("levelSwitchBtn");
  if (!btn) return;
  btn.onclick = safe(async () => {
    const levels = offeredSchoolLevels();
    const active = activeSchoolLevel();
    const idx = levels.indexOf(active);
    const next = levels[(idx + 1) % levels.length];
    btn.disabled = true;
    try {
      await setActiveSchoolLevel(next);
      btn.textContent = SCHOOL_LEVEL_SHORT[next] || next;
      if (onSwitch) await onSwitch(next);
    } finally { btn.disabled = false; }
  });
}

let __schoolSyncTimer = null;
const EDITING_GRACE_MS = 90000; // treat the user as "busy" for 90s after their last action,
// not just the instant a field is focused — covers pauses between fields, glancing away,
// tapping custom buttons (attendance marks, toggles), etc.
let __lastFormInteraction = 0;
function noteFormInteraction() { __lastFormInteraction = Date.now(); }
// Any of these mean the person is actively doing something — typing, tapping a
// custom control (attendance present/absent buttons, toggles, cards that aren't
// real <input> elements, drag handles, etc.), or just touching the screen. A
// background sync has no business re-rendering out from under any of it, so
// every one of these resets the "busy" clock, not just form input/change.
["input", "change", "click", "pointerdown", "keydown", "touchstart"].forEach(evt => {
  document.addEventListener(evt, noteFormInteraction, true);
});
// A network call in flight (saving attendance, submitting a form, etc.) also
// counts as busy — a background re-render firing while a save is still awaiting
// its response can wipe the screen out from under it or hit stale DOM nodes.
let __inFlightRequests = 0;
function isUserEditing() {
  const el = document.activeElement;
  if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return true;
  if (document.querySelector(".overlay")) return true; // a modal/sheet is open — an active workflow is in progress
  if (__inFlightRequests > 0) return true; // a save/submit is still in flight
  return (Date.now() - __lastFormInteraction) < EDITING_GRACE_MS;
}
function startSchoolSync() {
  stopSchoolSync();
  const tick = async () => {
    if (!CURRENT_SCHOOL_ID) return;
    await loadCurrentSchool();
    if (!auth) return;
    if (schoolIsActive()) return; // in good standing — nothing disruptive needed, don't touch the screen
    if (isUserEditing()) {
      // Still lock out a suspended/deleted school, but never mid-keystroke — check again once they're done.
      document.addEventListener("focusout", () => { if (!isUserEditing()) tick(); }, { once: true });
      return;
    }
    if (!hasNavAccess(profile, tab)) tab = "dashboard";
    render();
  };
  __schoolSyncTimer = setInterval(tick, 45000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !isUserEditing()) tick(); });
}
function stopSchoolSync() { if (__schoolSyncTimer) { clearInterval(__schoolSyncTimer); __schoolSyncTimer = null; } }

const PROFILES_MIGRATION_SQL = `-- lets Postgres hash/check passwords for us
create extension if not exists pgcrypto;

-- new columns this account system needs
alter table profiles add column if not exists username text unique;
alter table profiles add column if not exists phone text;
alter table profiles add column if not exists pin text;
alter table profiles add column if not exists password_hash text;
alter table profiles add column if not exists photo_url text;
alter table profiles add column if not exists suspended_at timestamptz;
alter table profiles add column if not exists deleted_at timestamptz;
-- profiles.id used to come from auth.users (via a foreign key) — accounts are
-- created directly here now, so that link has to go, and id needs to generate itself:
alter table profiles drop constraint if exists profiles_id_fkey;
alter table profiles alter column id set default gen_random_uuid();

-- Creates a new account. Called from the app's "Create account" screen.
drop function if exists create_account(text, text, text, text, text, text);
drop function if exists create_account(text, text, text, text, text, text, text);
create function create_account(
  p_full_name text, p_username text, p_department text,
  p_phone text, p_password text, p_pin text, p_photo_url text default null
) returns profiles
language plpgsql security definer as $create_account$
declare new_row profiles;
begin
  if p_username is null or trim(p_username) = '' then
    raise exception 'Username is required.';
  end if;
  if exists (select 1 from profiles where username = p_username) then
    raise exception 'That username is already taken.';
  end if;
  insert into profiles (full_name, username, department, phone, pin, password_hash, role, photo_url)
  values (p_full_name, p_username, nullif(p_department,''), nullif(p_phone,''), nullif(p_pin,''), crypt(p_password, gen_salt('bf')), 'staff', p_photo_url)
  returning * into new_row;
  new_row.password_hash := null;
  return new_row;
end;
$create_account$;
grant execute on function create_account(text,text,text,text,text,text,text) to anon, authenticated;

-- Checks a username + password and returns the profile on success.
drop function if exists verify_login(text, text);
create function verify_login(p_username text, p_password text) returns profiles
language plpgsql security definer as $verify_login$
declare found_row profiles;
begin
  select * into found_row from profiles where username = p_username;
  if found_row.id is null or found_row.password_hash is null
     or crypt(p_password, found_row.password_hash) <> found_row.password_hash then
    raise exception 'Incorrect username or password.';
  end if;
  if found_row.deleted_at is not null then
    raise exception 'This account has been deleted. Contact Administration.';
  end if;
  if found_row.suspended_at is not null then
    raise exception 'This account is suspended. Contact Administration.';
  end if;
  found_row.password_hash := null;
  return found_row;
end;
$verify_login$;
grant execute on function verify_login(text,text) to anon, authenticated;

-- "Forgot password" flow: identity is confirmed with the account's PIN
-- (no email involved), then the password is reset straight away.
drop function if exists reset_password(text, text, text);
create function reset_password(p_username text, p_pin text, p_new_password text) returns void
language plpgsql security definer as $reset_password$
declare found_row profiles;
begin
  select * into found_row from profiles where lower(username) = lower(p_username);
  if found_row.id is null then
    raise exception 'No account found with that username.';
  end if;
  if found_row.pin is null or found_row.pin = '' or found_row.pin <> p_pin then
    raise exception 'That PIN does not match our records.';
  end if;
  if p_new_password is null or length(p_new_password) < 6 then
    raise exception 'New password must be at least 6 characters.';
  end if;
  update profiles set password_hash = crypt(p_new_password, gen_salt('bf')) where id = found_row.id;
end;
$reset_password$;
grant execute on function reset_password(text,text,text) to anon, authenticated;`;

const STAFF_NOTIFY_FUNCTION_CODE = `// supabase/functions/staff-notify/index.ts
//
// Called by a Database Webhook whenever a new mother_announcements or
// parent_messages row is inserted. Sends a Web Push notification to every
// staff device subscribed via push_subscriptions_staff that should see it.
//
// Required secrets (Edge Functions -> staff-notify -> Secrets):
//   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, VAPID_PUBLIC_KEY,
//   VAPID_PRIVATE_KEY, VAPID_SUBJECT (e.g. "mailto:you@yourdomain.com")

import { createClient } from "npm:@supabase/supabase-js@2";
import webpush from "npm:web-push@3.6.7";

const SUPABASE_URL = Deno.env.get("SUPABASE_URL")!;
const SERVICE_ROLE_KEY = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!;
const VAPID_PUBLIC_KEY = Deno.env.get("VAPID_PUBLIC_KEY")!;
const VAPID_PRIVATE_KEY = Deno.env.get("VAPID_PRIVATE_KEY")!;
const VAPID_SUBJECT = Deno.env.get("VAPID_SUBJECT")!;

webpush.setVapidDetails(VAPID_SUBJECT, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY);
const supabase = createClient(SUPABASE_URL, SERVICE_ROLE_KEY);

Deno.serve(async (req) => {
  const payload = await req.json();
  const table = payload.table;
  const record = payload.record;
  if (!table || !record) return new Response("ignored", { status: 200 });

  let title = "New notification";
  let body = "";
  let query = supabase.from("push_subscriptions_staff").select("*");

  if (table === "mother_announcements") {
    title = record.title || "Announcement";
    body = record.body || "";
    // target_all -> every device. Otherwise only devices whose school_id is
    // in target_school_ids. Department narrows it further, except
    // Administration devices always get every department-targeted message.
    if (!record.target_all && Array.isArray(record.target_school_ids)) {
      query = query.in("school_id", record.target_school_ids);
    }
  } else if (table === "parent_messages") {
    title = \`\${record.parent_name || "A parent"}: \${record.subject}\`;
    body = record.message || "";
    if (record.department) {
      query = query.or(\`department.eq.\${record.department},department.eq.administration\`);
    }
  } else {
    return new Response("ignored", { status: 200 });
  }

  const { data: subs, error } = await query;
  if (error || !subs) return new Response("no subscriptions", { status: 200 });

  // Department filter for department-targeted mother_announcements happens
  // here (client-side, after the school filter above) so Administration
  // devices — regardless of the target department — still get it.
  const targetDept = table === "mother_announcements" ? record.target_department : null;
  const filtered = subs.filter((s: any) => {
    if (table !== "mother_announcements") return true;
    if (!targetDept || targetDept === "all") return true;
    if (s.department === "administration") return true;
    return s.department === targetDept;
  });

  const payloadBody = JSON.stringify({ title, body });
  let sent = 0;
  for (const sub of filtered) {
    const pushSubscription = { endpoint: sub.endpoint, keys: { p256dh: sub.p256dh, auth: sub.auth } };
    try {
      await webpush.sendNotification(pushSubscription, payloadBody);
      sent++;
    } catch (err: any) {
      if (err && (err.statusCode === 404 || err.statusCode === 410)) {
        await supabase.from("push_subscriptions_staff").delete().eq("endpoint", sub.endpoint);
      }
    }
  }
  return new Response(JSON.stringify({ sent }), { status: 200 });
});`;

-- Verifies a Student ID + the student's exact registered name match, then
-- links that student to a parent profile. Used both when adding a child
-- after sign-up and (inside create_parent_account below) during sign-up.
drop function if exists link_parent_child(uuid, text, text);
create function link_parent_child(p_parent_id uuid, p_sin text, p_student_name text) returns students
language plpgsql security definer as $link_parent_child$
declare found_student students;
begin
  select * into found_student from students
    where sin = upper(regexp_replace(coalesce(p_sin,''), '[^A-Za-z0-9]', '', 'g'))
      and trim(lower(full_name)) = trim(lower(p_student_name))
      and deleted_at is null
    limit 1;
  if found_student.id is null then
    raise exception 'We could not find a student with that SIN and exact registered name. Please check with the school office.';
  end if;
  insert into parent_students (parent_id, student_id) values (p_parent_id, found_student.id)
    on conflict (parent_id, student_id) do nothing;
  return found_student;
end;
$link_parent_child$;
grant execute on function link_parent_child(uuid,text,text) to anon, authenticated;

-- Creates a parent account. The Student ID + exact registered name match is
-- verified FIRST — the account (and the link to the child) is only created
-- once that check passes.
drop function if exists create_parent_account(text, text, text, text, text, text, text, text);
create function create_parent_account(
  p_full_name text, p_username text, p_phone text, p_password text, p_pin text,
  p_photo_url text, p_sin text, p_student_name text
) returns profiles
language plpgsql security definer as $create_parent_account$
declare new_row profiles; found_student students;
begin
  select * into found_student from students
    where sin = upper(regexp_replace(coalesce(p_sin,''), '[^A-Za-z0-9]', '', 'g'))
      and trim(lower(full_name)) = trim(lower(p_student_name))
      and deleted_at is null
    limit 1;
  if found_student.id is null then
    raise exception 'We could not find a student with that SIN and exact registered name. Please check with the school office.';
  end if;
  if p_username is null or trim(p_username) = '' then
    raise exception 'Username is required.';
  end if;
  if exists (select 1 from profiles where username = p_username) then
    raise exception 'That username is already taken.';
  end if;
  insert into profiles (full_name, username, phone, pin, password_hash, role, photo_url)
  values (p_full_name, p_username, nullif(p_phone,''), nullif(p_pin,''), crypt(p_password, gen_salt('bf')), 'parent', p_photo_url)
  returning * into new_row;
  insert into parent_students (parent_id, student_id) values (new_row.id, found_student.id)
    on conflict (parent_id, student_id) do nothing;
  new_row.password_hash := null;
  return new_row;
end;
$create_parent_account$;
grant execute on function create_parent_account(text,text,text,text,text,text,text,text) to anon, authenticated;`;

const SCHOOL_SELF_REGISTRATION_SQL = `-- Extra fields the registration screen collects about the school itself —
-- these live on the mother system's own \`schools\` table, not in this app's data.
alter table schools add column if not exists motto text;
alter table schools add column if not exists village text;
alter table schools add column if not exists sub_county text;

-- The human-facing School ID — letters, numbers, and underscores only. Generated
-- automatically inside register_school() below (TATNOVA followed by 7
-- random digits, retried until unique), shown to Administrators under Settings,
-- and never editable afterwards. Staff/parents key this in on the "Create your
-- account" screen so their account lands in the right school — this is the code
-- the TransApple Mother System uses to identify the school everywhere.
alter table schools add column if not exists school_code text;
do $$ begin
  if not exists (select 1 from pg_constraint where conname = 'schools_school_code_key') then
    alter table schools add constraint schools_school_code_key unique (school_code);
  end if;
  if not exists (select 1 from pg_constraint where conname = 'schools_school_code_format') then
    alter table schools add constraint schools_school_code_format check (school_code ~ '^[A-Za-z0-9_]+$');
  end if;
end $$;

-- Soft-delete and upgrade-tracking fields that schoolIsActive(), schoolBlockedMessage()
-- and the upgrade banner already read from CURRENT_SCHOOL, but which were never
-- actually created on the schools table until now.
alter table schools add column if not exists deleted_at timestamptz;
alter table schools add column if not exists upgrade_requested_at timestamptz;
alter table schools add column if not exists upgrade_completed_at timestamptz;

-- Lets an Administrator finish an upgrade that TransApple flagged (by setting
-- upgrade_requested_at externally) by confirming their password and filling
-- in any location/size fields that are still missing. Mirrors register_school's
-- school_code generation and verify_login's password check.
drop function if exists complete_school_upgrade(uuid, text, text, text, text, text, text, text);
create function complete_school_upgrade(
  p_school_id uuid, p_actor_username text, p_actor_password text,
  p_motto text default null, p_village text default null, p_subcounty text default null,
  p_district text default null, p_size_range text default null
) returns schools
language plpgsql security definer as $complete_school_upgrade$
declare actor profiles; target schools; candidate_code text; updated_row schools;
begin
  if p_school_id is null then
    raise exception 'No school selected.';
  end if;
  if p_actor_username is null or trim(p_actor_username) = '' then
    raise exception 'Not signed in.';
  end if;
  if p_actor_password is null or p_actor_password = '' then
    raise exception 'Enter your password to confirm.';
  end if;

  select * into actor from profiles where lower(username) = lower(p_actor_username);
  if actor.id is null or actor.password_hash is null
     or crypt(p_actor_password, actor.password_hash) <> actor.password_hash then
    raise exception 'Incorrect username or password.';
  end if;
  if actor.deleted_at is not null then
    raise exception 'This account has been deleted. Contact Administration.';
  end if;
  if actor.suspended_at is not null then
    raise exception 'This account is suspended. Contact Administration.';
  end if;
  if actor.school_id is distinct from p_school_id or actor.department <> 'administration' then
    raise exception 'You do not have permission to upgrade this school.';
  end if;

  select * into target from schools where id = p_school_id;
  if target.id is null then
    raise exception 'School not found.';
  end if;
  if target.school_code is not null or target.upgrade_requested_at is null or target.upgrade_completed_at is not null then
    raise exception 'This school is not pending an upgrade.';
  end if;

  loop
    candidate_code := 'TATNOVA' || lpad(floor(random() * 10000000)::text, 7, '0');
    exit when not exists (select 1 from schools where school_code = candidate_code);
  end loop;

  update schools set
    motto = coalesce(target.motto, nullif(trim(p_motto),'')),
    village = coalesce(target.village, nullif(trim(p_village),'')),
    sub_county = coalesce(target.sub_county, nullif(trim(p_subcounty),'')),
    district = coalesce(target.district, nullif(trim(p_district),'')),
    size_range = coalesce(target.size_range, nullif(p_size_range,'')),
    school_code = candidate_code,
    upgrade_completed_at = now()
  where id = p_school_id
  returning * into updated_row;

  return updated_row;
end;
$complete_school_upgrade$;
grant execute on function complete_school_upgrade(uuid,text,text,text,text,text,text,text) to anon, authenticated;

  p_admin_password text, p_admin_pin text default null, p_admin_photo_url text default null
) returns profiles
language plpgsql security definer as $register_school$
declare new_school schools; new_admin profiles; candidate_code text;
begin
  if p_school_name is null or trim(p_school_name) = '' then
    raise exception 'School name is required.';
  end if;
  if p_admin_full_name is null or trim(p_admin_full_name) = '' then
    raise exception 'Administrator full name is required.';
  end if;
  if p_admin_username is null or trim(p_admin_username) = '' then
    raise exception 'Administrator username is required.';
  end if;
  if exists (select 1 from profiles where username = p_admin_username) then
    raise exception 'That username is already taken.';
  end if;
  if p_admin_password is null or length(p_admin_password) < 6 then
    raise exception 'Administrator password must be at least 6 characters.';
  end if;

  -- Build the School ID as TATNOVA followed by 7 random digits, retrying
  -- until it's unique.
  loop
    candidate_code := 'TATNOVA' || lpad(floor(random() * 10000000)::text, 7, '0');
    exit when not exists (select 1 from schools where school_code = candidate_code);
  end loop;

  -- School record: owned by the mother system, not this app's own tables.
  insert into schools (name, motto, village, sub_county, district, size_range, status, school_code)
  values (
    trim(p_school_name), nullif(trim(p_school_motto),''),
    nullif(trim(p_school_village),''), nullif(trim(p_school_subcounty),''), nullif(trim(p_school_district),''),
    nullif(p_school_size_range,''), 'active', candidate_code
  ) returning * into new_school;

  -- First Administrator — Administration department = full access to everything,
  -- and is_owner = true: they hold full authority over the school (including
  -- suspending/deleting whole departments) until they transfer it to someone else.
  insert into profiles (
    full_name, username, department, phone, whatsapp, email,
    pin, password_hash, role, photo_url, school_id, is_owner
  ) values (
    trim(p_admin_full_name), p_admin_username, 'administration',
    nullif(p_admin_phone,''), nullif(p_admin_whatsapp,''), nullif(p_admin_email,''),
    nullif(p_admin_pin,''), crypt(p_admin_password, gen_salt('bf')), 'staff', p_admin_photo_url, new_school.id, true
  ) returning * into new_admin;

  new_admin.password_hash := null;
  return new_admin;
end;
$register_school$;
grant execute on function register_school(text,text,text,text,text,text,text,text,text,text,text,text,text,text) to anon, authenticated;

-- Moves full ownership authority from the current owner to another active
-- Administration-department account at the same school. Verified against the
-- acting (current owner's) password, same trust model as reset_password().
drop function if exists transfer_ownership(text,text,uuid);
create function transfer_ownership(p_actor_username text, p_actor_password text, p_new_owner_id uuid)
returns void language plpgsql security definer as $$
declare actor profiles; new_owner profiles;
begin
  select * into actor from profiles where username = p_actor_username;
  if actor.id is null or actor.password_hash is null or crypt(p_actor_password, actor.password_hash) <> actor.password_hash then
    raise exception 'Your password could not be verified.';
  end if;
  if not actor.is_owner then
    raise exception 'Only the current owner can transfer ownership.';
  end if;

  select * into new_owner from profiles where id = p_new_owner_id and school_id = actor.school_id;
  if new_owner.id is null then
    raise exception 'That account was not found at your school.';
  end if;
  if new_owner.department <> 'administration' then
    raise exception 'Ownership can only be transferred to an Administration account.';
  end if;
  if new_owner.deleted_at is not null or new_owner.suspended_at is not null then
    raise exception 'That account is suspended or deleted.';
  end if;

  update profiles set is_owner = false where id = actor.id;
  update profiles set is_owner = true where id = new_owner.id;
end;
$$;
grant execute on function transfer_ownership(text,text,uuid) to anon, authenticated;`;

-- Final verify_login: builds on every prior upgrade (deleted/suspended checks,
-- school-status checks, last_login_at, school_login_log) and adds the new
-- approval_status gate, plus the school-level Trash check (see
-- SCHOOL_TRASH_SQL / soft_delete_school in the Mother App) — checked first,
-- since once the school itself has been deleted nothing else about the
-- account matters. Blocks a login before it ever reaches the app shell.
drop function if exists verify_login(text, text);
create function verify_login(p_username text, p_password text) returns profiles
language plpgsql security definer as $verify_login$
declare found_row profiles; school_row schools;
begin
  select * into found_row from profiles where lower(username) = lower(p_username);
  if found_row.id is null or found_row.password_hash is null
     or crypt(p_password, found_row.password_hash) <> found_row.password_hash then
    if to_regclass('school_login_log') is not null then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
    end if;
    raise exception 'Incorrect username or password.';
  end if;
  if found_row.school_id is not null then
    select * into school_row from schools where id = found_row.school_id;
  end if;
  -- The whole school was deleted (moved to Trash by a Mother App admin) —
  -- this overrides every other check below, and the school row/name is
  -- still around to name-check against during its 30-day Trash window.
  if school_row.id is not null and school_row.deleted_at is not null then
    if to_regclass('school_login_log') is not null then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
    end if;
    raise exception '"%" no longer exists in the system because it was permanently deleted. If you think this is a mistake, please contact us now.', school_row.name;
  end if;
  if found_row.deleted_at is not null then
    if to_regclass('school_login_log') is not null then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
    end if;
    raise exception 'This account has been deleted. Contact Administration.';
  end if;
  if found_row.suspended_at is not null then
    if to_regclass('school_login_log') is not null then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
    end if;
    raise exception 'This account is suspended. Contact Administration.';
  end if;
  if found_row.approval_status = 'pending' then
    if to_regclass('school_login_log') is not null then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
    end if;
    raise exception 'Your registration is awaiting approval from your school Administrator.';
  end if;
  if found_row.approval_status = 'rejected' then
    if to_regclass('school_login_log') is not null then
      insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, false);
    end if;
    raise exception 'Your registration was not approved. Contact your school Administrator for more information.';
  end if;
  if school_row.id is not null then
    if school_row.status = 'pending' then
      raise exception 'Your school is still awaiting approval by TransApple. Please check back soon.';
    elsif school_row.status = 'rejected' then
      raise exception 'Your school''s registration was not approved. Contact TransApple for more information.';
    elsif school_row.status = 'suspended' then
      raise exception 'Your school''s account is suspended. Contact TransApple to resolve this.';
    elsif school_row.status = 'deactivated' then
      raise exception 'Your school''s account has been deactivated. Contact TransApple for help.';
    end if;
  end if;
  if to_regclass('profiles') is not null then
    begin
      update profiles set last_login_at = now() where id = found_row.id;
    exception when undefined_column then null;
    end;
  end if;
  if to_regclass('school_login_log') is not null then
    insert into school_login_log (school_id, username, success) values (found_row.school_id, p_username, true);
  end if;
  found_row.password_hash := null;
  return found_row;
end;
$verify_login$;
grant execute on function verify_login(text,text) to anon, authenticated;`;

async function sb(path, opts = {}) {
  const headers = Object.assign({
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
  }, SESSION_TOKEN ? { "x-session-token": SESSION_TOKEN } : {}, opts.headers || {});
  let res;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
  __inFlightRequests++; // mark busy so a background refresh doesn't re-render mid-request
  try {
    res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, { headers, signal: controller.signal }));
  } catch (e) {
    throw new Error("Couldn't connect right now. Please try again.");
  } finally {
    clearTimeout(timeoutId);
    __inFlightRequests--;
  }
  let data = null;
  try { data = await res.json(); } catch(e) { data = null; }
  if (!res.ok) {
    const msg = (data && (data.error_description || data.msg || data.message)) || "Request failed";
    throw new Error(msg);
  }
  return data;
}

const qs = (obj) => Object.entries(obj).filter(([,v])=>v!==undefined && v!==null && v!=="").map(([k,v])=>`${k}=${v}`).join("&");

function scopedParams(table, params) {
  const p = Object.assign({}, params);
  if (CURRENT_SCHOOL_ID && !SCHOOL_SCOPE_EXEMPT.has(table)) p.school_id = `eq.${CURRENT_SCHOOL_ID}`;
  return p;
}
function scopedBody(table, body) {
  if (!CURRENT_SCHOOL_ID || SCHOOL_SCOPE_EXEMPT.has(table)) return body;
  if (Array.isArray(body)) return body.map(row => Object.assign({ school_id: CURRENT_SCHOOL_ID }, row));
  return Object.assign({ school_id: CURRENT_SCHOOL_ID }, body);
}
async function dbSelect(table, params={}) {
  const path = `/rest/v1/${table}?${qs(scopedParams(table, Object.assign({select:"*"}, params)))}`;
  return await sb(path);
}
async function _dbInsert(table, body) {
  const scoped = scopedBody(table, body);
  return await sb(`/rest/v1/${table}`, { method:"POST", body: JSON.stringify(scoped), headers:{ "Prefer":"return=representation" } });
}
async function _dbUpdate(table, id, body) {
  return await sb(`/rest/v1/${table}?${qs(scopedParams(table, {id:`eq.${id}`}))}`, { method:"PATCH", body: JSON.stringify(body), headers:{ "Prefer":"return=representation" } });
}
async function _dbUpsert(table, body, onConflict) {
  const scoped = scopedBody(table, body);
  return await sb(`/rest/v1/${table}?on_conflict=${onConflict}`, { method:"POST", body: JSON.stringify(scoped), headers:{ "Prefer":"resolution=merge-duplicates,return=representation" } });
}
async function _dbDelete(table, id) {
  return await sb(`/rest/v1/${table}?${qs(scopedParams(table, {id:`eq.${id}`}))}`, { method:"DELETE" });
}
async function dbSelectActive(table, params={}) {
  const filteredParams = Object.assign({ deleted_at:"is.null" }, params);
  const filteredPath = `/rest/v1/${table}?${qs(scopedParams(table, Object.assign({select:"*"}, filteredParams)))}`;
  return await sb(filteredPath);
}
function deleteWhereParams(table, filter) {
  return scopedParams(table, Object.fromEntries(Object.entries(filter).map(([k, v]) => [k, `eq.${v}`])));
}
async function _dbDeleteWhere(table, filter) {
  return await sb(`/rest/v1/${table}?${qs(deleteWhereParams(table, filter))}`, { method:"DELETE" });
}

// ===================== ACTIVITY HISTORY (audit log) =====================
// Every write that goes through the generic data layer below (dbInsert/dbUpdate/dbUpsert/
// dbDelete/dbDeleteWhere) is mirrored into the `activity_log` table: who did it, what table/
// record, when, and what changed. This is intentionally hooked in at the data-layer level —
// not sprinkled at each of the ~150 call sites — so coverage is automatic and nothing existing
// had to change. Logging is fire-and-forget (never awaited by callers, failures are swallowed)
// so a logging hiccup can never block or break the actual save. `activity_log` rows are
// permanent: the table's RLS policies (deployed live) allow SELECT and INSERT only — there are
// no UPDATE/DELETE policies, so the database itself refuses to alter or remove entries.
// Visible to School Super Admins / Administrators only (Settings → History).
const ACTIVITY_LOG_EXCLUDED_TABLES = new Set(["activity_log", "push_subscriptions_staff"]);
const ACTIVITY_LOG_SENSITIVE_FIELDS = new Set(["password_hash","pin","password","session_token"]);
const ACTIVITY_LOG_TABLE_LABELS = {
  students:"Students", profiles:"Staff Accounts", attendance_records:"Attendance",
  staff_attendance_events:"Sign In & Out", classes:"Classes", subjects:"Subjects", terms:"Terms",
  academic_years:"Academic Years", exam_types:"Exam Types", exams:"Exams", grades:"Grades",
  exam_results:"Exam Results", fee_payments:"Fee Payments", fee_structure:"Fee Structure",
  fee_reminders:"Fee Reminders", inventory_items:"Inventory", asset_maintenance:"Asset Maintenance",
  library_books:"Library", boarders:"Boarders", preps:"Preps", visitors:"Visitors",
  uniform_issues:"Uniforms", uniform_items:"Uniforms", sick_bay_records:"Sick Bay",

function wrapPasswordField(input) {
  if (!input || input.dataset.pwdWrapped) return;
  if (input.closest(".pwd-wrap")) { input.dataset.pwdWrapped = "1"; return; }
  input.dataset.pwdWrapped = "1";
  const wrap = document.createElement("div");
  wrap.className = "pwd-wrap";
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "pwd-toggle";
  
  
  
  const syncIcon = () => {
    const hidden = input.type === "password";
    btn.innerHTML = hidden ? ic.eyeOff : ic.eye;
    btn.title = hidden ? "Show password" : "Hide password";
    btn.setAttribute("aria-label", btn.title);
    btn.classList.toggle("on", !hidden);
  };
  syncIcon();
  btn.onclick = () => {
    input.type = input.type === "text" ? "password" : "text";
    syncIcon();
  };
  wrap.appendChild(btn);
}
function wrapAllPasswordFields(root = document) {
  root.querySelectorAll('input[type="password"]').forEach(wrapPasswordField);
}
(function initPasswordToggleObserver() {
  const start = () => {
    wrapAllPasswordFields();
    const observer = new MutationObserver((mutations) => {
      for (const m of mutations) {
        m.addedNodes.forEach((node) => {
          if (node.nodeType !== 1) return;
          if (node.matches && node.matches('input[type="password"]')) wrapPasswordField(node);
          if (node.querySelectorAll) wrapAllPasswordFields(node);
        });
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

function fileToPhotoDataURL(file, maxDim = 480, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const scale = Math.min(1, maxDim / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
        const w = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
        const h = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", quality));
      } catch (e) { reject(new Error("Could not read image file.")); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read image file.")); };
    img.src = url;
  });
}
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error("Could not read image file."));
    r.readAsDataURL(file);
  });
}

function openCameraCapture(onCapture, onUnavailable) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { onUnavailable && onUnavailable(); return; }
  const overlay = el(`<div class="overlay">
    <div class="modal" style="max-width:420px;">
      <button class="modal-close">&times;</button>
      <h3>Take photo</h3>
      <div style="border-radius:12px;overflow:hidden;background:#000;margin-top:10px;position:relative;">
        <video id="camVideo" autoplay playsinline style="width:100%;display:block;max-height:60vh;object-fit:cover;"></video>
        <button type="button" class="btn btn-ghost btn-sm" id="camSwitch" style="position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);">${ic.camera} Switch</button>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" id="camCancel">Cancel</button>
        <button class="btn btn-primary" id="camCapture">Capture</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const video = overlay.querySelector("#camVideo");
  let stream = null, settled = false, facing = "user";
  const stop = () => { if (stream) stream.getTracks().forEach(t => t.stop()); };
  const close = () => { stop(); overlay.remove(); };
  overlay.querySelector(".modal-close").onclick = close;
  overlay.querySelector("#camCancel").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  
  const startCamera = (mode) => {
    stop();
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: mode }, audio: false })
      .then(s => { if (settled) { s.getTracks().forEach(t=>t.stop()); return; } stream = s; video.srcObject = s; })
      .catch(() => {
        
        if (mode !== "user") return navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then(s => { if (settled) { s.getTracks().forEach(t=>t.stop()); return; } stream = s; video.srcObject = s; })
          .catch(() => { settled = true; close(); onUnavailable && onUnavailable(); });
        settled = true; close(); onUnavailable && onUnavailable();
      });
  };
  startCamera(facing);
  overlay.querySelector("#camSwitch").onclick = () => {
    facing = facing === "user" ? "environment" : "user";
    startCamera(facing);
  };
  overlay.querySelector("#camCapture").onclick = () => {
    if (!stream) return;
    settled = true;
    const canvas = document.createElement("canvas");
    const vw = video.videoWidth || 480, vh = video.videoHeight || 480, sc = Math.min(1, 480 / Math.max(vw, vh));
    canvas.width = Math.max(1, Math.round(vw * sc)); canvas.height = Math.max(1, Math.round(vh * sc));
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
    close();
    onCapture(dataUrl);
  };
}

function scrollIntoViewIfHidden(container, item) {
