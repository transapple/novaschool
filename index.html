<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nova School Manager</title>
<meta name="description" content="Nova School Manager">
<meta name="theme-color" content="#16274A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nova School">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="https://i.postimg.cc/0NBZwRMk/file-000000008ea481f4a7d2fe89b842a95b.png">
<link rel="apple-touch-icon" href="https://i.postimg.cc/0NBZwRMk/file-000000008ea481f4a7d2fe89b842a95b.png">
<style>
  :root{
    --navy:#16274A;
    --navy-2:#1E3563;
    --teal:#2E9E7C;
    --teal-dark:#227A61;
    --teal-tint:#E4F5EE;
    --amber:#E2A33D;
    --amber-dark:#A06A13;
    --amber-tint:#FDF1DE;
    --red:#D6564F;
    --red-tint:#FDECEC;
    --sky:#3E8EDE;
    --sky-tint:#E7F1FC;
    --purple:#7C6FE0;
    --purple-tint:#EFEDFC;
    --indigo:#5B5FCF;
    --indigo-tint:#ECEDFA;
    --slate:#6B7688;
    --slate-tint:#EEF1F5;
    --bg:#EEF2F9;
    --card:#FFFFFF;
    --card-alt:#F7F9FD;
    --ink:#1D2433;
    --ink-soft:#5B647A;
    --line:#E4E8EF;
    --radius:14px;
  }
  @keyframes fadeSlideDown{0%{opacity:0;transform:translateY(-8px);}100%{opacity:1;transform:translateY(0);}}
  @keyframes popScale{0%{opacity:0;transform:scale(.85);}100%{opacity:1;transform:scale(1);}}
  @keyframes slideInLeft{0%{opacity:0;transform:translateX(-14px);}100%{opacity:1;transform:translateX(0);}}
  @keyframes wiggleIn{0%{opacity:0;transform:rotate(-4deg) translateY(-6px);}100%{opacity:1;transform:rotate(0) translateY(0);}}
  @keyframes riseIn{0%{opacity:0;transform:translateY(10px) scale(.96);}100%{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes sheetUp{0%{opacity:0;transform:translateY(24px);}100%{opacity:1;transform:translateY(0);}}
  .pageTitleAnim{display:inline-block;}
  .action-sheet-overlay{position:fixed;inset:0;background:rgba(22,39,74,.35);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
  .action-sheet{background:#fff;width:100%;max-width:420px;border-radius:18px 18px 0 0;padding:10px 14px calc(14px + env(safe-area-inset-bottom));animation:sheetUp .18s ease;}
  @media(min-width:860px){.action-sheet-overlay{align-items:center;}.action-sheet{border-radius:16px;}}
  .action-sheet .as-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:2px auto 10px;}
  .action-sheet button{width:100%;text-align:left;padding:13px 14px;border-radius:10px;border:none;background:none;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;color:var(--ink);}
  .action-sheet button:hover{background:var(--card-alt);}
  .action-sheet button.as-danger{color:var(--red);}
  .action-sheet button.as-cancel{color:var(--ink-soft);margin-top:4px;border-top:1px solid var(--line);border-radius:0;}
  .view-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .view-row:last-child{border-bottom:none;}
  .view-row .vlabel{color:var(--ink-soft);font-weight:600;}
  .view-row .vvalue{color:var(--ink);font-weight:700;text-align:right;}
  .list-row{cursor:pointer;-webkit-user-select:none;user-select:none;}
  .list-row:active{background:var(--card-alt);}
  .trash-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  *{box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;}
  body{margin:0;position:fixed;inset:0;width:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
  /* App data is never rendered/visible in a plain browser tab — only once running
     as the installed, standalone app. #app stays hidden until pwaShowApp() runs. */
  #app{display:none;}
  #app.pwa-app-unlocked{display:block;}
  .pwa-open-note{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:10px;}
  h1,h2,h3{font-weight:700;letter-spacing:-0.02em;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:#c9d0dc;border-radius:10px;}

  /* ---------- LOGIN ---------- */
  @keyframes gradientFlow{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
  .login-wrap{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;align-items:center;justify-content:center;background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 35%,var(--sky) 65%,var(--navy) 100%);background-size:300% 300%;animation:gradientFlow 14s ease infinite;padding:20px;}
  .login-card{background:var(--card);border-radius:20px;padding:36px 28px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:0 20px 60px rgba(10,20,50,.35);margin:auto;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px;}
  .brand-badge{width:42px;height:42px;border-radius:12px;background:var(--teal);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;}
  .brand-name{font-size:19px;font-weight:800;color:var(--navy);}
  .brand-sub{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;background:#FAFBFD;outline:none;transition:border-color .15s;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);background:#fff;}
  input[type="time"],input[type="datetime-local"]{ color-scheme: light; }
  input[type="time"]::-webkit-calendar-picker-indicator,
  input[type="datetime-local"]::-webkit-calendar-picker-indicator{
    background-color: var(--teal);
    border-radius:6px;
    padding:5px;
    cursor:pointer;
    opacity:1;
    filter: brightness(0) invert(1);
  }

  /* ---------- CUSTOM DATE PICKER (fully app-styled, replaces native OS date picker
     so the "Set/Cancel" buttons are ours to colour, not the phone OS's) ---------- */
  input.datefield{
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%232E9E7C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>');
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:18px 18px;
    padding-right:38px;
    cursor:pointer;
    caret-color:transparent;
  }
  input.datefield::placeholder{color:var(--ink-soft);}
  .date-cal-popup{
    position:fixed;z-index:500;background:#fff;border-radius:16px;
    box-shadow:0 16px 44px rgba(16,30,60,.28);border:1px solid var(--line);
    padding:14px;width:288px;animation:riseIn .14s ease;
  }
  .dc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .dc-title{font-size:14.5px;font-weight:800;color:var(--navy);}
  .dc-nav{background:var(--teal-tint);color:var(--teal-dark);border:none;width:30px;height:30px;border-radius:9px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;}
  .dc-nav:hover{background:var(--teal);color:#fff;}
  .dc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .dc-dow{margin-bottom:4px;}
  .dc-dow div{font-size:11px;font-weight:700;color:var(--ink-soft);text-align:center;padding:4px 0;}
  .dc-cell{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink);border-radius:9px;cursor:pointer;}
  .dc-cell.dc-day:hover{background:var(--teal-tint);}
  .dc-cell.dc-today{color:var(--teal-dark);box-shadow:inset 0 0 0 1.5px var(--teal);}
  .dc-cell.dc-selected{background:var(--teal);color:#fff;box-shadow:none;}
  .dc-cell.dc-empty{cursor:default;}
  .dc-footer{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .dc-link{background:none;border:none;color:var(--teal-dark);font-weight:700;font-size:12.5px;padding:6px 8px;border-radius:8px;}
  .dc-link:hover{background:var(--teal-tint);}
  .dc-link.dc-danger{color:var(--red);}
  .dc-link.dc-danger:hover{background:var(--red-tint);}
  .btn{border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s, transform .1s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--teal);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-ghost{background:var(--teal-tint);color:var(--teal-dark);border:1.5px solid var(--teal);}
  .btn-ghost:hover{background:var(--teal);color:#fff;}
  .btn-danger{background:#fde8e7;color:var(--red);}
  .btn-sm{padding:8px 12px;font-size:13px;}
  .confirm-box{max-width:340px;text-align:center;}
  .confirm-msg{font-size:14.5px;color:var(--ink);line-height:1.55;margin-bottom:18px;white-space:pre-wrap;}
  .confirm-box .form-actions{margin-top:0;}
  .link-btn{background:none;border:none;color:var(--teal-dark);font-weight:600;font-size:13.5px;padding:0;}
  .err{background:#fdecec;color:var(--red);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;}
  .msg-ok{background:#e9f7f1;color:var(--teal-dark);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;}
  .tiny-note{font-size:11.5px;color:var(--ink-soft);margin-top:16px;line-height:1.5;text-align:center;}

  /* ---------- SHELL ---------- */
  .shell{display:flex;height:100vh;height:100dvh;overflow:hidden;}
  .sidebar{width:230px;background:linear-gradient(200deg,var(--navy) 0%,var(--navy-2) 45%,#274b8a 100%);background-size:250% 250%;animation:gradientFlow 18s ease infinite;color:#fff;flex-direction:column;padding:22px 14px;position:fixed;top:0;bottom:0;left:0;display:none;z-index:40;}
  .sidebar .brand-name{color:#fff;}
  .sidebar .brand-sub{color:#9fb0d6;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:10px;color:#c7d3ee;font-size:14px;font-weight:600;margin-bottom:3px;transition:background .2s ease,color .2s ease,box-shadow .2s ease;}
  .nav-item svg{opacity:.9;flex-shrink:0;}
  .nav-item.active{background:var(--teal);color:#fff;box-shadow:0 4px 12px rgba(46,158,124,.35);}
  .nav-item:not(.active):hover{background:rgba(255,255,255,.08);color:#fff;}
  .main{flex:1;margin-left:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:20;box-shadow:0 1px 0 rgba(22,39,74,.03);}
  .topbar h1{font-size:19px;color:var(--navy);}
  .topbar .who{font-size:12.5px;color:var(--ink-soft);}
  .content{padding:16px;padding-bottom:98px;max-width:1100px;margin:0 auto;width:100%;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}

  .bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;overflow-x:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(22,39,74,.05);}
  .bn-item{flex:1 0 auto;min-width:64px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;color:var(--ink-soft);font-size:10.5px;font-weight:600;border-radius:10px;transition:background .25s ease,color .25s ease,transform .25s ease;}
  .bn-item.active{color:var(--teal-dark);background:var(--teal-tint);transform:translateY(-2px);}
  .bn-item svg{flex-shrink:0;transition:transform .25s ease;}
  .bn-item.active svg{transform:scale(1.08);}
  .bn-icon-wrap{position:relative;display:inline-flex;}
  .nav-badge-count{position:absolute;top:-6px;right:-9px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;line-height:1;min-width:15px;height:15px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px;box-shadow:0 0 0 2px #fff;animation:popScale .25s ease;}
  .nav-item .nav-badge-count{position:static;margin-left:auto;min-width:18px;height:18px;font-size:11px;box-shadow:none;}

  @media(min-width:860px){
    .sidebar{display:flex;}
    .main{margin-left:230px;}
    .bottomnav{display:none;}
    .content{padding-bottom:16px;}
  }

  /* ---------- COMPONENTS ---------- */
  .card{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(22,39,74,.05);}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .section-head h2{font-size:18px;color:var(--navy);}
  .pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
  .pill{padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--card);border:1.5px solid var(--line);color:var(--ink-soft);}
  .pill.active{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 3px 10px rgba(46,158,124,.3);}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
  .stat{background:var(--card);border-radius:var(--radius);border:1px solid var(--line);padding:16px;border-left:4px solid var(--teal);box-shadow:0 1px 3px rgba(22,39,74,.05);}
  .stat:nth-child(4n+2){border-left-color:var(--sky);}
  .stat:nth-child(4n+3){border-left-color:var(--amber);}
  .stat:nth-child(4n+4){border-left-color:var(--purple);}
  .stat .num{font-size:24px;font-weight:800;color:var(--navy);}
  .stat .lbl{font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
  .list-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .avatar{width:40px;height:40px;border-radius:10px;background:var(--sky-tint);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);font-size:14px;flex-shrink:0;}
  .list-main{flex:1;min-width:0;}
  .list-title{font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .list-sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .badge-green{background:#e5f6ee;color:var(--teal-dark);}
  .badge-amber{background:#fdf1de;color:#a06a13;}
  .badge-red{background:#fdecec;color:var(--red);}
  .badge-grey{background:#eef0f4;color:var(--ink-soft);}
  .icon-btn{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .search-bar{display:flex;gap:8px;margin-bottom:14px;}
  .search-bar input{flex:1;}
  .fab{position:fixed;right:18px;bottom:96px;width:54px;height:54px;border-radius:16px;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(46,158,124,.45);border:none;z-index:25;}
  @media(min-width:860px){.fab{bottom:28px;}}
  .empty{text-align:center;padding:40px 16px;color:var(--ink-soft);}
  .empty svg{margin-bottom:10px;opacity:.5;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,22,40,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
  .modal{background:#fff;width:100%;max-width:480px;border-radius:18px;padding:22px;max-height:88vh;overflow-y:auto;}
  .modal h3{font-size:17px;color:var(--navy);margin-bottom:16px;}
  .modal-close{float:right;background:none;border:none;font-size:20px;color:var(--ink-soft);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .form-actions{display:flex;gap:10px;margin-top:6px;}
  .form-actions .btn{flex:1;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:9px 8px;border-bottom:2px solid var(--line);}
  td{padding:9px 8px;border-bottom:1px solid var(--line);}
  .table-wrap{overflow-x:auto;}
  /* Excel-style colored columns for the fee payment history table */
  .fee-history-table{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:640px;}
  .fee-history-table thead th{color:#fff;font-weight:800;font-size:11px;border-bottom:none;padding:12px 16px;white-space:nowrap;}
  .fee-history-table thead th:first-child{border-radius:10px 0 0 0;}
  .fee-history-table thead th:last-child{border-radius:0 10px 0 0;}
  .fee-history-table tbody td{padding:13px 16px;font-weight:600;border-bottom:1px solid var(--card);vertical-align:middle;}
  .fee-history-table tbody tr:last-child td{border-bottom:none;}
  .fee-history-table th,.fee-history-table td{border-right:3px solid var(--card);}
  .fee-history-table th:last-child,.fee-history-table td:last-child{border-right:none;}
  .fee-history-table .col-date-h,.fee-history-table .col-date-d{width:16%;white-space:nowrap;}
  .fee-history-table .col-student-h,.fee-history-table .col-student-d{width:32%;}
  .fee-history-table .col-student-d{line-height:1.4;overflow-wrap:break-word;}
  .fee-history-table .col-term-h,.fee-history-table .col-term-d{width:18%;overflow-wrap:break-word;}
  .fee-history-table .col-amount-h,.fee-history-table .col-amount-d{width:18%;white-space:nowrap;}
  .fee-history-table .col-method-h,.fee-history-table .col-method-d{width:16%;white-space:nowrap;}

  /* ---------- PARENT PORTAL: digital receipt ---------- */
  .receipt-box{padding:4px 0 10px;position:relative;}
  .receipt-stamp{position:absolute;top:64px;right:6px;width:104px;height:104px;border-radius:50%;border:2.5px solid var(--teal);opacity:.6;transform:rotate(-16deg);display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2;}
  .receipt-stamp-inner{width:86px;height:86px;border-radius:50%;border:1.5px solid var(--teal);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;}
  .receipt-stamp .rs-line1{font-size:8px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--teal-dark);line-height:1.2;}
  .receipt-stamp .rs-line2{font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--teal-dark);margin:2px 0;}
  .receipt-stamp .rs-line3{font-size:7.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--teal-dark);}
  @media print{ .receipt-stamp{opacity:.7;} }
  .receipt-head{text-align:center;margin-bottom:14px;padding-bottom:14px;border-bottom:2px dashed var(--line);}
  .receipt-logo{width:44px;height:44px;border-radius:10px;object-fit:cover;margin-bottom:6px;}
  .receipt-school{font-size:17px;font-weight:800;color:var(--navy);}
  .receipt-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .receipt-title{font-size:12.5px;font-weight:700;color:var(--teal-dark);margin-top:8px;text-transform:uppercase;letter-spacing:.04em;}
  .receipt-amount{display:flex;justify-content:space-between;align-items:center;background:var(--teal-tint);border-radius:12px;padding:14px 16px;margin-top:14px;font-weight:800;color:var(--teal-dark);font-size:17px;}
  .receipt-foot{font-size:11px;color:var(--ink-soft);text-align:center;margin-top:14px;}
  @media print{
    body *{visibility:hidden;}
    #receiptArea,#receiptArea *{visibility:visible;}
    #receiptArea{position:fixed;left:0;top:0;width:100%;margin:0;padding:24px;}

// Builds an ID like DFM25000: prefix + gender letter + 2-digit year + zero-padded running number.
function formatGeneratedId(prefix, seq, digits, gender) {
  if (!prefix) return "";
  const yy = String(new Date().getFullYear()).slice(-2);
  const letter = gender === "Female" ? "F" : "M";
  return `${prefix}${letter}${yy}${String(Number(seq)||0).padStart(Number(digits)||3,'0')}`;
}
// Preview of the next ID for a given entity ("student"/"teacher") and gender, based on the
// currently saved counter — doesn't consume it.
function nextIdFor(kind, gender) {
  const s = schoolSettings || {};
  const prefix = s[`${kind}_id_prefix`];
  if (!prefix) return "";
  return formatGeneratedId(prefix, s[`${kind}_id_seq`] ?? 0, s[`${kind}_id_digits`] ?? 3, gender);
}
// Advances the running number after a new registration, so the next generated ID is unique.
async function advanceIdSeq(kind) {
  const s = schoolSettings || {};
  if (!s[`${kind}_id_prefix`]) return;
  const payload = { id: 1 };
  payload[`${kind}_id_seq`] = Number(s[`${kind}_id_seq`] ?? 0) + 1;
  try {
    await dbUpsert("school_settings", payload, "id");
    schoolSettings = Object.assign({}, schoolSettings, payload);
  } catch (e) { /* non-fatal — the record was already saved with its ID */ }
}

/* ---------------- MOTHER SYSTEM: REMOTE FEATURE CONTROL ----------------
   NAV ids in this list can be switched on/off per-school from the TransApple
   Mother System (schools.features jsonb column). "Core" ids below are NEVER
   gated — every school always keeps Home, Users/Account, Settings and Trash,
   regardless of plan, so nobody ever gets locked out of their own account
   settings or bin. Everything else follows schools.features[navId]; a module
   is treated as ENABLED unless the Mother System has explicitly set it to
   false (so schools created before this system existed, or with no features
   configured yet, are unaffected).
   This id list must be kept in sync with FEATURE_MODULES in the Mother App. */
const CORE_NAV_IDS = new Set(["dashboard","users","settings","trash"]);
const GATABLE_NAV_IDS = ["health","students","teachers","attendance","fees","exams","academic","comms"];

// The full school row from the Mother System's `schools` table (status, plan,
// features, name/motto). Kept separate from `schoolSettings` (this app's own
// `school_settings` table) — this one is the record the Mother System owns.
let CURRENT_SCHOOL = null;
async function loadCurrentSchool() {
  if (!CURRENT_SCHOOL_ID) { CURRENT_SCHOOL = null; return; }
  try {
    const rows = await dbSelect("schools", { id:`eq.${CURRENT_SCHOOL_ID}`, select:"id,name,motto,status,plan,features" });
    CURRENT_SCHOOL = rows[0] || null;
  } catch (e) { CURRENT_SCHOOL = null; }
}
function isFeatureEnabled(navId) {
  if (CORE_NAV_IDS.has(navId)) return true;
  const f = CURRENT_SCHOOL?.features;
  if (!f || typeof f !== "object") return true; // no config from Mother System yet — don't lock anyone out
  return f[navId] !== false;
}
// Is this school allowed to be used at all right now, per the Mother System?
function schoolIsActive() {
  if (!CURRENT_SCHOOL) return true; // couldn't reach the schools row (offline, RLS not set up yet, etc.) — fail open, not closed
  return CURRENT_SCHOOL.status === "active";
}
function schoolBlockedMessage() {
  const s = CURRENT_SCHOOL?.status;
  if (s === "pending") return "Your school's registration is still awaiting approval from TransApple. Please check back shortly.";
  if (s === "suspended") return "Access to this school has been suspended by TransApple. Please contact your administrator or TransApple support.";
  if (s === "deactivated") return "This school's account has been deactivated by TransApple. Please contact TransApple support if you believe this is a mistake.";
  return "This school's account is not currently active. Please contact TransApple support.";
}
// Polls the Mother System's schools row every 45s (and whenever the tab regains
// focus) so plan/feature/status changes made from the Mother App take effect
// here automatically, without anyone needing to log out and back in.
let __schoolSyncTimer = null;
function startSchoolSync() {
  stopSchoolSync();
  const tick = async () => {
    if (!CURRENT_SCHOOL_ID) return;
    const prevStatus = CURRENT_SCHOOL?.status;
    const prevFeatures = JSON.stringify(CURRENT_SCHOOL?.features || {});
    await loadCurrentSchool();
    if (!auth) return; // logged out while this was in flight
    const changed = prevStatus !== CURRENT_SCHOOL?.status || prevFeatures !== JSON.stringify(CURRENT_SCHOOL?.features || {});
    if (changed) {
      if (!schoolIsActive()) { render(); return; } // full block screen takes over immediately
      if (!hasNavAccess(profile, tab)) tab = "dashboard";
      render();
    }
  };
  __schoolSyncTimer = setInterval(tick, 45000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") tick(); });
}
function stopSchoolSync() { if (__schoolSyncTimer) { clearInterval(__schoolSyncTimer); __schoolSyncTimer = null; } }

// Which NAV section ids a profile may open. Accounts created before this
// department system existed (no `department` set) fall back to their old
// legacy `role` so nobody gets silently locked out of everything.
function deptAccess(p) {
  if (p?.role === "admin") return "all";
  const d = DEPARTMENTS[p?.department];
  if (d) return d.access;
  if (p?.role === "accountant") return ["dashboard","students","fees"];
  if (p?.role === "teacher") return ["dashboard","students","teachers","attendance","exams","academic"];
  return ["dashboard"];
}
function hasFullAccess(p) { return deptAccess(p) === "all"; }
function hasNavAccess(p, navId) {
  if (!isFeatureEnabled(navId)) return false; // Mother System module gate overrides department access entirely
  const a = deptAccess(p);
  return a === "all" || a.includes(navId);
}
// One-time setup for username/password/pin login with NO Supabase Auth and NO
// email involved anywhere — accounts live entirely in the `profiles` table,
// with passwords hashed by Postgres itself (pgcrypto), checked via the
// verify_login() function below. Run this once in Supabase → SQL Editor.
const PROFILES_MIGRATION_SQL = `-- lets Postgres hash/check passwords for us
create extension if not exists pgcrypto;

-- new columns this account system needs
alter table profiles add column if not exists username text unique;
alter table profiles add column if not exists phone text;
alter table profiles add column if not exists pin text;
alter table profiles add column if not exists password_hash text;
alter table profiles add column if not exists photo_url text;
alter table profiles add column if not exists suspended_at timestamptz;
alter table profiles add column if not exists deleted_at timestamptz;
-- profiles.id used to come from auth.users (via a foreign key) — accounts are
-- created directly here now, so that link has to go, and id needs to generate itself:
alter table profiles drop constraint if exists profiles_id_fkey;
alter table profiles alter column id set default gen_random_uuid();

-- Creates a new account. Called from the app's "Create account" screen.
drop function if exists create_account(text, text, text, text, text, text);
drop function if exists create_account(text, text, text, text, text, text, text);
create function create_account(
  p_full_name text, p_username text, p_department text,
  p_phone text, p_password text, p_pin text, p_photo_url text default null
) returns profiles
language plpgsql security definer as $create_account$
declare new_row profiles;
begin
  if p_username is null or trim(p_username) = '' then
    raise exception 'Username is required.';
  end if;
  if exists (select 1 from profiles where username = p_username) then
    raise exception 'That username is already taken.';
  end if;
  insert into profiles (full_name, username, department, phone, pin, password_hash, role, photo_url)
  values (p_full_name, p_username, nullif(p_department,''), nullif(p_phone,''), nullif(p_pin,''), crypt(p_password, gen_salt('bf')), 'staff', p_photo_url)
  returning * into new_row;
  new_row.password_hash := null;
  return new_row;
end;
$create_account$;
grant execute on function create_account(text,text,text,text,text,text,text) to anon, authenticated;

-- Checks a username + password and returns the profile on success.
drop function if exists verify_login(text, text);
create function verify_login(p_username text, p_password text) returns profiles
language plpgsql security definer as $verify_login$
declare found_row profiles;
begin
  select * into found_row from profiles where username = p_username;
  if found_row.id is null or found_row.password_hash is null
     or crypt(p_password, found_row.password_hash) <> found_row.password_hash then
    raise exception 'Incorrect username or password.';
  end if;
  if found_row.deleted_at is not null then
    raise exception 'This account has been deleted. Contact Administration.';
  end if;
  if found_row.suspended_at is not null then
    raise exception 'This account is suspended. Contact Administration.';
  end if;
  found_row.password_hash := null;
  return found_row;
end;
$verify_login$;
grant execute on function verify_login(text,text) to anon, authenticated;

-- "Forgot password" flow: identity is confirmed with the account's PIN
-- (no email involved), then the password is reset straight away.
drop function if exists reset_password(text, text, text);
create function reset_password(p_username text, p_pin text, p_new_password text) returns void
language plpgsql security definer as $reset_password$
declare found_row profiles;
begin
  select * into found_row from profiles where username = p_username;
  if found_row.id is null then
    raise exception 'No account found with that username.';
  end if;
  if found_row.pin is null or found_row.pin = '' or found_row.pin <> p_pin then
    raise exception 'That PIN does not match our records.';
  end if;
  if p_new_password is null or length(p_new_password) < 6 then
    raise exception 'New password must be at least 6 characters.';
  end if;
  update profiles set password_hash = crypt(p_new_password, gen_salt('bf')) where id = found_row.id;
end;
$reset_password$;
grant execute on function reset_password(text,text,text) to anon, authenticated;`;

-- Verifies a Student ID + the student's exact registered name match, then
-- links that student to a parent profile. Used both when adding a child
-- after sign-up and (inside create_parent_account below) during sign-up.
drop function if exists link_parent_child(uuid, text, text);
create function link_parent_child(p_parent_id uuid, p_admission_no text, p_student_name text) returns students
language plpgsql security definer as $link_parent_child$
declare found_student students;
begin
  select * into found_student from students
    where trim(lower(admission_no)) = trim(lower(p_admission_no))
      and trim(lower(full_name)) = trim(lower(p_student_name))
      and deleted_at is null
    limit 1;
  if found_student.id is null then
    raise exception 'We could not find a student with that Student ID and exact registered name. Please check with the school office.';
  end if;
  insert into parent_students (parent_id, student_id) values (p_parent_id, found_student.id)
    on conflict (parent_id, student_id) do nothing;
  return found_student;
end;
$link_parent_child$;
grant execute on function link_parent_child(uuid,text,text) to anon, authenticated;

-- Creates a parent account. The Student ID + exact registered name match is
-- verified FIRST — the account (and the link to the child) is only created
-- once that check passes.
drop function if exists create_parent_account(text, text, text, text, text, text, text, text);
create function create_parent_account(
  p_full_name text, p_username text, p_phone text, p_password text, p_pin text,
  p_photo_url text, p_admission_no text, p_student_name text
) returns profiles
language plpgsql security definer as $create_parent_account$
declare new_row profiles; found_student students;
begin
  select * into found_student from students
    where trim(lower(admission_no)) = trim(lower(p_admission_no))
      and trim(lower(full_name)) = trim(lower(p_student_name))
      and deleted_at is null
    limit 1;
  if found_student.id is null then
    raise exception 'We could not find a student with that Student ID and exact registered name. Please check with the school office.';
  end if;
  if p_username is null or trim(p_username) = '' then
    raise exception 'Username is required.';
  end if;
  if exists (select 1 from profiles where username = p_username) then
    raise exception 'That username is already taken.';
  end if;
  insert into profiles (full_name, username, phone, pin, password_hash, role, photo_url)
  values (p_full_name, p_username, nullif(p_phone,''), nullif(p_pin,''), crypt(p_password, gen_salt('bf')), 'parent', p_photo_url)
  returning * into new_row;
  insert into parent_students (parent_id, student_id) values (new_row.id, found_student.id)
    on conflict (parent_id, student_id) do nothing;
  new_row.password_hash := null;
  return new_row;
end;
$create_parent_account$;
grant execute on function create_parent_account(text,text,text,text,text,text,text,text) to anon, authenticated;`;

/* ---------------- MULTI-SCHOOL SETUP ----------------
   Run this ONCE in Supabase → SQL Editor to turn this single-school app into
   a multi-school one. It: creates the `schools` registry table, adds a
   `school_id` column to every existing table, backfills existing rows into a
   first "default" school (so nothing already in your database gets orphaned),
   and updates create_account/create_parent_account/link_parent_child to be
   school-aware. Nothing here changes how the app works for a school that's
   already using it — it just adds the ability to have more than one. */
const MULTI_SCHOOL_SQL = `create table if not exists schools (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  status text not null default 'active', -- 'active' or 'suspended'
  created_at timestamptz not null default now()
);
alter table schools enable row level security;
drop policy if exists "Anyone can read active schools" on schools;
create policy "Anyone can read active schools" on schools for select using (true);

-- One default school so existing data has somewhere to belong.
insert into schools (name) select 'My School' where not exists (select 1 from schools);

-- Add school_id to every table this app uses, and backfill it to the first
-- school so nothing existing breaks. Safe to re-run.
do $$
declare t text; default_school uuid;
begin
  select id into default_school from schools order by created_at limit 1;
  foreach t in array array[
    'profiles','students','teachers','classes','class_subjects','subjects','terms',
    'exams','exam_types','exam_results','grades','attendance','staff_attendance',
    'fee_structures','fee_payments','school_communications','school_meetings',
    'school_settings','account_change_requests','parent_students','parent_messages','private_messages','fee_reminders'
  ]
  loop
    if to_regclass(t) is not null then
      execute format('alter table %I add column if not exists school_id uuid references schools(id)', t);
      execute format('update %I set school_id = %L where school_id is null', t, default_school);
    end if;
  end loop;
end $$;

-- Creates a new staff account within a specific school.
drop function if exists create_account(text, text, text, text, text, text, text);
create function create_account(
  p_full_name text, p_username text, p_department text,
  p_phone text, p_password text, p_pin text, p_photo_url text default null, p_school_id uuid default null
) returns profiles
language plpgsql security definer as $create_account$
declare new_row profiles;
begin
  if p_username is null or trim(p_username) = '' then
    raise exception 'Username is required.';
  end if;
  if p_school_id is null then
    raise exception 'Select a school.';
  end if;
  if exists (select 1 from profiles where username = p_username) then
    raise exception 'That username is already taken.';
  end if;
  insert into profiles (full_name, username, department, phone, pin, password_hash, role, photo_url, school_id)
  values (p_full_name, p_username, nullif(p_department,''), nullif(p_phone,''), nullif(p_pin,''), crypt(p_password, gen_salt('bf')), 'staff', p_photo_url, p_school_id)
  returning * into new_row;
  new_row.password_hash := null;
  return new_row;
end;
$create_account$;
grant execute on function create_account(text,text,text,text,text,text,text,uuid) to anon, authenticated;

-- Creates a parent account, scoped to the school the student belongs to.
drop function if exists create_parent_account(text, text, text, text, text, text, text, text);
create function create_parent_account(
  p_full_name text, p_username text, p_phone text, p_password text, p_pin text,
  p_photo_url text, p_admission_no text, p_student_name text, p_school_id uuid default null
) returns profiles
language plpgsql security definer as $create_parent_account$
declare new_row profiles; found_student students;
begin
  if p_school_id is null then
    raise exception 'Select a school.';
  end if;
  select * into found_student from students
    where trim(lower(admission_no)) = trim(lower(p_admission_no))
      and trim(lower(full_name)) = trim(lower(p_student_name))
      and school_id = p_school_id
      and deleted_at is null
    limit 1;
  if found_student.id is null then
    raise exception 'We could not find a student with that Student ID and exact registered name at that school. Please check with the school office.';
  end if;
  if p_username is null or trim(p_username) = '' then
    raise exception 'Username is required.';
  end if;
  if exists (select 1 from profiles where username = p_username) then
    raise exception 'That username is already taken.';
  end if;
  insert into profiles (full_name, username, phone, pin, password_hash, role, photo_url, school_id)
  values (p_full_name, p_username, nullif(p_phone,''), nullif(p_pin,''), crypt(p_password, gen_salt('bf')), 'parent', p_photo_url, p_school_id)
  returning * into new_row;
  insert into parent_students (parent_id, student_id, school_id) values (new_row.id, found_student.id, p_school_id)
    on conflict (parent_id, student_id) do nothing;
  new_row.password_hash := null;
  return new_row;
end;
$create_parent_account$;
grant execute on function create_parent_account(text,text,text,text,text,text,text,text,uuid) to anon, authenticated;

-- Links an additional child, scoped to the parent's own school.
drop function if exists link_parent_child(uuid, text, text);
create function link_parent_child(p_parent_id uuid, p_admission_no text, p_student_name text) returns students
language plpgsql security definer as $link_parent_child$
declare found_student students; parent_school uuid;
begin
  select school_id into parent_school from profiles where id = p_parent_id;
  select * into found_student from students
    where trim(lower(admission_no)) = trim(lower(p_admission_no))
      and trim(lower(full_name)) = trim(lower(p_student_name))
      and school_id = parent_school
      and deleted_at is null
    limit 1;
  if found_student.id is null then
    raise exception 'We could not find a student with that Student ID and exact registered name. Please check with the school office.';
  end if;
  insert into parent_students (parent_id, student_id, school_id) values (p_parent_id, found_student.id, parent_school)
    on conflict (parent_id, student_id) do nothing;
  return found_student;
end;
$link_parent_child$;
grant execute on function link_parent_child(uuid,text,text) to anon, authenticated;`;

/* ---------------- SCHOOL SELF-REGISTRATION (TransApple mother system) ----------------
   Run this ONCE in Supabase → SQL Editor, after MULTI_SCHOOL_SQL. It powers the
   "Register Your School" screen shown the first time this app is opened on a
   new browser/device with no account yet.
   IMPORTANT — data ownership: everything collected on that screen about the
   SCHOOL itself (name, motto, location, size range, school password) is written
   ONLY to the `schools` table below. `schools` is the TransApple mother system's
   registry — the same table mother-app.html reads and manages — never this
   app's own operational tables (profiles, students, etc). That keeps school
   registration data fully owned and manageable by the mother system, exactly
   like a school that a mother-app admin created directly. Only the first
   Administrator's login account is created here, in `profiles`, because that
   account has to exist in this app's database for them to log in and start
   creating the rest of their team. */
const SCHOOL_SELF_REGISTRATION_SQL = `-- Extra fields the registration screen collects about the school itself —
-- these live on the mother system's own \`schools\` table, not in this app's data.
alter table schools add column if not exists motto text;
alter table schools add column if not exists location text;
alter table schools add column if not exists size_range text;
alter table schools add column if not exists password_hash text;

-- Extra contact fields for the first Administrator account.
alter table profiles add column if not exists whatsapp text;
alter table profiles add column if not exists email text;
alter table profiles add column if not exists location text;

-- Registers a brand-new school (written to the mother system's \`schools\`
-- table) AND creates its first Administrator account together, atomically —
-- if either half fails, nothing is created.
drop function if exists register_school(text,text,text,text,text,text,text,text,text,text,text,text,text);
create function register_school(
  p_school_name text, p_school_motto text, p_school_location text,
  p_school_password text, p_school_size_range text,
  p_admin_full_name text, p_admin_username text, p_admin_phone text,
  p_admin_whatsapp text, p_admin_email text, p_admin_location text,
  p_admin_password text, p_admin_pin text default null
) returns profiles
language plpgsql security definer as $register_school$
declare new_school schools; new_admin profiles;
begin
  if p_school_name is null or trim(p_school_name) = '' then
    raise exception 'School name is required.';
  end if;
  if p_school_password is null or length(p_school_password) < 6 then
    raise exception 'School password must be at least 6 characters.';
  end if;
  if p_admin_full_name is null or trim(p_admin_full_name) = '' then
    raise exception 'Administrator full name is required.';
  end if;
  if p_admin_username is null or trim(p_admin_username) = '' then
    raise exception 'Administrator username is required.';
  end if;
  if exists (select 1 from profiles where username = p_admin_username) then
    raise exception 'That username is already taken.';
  end if;
  if p_admin_password is null or length(p_admin_password) < 6 then
    raise exception 'Administrator password must be at least 6 characters.';
  end if;

  -- School record: owned by the mother system, not this app's own tables.
  insert into schools (name, motto, location, size_range, password_hash, status)
  values (
    trim(p_school_name), nullif(trim(p_school_motto),''), nullif(trim(p_school_location),''),
    nullif(p_school_size_range,''), crypt(p_school_password, gen_salt('bf')), 'active'
  ) returning * into new_school;

  -- First Administrator — Administration department = full access to everything.
  insert into profiles (
    full_name, username, department, phone, whatsapp, email, location,
    pin, password_hash, role, school_id
  ) values (
    trim(p_admin_full_name), p_admin_username, 'administration',
    nullif(p_admin_phone,''), nullif(p_admin_whatsapp,''), nullif(p_admin_email,''), nullif(p_admin_location,''),
    nullif(p_admin_pin,''), crypt(p_admin_password, gen_salt('bf')), 'staff', new_school.id
  ) returning * into new_admin;

  new_admin.password_hash := null;
  return new_admin;
end;
$register_school$;
grant execute on function register_school(text,text,text,text,text,text,text,text,text,text,text,text,text) to anon, authenticated;`;

/* ---------------- SUPABASE HELPERS ---------------- */
async function sb(path, opts = {}) {
  // Accounts no longer go through Supabase Auth at all (see AUTH section below), so
  // every request — logged in or not — just uses the project's anon key.
  const headers = Object.assign({
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + SUPABASE_KEY,
    "Content-Type": "application/json",
  }, opts.headers || {});
  let res;
  try {
    res = await fetch(SUPABASE_URL + path, Object.assign({}, opts, { headers }));
  } catch (e) {
    // The browser throws a bare "Failed to fetch" for any network-level failure
    // (offline, blocked request, DNS issue, server unreachable, CORS, etc).
    // Surface something a user can actually act on instead of that raw message.
    throw new Error("Check your internet connection and try again. If this keeps happening, please contact the developer.");
  }
  let data = null;
  try { data = await res.json(); } catch(e) { data = null; }
  if (!res.ok) {
    const msg = (data && (data.error_description || data.msg || data.message)) || "Request failed";
    throw new Error(msg);
  }
  return data;
}
const qs = (obj) => Object.entries(obj).filter(([,v])=>v!==undefined && v!==null && v!=="").map(([k,v])=>`${k}=${v}`).join("&");

// Every read/write below is scoped to CURRENT_SCHOOL_ID automatically, so the
// hundreds of call sites elsewhere in the app never need to mention school_id
// themselves — school isolation lives in exactly one place.
function scopedParams(table, params) {
  const p = Object.assign({}, params);
  if (CURRENT_SCHOOL_ID && !SCHOOL_SCOPE_EXEMPT.has(table)) p.school_id = `eq.${CURRENT_SCHOOL_ID}`;
  return p;
}
function scopedBody(table, body) {
  if (!CURRENT_SCHOOL_ID || SCHOOL_SCOPE_EXEMPT.has(table)) return body;
  if (Array.isArray(body)) return body.map(row => Object.assign({ school_id: CURRENT_SCHOOL_ID }, row));
  return Object.assign({ school_id: CURRENT_SCHOOL_ID }, body);
}
async function dbSelect(table, params={}) {
  return sb(`/rest/v1/${table}?${qs(scopedParams(table, Object.assign({select:"*"}, params)))}`);
}
async function dbInsert(table, body) {
  return sb(`/rest/v1/${table}`, { method:"POST", body: JSON.stringify(scopedBody(table, body)), headers:{ "Prefer":"return=representation" } });
}
async function dbUpdate(table, id, body) {
  return sb(`/rest/v1/${table}?${qs(scopedParams(table, {id:`eq.${id}`}))}`, { method:"PATCH", body: JSON.stringify(body), headers:{ "Prefer":"return=representation" } });
}
async function dbUpsert(table, body, onConflict) {
  return sb(`/rest/v1/${table}?on_conflict=${onConflict}`, { method:"POST", body: JSON.stringify(scopedBody(table, body)), headers:{ "Prefer":"resolution=merge-duplicates,return=representation" } });
}
async function dbDelete(table, id) {
  return sb(`/rest/v1/${table}?${qs(scopedParams(table, {id:`eq.${id}`}))}`, { method:"DELETE" });
}
async function dbSelectActive(table, params={}) {
  try { return await dbSelect(table, Object.assign({ deleted_at:"is.null" }, params)); }
  catch (e) { return await dbSelect(table, params); }
}

/* ---------------- AUTH ----------------
   No Supabase Auth, no email, no rate limits — this goes straight against the
   `profiles` table via two Postgres functions (see PROFILES_MIGRATION_SQL
   below): create_account() and verify_login(). Passwords are hashed with
   pgcrypto inside those functions; the plain password only ever leaves the
   browser over HTTPS to be checked/hashed, and is never stored or returned. */
const REMEMBER_KEY = "novaRememberedUsername";
const REMEMBER_SCHOOL_KEY = "novaRememberedSchoolId";
// Tracks whether this browser/device has ever registered a school or logged in
// before — independent of "remember me" and NOT cleared on logout — so a
// returning device goes straight to the log-in screen instead of being shown
// "Register Your School" again every time someone signs out.
const DEVICE_SEEN_KEY = "novaDeviceSeen";
function markDeviceSeen() { try { localStorage.setItem(DEVICE_SEEN_KEY, "true"); } catch (e) {} }
function isDeviceSeen() { try { return localStorage.getItem(DEVICE_SEEN_KEY) === "true"; } catch (e) { return false; } }
function rememberSession(username) {
  try { localStorage.setItem(REMEMBER_KEY, username); } catch (e) {}
}
function clearRememberedSession() {
  try { localStorage.removeItem(REMEMBER_KEY); localStorage.removeItem(REMEMBER_SCHOOL_KEY); } catch (e) {}
}
function getRememberedSession() {
  try { return localStorage.getItem(REMEMBER_KEY) || null; } catch (e) { return null; }
}
function setCurrentSchool(schoolId) {
  CURRENT_SCHOOL_ID = schoolId || null;
  try { if (schoolId) localStorage.setItem(REMEMBER_SCHOOL_KEY, schoolId); } catch (e) {}
}
// Used only to decide the very first screen shown on this device (see render()) —
// if this device has ever been associated with a school before, skip straight to
// the log-in screen instead of "Register Your School".
function getRememberedSchool() {
  try { return localStorage.getItem(REMEMBER_SCHOOL_KEY) || null; } catch (e) { return null; }
}
function scrubProfile(row) {
  if (!row) return row;
  const { password_hash, ...rest } = row;
  return rest;
}
async function login(username, password, remember) {
  const rows = await sb(`/rest/v1/rpc/verify_login`, { method:"POST", body: JSON.stringify({ p_username: username, p_password: password }) });
  const row = Array.isArray(rows) ? rows[0] : rows;
  if (!row || !row.id) throw new Error("Incorrect username or password.");
  profile = scrubProfile(row);
  setCurrentSchool(profile.school_id);
  await loadCurrentSchool();
  auth = { user: { id: profile.id } }; // no real token — just marks "signed in" for the UI gate below
  if (remember) rememberSession(username); else clearRememberedSession();
  markDeviceSeen();
  pinLocked = false;
  tab = "dashboard";
  startSchoolSync();
  render();
}
// Silently restores a "remembered" session on app launch by just looking the
// person back up by username — no password, no PIN, straight into the app,
// every time. Returns true if someone was found, false otherwise (and clears
// any stale remembered username so we don't keep trying it).
async function tryRestoreRememberedSession() {
  const username = getRememberedSession();
  if (!username) return false;
  try {
    const rows = await dbSelect("profiles", { username:`eq.${username}`, select:"id,full_name,phone,department,position,role,username,pin,photo_url,suspended_at,deleted_at,school_id" });
    const row = rows[0];
    if (!row) { clearRememberedSession(); return false; }
    if (row.deleted_at || row.suspended_at) { clearRememberedSession(); return false; }
    profile = scrubProfile(row);
    setCurrentSchool(profile.school_id);
    await loadCurrentSchool();
    auth = { user: { id: profile.id } };
    markDeviceSeen();
    pinLocked = false;
    startSchoolSync();
    return true;
  } catch (e) {
    return false;
  }
}
// Creates a new staff account. Department drives what they can see (see
// deptAccess/hasNavAccess above) — "Administration" already gets full access on
// its own, so the legacy `role` column just stays "staff" for everyone.
async function signup({ full_name, username, department, phone, password, pin, photo_url, school_id }) {
  await sb(`/rest/v1/rpc/create_account`, { method:"POST", body: JSON.stringify({
    p_full_name: full_name, p_username: username, p_department: department || null,
    p_phone: phone || null, p_password: password, p_pin: pin || null, p_photo_url: photo_url || null,
    p_school_id: school_id,
  }) });
}
// Schools shown in the signup school picker — only active ones, id+name only.
async function listActiveSchools() {
  return dbSelect("schools", { select:"id,name", status:"eq.active", order:"name.asc" });
}
// Options for the "School Size Range" field on the registration screen.
const SCHOOL_SIZE_RANGES = ["1–100 students","101–300 students","301–600 students","601–1000 students","1000+ students"];
// Registers a brand-new school (stored in the mother system's `schools` table —
// see SCHOOL_SELF_REGISTRATION_SQL) and creates its first Administrator account
// in one atomic call. Returns the new Administrator's profile.
async function registerSchool({ schoolName, schoolMotto, schoolLocation, schoolPassword, schoolSizeRange, adminFullName, adminUsername, adminPhone, adminWhatsapp, adminEmail, adminLocation, adminPassword, adminPin }) {
  const rows = await sb(`/rest/v1/rpc/register_school`, { method:"POST", body: JSON.stringify({
    p_school_name: schoolName, p_school_motto: schoolMotto || null, p_school_location: schoolLocation || null,
    p_school_password: schoolPassword, p_school_size_range: schoolSizeRange || null,
    p_admin_full_name: adminFullName, p_admin_username: adminUsername, p_admin_phone: adminPhone || null,
    p_admin_whatsapp: adminWhatsapp || null, p_admin_email: adminEmail || null, p_admin_location: adminLocation || null,
    p_admin_password: adminPassword, p_admin_pin: adminPin || null,
  }) });
  return Array.isArray(rows) ? rows[0] : rows;
}
// Creates a parent account. The Student ID + exact registered name match is verified
// server-side FIRST (see create_parent_account() in PARENT_PORTAL_SQL) — the account
// only comes into existence, already linked to the child, once that check passes.
async function createParentAccount({ full_name, username, phone, password, pin, photo_url, admission_no, student_name, school_id }) {
  await sb(`/rest/v1/rpc/create_parent_account`, { method:"POST", body: JSON.stringify({
    p_full_name: full_name, p_username: username, p_phone: phone || null, p_password: password,
    p_pin: pin || null, p_photo_url: photo_url || null, p_admission_no: admission_no, p_student_name: student_name,
    p_school_id: school_id,
  }) });
}
// Links an additional child to an existing parent account, same verification.
async function linkParentChild(parentId, admission_no, student_name) {
  const rows = await sb(`/rest/v1/rpc/link_parent_child`, { method:"POST", body: JSON.stringify({
    p_parent_id: parentId, p_admission_no: admission_no, p_student_name: student_name,
  }) });
  return Array.isArray(rows) ? rows[0] : rows;
}

function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
// Browsers silently drop <tr>/<td> tags when parsed as innerHTML of a plain <div> (they're
// only valid inside a table context), which collapses every column into one first cell.
// Use this instead of el() whenever building a <tr> to append into a <tbody>.
function elRow(rowHtml) { const t = document.createElement("table"); t.innerHTML = rowHtml.trim(); return t.querySelector("tr"); }

function initials(name) { return (name||"?").split(" ").filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(""); }
function avatarHtml(name, photoUrl, size) {
  size = size || 40;
  if (photoUrl) return `<img src="${photoUrl}" alt="${name||''}" style="width:${size}px;height:${size}px;border-radius:10px;object-fit:cover;flex-shrink:0;"/>`;
  return `<div class="avatar" style="width:${size}px;height:${size}px;">${initials(name)}</div>`;
}
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error("Could not read image file."));
    r.readAsDataURL(file);
  });
}
// Throws with a friendly message if any of the given field ids are empty — used to enforce
// "required" fields on custom (non-<form>) modals.
function requireFields(ov, fields) {
  for (const [id, label] of fields) {
    const elF = ov.querySelector("#"+id);
    if (!elF) continue;
    if (!String(elF.value || "").trim()) throw new Error(`${label} is required.`);
  }
}
// Opens a live camera overlay and explicitly asks the browser for camera permission via
// getUserMedia. Calls onCapture(dataUrl) with a JPEG data URL once the person snaps a photo.
// If the browser can't do getUserMedia at all (or the person denies/it errors), calls
// onUnavailable() so the caller can fall back to a native capture-attribute file input.
function openCameraCapture(onCapture, onUnavailable) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { onUnavailable && onUnavailable(); return; }
  const overlay = el(`<div class="overlay">
    <div class="modal" style="max-width:420px;">
      <button class="modal-close">&times;</button>
      <h3>Take photo</h3>
      <div style="border-radius:12px;overflow:hidden;background:#000;margin-top:10px;position:relative;">
        <video id="camVideo" autoplay playsinline style="width:100%;display:block;max-height:60vh;object-fit:cover;"></video>
        <button type="button" class="btn btn-ghost btn-sm" id="camSwitch" style="position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);">${ic.camera} Switch</button>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" id="camCancel">Cancel</button>
        <button class="btn btn-primary" id="camCapture">Capture</button>
      </div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  const video = overlay.querySelector("#camVideo");
  let stream = null, settled = false, facing = "user";
  const stop = () => { if (stream) stream.getTracks().forEach(t => t.stop()); };
  const close = () => { stop(); overlay.remove(); };
  overlay.querySelector(".modal-close").onclick = close;
  overlay.querySelector("#camCancel").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  // This call is what triggers the browser/OS's "Allow camera access?" permission prompt.
  const startCamera = (mode) => {
    stop();
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: mode }, audio: false })
      .then(s => { if (settled) { s.getTracks().forEach(t=>t.stop()); return; } stream = s; video.srcObject = s; })
      .catch(() => {
        // If the requested facing mode isn't available on this device, fall back to whatever camera we can get.
        if (mode !== "user") return navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then(s => { if (settled) { s.getTracks().forEach(t=>t.stop()); return; } stream = s; video.srcObject = s; })
          .catch(() => { settled = true; close(); onUnavailable && onUnavailable(); });
        settled = true; close(); onUnavailable && onUnavailable();
      });
  };
  startCamera(facing);
  overlay.querySelector("#camSwitch").onclick = () => {
    facing = facing === "user" ? "environment" : "user";
    startCamera(facing);
  };
  overlay.querySelector("#camCapture").onclick = () => {
    if (!stream) return;
    settled = true;
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 480; canvas.height = video.videoHeight || 480;
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
    close();
    onCapture(dataUrl);
  };
}

/* ---------------- MODAL HELPER ---------------- */
// Keeps a centered modal fully visible and usable when the on-screen keyboard opens:
// shrinks/repositions the overlay to the actual visible viewport (so the modal never ends
// up hidden behind the keyboard), scrolls whichever field the person is typing into into
// view, and — once there's little content left below that field — scrolls the rest of the
// way so the tail of the form (including the Save/Cancel buttons) is never left hidden
// behind the keyboard. Not used for action sheets (the bottom-nav "More" menu, edit/delete
// sheets) — those have no inputs and stay anchored where they already are.
function enableModalKeyboardHandling(overlay) {
  const modal = overlay.querySelector(".modal");
  const vv = window.visualViewport;
  if (!modal) return;
  // If we're close to the end of the form's scrollable content, scroll all the way down
  // so trailing fields and the Save/Cancel row surface above the keyboard too.
  const revealTail = () => {
    const remaining = modal.scrollHeight - (modal.scrollTop + modal.clientHeight);
    if (remaining > 0 && remaining < 160) modal.scrollTo({ top: modal.scrollHeight, behavior: "smooth" });
  };
  modal.addEventListener("focusin", (e) => {
    const t = e.target;
    if (!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    // Give the keyboard's open animation a moment to finish before measuring/scrolling.
    setTimeout(() => {
      t.scrollIntoView({ block: "center", behavior: "smooth" });
      setTimeout(revealTail, 300);
    }, 250);
  });
  if (!vv) return;
  const resize = () => {
    overlay.style.height = vv.height + "px";
    overlay.style.top = vv.offsetTop + "px";
    overlay.style.bottom = "auto";
    modal.style.maxHeight = Math.round(vv.height * 0.9) + "px";
    if (document.activeElement && modal.contains(document.activeElement)) revealTail();
  };
  vv.addEventListener("resize", resize);
  vv.addEventListener("scroll", resize);
  resize();
  const stop = new MutationObserver(() => {
    if (document.body.contains(overlay)) return;
    vv.removeEventListener("resize", resize);
    vv.removeEventListener("scroll", resize);
    stop.disconnect();
  });
  stop.observe(document.body, { childList: true });
}

// Keeps the login/sign-up card fully visible and scrollable when the on-screen
// keyboard opens — same idea as enableModalKeyboardHandling above, but targeting
// .login-wrap/.login-card instead of an .overlay/.modal pair.
function enableAuthKeyboardHandling() {
  const wrap = document.querySelector(".login-wrap");
  const card = document.querySelector(".login-card");
  if (!wrap || !card) return;
  const vv = window.visualViewport;
  const revealTail = () => {
    const remaining = card.scrollHeight - (card.scrollTop + card.clientHeight);
    if (remaining > 0 && remaining < 160) card.scrollTo({ top: card.scrollHeight, behavior: "smooth" });
  };
  wrap.addEventListener("focusin", (e) => {
    const t = e.target;
    if (!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    setTimeout(() => {
      t.scrollIntoView({ block: "center", behavior: "smooth" });
      setTimeout(revealTail, 300);
    }, 250);
  });
  if (!vv) return;
  const resize = () => {
    wrap.style.height = vv.height + "px";
    wrap.style.top = vv.offsetTop + "px";
    card.style.maxHeight = Math.round(vv.height * 0.92) + "px";
    if (document.activeElement && card.contains(document.activeElement)) revealTail();
  };
  vv.addEventListener("resize", resize);
  vv.addEventListener("scroll", resize);
  resize();
}

/* ---------------- CUSTOM ALERT / CONFIRM ----------------
   Replaces the browser's native alert()/confirm() — which show as an unstyled
   "This page says" dialog with an invisible white OK button on many devices —
   with our own centered, clearly-colored dialog. */
function customAlert(message, opts={}) {
  return new Promise((resolve) => {
    const overlay = el(`<div class="overlay">
      <div class="modal confirm-box">
        <div class="confirm-msg">${message}</div>
        <div class="form-actions">
          <button class="btn btn-primary" id="alertOk">${opts.okLabel || "OK"}</button>
        </div>
      </div>
    </div>`);
    document.body.appendChild(overlay);
    enableModalKeyboardHandling(overlay);
    const close = () => { overlay.remove(); resolve(); };
    overlay.querySelector("#alertOk").onclick = close;
    overlay.onclick = (e) => { if (e.target === overlay) close(); };
  });
}
function customConfirm(message, opts={}) {
  return new Promise((resolve) => {
    const danger = !!opts.danger;
    const overlay = el(`<div class="overlay">
      <div class="modal confirm-box">
        <div class="confirm-msg">${message}</div>
        <div class="form-actions">
          <button class="btn btn-ghost" id="confirmNo">${opts.cancelLabel || "Cancel"}</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="confirmYes">${opts.okLabel || (danger ? "Delete" : "OK")}</button>
        </div>
      </div>
    </div>`);
    document.body.appendChild(overlay);
    enableModalKeyboardHandling(overlay);
    let done = false;
    const finish = (v) => { if (done) return; done = true; overlay.remove(); resolve(v); };
    overlay.querySelector("#confirmNo").onclick = () => finish(false);
    overlay.querySelector("#confirmYes").onclick = () => finish(true);
    overlay.onclick = (e) => { if (e.target === overlay) finish(false); };
  });
}
function openModal(title, fieldsHtml, onSave, opts={}) {
  const overlay = el(`<div class="overlay"><div class="modal">
    <button class="modal-close">&times;</button>
    <h3>${title}</h3>

    <div class="form-actions">

      <button class="btn btn-primary" id="modalSave">${opts.saveLabel || "Save"}</button>
    </div>
  </div></div>`);
  document.body.appendChild(overlay);
  enableModalKeyboardHandling(overlay);
  const close = () => overlay.remove();
  overlay.querySelector(".modal-close").onclick = close;
  overlay.querySelector("#modalCancel").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };

}

/* ---------------- ROW GESTURES: short click = view, long press = edit/delete ---------------- */
function bindRowGestures(rowEl, { onView, onEdit, onDelete }) {
  rowEl.oncontextmenu = (e) => e.preventDefault();
  let timer = null, longFired = false, startX = 0, startY = 0;
  const LONG_MS = 550, MOVE_TOL = 10;
  const start = (x,y) => {
    longFired = false; startX = x; startY = y;
    timer = setTimeout(() => {
      longFired = true;
      const actions = [];
      if (onEdit) actions.push({ label:"Edit", icon:ic.edit, onClick:onEdit });
      if (onDelete) actions.push({ label:"Delete", icon:ic.trash, danger:true, onClick:onDelete });
      if (actions.length) openActionSheet(actions);
    }, LONG_MS);
  };
  const cancel = () => { clearTimeout(timer); };
  const move = (x,y) => { if (Math.abs(x-startX)>MOVE_TOL || Math.abs(y-startY)>MOVE_TOL) cancel(); };
  rowEl.addEventListener("pointerdown", (e) => start(e.clientX, e.clientY));
  rowEl.addEventListener("pointermove", (e) => move(e.clientX, e.clientY));
  rowEl.addEventListener("pointerup", () => { cancel(); if (!longFired && onView) onView(); });
  rowEl.addEventListener("pointercancel", cancel);
  rowEl.addEventListener("pointerleave", cancel);
}

/* Simple tap-vs-hold gesture: short tap fires onTap, holding fires onHold directly (no action sheet) */
function bindTapHold(rowEl, { onTap, onHold }) {
  rowEl.oncontextmenu = (e) => e.preventDefault();
  let timer = null, longFired = false, startX = 0, startY = 0;
  const LONG_MS = 550, MOVE_TOL = 10;
  const start = (x,y) => {
    longFired = false; startX = x; startY = y;
    timer = setTimeout(() => { longFired = true; if (onHold) onHold(); }, LONG_MS);
  };
  const cancel = () => { clearTimeout(timer); };
  const move = (x,y) => { if (Math.abs(x-startX)>MOVE_TOL || Math.abs(y-startY)>MOVE_TOL) cancel(); };
  rowEl.addEventListener("pointerdown", (e) => start(e.clientX, e.clientY));
  rowEl.addEventListener("pointermove", (e) => move(e.clientX, e.clientY));
  rowEl.addEventListener("pointerup", () => { cancel(); if (!longFired && onTap) onTap(); });
  rowEl.addEventListener("pointercancel", cancel);
  rowEl.addEventListener("pointerleave", cancel);
}

   accounts (see PARENT_PORTAL_SQL). Parents never see the staff
   department/NAV system above; render() branches into renderParentApp()
   as soon as it sees profile.role === "parent".

/* Parents get exactly five menus — nothing else. Do not add extra tabs here

const NAV_PARENT = [

  { id:"pfees", label:"Fees", icon:ic.fees },

];
const PARENT_TAB_COLOR = { pchildren:"var(--sky)", pfees:"var(--red)", pnotifications:"#c2410c", pcontact:"var(--indigo)", psettings:"var(--slate)" };
const PARENT_TAB_ANIM = { pchildren:"slideInLeft", pfees:"wiggleIn", pnotifications:"popScale", pcontact:"fadeSlideDown", psettings:"riseIn" };

/* ---------------- PARENT NOTIFICATIONS (Meetings + Announcements) ----------------
   Upcoming school_meetings + recent school_communications(type=announcement),
   each read/unread per-parent locally on this device (there's no per-user
   read-tracking table, so a small localStorage set — keyed by parent id and
   "type:id" — is enough to know what's new and drives the red nav badge). */
function parentReadKey() { return `novaReadNotifs_${profile?.id || "anon"}`; }
function getReadNotifIds() {
  try { return new Set(JSON.parse(localStorage.getItem(parentReadKey()) || "[]")); }
  catch (e) { return new Set(); }
}
function markNotifsRead(ids) {
  if (!ids || !ids.length) return;
  const read = getReadNotifIds();
  ids.forEach(id => read.add(id));
  try { localStorage.setItem(parentReadKey(), JSON.stringify([...read])); } catch (e) {}
}
function notifIdsFor(meetings, announcements, reminders=[]) {
  return [...meetings.map(m => `meeting:${m.id}`), ...announcements.map(a => `announcement:${a.id}`), ...reminders.map(r => `reminder:${r.id}`)];
}
const parentAudienceOk = (a) => !a || a === "Everyone" || a === "All parents";
async function fetchParentMeetings() {
  const rows = await dbSelectActive("school_meetings", { order:"meeting_date.asc" });
  const now = Date.now();
  return rows.filter(m => parentAudienceOk(m.audience) && new Date(m.meeting_date).getTime() >= now);
}
async function fetchParentAnnouncements(limit=20) {
  const rows = await dbSelectActive("school_communications", { type:"eq.announcement", order:"created_at.desc", limit:String(limit) });
  return rows.filter(c => parentAudienceOk(c.audience));
}
// Fee reminders from Finance — a row with no student_id goes to every
// parent; a row with a student_id only shows up for the parent(s) linked to
// that specific child.
async function fetchParentFeeReminders(limit=20) {
  const rows = await dbSelectActive("fee_reminders", { order:"created_at.desc", limit:String(limit), select:"*,students(full_name)" });
  let childIds = [];
  try { childIds = (await getParentChildren()).map(c => c.id); } catch (e) {}
  return rows.filter(r => !r.student_id || childIds.includes(r.student_id));
}
// Refreshes the red unread-count badge on the "Meetings" nav entry (sidebar +
// bottom nav) in place, without a full re-render. Called after every parent
// shell render, and again immediately after the Meetings page marks its
// items as read so the badge disappears right away.
async function refreshParentBadges() {
  if (!profile || (profile.role !== "parent" && profile.department !== "parents")) return;
  let count = 0;
  try {
    const [meetings, announcements, reminders] = await Promise.all([fetchParentMeetings().catch(()=>[]), fetchParentAnnouncements().catch(()=>[]), fetchParentFeeReminders().catch(()=>[])]);
    const read = getReadNotifIds();
    count = notifIdsFor(meetings, announcements, reminders).filter(id => !read.has(id)).length;
  } catch (e) { count = 0; }
  document.querySelectorAll('[data-nav="pnotifications"]').forEach(node => {
    let badge = node.querySelector(".nav-badge-count");
    if (count > 0) {
      if (!badge) {
        badge = el(`<span class="nav-badge-count">${count}</span>`);
        (node.querySelector(".bn-icon-wrap") || node).appendChild(badge);
      } else badge.textContent = String(count);
    } else if (badge) badge.remove();
  });
}

// All students linked to the signed-in parent, with class info embedded.
async function getParentChildren() {
  const links = await dbSelect("parent_students", { parent_id:`eq.${profile.id}`, select:"student_id,students(*,classes(name,section))" });
  return links.map(l => l.students).filter(Boolean);
}
// Fee summary for one child — total ever assigned (across all terms for their
// class) vs. total ever paid. The child detail page also shows a per-term
// breakdown for more precision.
async function computeChildFeeSummary(studentId, classId) {
  const [structure, payments] = await Promise.all([
    dbSelect("fee_structures", { class_id:`eq.${classId||'null'}`, select:"amount,term_id" }).catch(()=>[]),
    dbSelect("fee_payments", { student_id:`eq.${studentId}`, select:"amount_paid,term_id" }).catch(()=>[]),
  ]);
  const totalAssigned = structure.reduce((a,b)=>a+Number(b.amount||0),0);
  const totalPaid = payments.reduce((a,b)=>a+Number(b.amount_paid||0),0);
  return { totalAssigned, totalPaid, totalDue: Math.max(totalAssigned-totalPaid,0) };
}

/* ---- Digital receipt ---- */
/* Assigns a permanent, sequential receipt number the first time a receipt is
   viewed (using the format configured in Settings), then reuses it on every
   reprint. Falls back to the old id-based number if the receipt_no column /
   settings columns haven't been migrated in yet (see STAMPS_RECEIPT_SQL). */
async function getOrAssignReceiptNo(payment) {
  if (payment.receipt_no) return payment.receipt_no;
  const s = schoolSettings || {};
  try {
    const prefix = s.receipt_prefix || "RCT";
    const digits = s.receipt_digits || 6;
    const next = s.receipt_next_number || 1;
    const receiptNo = `${prefix}-${String(next).padStart(digits, "0")}`;
    await dbUpdate("payments", payment.id, { receipt_no: receiptNo });
    await dbUpsert("school_settings", { id:1, receipt_next_number: next + 1 }, "id");
    await loadSchoolSettings();
    payment.receipt_no = receiptNo;
    return receiptNo;
  } catch (e) {
    return `RCT-${String(payment.id).slice(0,8).toUpperCase()}`;
  }
}

  let receivedByName = "";

  document.body.appendChild(overlay);

      <div class="field"><label>Confirm new password</label><input id="f_cnewpass2" type="password" placeholder="Repeat new password"/></div>

/* ---- Dashboard stat: Total present today (click to see present/absent + gender breakdown) ---- */
async function showPresentTodayBreakdown(date) {
  let attRows = [];
  try { attRows = await dbSelect("attendance", { date:`eq.${date}`, select:"status,students(gender)" }); }
  catch(e) { attRows = []; }
  const isGender = (a, g) => a.students && a.students.gender === g;
  const present = attRows.filter(a=>a.status==="present");
  const absent = attRows.filter(a=>a.status==="absent");
  openViewModal(`Attendance — ${date}`, [
    ["Total students present", present.length],
    ["Total boys present", present.filter(a=>isGender(a,"Male")).length],
    ["Total girls present", present.filter(a=>isGender(a,"Female")).length],
    ["Total students absent", absent.length],
    ["Total boys absent", absent.filter(a=>isGender(a,"Male")).length],
    ["Total girls absent", absent.filter(a=>isGender(a,"Female")).length],
  ]);
}

/* ---- Dashboard stat: Present staff today (click to see present/absent staff) ---- */
async function showStaffPresentTodayBreakdown(date) {
  let rows = [];
  try { rows = await dbSelect("staff_attendance", { date:`eq.${date}`, select:"status" }); }
  catch(e) { rows = []; }
  const present = rows.filter(a=>a.status==="present").length;
  const absent = rows.filter(a=>a.status==="absent").length;
  openViewModal(`Staff attendance — ${date}`, [
    ["Staff present", present],
    ["Staff absent", absent],
  ]);
}

/* ---- Dashboard panel: Attendance by class today ---- */
async function renderAttendanceByClass(body, classes) {
  body.innerHTML = `<h3 style="color:var(--amber-dark);margin-bottom:14px;">Attendance by Class Today</h3><div class="center-loading">Loading…</div>`;
  if (!classes.length) { body.innerHTML = `<h3 style="color:var(--amber-dark);margin-bottom:14px;">Attendance by Class Today</h3>${emptyState("Create classes first in Setup.")}`; return; }
  const today = new Date().toISOString().slice(0,10);
  const [classList, students, attToday] = await Promise.all([
    dbSelectActive("classes", { order:"name.asc" }),
    dbSelectActive("students", { status:"eq.active", select:"id,class_id" }),
    dbSelect("attendance", { date:`eq.${today}`, select:"class_id,status" }).catch(()=>[]),
  ]);
  const rowsHtml = classList.map(c => {
    const total = students.filter(s=>s.class_id===c.id).length;
    const present = attToday.filter(a=>a.class_id===c.id && a.status==="present").length;
    const pct = total ? Math.round((present/total)*100) : 0;
    const color = pct>=75 ? 'var(--teal)' : pct>=40 ? 'var(--amber)' : 'var(--red)';
    return `<div style="margin-bottom:12px;">
      <div class="row" style="margin-bottom:5px;font-size:13px;">
        <div style="font-weight:700;color:var(--ink);">${c.name}${c.section?(' '+c.section):''}</div>
        <div style="color:var(--ink-soft);font-weight:600;">${present}/${total} · ${pct}%</div>
      </div>
      <div style="background:var(--card-alt);border-radius:999px;height:9px;overflow:hidden;">
        <div style="width:${pct}%;height:100%;background:${color};border-radius:999px;"></div>
      </div>
    </div>`;
  }).join("");
  body.innerHTML = `<h3 style="color:var(--amber-dark);margin-bottom:14px;">Attendance by Class Today</h3>${rowsHtml}`;
}

/* ---- Dashboard panel: Upcoming this week ---- */
async function renderUpcomingWeek(body) {
  body.innerHTML = `<h3 style="color:var(--purple);margin-bottom:14px;">Upcoming This Week</h3><div class="center-loading">Loading…</div>`;
  const now = new Date(); const in7 = new Date(now.getTime()+7*86400000);
  const todayStr = now.toISOString().slice(0,10), in7Str = in7.toISOString().slice(0,10);
  let exams = [];
  try { exams = await dbSelect("exams", { select:"*,classes(name,section)", exam_date:`gte.${todayStr}`, order:"exam_date.asc" }); } catch(e) { exams = []; }
  const upcoming = exams.filter(x => x.exam_date && x.exam_date <= in7Str);
  if (!upcoming.length) { body.innerHTML = `<h3 style="color:var(--purple);margin-bottom:14px;">Upcoming This Week</h3>${emptyState("Nothing scheduled in the next 7 days.")}`; return; }
  body.innerHTML = `<h3 style="color:var(--purple);margin-bottom:14px;">Upcoming This Week</h3>
    ${upcoming.map(x=>{
      const days = Math.round((new Date(x.exam_date) - new Date(todayStr))/86400000);
      const when = days<=0 ? 'Today' : days===1 ? 'Tomorrow' : `in ${days} days`;
      return `<div class="list-row">
        <div class="avatar">${ic.exam}</div>
        <div class="list-main"><div class="list-title">${x.name}</div>
        <div class="list-sub">${x.classes?.name||''} ${x.classes?.section||''} · ${x.exam_date}</div></div>
        <span class="badge badge-amber">${when}</span>
      </div>`;
    }).join("")}
  `;
}

function openExamTypeModal(body, t) {
