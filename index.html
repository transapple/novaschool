      <div class="settings-card-head"><div class="ic" style="background:var(--amber-tint);color:var(--amber-dark);">${ic.calendar}</div><div><h3 style="color:var(--navy);">Almost there — one-time setup</h3><p>Meetings needs a small table in your database before you can schedule anything.</p></div></div>
      <p style="font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:12px;">Run this once in your Supabase SQL editor, then come back and tap refresh.</p>
      <pre style="background:var(--card-alt);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:11.5px;overflow-x:auto;white-space:pre-wrap;">${MEETINGS_SQL}</pre>
      <button class="btn btn-primary" id="retryMeetingsBtn" style="margin-top:12px;">I've run it — Refresh</button>
    </div>`;
    document.getElementById("retryMeetingsBtn").onclick = () => renderMeetingsAdminList(body, container);
    return;
  }

  const now = Date.now();
  const upcoming = items.filter(m => new Date(m.meeting_date).getTime() >= now);
  const past = items.filter(m => new Date(m.meeting_date).getTime() < now);

  body.innerHTML = `<div class="section-head"><h3 style="color:#c2410c;">Meetings</h3><button class="btn btn-primary btn-sm" id="addBtn">${ic.plus} Schedule meeting</button></div>
    <div class="card" id="list"></div>
    ${past.length ? `<h3 style="color:var(--ink-soft);margin:18px 0 12px;">Past</h3><div class="card" id="pastList"></div>` : ""}`;
  const list = document.getElementById("list");
  list.innerHTML = upcoming.length ? "" : emptyState("No upcoming meetings scheduled.");
  const renderRow = (m, container2) => {
    const row = el(`<div class="list-row"><div class="avatar">${ic.calendar}</div>
      <div class="list-main"><div class="list-title">${m.title}</div>
      <div class="list-sub">${formatDate(m.meeting_date)} · ${new Date(m.meeting_date).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}${m.location ? " · "+m.location : ""}</div></div></div>`);
    const view = () => openViewModal(m.title, [
      ["Date & time", new Date(m.meeting_date).toLocaleString()], ["Location", m.location],
      ["Audience", m.audience || "Everyone"], ["Details", m.description],
      ["Scheduled by", m.created_by],
    ], () => openMeetingModal(body, container, m));
    const edit = () => openMeetingModal(body, container, m);
    const del = async () => { if (await customConfirm(`Delete "${m.title}"?`, { danger:true, okLabel:"Delete" })) safe(async()=>{ await softDelete("school_meetings", m.id); renderMeetingsAdminList(body, container); })(); };
    bindRowGestures(row, { onView:view, onEdit:edit, onDelete:del });
    container2.appendChild(row);
  };
  upcoming.forEach(m => renderRow(m, list));
  if (past.length) { const pastList = document.getElementById("pastList"); past.forEach(m => renderRow(m, pastList)); }
  document.getElementById("addBtn").onclick = () => openMeetingModal(body, container, null);
}
function openMeetingModal(body, container, m) {
  const isEdit = !!m;
  const audiences = ["Everyone","All parents","All staff","All students","Specific class"];
  const dt = m?.meeting_date ? new Date(m.meeting_date) : null;
  const dateVal = dt ? dt.toISOString().slice(0,10) : "";
  const timeVal = dt ? dt.toTimeString().slice(0,5) : "";
  openModal(isEdit ? "Edit meeting" : "Schedule meeting", `
    <div class="field"><label>Title</label><input id="f_title" placeholder="e.g. Term 2 PTA meeting" value="${m?.title||''}"/></div>
    <div class="field"><label>Date</label><input id="f_date" type="date" value="${dateVal}"/></div>
    <div class="field"><label>Time</label><input id="f_time" type="time" value="${timeVal}"/></div>
    <div class="field"><label>Location</label><input id="f_location" placeholder="e.g. School hall" value="${m?.location||''}"/></div>
    <div class="field"><label>Audience</label><select id="f_audience">${audiences.map(a=>`<option ${m?.audience===a?'selected':''}>${a}</option>`).join("")}</select></div>
    <div class="field"><label>Details</label><textarea id="f_description" rows="4" placeholder="Agenda, what to bring, etc.">${m?.description||''}</textarea></div>
  `, async (ov) => {
    requireFields(ov, [["f_title","Title"], ["f_date","Date"], ["f_time","Time"]]);
    const meeting_date = new Date(`${val(ov,"f_date")}T${val(ov,"f_time")}`).toISOString();
    const payload = { title: val(ov,"f_title"), meeting_date, location: val(ov,"f_location"), audience: val(ov,"f_audience"), description: val(ov,"f_description"), created_by: profile?.full_name || null };
    if (isEdit) await dbUpdate("school_meetings", m.id, payload); else await dbInsert("school_meetings", payload);
    renderMeetingsAdminList(body, container);
  }, { saveLabel: isEdit ? "Save changes" : "Schedule" });
}

// Admin-defined grade bands (Setup → Grades), cached after first load so report cards
// and results don't re-fetch on every row. Falls back to a default A–F scale if the
// admin hasn't set up any grades yet (or the grades table doesn't exist).
let gradesCache = null;
async function loadGrades() {
  if (gradesCache !== null) return gradesCache;
  try {
    const rows = await dbSelectActive("grades", { order:"min_score.desc" });
    gradesCache = rows.length ? rows : [];
  } catch (e) { gradesCache = []; }
  return gradesCache;
}
function gradeInfo(pct) {
  const bands = gradesCache || [];
  const match = bands.find(g => pct >= Number(g.min_score) && pct <= Number(g.max_score));
  if (match) return { grade: match.grade, remark: match.remark || "" };
  // Default scale — used only until the admin defines grades in Setup.
  const grade = pct>=80?"A":pct>=70?"B":pct>=60?"C":pct>=50?"D":pct>=40?"E":"F";
  return { grade, remark: "" };
}
function gradeFor(pct) { return gradeInfo(pct).grade; }
function gradeLabel(pct) { const {grade,remark} = gradeInfo(pct); return remark ? `${grade} (${remark})` : grade; }
async function renderReportCard(body) {
  const [examsRaw] = await Promise.all([
    dbSelect("exams", { select:"*,classes(name,section),terms(name),exam_types(name)", order:"exam_date.desc" }),
    loadGrades(),
  ]);
  const exams = dedupeExams(examsRaw);
  if (!exams.length) { body.innerHTML = emptyState("Create an exam first (see the Exams tab)."); return; }
  body.innerHTML = `<div class="card"><div class="field"><label>Exam</label><select id="selExam2">${exams.map(x=>`<option value="${x.id}" data-class="${x.class_id}">${examLabel(x)}</option>`).join("")}</select></div>
    <div class="field"><label>Student</label><select id="selStudent2"></select></div></div>
    <div id="cardArea"></div>`;
  const selExam2 = document.getElementById("selExam2");
  const selStudent2 = document.getElementById("selStudent2");
  async function loadStudents() {
    if (!selExam2.value) return;
    const classId = selExam2.selectedOptions[0].dataset.class;
    const students = await dbSelect("students", { class_id:`eq.${classId}`, status:"eq.active", order:"full_name.asc" });
    selStudent2.innerHTML = students.map(s=>`<option value="${s.id}">${s.full_name}</option>`).join("");
    buildCard();
  }
  async function buildCard() {
    const examId = selExam2.value, studentId = selStudent2.value;
    const area = document.getElementById("cardArea");
    if (!examId || !studentId) { area.innerHTML=""; return; }
    const results = await dbSelect("exam_results", { select:"*,subjects(name)", exam_id:`eq.${examId}`, student_id:`eq.${studentId}` });
    const student = (await dbSelect("students", { id:`eq.${studentId}` }))[0];
    const exam = exams.find(x=>x.id===examId);
    const total = results.reduce((a,r)=>a+Number(r.marks_obtained||0),0);
    const maxTotal = results.reduce((a,r)=>a+Number(r.max_marks||0),0);
    const avg = maxTotal ? (total/maxTotal*100) : 0;
    const s = schoolSettings || {};
    area.innerHTML = `
      <div class="card" id="printArea">
        <div style="text-align:center;margin-bottom:14px;">
          ${s.logo_url ? `<img src="${s.logo_url}" alt="" style="width:40px;height:40px;object-fit:cover;border-radius:8px;margin-bottom:6px;"/>` : ""}
          <h3 style="color:var(--navy);">${s.school_name || "Nova School"}</h3>
          <div style="font-size:13px;color:var(--ink-soft);">${exam ? examLabel(exam) : ''} — Report Card</div>
        </div>
        <div class="row" style="margin-bottom:10px;font-size:13.5px;">
          <div><b>${student?.full_name}</b><br/><span style="color:var(--ink-soft);">Adm. No: ${student?.admission_no}</span></div>
        </div>
        <div class="table-wrap"><table><thead><tr><th>Subject</th><th>Marks</th><th>Max</th><th>Grade</th><th>Remarks</th></tr></thead><tbody>
          ${results.map(r=>`<tr><td>${r.subjects?.name}</td><td>${r.marks_obtained}</td><td>${r.max_marks}</td><td>${gradeLabel((r.marks_obtained/r.max_marks)*100)}</td><td>${r.remarks||''}</td></tr>`).join("") || `<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);">No results entered yet</td></tr>`}
        </tbody></table></div>
        <div class="row" style="margin-top:12px;font-weight:700;">
          <div>Total: ${total} / ${maxTotal}</div><div>Average: ${avg.toFixed(1)}%</div><div>Grade: ${gradeLabel(avg)}</div>
        </div>
        ${s.stamp_head_teacher ? `
        <div style="margin-top:22px;display:flex;justify-content:flex-end;">
          <div style="text-align:center;">
            <img src="${s.stamp_head_teacher}" alt="Head Teacher's stamp" style="width:80px;height:80px;object-fit:contain;"/>
            <div style="font-size:11px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:4px;margin-top:2px;">Head Teacher</div>
          </div>
        </div>` : ""}
      </div>
      <button class="btn btn-ghost" id="printBtn" style="width:100%;margin-top:10px;">Print report card</button>
    `;
    document.getElementById("printBtn").onclick = () => window.print();
  }
  selExam2.onchange = loadStudents;
  selStudent2.onchange = buildCard;
  if (exams.length) loadStudents();
}

/* ---------------- ACCOUNT MANAGEMENT ----------------
   Renamed from "Users & Roles" — every department can open this page for
   their own account (view details, log in/out is always unrestricted).
   Only Administration can edit department/position/role for anyone,
   including themselves. Academic, Finance and Parents accounts can't change those
   details directly — they submit a request here, which Administration
   sees and actions further down this same page. */
async function renderUsers(container) {
  const isAdmin = hasFullAccess(profile);
  const restrictedDept = profile?.department === "academic" || profile?.department === "finance" || profile?.department === "parents";
  const deptLabel = DEPARTMENTS[profile?.department]?.label || "";

  const meCard = `
    <div class="card" style="margin-bottom:16px;">
      <div class="section-head"><h3 style="color:var(--navy-2);">My Account</h3></div>
      <div class="list-row" style="flex-wrap:wrap;">
        ${avatarHtml(profile?.full_name, profile?.photo_url)}
        <div class="list-main">
          <div class="list-title">${profile?.full_name || ""}</div>
          <div class="list-sub">${profile?.phone || ""}${profile?.username ? ` · @${profile.username}` : ""}</div>
        </div>
        <div class="list-sub">${deptLabel || "No department"}${profile?.position ? ` · ${profile.position}` : ""}</div>
      </div>
      <div class="tiny-note" style="margin-top:10px;">You can log in and log out any time — that's never restricted by department.</div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn" style="margin-top:8px;">${ic.logout} Log out</button>
      ${restrictedDept ? `
        <div class="tiny-note" style="margin-top:8px;">${deptLabel} accounts can't change department, position or role here — send Administration a request instead and they'll update it for you.</div>
        <button class="btn btn-ghost btn-sm" id="reqBtn" style="margin-top:8px;">${ic.edit} Request a detail change</button>
      ` : ""}
    </div>`;

  if (!isAdmin) {
    container.innerHTML = meCard + `<div id="myReqs"></div>`;
    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) logoutBtn.onclick = async () => {
      if (await customConfirm("Log out?")) logout();
    };
    const reqBtn = document.getElementById("reqBtn");
    if (reqBtn) reqBtn.onclick = () => {
      openModal("Request a detail change", `
        <div class="tiny-note" style="text-align:left;">Tell Administration what you'd like changed (department, position, phone number, etc) and why — they'll review it and update your account.</div>
        <div class="field"><label>What would you like changed?</label><textarea id="f_msg" rows="4" placeholder="e.g. Please move me from Teaching Staff to Head of Department (HOD)"></textarea></div>
        <details style="margin-top:8px;"><summary style="cursor:pointer;font-size:12px;color:var(--ink-soft);">One-time database setup (only if sending fails)</summary>
        <pre style="background:var(--card-alt);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:11px;overflow-x:auto;white-space:pre-wrap;margin-top:8px;">${ACCOUNT_REQUESTS_SQL}</pre></details>
      `, async (ov) => {
        requireFields(ov, [["f_msg","Message"]]);
        await dbInsert("account_change_requests", { profile_id: profile.id, full_name: profile.full_name, department: profile.department, message: val(ov,"f_msg") });
        toast("Your request was sent to Administration.", false);
        renderUsers(container);
      }, { saveLabel: "Send request" });
    };
    const myReqs = document.getElementById("myReqs");
    try {
      const reqs = await dbSelect("account_change_requests", { profile_id:`eq.${profile.id}`, order:"created_at.desc", select:"id,message,status,created_at" });
      myReqs.innerHTML = !reqs.length ? "" : `<div class="section-head"><h3 style="color:var(--navy-2);">Your requests</h3></div><div class="card">` +
        reqs.map(r => `<div class="list-row"><div class="list-main"><div class="list-title">${r.message}</div><div class="list-sub">${new Date(r.created_at).toLocaleDateString()}</div></div>
          <span class="badge ${r.status==='pending'?'badge-amber':r.status==='dismissed'?'badge-grey':'badge-green'}">${r.status}</span></div>`).join("") + `</div>`;
    } catch (e) { /* table not set up yet — quietly skip, the SQL is in the request modal */ }
    return;
  }

  const profiles = await dbSelect("profiles", { order:"full_name.asc", select:"id,full_name,phone,department,position,role,username,pin,photo_url,suspended_at,deleted_at" });
  container.innerHTML = meCard +
    `<div class="section-head"><h3 style="color:var(--navy-2);">Manage Accounts</h3></div>
    <div class="tiny-note" style="margin-bottom:10px;">Department controls which sections of the app someone can open. Administration gets full access to everything, including this page. New staff create their own login from the sign-in screen's "Create one" link — set their department and position here afterwards. Suspend or delete an account to block its login instantly; both can be reversed any time from this list.</div>
    <div class="card" id="list"></div>
    <div class="section-head" style="margin-top:20px;"><h3 style="color:var(--navy-2);">Pending Requests</h3></div>
    <div class="tiny-note" style="margin-bottom:10px;">Detail-change requests from Academic, Finance and Parents department accounts show up here. Update the account below, then mark the request as done.</div>
    <div class="card" id="reqList"></div>`;
  const logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) logoutBtn.onclick = async () => {
    if (await customConfirm("Log out?")) logout();
  };
  const list = document.getElementById("list");
  const deptOptions = (selected) => `<option value="" ${!selected?'selected':''}>— No department —</option>` +
    Object.entries(DEPARTMENTS).map(([key,d])=>`<option value="${key}" ${selected===key?'selected':''}>${d.label}</option>`).join("");
  const posOptions = (deptKey, selected) => {
    const positions = DEPARTMENTS[deptKey]?.positions || [];
    if (!positions.length) return `<option value="">—</option>`;
    return `<option value="" ${!selected?'selected':''}>— Select position —</option>` +
      positions.map(pos=>`<option value="${pos}" ${selected===pos?'selected':''}>${pos}</option>`).join("");
  };
  profiles.forEach(p => {
    const isSelf = p.id === profile.id;
    const isDeleted = !!p.deleted_at;
    const isSuspended = !!p.suspended_at;
    const badges = `${isDeleted ? `<span class="badge badge-grey">Deleted</span>` : isSuspended ? `<span class="badge badge-amber">Suspended</span>` : ""}`;
    const row = el(`<div class="list-row" style="flex-wrap:wrap;${isDeleted?'opacity:.6;':''}">
      ${avatarHtml(p.full_name, p.photo_url)}
      <div class="list-main"><div class="list-title">${p.full_name} ${badges}</div><div class="list-sub">${p.phone||''}${p.username?` · @${p.username}`:''}</div></div>
      ${isDeleted ? "" : `
        <select class="deptSel" style="padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);">${deptOptions(p.department)}</select>
        <select class="posSel" style="padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);">${posOptions(p.department, p.position)}</select>
        <select class="roleSel" title="Legacy role — Administration department already grants full access on its own" style="padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);">
          ${["admin","teacher","accountant","staff"].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${r}</option>`).join("")}
        </select>
      `}
      <div class="row" style="gap:6px;width:100%;justify-content:flex-end;margin-top:6px;">
        ${isSelf ? `<span class="tiny-note" style="margin:0;">This is you</span>` : isDeleted ? `
          <button class="btn btn-ghost btn-sm recoverBtn">${ic.check} Recover account</button>
        ` : `
          <button class="btn btn-ghost btn-sm suspendBtn">${isSuspended ? ic.check+' Unsuspend' : ic.keyLock+' Suspend'}</button>
          <button class="btn btn-ghost btn-sm deleteBtn" style="color:var(--red);">${ic.trash} Delete</button>
        `}
      </div>
    </div>`);
    if (!isDeleted) {
      const deptSel = row.querySelector(".deptSel");
      const posSel = row.querySelector(".posSel");
      deptSel.onchange = safe(async (e) => {
        const newDept = e.target.value || null;
        posSel.innerHTML = posOptions(newDept, null);
        await dbUpdate("profiles", p.id, { department: newDept, position: null });
        toast(`${p.full_name}'s department updated.`, false);
      });
      posSel.onchange = safe(async (e) => {
        await dbUpdate("profiles", p.id, { position: e.target.value || null });
        toast(`${p.full_name}'s position updated.`, false);
      });
      row.querySelector(".roleSel").onchange = safe(async (e) => { await dbUpdate("profiles", p.id, { role: e.target.value }); toast(`${p.full_name}'s role updated.`, false); });
    }
    if (!isSelf) {
      if (isDeleted) {
        row.querySelector(".recoverBtn").onclick = safe(async () => {
          if (!(await customConfirm(`Restore ${p.full_name}'s account?`))) return;
          await dbUpdate("profiles", p.id, { deleted_at: null });
          toast(`${p.full_name}'s account restored.`, false);
          renderUsers(container);
        });
      } else {
        row.querySelector(".suspendBtn").onclick = safe(async () => {
          if (isSuspended) {
            await dbUpdate("profiles", p.id, { suspended_at: null });
            toast(`${p.full_name}'s account unsuspended.`, false);
          } else {
            if (!(await customConfirm(`Suspend ${p.full_name}? They won't be able to log in until you unsuspend them.`, { danger:true, okLabel:"Suspend" }))) return;
            await dbUpdate("profiles", p.id, { suspended_at: new Date().toISOString() });
            toast(`${p.full_name}'s account suspended.`, false);
          }
          renderUsers(container);
        });
        row.querySelector(".deleteBtn").onclick = safe(async () => {
          if (!(await customConfirm(`Delete ${p.full_name}'s account? You can recover it later from this page.`, { danger:true, okLabel:"Delete" }))) return;
          await dbUpdate("profiles", p.id, { deleted_at: new Date().toISOString() });
          toast(`${p.full_name}'s account deleted.`, false);
          renderUsers(container);
        });
      }
    }
    list.appendChild(row);
  });
  const reqList = document.getElementById("reqList");
  try {
    const reqs = await dbSelect("account_change_requests", { status:"eq.pending", order:"created_at.asc", select:"id,full_name,department,message,created_at" });
    reqList.innerHTML = !reqs.length ? `<div class="tiny-note">No pending requests.</div>` :
      reqs.map(r => `<div class="list-row" style="flex-wrap:wrap;align-items:flex-start;">
        <div class="list-main">
          <div class="list-title">${r.full_name || "Unknown"} <span class="badge badge-amber">${DEPARTMENTS[r.department]?.label || r.department || "No department"}</span></div>
          <div class="list-sub">${r.message}</div>
          <div class="list-sub">${new Date(r.created_at).toLocaleString()}</div>
        </div>
        <button class="btn btn-ghost btn-sm dismissBtn" data-id="${r.id}">Dismiss</button>
        <button class="btn btn-primary btn-sm doneBtn" data-id="${r.id}">${ic.check} Mark done</button>
      </div>`).join("");
    reqList.querySelectorAll(".doneBtn").forEach(btn => btn.onclick = safe(async () => {
      await dbUpdate("account_change_requests", btn.dataset.id, { status:"resolved", resolved_at:new Date().toISOString() });
      toast("Request marked as done.", false);
      renderUsers(container);
    }));
    reqList.querySelectorAll(".dismissBtn").forEach(btn => btn.onclick = safe(async () => {
      await dbUpdate("account_change_requests", btn.dataset.id, { status:"dismissed", resolved_at:new Date().toISOString() });
      toast("Request dismissed.", false);
      renderUsers(container);
    }));
  } catch (e) {
    reqList.innerHTML = `<div class="tiny-note">Request history isn't set up yet — the one-time database setup appears when a request is sent. Run it in Supabase → SQL Editor, then refresh.</div>`;
  }
}

async function renderTrash(container) {
  container.innerHTML = `<h3 style="color:var(--slate);margin-bottom:10px;">Trash</h3><div class="section-head"><div style="font-size:13px;color:var(--ink-soft);">Items stay here until restored or permanently deleted.</div><button class="btn btn-ghost btn-sm" id="emptyBtn">${ic.trash} Empty trash</button></div><div id="trashList"><div class="center-loading">Loading…</div></div>`;
  const listEl = document.getElementById("trashList");
  let allTrashed = [];
  await Promise.all(TRASH_TABLES.map(async (t) => {
    try {
      const rows = await dbSelect(t.table, { deleted_at:"not.is.null", order:"deleted_at.desc" });
      rows.forEach(r => allTrashed.push({ ...t, row:r }));
    } catch(e) { /* table has no deleted_at column yet — skip quietly */ }
  }));
  allTrashed.sort((a,b) => new Date(b.row.deleted_at) - new Date(a.row.deleted_at));
  if (!allTrashed.length) { listEl.innerHTML = emptyState("Trash is empty."); document.getElementById("emptyBtn").style.display="none"; return; }
  listEl.innerHTML = `<div class="card" id="list"></div>`;
  const list = document.getElementById("list");
  allTrashed.forEach(item => {
    const name = item.row[item.nameField] || "Untitled";
    const row = el(`<div class="list-row"><div class="avatar">${item.icon}</div>
      <div class="list-main"><div class="list-title">${name}</div>
      <div class="list-sub">${item.label} · deleted ${new Date(item.row.deleted_at).toLocaleDateString()}</div></div></div>`);
    row.onclick = () => openActionSheet([
      { label:"Restore", icon:ic.edit, onClick: safe(async()=>{ await restoreRecord(item.table, item.row.id); toast(`${name} restored.`, false); renderTrash(container); }) },
      { label:"Delete permanently", icon:ic.trash, danger:true, onClick: () => { customConfirm(`Permanently delete "${name}"? This cannot be undone.`, { danger:true, okLabel:"Delete permanently" }).then(ok => { if (ok) safe(async()=>{ await dbDelete(item.table, item.row.id); renderTrash(container); })(); }); } },
    ]);
    list.appendChild(row);
  });
  document.getElementById("emptyBtn").onclick = async () => {
    if (!(await customConfirm(`Permanently delete all ${allTrashed.length} item(s) in trash? This cannot be undone.`, { danger:true, okLabel:"Delete all" }))) return;
    safe(async () => {
      for (const item of allTrashed) { await dbDelete(item.table, item.row.id); }
      toast("Trash emptied.", false);
      renderTrash(container);
    })();
  };
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }

/* Small non-blocking toast for background/action errors, so nothing fails silently */
function toast(msg, isError=true) {
  const t = el(`<div style="position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:${isError?'#D6564F':'#2E9E7C'};color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 10px 28px rgba(0,0,0,.25);max-width:90%;text-align:center;">${msg}</div>`);
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .3s"; t.style.opacity="0"; setTimeout(()=>t.remove(),300); }, 3000);
}
/* Wrap any async action (delete, role change, etc.) so failures show a toast instead of breaking the page */
function safe(fn) {
  return async (...args) => {
    try { await fn(...args); }
    catch (e) { toast(e.message || "Something went wrong. Please try again."); console.error(e); }
  };
}
window.addEventListener("unhandledrejection", (e) => {
  toast((e.reason && e.reason.message) || "Something went wrong. Please try again.");
  console.error(e.reason);
});
window.addEventListener("error", (e) => { console.error(e.error || e.message); });

/* ---------------- CUSTOM DATE PICKER ENGINE ----------------
   Every input.datefield is a readonly text field (not a real native
   input[type=date]) so its calendar popup — including the equivalent
   of the OS "Set"/"Cancel" controls — is drawn entirely by us and can
   be coloured however we like. The chosen value is written back into
   the input's .value as an ISO "YYYY-MM-DD" string, and a real "change"
   event is dispatched, so every existing val()/onchange() call in the
   app keeps working exactly as before. */
let activeDateCal = null;
let activeDateInput = null;

function closeDateCalendar() {
  if (activeDateCal) { activeDateCal.remove(); activeDateCal = null; }
  document.removeEventListener("mousedown", onDateCalOutsideClick, true);
  document.removeEventListener("keydown", onDateCalKeydown, true);
  window.removeEventListener("resize", closeDateCalendar);
  window.removeEventListener("scroll", closeDateCalendar, true);
  activeDateInput = null;
}
function onDateCalOutsideClick(e) {
  if (activeDateCal && !activeDateCal.contains(e.target) && e.target !== activeDateInput) closeDateCalendar();
}
function onDateCalKeydown(e) { if (e.key === "Escape") closeDateCalendar(); }

function openDateCalendar(inputEl) {
  if (activeDateInput === inputEl) return; // already open for this field
  closeDateCalendar();
  activeDateInput = inputEl;

  const todayD = new Date();
  const parsed = inputEl.value ? new Date(inputEl.value + "T00:00:00") : null;
  let viewYear = (parsed && !isNaN(parsed)) ? parsed.getFullYear() : todayD.getFullYear();
  let viewMonth = (parsed && !isNaN(parsed)) ? parsed.getMonth() : todayD.getMonth();
  let selectedIso = inputEl.value || null;

  const pop = document.createElement("div");
  pop.className = "date-cal-popup";
  document.body.appendChild(pop);
  activeDateCal = pop;

  const pad = n => String(n).padStart(2, "0");
  const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const todayIso = iso(todayD.getFullYear(), todayD.getMonth(), todayD.getDate());

  function position() {
    const r = inputEl.getBoundingClientRect();
    const w = pop.offsetWidth || 288, h = pop.offsetHeight || 320;
    let left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    let top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  function draw() {
    const first = new Date(viewYear, viewMonth, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const monthName = first.toLocaleString("default", { month: "long" });
    let cells = "";
    for (let i = 0; i < startDow; i++) cells += `<div class="dc-cell dc-empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dStr = iso(viewYear, viewMonth, d);
      const cls = ["dc-cell", "dc-day"];
      if (dStr === selectedIso) cls.push("dc-selected");
      if (dStr === todayIso) cls.push("dc-today");
      cells += `<div class="${cls.join(' ')}" data-date="${dStr}">${d}</div>`;
    }
    pop.innerHTML = `
      <div class="dc-header">
        <button type="button" class="dc-nav" id="dcPrev">&#8249;</button>
        <div class="dc-title">${monthName} ${viewYear}</div>
        <button type="button" class="dc-nav" id="dcNext">&#8250;</button>
      </div>
      <div class="dc-grid dc-dow"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
      <div class="dc-grid">${cells}</div>
      <div class="dc-footer">
        <button type="button" class="dc-link" id="dcToday">Today</button>
        <button type="button" class="dc-link dc-danger" id="dcClear">Clear</button>
      </div>`;
    pop.querySelectorAll(".dc-day").forEach(cell => {
      cell.onclick = () => choose(cell.dataset.date);
    });
    pop.querySelector("#dcPrev").onclick = () => { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } draw(); position(); };
    pop.querySelector("#dcNext").onclick = () => { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } draw(); position(); };
    pop.querySelector("#dcToday").onclick = () => { viewYear = todayD.getFullYear(); viewMonth = todayD.getMonth(); choose(todayIso); };
    pop.querySelector("#dcClear").onclick = () => choose("");
  }

  function choose(dStr) {
    selectedIso = dStr || null;
    inputEl.value = dStr;
    inputEl.dispatchEvent(new Event("input", { bubbles: true }));
    inputEl.dispatchEvent(new Event("change", { bubbles: true }));
    closeDateCalendar();
  }

  draw();
  position();
  setTimeout(() => {
    document.addEventListener("mousedown", onDateCalOutsideClick, true);
    document.addEventListener("keydown", onDateCalKeydown, true);
    window.addEventListener("resize", closeDateCalendar);
    window.addEventListener("scroll", closeDateCalendar, true);
  }, 0);
}

document.addEventListener("focusin", (e) => { if (e.target.matches && e.target.matches("input.datefield")) openDateCalendar(e.target); });
document.addEventListener("click", (e) => { if (e.target.matches && e.target.matches("input.datefield")) openDateCalendar(e.target); });

/* ---------------- PWA INSTALL SUPPORT ----------------
   Registers a minimal service worker (generated in-memory as a Blob,
   so no separate .js file is needed) purely so browsers consider this
   app installable and it can open standalone from the home screen. */
if ("serviceWorker" in navigator) {
  const swSource = `
    const CACHE = "nova-school-cache-v1";
    self.addEventListener("install", (e) => { self.skipWaiting(); });
    self.addEventListener("activate", (e) => { self.clients.claim(); });
    self.addEventListener("fetch", (e) => {
      e.respondWith(
        fetch(e.request).catch(() => caches.match(e.request))
      );
    });
  `;
  const swBlob = new Blob([swSource], { type: "application/javascript" });
  const swUrl = URL.createObjectURL(swBlob);
  window.addEventListener("load", () => {
    navigator.serviceWorker.register(swUrl).catch((err) => console.warn("SW registration failed:", err));
  });
}

/* ---------------- PWA INSTALL OVERLAY ENGINE ----------------
   Full-screen, fully app-styled "install this app" screen that appears
   on open (in any browser — Chrome, Edge, Samsung Internet, Firefox,
   Safari/iOS) and adapts its content to what that browser can actually
   do:
     • Chromium-based browsers (Chrome/Edge/Brave/Samsung/Opera) → wait
       for the native install-eligibility event, then show a real
       "Install Now" button that triggers the one-tap install.
     • iOS (any browser, since they all use WebKit) → step-by-step
       "Share → Add to Home Screen" instructions, since iOS has no
       programmatic install trigger at all.
     • Firefox (desktop & Android) → step-by-step menu instructions,
       since Firefox does not support the install-eligibility event.
   The overlay never shows again once the app is actually installed,
   and can be dismissed (for this visit, or for a while) without
   blocking access to the app itself. */
const PWA_ICON_URL = "https://i.postimg.cc/0NBZwRMk/file-000000008ea481f4a7d2fe89b842a95b.png";
const PWA_OPTOUT_DAYS = 21;

function detectPwaPlatform() {
  const ua = navigator.userAgent || "";
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isFirefox = /Firefox|FxiOS/i.test(ua);
  return { isStandalone, isIOS, isFirefox };
}

// Reveal the real app UI. This only ever runs once we're certain we're
// running as the installed, standalone app — never inside a plain browser tab.
function pwaShowApp() {
  const app = document.getElementById("app");
  if (app) app.classList.add("pwa-app-unlocked");
  const overlay = document.getElementById("pwaInstallOverlay");
  if (overlay) { overlay.style.display = "none"; overlay.innerHTML = ""; }
  window.__pwaEventArrived = null;
  try { localStorage.setItem("pwaInstalled", "true"); } catch (e) {}
}

function pwaWasInstalled() {
  try { return localStorage.getItem("pwaInstalled") === "true"; } catch (e) { return false; }
}

// Best-effort attempt to hand off to the already-installed app instead of
// staying in the browser. On browsers that support manifest "capture_links" /
// "launch_handler" (declared in manifest.json), re-navigating to the app's
// own scope gets intercepted and routed into the installed app window.
function pwaTryOpenInstalledApp() {
  window.location.href = window.location.origin + window.location.pathname;
}

function pwaOverlayShell(bodyHtml, opts) {
  opts = opts || {};
  return `
    <div class="pwa-card">
      <div class="pwa-icon"><img src="${PWA_ICON_URL}" alt=""/></div>
      <div class="pwa-title">${opts.title || "Install Nova School"}</div>
      <div class="pwa-sub">${opts.sub || "Nova School Manager runs best as an installed app. Install it once to your device for the full experience — this only takes a moment."}</div>
      <div class="pwa-body">${bodyHtml}</div>
      ${opts.showSkip === false ? "" : `<div class="tiny-note" style="margin-top:14px;"><span class="link-btn" id="pwaSkipLink" style="cursor:pointer;">Continue in browser</span></div>`}
      ${DEV_MODE ? `<div class="tiny-note" style="margin-top:14px;"><button type="button" id="pwaDevSkip" class="btn btn-ghost btn-sm">Skip install (dev mode)</button></div>` : ""}
    </div>`;
}
// Dismisses the overlay for this visit only (does not mark the app as
// "installed"), so it can still be a prompt rather than a hard gate.
function pwaWireSkip(overlay) {
  const skip = overlay.querySelector("#pwaSkipLink");
  if (skip) skip.onclick = () => {
    const app = document.getElementById("app");
    if (app) app.classList.add("pwa-app-unlocked");
    overlay.style.display = "none";
  };
}
function pwaWireDevSkip(overlay) {
  if (!DEV_MODE) return;
  overlay.addEventListener("click", (e) => {
    if (e.target && e.target.id === "pwaDevSkip") pwaShowApp();
  });
}

function renderPwaChecking(overlay) {
  overlay.innerHTML = pwaOverlayShell(`
    <div class="pwa-spinner"></div>
    <div class="pwa-status">Preparing installer…</div>
  `);
  pwaWireSkip(overlay);
}
function renderPwaReady(overlay) {
  overlay.innerHTML = pwaOverlayShell(`
    <div class="pwa-actions"><button class="btn btn-primary" id="pwaInstallBtn">${ic.plus} Download &amp; Install</button></div>
  `);
  const btn = overlay.querySelector("#pwaInstallBtn");
  btn.onclick = async () => {
    if (!deferredInstallPrompt) { renderPwaFallback(overlay); return; }
    btn.disabled = true; btn.textContent = "Installing…";
    deferredInstallPrompt.prompt();
    try {
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      if (choice.outcome !== "accepted") { btn.disabled = false; btn.innerHTML = `${ic.plus} Download & Install`; }
      // if accepted, the "appinstalled" event takes over from here
    } catch (e) { btn.disabled = false; btn.innerHTML = `${ic.plus} Download & Install`; }
  };
}
function renderPwaFallback(overlay) {
  overlay.innerHTML = pwaOverlayShell(`
    <div class="pwa-fallback-box">
      ${ic.settings}
      <div>Look for the install icon in your address bar, or open your browser's menu and choose <b>"Install Nova School Manager"</b> (or <b>"Add to Home Screen"</b>). The app opens once it's installed.</div>
    </div>
  `);
}
function renderPwaIOS(overlay) {
  const shareIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>`;
  const plusIcon = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></svg>`;
  overlay.innerHTML = pwaOverlayShell(`
    <div class="pwa-steps">
      <div class="pwa-step"><span class="pwa-step-ic">${shareIcon}</span><span>Tap the <b>Share</b> icon in your browser's toolbar</span></div>
      <div class="pwa-step"><span class="pwa-step-ic">${plusIcon}</span><span>Scroll down and choose <b>Add to Home Screen</b></span></div>
      <div class="pwa-step"><span class="pwa-step-ic">✓</span><span>Tap <b>Add</b>, then open Nova School from your Home Screen</span></div>
    </div>
    <div class="pwa-open-note">This page will stay on the install screen until you open the app from your Home Screen.</div>
  `);
}
function renderPwaFirefox(overlay) {
  overlay.innerHTML = pwaOverlayShell(`
    <div class="pwa-fallback-box">
      ${ic.settings}
      <div>Firefox doesn't support one-tap install yet. Open the <b>⋮ menu</b> and choose <b>"Install"</b> or <b>"Add to Home Screen"</b>, then launch Nova School from there — or open this link in Chrome/Edge for one-tap install.</div>
    </div>
  `);
}
function renderPwaInstalledSuccess(overlay) {
  overlay.style.display = "flex";
  overlay.innerHTML = pwaOverlayShell(`
    <div class="pwa-actions"><button class="btn btn-primary" id="pwaOpenBtn">${ic.plus} Open Nova School</button></div>
  `, {
    title: "Installed!",
    sub: "Nova School Manager is on your device now. Open it from here, or from your home screen any time.",
    showSkip: false,
  });
  overlay.querySelector("#pwaOpenBtn").onclick = pwaTryOpenInstalledApp;
}
function renderPwaAlreadyInstalled(overlay) {
  overlay.innerHTML = pwaOverlayShell(`
    <div class="pwa-actions"><button class="btn btn-primary" id="pwaOpenBtn">${ic.plus} Open Nova School</button></div>
  `, {
    title: "Open the Nova School app",
    sub: "You've already installed Nova School Manager. This browser tab can't show your data — open the installed app instead.",
    showSkip: false,
  });
  overlay.querySelector("#pwaOpenBtn").onclick = pwaTryOpenInstalledApp;
}

function initPwaInstallOverlay() {
  const overlay = document.getElementById("pwaInstallOverlay");
  if (!overlay) { pwaShowApp(); return; }
  const { isStandalone, isIOS, isFirefox } = detectPwaPlatform();
  // Already running as the installed app (or previously installed) — skip straight in.
  if (isStandalone || pwaWasInstalled()) { pwaShowApp(); return; }
  overlay.style.display = "flex";
  renderPwaChecking(overlay);
  // Give Chromium a brief moment to fire "beforeinstallprompt" before deciding
  // which version of the prompt to show.
  window.__pwaEventArrived = () => {
    if (overlay.style.display === "flex" && overlay.querySelector(".pwa-spinner")) {
      renderPwaReady(overlay); pwaWireDevSkip(overlay); pwaWireSkip(overlay);
    }
  };
  setTimeout(() => {
    if (isIOS) { renderPwaIOS(overlay); }
    else if (isFirefox) { renderPwaFirefox(overlay); }
    else if (deferredInstallPrompt) { renderPwaReady(overlay); }
    else { renderPwaFallback(overlay); }
    pwaWireDevSkip(overlay);
    pwaWireSkip(overlay);
  }, 700);
}

initPwaInstallOverlay();
</script>
</body>
</html>
