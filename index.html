const TEACHER_EVALUATIONS_SQL = `-- Teacher Performance & Evaluations: run once in Supabase -> SQL Editor.

-- Bridges a teacher's login account (profiles) to their per-school
-- professional record (teachers), so a logged-in teacher can be shown only
-- their OWN evaluations. Nullable and admin-set — see openAccountControls().
alter table profiles add column if not exists linked_teacher_id uuid references teachers(id);

-- Per-school policy for how much of an evaluation a teacher is allowed to see
-- of their own record: 'hidden' (nothing), 'scores_only' (categories + overall
-- score, no comments), 'full' (everything). Never lets a teacher edit either way.
alter table school_settings add column if not exists teacher_eval_visibility text not null default 'scores_only';

create table if not exists teacher_evaluations (
  id uuid primary key default gen_random_uuid(),
  school_id uuid not null,
  teacher_id uuid not null references teachers(id) on delete cascade,
  evaluator_profile_id uuid references profiles(id),
  evaluator_name text, -- denormalized so history reads correctly even if the account is later removed
  evaluation_date date not null default current_date,
  evaluation_period text, -- e.g. "Term 1, 2026"
  scores jsonb not null default '{}'::jsonb, -- {"Teaching effectiveness": 4, "Punctuality": 5, ...}
  overall_score numeric(4,2), -- average of the scores actually entered, computed at save time
  strengths text,
  areas_for_improvement text,
  recommendation text,
  deleted_at timestamptz,
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
alter table teacher_evaluations enable row level security;
drop policy if exists "Anyone can read teacher_evaluations" on teacher_evaluations;
create policy "Anyone can read teacher_evaluations" on teacher_evaluations for select using (true);
drop policy if exists "Authenticated can manage teacher_evaluations" on teacher_evaluations;
create policy "Authenticated can manage teacher_evaluations" on teacher_evaluations for all using (true);

-- Every create/update/delete of an evaluation writes one row here — a
-- permanent, un-editable log of who did what and when. Never updated or
-- deleted itself (no edit UI is ever built for this table).
create table if not exists teacher_evaluation_audit (
  id uuid primary key default gen_random_uuid(),
  school_id uuid not null,
  evaluation_id uuid not null references teacher_evaluations(id) on delete cascade,
  action text not null, -- 'created' | 'updated' | 'deleted'
  actor_profile_id uuid references profiles(id),
  actor_name text,
  snapshot jsonb, -- full evaluation content at the moment of this action
  created_at timestamptz not null default now()
);
alter table teacher_evaluation_audit enable row level security;
drop policy if exists "Anyone can read teacher_evaluation_audit" on teacher_evaluation_audit;
create policy "Anyone can read teacher_evaluation_audit" on teacher_evaluation_audit for select using (true);
drop policy if exists "Authenticated can manage teacher_evaluation_audit" on teacher_evaluation_audit;
create policy "Authenticated can manage teacher_evaluation_audit" on teacher_evaluation_audit for all using (true);
`;

const EVAL_CATEGORIES = [
  "Teaching effectiveness", "Attendance", "Punctuality", "Professionalism",
  "Lesson preparation", "Student engagement", "Assessment quality", "Responsibility", "Teamwork",
];

function calcOverallScore(scores) {
  const vals = EVAL_CATEGORIES
    .map(c => scores ? scores[c] : undefined)
    .filter(v => v !== null && v !== undefined && v !== "" && !Number.isNaN(Number(v)))
    .map(Number);
  if (!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b, 0) / vals.length) * 100) / 100;
}

function canManageEvaluations(p) { return hasFullAccess(p); }
function evalVisibilityPolicy() { return (schoolSettings && schoolSettings.teacher_eval_visibility) || "scores_only"; }

async function logEvalAudit(evaluationId, action, snapshot) {
  try {
    await dbInsert("teacher_evaluation_audit", {
      evaluation_id: evaluationId, action, actor_profile_id: profile?.id || null,
      actor_name: profile?.full_name || null, snapshot,
    });
  } catch (e) {  }
}

async function renderTeacherPerformance(body, container, teacher) {
  const isAdmin = canManageEvaluations(profile);
  const isSelf = !!(profile && profile.linked_teacher_id && profile.linked_teacher_id === teacher.id);
  const policy = evalVisibilityPolicy();
  if (!isAdmin && !isSelf) { body.innerHTML = emptyState("You don't have access to this teacher's performance record."); return; }
  if (!isAdmin && isSelf && policy === "hidden") { body.innerHTML = emptyState("Performance evaluations aren't visible to teachers at this school. Ask an administrator."); return; }
  const evals = await dbSelectActive("teacher_evaluations", { teacher_id:`eq.${teacher.id}`, order:"evaluation_date.desc" });
  body.innerHTML = `<div class="card" id="evalList"></div>`;
  const list = document.getElementById("evalList");
  list.innerHTML = evals.length ? "" : emptyState(isAdmin ? "No performance evaluations yet." : "No performance evaluations recorded yet.");
  evals.forEach(ev => {
    const row = el(`<div class="list-row">
      <div class="avatar">${ev.overall_score != null ? ev.overall_score : '—'}</div>
      <div class="list-main"><div class="list-title">${ev.evaluation_period || formatDate(ev.evaluation_date)}</div>
      <div class="list-sub">${formatDate(ev.evaluation_date)}${ev.evaluator_name ? (' · Evaluator: '+ev.evaluator_name) : ''}</div></div>
      <span class="badge badge-amber">${ev.overall_score != null ? ev.overall_score+'/5' : 'Unscored'}</span>
    </div>`);
    const view = () => openEvaluationViewModal(ev, isAdmin, body, container, teacher, policy);
    if (isAdmin) {
      const edit = () => openEvaluationModal(body, container, teacher, ev);
      const del = async () => { if (await customConfirm(`Delete this evaluation? This cannot be undone.`, { danger:true, okLabel:"Delete" })) safe(async()=>{
        await softDelete("teacher_evaluations", ev.id);
        await logEvalAudit(ev.id, "deleted", ev);
        renderTeacherPerformance(body, container, teacher);
      })(); };
      bindRowGestures(row, { onView:view, onEdit:edit, onDelete:del });
    } else {
      
      
      row.style.cursor = "pointer";
      row.onclick = view;
    }
    list.appendChild(row);
  });
  if (isAdmin) addFab(body, () => openEvaluationModal(body, container, teacher, null));
}

function openEvaluationViewModal(ev, isAdmin, body, container, teacher, policy) {
  const showFull = isAdmin || policy === "full";
  const rows = [
    ["Evaluation date", formatDate(ev.evaluation_date)],
    ["Evaluation period", ev.evaluation_period],
    ["Evaluator", ev.evaluator_name],
    ...EVAL_CATEGORIES.map(c => [c, (ev.scores && ev.scores[c] != null) ? `${ev.scores[c]}/5` : null]),
    ["Overall score", ev.overall_score != null ? `${ev.overall_score}/5` : "Not yet calculated"],
  ];
  if (showFull) {
    rows.push(["Strengths", ev.strengths], ["Areas for improvement", ev.areas_for_improvement], ["Professional recommendation", ev.recommendation]);
  } else if (!isAdmin) {
    rows.push(["Comments", "Not shared by your school's evaluation policy."]);
  }
  openViewModal(ev.evaluation_period || "Performance evaluation", rows, isAdmin ? () => openEvaluationModal(body, container, teacher, ev) : null);
}
function openEvaluationModal(body, container, teacher, ev) {
  const isEdit = !!ev;
  const scores = ev?.scores || {};
  openModal(isEdit ? "Edit evaluation" : "New performance evaluation", `
    <div class="grid2">
      <div class="field"><label>Evaluation date</label><input id="f_edate" type="date" value="${ev?.evaluation_date || new Date().toISOString().slice(0,10)}"/></div>
      <div class="field"><label>Evaluation period</label><input id="f_period" value="${ev?.evaluation_period||''}"/></div>
    </div>
    <div class="field" style="font-weight:700;color:var(--navy-2);margin-top:6px;">Categories (score out of 5)</div>
    ${EVAL_CATEGORIES.map((c,i)=>`
      <div class="field"><label>${c}</label>
        <select id="f_cat${i}">
          <option value="">— Not scored —</option>
          ${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(scores[c])===n?'selected':''}>${n}/5</option>`).join("")}
        </select>
      </div>`).join("")}
    <div class="field" id="overallPreview" style="font-weight:700;color:var(--navy-2);"></div>
    <div class="field"><label>Strengths</label><textarea id="f_strengths" rows="2">${ev?.strengths||''}</textarea></div>
    <div class="field"><label>Areas for improvement</label><textarea id="f_areas" rows="2">${ev?.areas_for_improvement||''}</textarea></div>
    <div class="field"><label>Professional recommendation</label><textarea id="f_reco" rows="2">${ev?.recommendation||''}</textarea></div>
  `, async (ov) => {
    const newScores = {};
    EVAL_CATEGORIES.forEach((c,i) => { const v = val(ov,`f_cat${i}`); if (v !== "") newScores[c] = Number(v); });
    const overall_score = calcOverallScore(newScores);
    const payload = {
      teacher_id: teacher.id,
      evaluator_profile_id: profile?.id || null, evaluator_name: profile?.full_name || null,
      evaluation_date: val(ov,"f_edate") || new Date().toISOString().slice(0,10),
      evaluation_period: val(ov,"f_period") || null,
      scores: newScores, overall_score,
      strengths: val(ov,"f_strengths") || null, areas_for_improvement: val(ov,"f_areas") || null,
      recommendation: val(ov,"f_reco") || null,
      updated_at: new Date().toISOString(),
    };
    let saved;
    if (isEdit) { const rows = await dbUpdate("teacher_evaluations", ev.id, payload); saved = (rows && rows[0]) || Object.assign({}, ev, payload); }
    else { const rows = await dbInsert("teacher_evaluations", payload); saved = rows[0]; }
    await logEvalAudit(saved.id, isEdit ? "updated" : "created", saved);
    renderTeacherPerformance(body, container, teacher);
  }, { saveLabel: isEdit ? "Save changes" : "Save evaluation" });
  
  const updatePreview = () => {
    const s = {};
    EVAL_CATEGORIES.forEach((c,i) => { const sel = document.getElementById(`f_cat${i}`); if (sel && sel.value !== "") s[c] = Number(sel.value); });
    const overall = calcOverallScore(s);
    const previewEl = document.getElementById("overallPreview");
    if (previewEl) previewEl.textContent = overall != null ? `Overall score: ${overall}/5` : "Overall score: — (no categories scored yet)";
  };
  EVAL_CATEGORIES.forEach((c,i) => { const sel = document.getElementById(`f_cat${i}`); if (sel) sel.onchange = updatePreview; });
  updatePreview();
}

async function findOrCreateTeacherIdentity(fullName, nationalId, dob, gender, photoUrl) {
  const rows = await sb(`/rest/v1/rpc/find_or_create_teacher_identity`, { method:"POST", body: JSON.stringify({
    p_full_name: fullName, p_national_id_no: nationalId || null, p_date_of_birth: dob || null,
    p_gender: gender || null, p_photo_url: photoUrl || null,
  })});
  return Array.isArray(rows) ? rows[0] : rows;
}

async function searchTeacherIdentities(query) {
  if (!query || query.trim().length < 2) return [];
  return sb(`/rest/v1/rpc/search_teacher_identities`, { method:"POST", body: JSON.stringify({ p_query: query.trim() }) }).catch(()=>[]);
}

  container.innerHTML = `
    <div class="card" style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
      ${avatarHtml(teacher.full_name, teacher.photo_url, 56)}
      <div>
        <div style="font-weight:800;font-size:16px;color:var(--navy-2);">${teacher.full_name}</div>
        <div style="font-size:12.5px;color:var(--ink-soft);">${teacher.specialty||'General'} ${teacher.staff_no?('· '+teacher.staff_no):''}</div>
        ${teacher.nova_teacher_id ? `<div style="font-size:11.5px;color:var(--purple);font-weight:700;margin-top:2px;">${teacher.nova_teacher_id}</div>` : ""}
      </div>
      <span class="badge ${teacher.status==='active'?'badge-green':'badge-grey'}" style="margin-left:auto;">${teacher.status}</span>

}
function wireTeacherProfilePills(container, teacher, sub) {
  const pills = document.getElementById("tpPills");
  const prevPillScroll = pills.scrollLeft;
  pills.innerHTML = "";
  
  
  const canSeePerformance = canManageEvaluations(profile) || (profile && profile.linked_teacher_id === teacher.id);
  const tabs = [["overview","Overview"],["qualifications","Qualifications"],["documents","Documents"]];
  if (canSeePerformance) tabs.push(["performance","Performance"]);
  if (sub === "performance" && !canSeePerformance) sub = "overview";
  tabs.forEach(([id,label])=>{
    const p = el(`<div class="pill ${sub===id?'active':''}">${label}</div>`);
    p.onclick = () => renderTeacherProfileTab(container, teacher, id);
    pills.appendChild(p);
  });
  pills.scrollLeft = prevPillScroll;
  scrollIntoViewIfHidden(pills, pills.querySelector(".pill.active"));
  renderTeacherProfileTab(container, teacher, sub, true);
}
function renderTeacherProfileTab(container, teacher, sub, skipPills) {
  if (!skipPills) wireTeacherProfilePills(container, teacher, sub);
  const body = document.getElementById("tpBody");
  if (!body) return;
  body.innerHTML = `<div class="center-loading">Loading…</div>`;
  if (sub === "qualifications") return renderTeacherQualifications(body, container, teacher).catch(errShow(body));
  if (sub === "documents") return renderTeacherDocuments(body, container, teacher).catch(errShow(body));
  if (sub === "performance") return renderTeacherPerformance(body, container, teacher).catch(errShow(body));
  return renderTeacherProfileOverview(body, container, teacher).catch(errShow(body));
}

async function renderTeacherProfileOverview(body, container, teacher) {
  const [rows, identityRows, allClasses] = await Promise.all([
    dbSelect("teacher_profiles", { teacher_id:`eq.${teacher.id}` }).catch(()=>[]),
    teacher.teacher_identity_id ? dbSelect("teacher_identities", { id:`eq.${teacher.teacher_identity_id}` }).catch(()=>[]) : Promise.resolve([]),
    dbSelectActive("classes", { order:"name.asc" }).catch(()=>[]),
  ]);
  const p = rows[0] || null;
  const identity = identityRows[0] || null;
  const classesTaught = allClasses.filter(c=>c.class_teacher_id===teacher.id);
  const classNames = classesTaught.map(c=>c.name+(c.section?(' '+c.section):'')).join(", ") || "Not assigned to a class";

  body.innerHTML = `

    ["AiO Teacher ID", teacher.nova_teacher_id],
    ["Phone", teacher.phone], ["Email", teacher.email],
    ["National ID No.", identity?.national_id_no], ["Date of birth", identity?.date_of_birth],
  ].filter(([,v]) => v !== undefined && v !== null && v !== "");

    ? personalRows.map(([label,value])=>`<div class="view-row"><div class="vlabel">${label}</div><div class="vvalue">${value}</div></div>`).join("")
    : emptyState("No personal details on file.");
  const personalEditBtn = el(`<button class="btn btn-ghost btn-sm" style="margin-top:12px;">${ic.edit} Edit personal info</button>`);
  personalEditBtn.onclick = () => openPersonalDetailsModal(body, container, teacher, identity);
  personalCard.appendChild(personalEditBtn);

  const professionalCard = document.getElementById("tpProfessionalCard");

    ["Current position", p?.current_position], ["Subjects", p?.subjects_specialization],

    ["Date joined current school", p?.date_joined],
    ["Years of experience", p?.years_experience], ["Professional reg. no.", p?.professional_reg_no],
    ["Bio", p?.bio],
  ].filter(([,v]) => v !== undefined && v !== null && v !== "");
  professionalCard.innerHTML = professionalRows.length
    ? professionalRows.map(([label,value])=>`<div class="view-row"><div class="vlabel">${label}</div><div class="vvalue">${value}</div></div>`).join("")
    : emptyState("No professional details added yet.");
  const proEditBtn = el(`<button class="btn btn-primary btn-sm" style="margin-top:12px;">${ic.edit} ${p?'Edit':'Add'} details</button>`);
  proEditBtn.onclick = () => openTeacherProfileModal(body, container, teacher, p);
  professionalCard.appendChild(proEditBtn);

function openPersonalDetailsModal(body, container, teacher, identity) {
  openModal("Edit personal info", `
    <div class="view-row" style="margin-bottom:6px;"><div class="vlabel">AiO Teacher ID</div><div class="vvalue">${teacher.nova_teacher_id||'—'}</div></div>
    <div class="grid2">
      <div class="field"><label>Phone</label><input id="f_phone" value="${teacher.phone||''}"/></div>
      <div class="field"><label>Email</label><input id="f_email" type="email" value="${teacher.email||''}"/></div>
    </div>
    <div class="grid2">
      <div class="field"><label>National ID No. (NIN)</label><input id="f_nin" value="${identity?.national_id_no||''}"/></div>
      ${dobFieldHtml("f_dob", identity?.date_of_birth)}
    </div>
  `, async (ov) => {
    const phone = val(ov,"f_phone") || null, email = val(ov,"f_email") || null;
    await dbUpdate("teachers", teacher.id, { phone, email });

const LOW_ATTENDANCE_THRESHOLD = 75; 
const ATT_WINDOW_DAYS = 30;          
function daysAgoISO(n) { const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }

async function renderSchoolHealth(container) {
  setActiveRefresh(() => renderSchoolHealth(container));
  container.innerHTML = `<div class="center-loading">Loading…</div>`;
  const today = new Date().toISOString().slice(0,10);
  const windowStart = daysAgoISO(ATT_WINDOW_DAYS);

  const [students, teachers, classesAll, feePayments, feeStructures, examsRaw, examResults, attWindow, staffAttWindow, staffAttToday] = await Promise.all([
    dbSelectActive("students", { status:"eq.active", select:"id,full_name,admission_no,class_id,photo_url,classes(name,section)" }),
    dbSelectActive("teachers", { status:"eq.active", select:"id,full_name,photo_url,specialty,staff_no" }),
    dbSelectActive("classes", { select:"id,name,section" }),
    dbSelect("fee_payments", { select:"student_id,amount_paid" }).catch(()=>[]),
    dbSelect("fee_structures", { select:"class_id,amount" }).catch(()=>[]),
    dbSelectActive("exams", { select:"id,class_id" }).catch(()=>[]),
    dbSelect("exam_results", { select:"exam_id,marks_obtained,max_marks" }).catch(()=>[]),
    dbSelect("attendance", { date:`gte.${windowStart}`, select:"student_id,status" }).catch(()=>[]),
    dbSelect("staff_attendance", { date:`gte.${windowStart}`, select:"teacher_id,status" }).catch(()=>[]),
    dbSelect("staff_attendance", { date:`eq.${today}`, select:"teacher_id,status" }).catch(()=>[]),
  ]);

  
  const totalCollected = feePayments.reduce((a,p)=>a+Number(p.amount_paid||0),0);
  const classAssigned = {};
  feeStructures.forEach(s => { classAssigned[s.class_id] = (classAssigned[s.class_id]||0) + Number(s.amount||0); });
  const paidByStudent = {};
  feePayments.forEach(p => { paidByStudent[p.student_id] = (paidByStudent[p.student_id]||0) + Number(p.amount_paid||0); });
  const outstanding = students.reduce((sum,s) => {
    const assigned = classAssigned[s.class_id] || 0;
    const paid = paidByStudent[s.id] || 0;
    return sum + Math.max(assigned - paid, 0);
  }, 0);

  
  const examClassMap = {}; examsRaw.forEach(x=>examClassMap[x.id]=x.class_id);
  const classPerf = {};
  examResults.forEach(r => {
    const cid = examClassMap[r.exam_id];
    if (!cid) return;
    if (!classPerf[cid]) classPerf[cid] = { obtained:0, max:0 };
    classPerf[cid].obtained += Number(r.marks_obtained||0);
    classPerf[cid].max += Number(r.max_marks||0);
  });
  let topClassId = null, topPct = -1;
  Object.entries(classPerf).forEach(([cid,v]) => {
    if (!v.max) return;
    const pct = v.obtained/v.max*100;
    if (pct > topPct) { topPct = pct; topClassId = cid; }
  });
  const classMap = {}; classesAll.forEach(c=>classMap[c.id]=c);
  const topClassName = topClassId && classMap[topClassId] ? (classMap[topClassId].name + (classMap[topClassId].section?(' '+classMap[topClassId].section):'')) : null;

  
  const studentAttAgg = {};
  attWindow.forEach(a => {
    if (!studentAttAgg[a.student_id]) studentAttAgg[a.student_id] = { present:0, total:0 };
    studentAttAgg[a.student_id].total++;
    if (a.status === "present") studentAttAgg[a.student_id].present++;
  });
  const activeIds = new Set(students.map(s=>s.id));
  const lowAttendanceStudents = Object.entries(studentAttAgg)
    .filter(([sid,v]) => activeIds.has(sid) && v.total>0 && (v.present/v.total*100) < LOW_ATTENDANCE_THRESHOLD)
    .map(([sid,v]) => ({ id:sid, rate:(v.present/v.total*100), present:v.present, total:v.total }));

  
  const presentToday = staffAttToday.filter(a=>a.status==="present").length;
  const absentToday = staffAttToday.filter(a=>a.status==="absent").length;
  const teacherAttAgg = {};
  staffAttWindow.forEach(a => {
    if (!teacherAttAgg[a.teacher_id]) teacherAttAgg[a.teacher_id] = { present:0, total:0 };
    teacherAttAgg[a.teacher_id].total++;
    if (a.status === "present") teacherAttAgg[a.teacher_id].present++;
  });
  const overallTeacherRate = staffAttWindow.length ? (staffAttWindow.filter(a=>a.status==="present").length/staffAttWindow.length*100) : null;

  container.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="num">${currency()}${totalCollected.toLocaleString()}</div><div class="lbl">Total fees collected</div></div>
      <div class="stat"><div class="num" style="color:${outstanding>0?'var(--red)':'var(--teal-dark)'};">${currency()}${outstanding.toLocaleString()}</div><div class="lbl">Outstanding fee balances</div></div>
      <div class="stat"><div class="num" style="font-size:17px;">${topClassName || "—"}</div><div class="lbl">Top performing class${topPct>=0?` · ${topPct.toFixed(1)}%`:""}</div></div>
      <div class="stat"><div class="num">${students.length}</div><div class="lbl">Total students</div></div>
      <div class="stat" id="lowAttStat" style="cursor:pointer;"><div class="num" style="color:${lowAttendanceStudents.length?'var(--red)':'var(--teal-dark)'};">${lowAttendanceStudents.length}</div><div class="lbl">Students with low attendance</div></div>
      <div class="stat"><div class="num">${teachers.length}</div><div class="lbl">Total teachers</div></div>
      <div class="stat"><div class="num" style="color:var(--teal-dark);">${presentToday}</div><div class="lbl">Teachers present today</div></div>
      <div class="stat"><div class="num" style="color:${absentToday?'var(--red)':'var(--ink)'};">${absentToday}</div><div class="lbl">Teachers absent today</div></div>
    </div>
    <div class="card" id="teacherPerfPanel"><div class="center-loading">Loading…</div></div>
  `;
  document.getElementById("lowAttStat").onclick = () => { pushNavState(() => renderSchoolHealth(container).catch(errShow(container))); renderLowAttendanceList(container, lowAttendanceStudents, students, windowStart); };
  renderTeacherAttendancePerformance(document.getElementById("teacherPerfPanel"), teachers, teacherAttAgg, overallTeacherRate);
}

function renderTeacherAttendancePerformance(body, teachers, teacherAttAgg, overallRate) {
  const rows = teachers.map(t => {
    const agg = teacherAttAgg[t.id] || { present:0, total:0 };
    const pct = agg.total ? (agg.present/agg.total*100) : null;
    return { teacher:t, pct, present:agg.present, total:agg.total };
  }).sort((a,b) => (a.pct===null?101:a.pct) - (b.pct===null?101:b.pct));
  const rowsHtml = rows.map(r => {
    const barPct = r.pct===null ? 0 : r.pct;
    const color = r.pct===null ? 'var(--slate)' : barPct>=90 ? 'var(--teal)' : barPct>=75 ? 'var(--amber)' : 'var(--red)';
    const label = r.pct===null ? 'No records' : `${r.present}/${r.total} · ${barPct.toFixed(0)}%`;
    return `<div style="margin-bottom:12px;">
      <div class="row" style="margin-bottom:5px;font-size:13px;">
        <div style="font-weight:700;color:var(--ink);">${r.teacher.full_name}</div>
        <div style="color:var(--ink-soft);font-weight:600;">${label}</div>
      </div>
      <div style="background:var(--card-alt);border-radius:999px;height:9px;overflow:hidden;">
        <div style="width:${barPct}%;height:100%;background:${color};border-radius:999px;"></div>
      </div>
    </div>`;
  }).join("");
  body.innerHTML = `<div class="section-head" style="margin-bottom:14px;">
      <h3 style="color:var(--purple);margin:0;">Teacher Attendance Performance</h3>
      ${overallRate!==null ? `<span class="badge ${overallRate>=90?'badge-green':overallRate>=75?'badge-amber':'badge-red'}">${overallRate.toFixed(0)}% overall · last ${ATT_WINDOW_DAYS}d</span>` : ""}
    </div>
    ${rows.length ? rowsHtml : emptyState("No teachers yet.")}`;
}

function renderLowAttendanceList(container, lowList, students, windowStart) {
  const studentMap = {}; students.forEach(s=>studentMap[s.id]=s);
  const rows = lowList
    .map(l => ({ ...l, student: studentMap[l.id] }))
    .filter(l => l.student)

  container.innerHTML = `

    <p style="font-size:12.5px;color:var(--ink-soft);margin:-6px 0 14px;">Attendance below ${LOW_ATTENDANCE_THRESHOLD}% over the last ${ATT_WINDOW_DAYS} days (since ${formatDate(windowStart)}).</p>
    <div class="card" id="lowAttList"></div>

async function renderFeesHealth(body) {
  const [terms, payments] = await Promise.all([
    dbSelectActive("terms", { order:"start_date.desc" }),
    dbSelect("fee_payments", { select:"student_id,amount_paid,term_id,students(full_name,admission_no,photo_url,classes(name,section))" }).catch(()=>[]),
  ]);
  if (!terms.length) { body.innerHTML = emptyState("Create terms first in Setup, then come back to see fee health."); return; }
  const sorted = [...terms].sort((a,b) => new Date(b.start_date) - new Date(a.start_date));
  const currentTerm = sorted.find(t => t.is_current) || sorted[0];
  const currentIdx = sorted.findIndex(t => t.id === currentTerm.id);
  const lastTerm = sorted[currentIdx + 1] || null;
  const previousTerms = sorted.slice(currentIdx + 2);

  function groupStats(termList) {
    const ids = new Set(termList.map(t => t.id));
    const rows = payments.filter(p => ids.has(p.term_id));
    const total = rows.reduce((a,p) => a + Number(p.amount_paid||0), 0);
    const studentIds = new Set(rows.map(p => p.student_id));
    return { total, studentCount: studentIds.size, rows };
  }
  function termRangeLabel(termList) {
    if (!termList.length) return "No term yet";
    return termList.map(t => t.name).join(", ");
  }
  function feeHealthCard(key, title, termList, stats) {
    if (!termList.length) {
      return `<div class="card"><h3 style="color:var(--red);margin-bottom:4px;">${title}</h3>${emptyState("No term in this group yet.")}</div>`;
    }
    return `<div class="card">
      <h3 style="color:var(--red);margin-bottom:2px;">${title}</h3>
      <div class="tiny-note" style="margin:0 0 10px;text-align:left;">${termRangeLabel(termList)}</div>
      <div class="stat-grid">
        <div class="stat" id="fh_total_${key}" style="cursor:pointer;"><div class="num">${currency()}${stats.total.toLocaleString()}</div><div class="lbl">Total Payments</div></div>
        <div class="stat"><div class="num">${stats.studentCount}</div><div class="lbl">Students paid</div></div>
      </div>
    </div>`;
  }

  const curStats = groupStats([currentTerm]);
  const lastStats = groupStats(lastTerm ? [lastTerm] : []);
  const prevStats = groupStats(previousTerms);

  body.innerHTML = `
    <div class="section-head"><h3 style="color:var(--red);">Fees Health Dashboard</h3></div>
    ${feeHealthCard("current", "Current Term", [currentTerm], curStats)}
    ${feeHealthCard("last", "Last Term", lastTerm ? [lastTerm] : [], lastStats)}
    ${feeHealthCard("previous", "Previous Terms", previousTerms, prevStats)}
  `;
  const bind = (key, title, termList, stats) => {
    if (!termList.length) return;
    const el2 = document.getElementById(`fh_total_${key}`);
    if (el2) el2.onclick = () => { pushNavState(() => renderFeesHealth(body)); renderPaidStudentsList(body, title, stats.rows); };
  };
  bind("current", "Current Term — Students who have paid", [currentTerm], curStats);
  bind("last", "Last Term — Students who have paid", lastTerm ? [lastTerm] : [], lastStats);
  bind("previous", "Previous Terms — Students who have paid", previousTerms, prevStats);
}

function renderPaidStudentsList(body, title, rows) {
  const byStudent = new Map();
  rows.forEach(p => {
    const sid = p.student_id;
    if (!byStudent.has(sid)) byStudent.set(sid, { student: p.students, total: 0 });
    byStudent.get(sid).total += Number(p.amount_paid||0);
  });
  const list = [...byStudent.values()].filter(e => e.student).sort((a,b) => b.total - a.total);
  body.innerHTML = `
    <div class="section-head"><h3 style="color:var(--red);">${title}</h3></div>
    <div class="card" id="paidList"></div>
  `;
  const paidList = document.getElementById("paidList");
  paidList.innerHTML = list.length ? "" : emptyState("No payments recorded for this period yet.");
  list.forEach(({ student:s, total }) => {
    const className = s.classes ? (s.classes.name + (s.classes.section?(' '+s.classes.section):'')) : "Unassigned";
    const row = el(`<div class="list-row">${avatarHtml(s.full_name, s.photo_url, 40)}
      <div class="list-main"><div class="list-title">${s.full_name}</div><div class="list-sub">${s.admission_no||''} · ${className}</div></div>
      <div style="text-align:right;font-weight:800;color:var(--teal-dark);">${currency()}${total.toLocaleString()}</div>
    </div>`);
    paidList.appendChild(row);
  });
}

const FEE_PCT_BRACKETS = [
  ["below30", "Below 30%", (p) => p < 30],
  ["50", "50%", (p) => p >= 30 && p < 50],
  ["75", "75%", (p) => p >= 50 && p < 75],
  ["100", "100%", (p) => p >= 75],
];
async function renderFeeStatus(body, bracketKey="") {
  const [students, structures, payments] = await Promise.all([
    dbSelect("students", { status:"eq.active", select:"id,full_name,admission_no,photo_url,class_id,classes(name,section)", order:"full_name.asc" }),
    dbSelectActive("fee_structures", { select:"class_id,amount" }).catch(()=>[]),
    dbSelect("fee_payments", { select:"student_id,amount_paid" }).catch(()=>[]),
  ]);
  const assignedByClass = {};
  structures.forEach(s => { assignedByClass[s.class_id] = (assignedByClass[s.class_id]||0) + Number(s.amount||0); });
  const paidByStudent = {};
  payments.forEach(p => { paidByStudent[p.student_id] = (paidByStudent[p.student_id]||0) + Number(p.amount_paid||0); });
  const rows = students.map(s => {
    const assigned = assignedByClass[s.class_id] || 0;
    const paid = paidByStudent[s.id] || 0;
    const pct = assigned > 0 ? Math.min(100, (paid/assigned)*100) : (paid > 0 ? 100 : 0);
    return { student: s, assigned, paid, pct };
  });
  const bracket = FEE_PCT_BRACKETS.find(b => b[0]===bracketKey);
  const filtered = bracket ? rows.filter(r => bracket[2](r.pct)) : rows;
  filtered.sort((a,b) => a.pct - b.pct);

  const prevPillScroll = document.getElementById("pctPills")?.scrollLeft;
  body.innerHTML = `
    <div class="section-head"><h3 style="color:var(--red);">Payment Status</h3></div>
    <p style="font-size:12.5px;color:var(--ink-soft);margin:-6px 0 12px;">Each student's total paid vs. their class's total assigned fees, across all terms. Tap a student to see their full payment history and receipts.</p>
    <div class="pill-row" id="pctPills"></div>
    <div class="card" id="statusList"></div>
  `;
  const pctPills = document.getElementById("pctPills");
  const allPill = el(`<div class="pill ${!bracketKey?'active':''}">All (${rows.length})</div>`);
  allPill.onclick = () => renderFeeStatus(body, "");
  pctPills.appendChild(allPill);
  FEE_PCT_BRACKETS.forEach(([key,label,test]) => {
    const count = rows.filter(r=>test(r.pct)).length;
    const p = el(`<div class="pill ${bracketKey===key?'active':''}">${label} (${count})</div>`);
    p.onclick = () => renderFeeStatus(body, key);
    pctPills.appendChild(p);
  });
  if (typeof prevPillScroll === "number") pctPills.scrollLeft = prevPillScroll;
  scrollIntoViewIfHidden(pctPills, pctPills.querySelector(".pill.active"));
  const list = document.getElementById("statusList");
  list.innerHTML = filtered.length ? "" : emptyState("No students match this filter.");
  filtered.forEach(({ student:s, assigned, paid, pct }) => {
    const className = s.classes ? (s.classes.name + (s.classes.section?(' '+s.classes.section):'')) : "Unassigned";
    const color = pct>=100 ? 'var(--teal-dark)' : pct>=50 ? 'var(--amber-dark)' : 'var(--red)';
    const row = el(`<div class="list-row">${avatarHtml(s.full_name, s.photo_url, 40)}
      <div class="list-main"><div class="list-title">${s.full_name}</div><div class="list-sub">${s.admission_no||''} · ${className} · ${currency()}${paid.toLocaleString()} / ${currency()}${assigned.toLocaleString()}</div></div>
      <div style="text-align:right;font-weight:800;color:${color};">${pct.toFixed(0)}%</div>${ic.chevronRight}
    </div>`);
    row.onclick = () => { const onBack = () => renderFeeStatus(body, bracketKey); pushNavState(onBack); renderStaffStudentFeeDetail(body, s, onBack); };
    list.appendChild(row);
  });
}

async function renderStaffStudentFeeDetail(body, student, onBack) {

    </div>
    <div class="stat-grid">

      <div class="stat"><div class="num" style="font-size:20px;color:${totalDue>0?'var(--red)':'var(--teal-dark)'};">${currency()}${totalDue.toLocaleString()}</div><div class="lbl">Balance due</div></div>
    </div>
    <div class="card"><h3 style="color:var(--red);margin-bottom:10px;">Fee balance by term</h3>${termRowsHtml || emptyState("No fee structure set up yet for this class.")}</div>
    <div class="card">
      <h3 style="color:var(--teal-dark);margin-bottom:4px;">Payment history &amp; receipts</h3>
      <div class="tiny-note" style="margin:0 0 10px;text-align:left;"></div>
      <div id="payList"></div>
    </div>
  `;
  const payList = document.getElementById("payList");
  payList.innerHTML = payments.length ? "" : emptyState("No payments recorded yet.");
  payments.forEach(p => {
    const row = el(`<div class="list-row" style="gap:10px;"><div class="avatar">${ic.fees}</div>
      <div class="list-main"><div class="list-title">${currency()}${Number(p.amount_paid||0).toLocaleString()} · ${p.terms?.name||''}</div><div class="list-sub">${formatDate(p.payment_date)} · ${methodLabel(p.method)}</div></div>
      <button class="btn btn-ghost btn-sm" id="rcpt${p.id}">Receipt</button></div>`);
    row.querySelector(`#rcpt${p.id}`).onclick = (e) => { e.stopPropagation(); openReceiptModal(p, student); };
    row.onclick = () => openReceiptModal(p, student);

}

async function renderFeeReminders(body) {
  const students = await dbSelect("students", { status:"eq.active", select:"id,full_name,admission_no", order:"full_name.asc" }).catch(()=>[]);
  body.innerHTML = `
    <div class="card">
      <h3 style="color:var(--red);margin-bottom:4px;">Send a message</h3>
      <div class="tiny-note" style="margin:0 0 10px;text-align:left;"></div>
      <div class="field"><label>Type</label><select id="f_msgType"><option value="reminder">Fee reminder</option><option value="announcement">Finance announcement</option></select></div>
      <div class="field" id="f_remTargetWrap"><label>Send to</label><select id="f_remTarget"><option value="all">All parents</option><option value="student">Specific student</option></select></div>
      <div class="field" id="f_remStudentWrap" style="display:none;"><label>Student</label><select id="f_remStudent"><option value="">— Select student —</option>${students.map(s=>`<option value="${s.id}">${s.full_name} (${s.admission_no})</option>`).join("")}</select></div>
      <div class="field" id="f_annAudienceWrap" style="display:none;"><label>Audience</label><select id="f_annAudience"><option>Everyone</option><option>All parents</option></select></div>
      <div class="field"><label>Title</label><input id="f_msgTitle"/></div>
      <div class="field"><label>Message</label><textarea id="f_msgMessage" rows="4"></textarea></div>
      <button class="btn btn-primary" id="sendMsgBtn" style="width:100%;">Send</button>
      <div id="msgStatus"></div>
    </div>
    <div class="card" id="msgList"><div class="center-loading">Loading…</div></div>
  `;
  const typeSel = document.getElementById("f_msgType");
  const targetSel = document.getElementById("f_remTarget");
  const studentWrap = document.getElementById("f_remStudentWrap");
  const remTargetWrap = document.getElementById("f_remTargetWrap");
  const annAudienceWrap = document.getElementById("f_annAudienceWrap");
  targetSel.onchange = () => { studentWrap.style.display = targetSel.value==="student" ? "" : "none"; };
  typeSel.onchange = () => {
    const isReminder = typeSel.value === "reminder";
    remTargetWrap.style.display = isReminder ? "" : "none";
    studentWrap.style.display = (isReminder && targetSel.value==="student") ? "" : "none";
    annAudienceWrap.style.display = isReminder ? "none" : "";
  };

  async function loadRecent() {
    const wrap = document.getElementById("msgList");
    let reminders = [], announcements = [], missing = null;
    try { reminders = await dbSelectActive("fee_reminders", { order:"created_at.desc", limit:"20", select:"*,students(full_name,admission_no)" }); } catch (e) { missing = "reminders"; }
    try { announcements = await dbSelectActive("school_communications", { type:"eq.announcement", order:"created_at.desc", limit:"20" }); } catch (e) { if (!missing) missing = "announcements"; }

    if (missing) {
      wrap.innerHTML = missingSetupHtml("Sending messages isn't available for your school yet.") +
        `<button class="btn btn-primary" id="retryMsgBtn" style="margin-top:12px;">Refresh</button>`;
      document.getElementById("retryMsgBtn").onclick = loadRecent;
      return;
    }

    const items = [
      ...reminders.map(r => ({ date: r.created_at, kind: "Reminder", title: r.title, sub: r.students ? `To ${r.students.full_name} (${r.students.admission_no||''})` : "To all parents", del: async () => { await dbUpdate("fee_reminders", r.id, { deleted_at:new Date().toISOString() }); loadRecent(); } })),
      ...announcements.map(c => ({ date: c.created_at, kind: "Announcement", title: c.title, sub: c.audience || "Everyone", del: async () => { await softDelete("school_communications", c.id); loadRecent(); } })),
    ].sort((a,b) => new Date(b.date) - new Date(a.date));

    wrap.innerHTML = `<h3 style="color:var(--slate);margin-bottom:10px;">Recent messages</h3>` +
      (items.length ? items.map(it => `<div class="list-row"><div class="list-main"><div class="list-title">${it.title}</div><div class="list-sub">${it.kind} · ${it.sub} · ${formatDate(it.date)}</div></div>
        <button class="btn btn-ghost btn-sm" data-delmsg>${ic.trash||"Delete"}</button></div>`).join("") : emptyState("No messages sent yet."));
    [...wrap.querySelectorAll("[data-delmsg]")].forEach((btn, i) => {
      btn.onclick = async () => { if (await customConfirm(`Delete "${items[i].title}"?`, { danger:true, okLabel:"Delete" })) safe(items[i].del)(); };
    });
  }

  document.getElementById("sendMsgBtn").onclick = async () => {
    const status = document.getElementById("msgStatus"); status.innerHTML = "";
    const title = document.getElementById("f_msgTitle").value.trim();
    const message = document.getElementById("f_msgMessage").value.trim();
    if (!title || !message) { status.innerHTML = `<div class="err">Please fill in both title and message.</div>`; return; }
    try {
      if (typeSel.value === "reminder") {
        const target = targetSel.value;
        const studentId = document.getElementById("f_remStudent").value;
        if (target==="student" && !studentId) { status.innerHTML = `<div class="err">Please select a student.</div>`; return; }

async function renderFeeStructure(body) {

function openFeeItemModal(body, cls, terms, f, onDone) {

      await dbUpdate("fee_structures", f.id, payload);

    }, { saveLabel: "Save changes" });

  }

  
  
  let rowCount = 0;
  const makeRowHtml = () => {
    rowCount++;
    return `<div class="feeItemRow" data-row="${rowCount}" style="display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;">
      <div class="field" style="flex:1.5;margin-bottom:0;">${rowCount===1?'<label>Item name</label>':''}<input class="fi-name"/></div>

      <button type="button" class="btn btn-ghost btn-sm fi-remove" title="Remove item" style="padding:10px 12px;flex-shrink:0;">&times;</button>
    </div>`;
  };
  const firstRowHtml = makeRowHtml();

  const overlay = openModal("New fee items", `
    ${classLabel}
    <div class="field"><label>Term</label><select id="f_term">${terms.map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}</select></div>
    <div id="feeItemsWrap">${firstRowHtml}</div>

    <div class="row" style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px;">
      <div style="font-weight:700;color:var(--navy);">Total</div>
      <div style="font-weight:800;font-size:17px;color:var(--red);" id="feeItemsTotal">${currency()}0</div>
    </div>
  `, async (ov) => {
    const termId = val(ov,"f_term");
    const payloads = Array.from(ov.querySelectorAll(".feeItemRow")).map(r => ({
      class_id: cls.id,
      term_id: termId,
      item_name: r.querySelector(".fi-name").value.trim(),
      amount: Number(r.querySelector(".fi-amount").value),
    })).filter(p => p.item_name && p.amount > 0);
    if (!payloads.length) throw new Error("Add at least one fee item with a name and an amount.");
    await dbInsert("fee_structures", payloads);
    done();
  }, { saveLabel: "Add items" });

  const wrap = overlay.querySelector("#feeItemsWrap");
  const totalEl = overlay.querySelector("#feeItemsTotal");
  const recalcTotal = () => {
    const total = Array.from(overlay.querySelectorAll(".fi-amount")).reduce((a,i)=>a+(Number(i.value)||0), 0);
    totalEl.textContent = currency() + total.toLocaleString();
  };
  const bindRow = (rowEl) => {
    rowEl.querySelector(".fi-amount").addEventListener("input", recalcTotal);
    rowEl.querySelector(".fi-name").addEventListener("input", recalcTotal);
    rowEl.querySelector(".fi-remove").onclick = () => {
      
      if (overlay.querySelectorAll(".feeItemRow").length <= 1) {
        rowEl.querySelector(".fi-name").value = "";
        rowEl.querySelector(".fi-amount").value = "";
        recalcTotal();
        return;
      }
      rowEl.remove();
      recalcTotal();
    };
  };
  wrap.querySelectorAll(".feeItemRow").forEach(bindRow);
  overlay.querySelector("#addItemRowBtn").onclick = () => {
    const holder = document.createElement("div");
    holder.innerHTML = makeRowHtml();
    const rowEl = holder.firstChild;
    wrap.appendChild(rowEl);
    bindRow(rowEl);
    rowEl.querySelector(".fi-name").focus();
  };
}

    const classId = studentSel.selectedOptions[0].dataset.class;
    const [structure, payments] = await Promise.all([
      dbSelect("fee_structures", { class_id:`eq.${classId}`, term_id:`eq.${tid}` }),
      dbSelect("fee_payments", { student_id:`eq.${sid}`, term_id:`eq.${tid}` }),

    const paid = payments.reduce((a,b)=>a+Number(b.amount_paid),0);
    balanceEl.innerHTML = `Term fee: <b>${currency()}${total.toLocaleString()}</b> · Paid so far: <b>${currency()}${paid.toLocaleString()}</b> · Balance: <b style="color:${total-paid>0?'var(--red)':'var(--teal-dark)'}">${currency()}${(total-paid).toLocaleString()}</b>`;
  }
  studentSel.onchange = refreshBalance;
  termSel.onchange = refreshBalance;

      await dbInsert("fee_payments", {
        student_id: sid,
        term_id: tid,
        amount_paid: amt,
        method: document.getElementById("f_method").value,
        note: document.getElementById("f_note").value,
        received_by: profile.id,
      });
      msg.innerHTML = `<div class="msg-ok">Payment recorded.</div>`;
      document.getElementById("f_amount").value = "";
      document.getElementById("f_note").value = "";
      refreshBalance();
    } catch(err) { msg.innerHTML = `<div class="err">${err.message}</div>`; }
  };

function methodLabel(m) {
  const map = { cash:"Cash", bank_transfer:"Bank transfer", card:"Card", mobile_money:"Mobile money", other:"Other" };

}
function formatDate(d) {
  if (!d) return "";
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString(undefined, { day:"numeric", month:"short", year:"numeric" });
}

function examLabel(x) {
  const type = x.exam_types?.name || x.name || "Exam";
  const cls = (x.classes?.name || "") + (x.classes?.section ? (" " + x.classes.section) : "");
  const term = x.terms?.name || "";
  return [type, cls, term].filter(Boolean).join(" • ");
}
function examDateRange(x) {
  if (x.exam_date && x.exam_end_date) return `${x.exam_date} → ${x.exam_end_date}`;
  return x.exam_date || x.exam_end_date || "";
}

function dedupeExams(exams) {
  const seen = new Set(); const out = [];
  exams.forEach(x => {
    const key = `${x.class_id}|${x.term_id}|${x.exam_type_id}`;
    if (seen.has(key)) return;
    seen.add(key); out.push(x);
  });
  return out;
}

function openExamModal(body, classes, terms, examTypes, existingExams, x) {
  const isEdit = !!x;
  openModal(isEdit ? "Edit exam" : "New exam", `
    <div class="field"><label>Exam type</label><select id="f_examtype">${examTypes.map(t=>`<option value="${t.id}" ${x?.exam_type_id===t.id?'selected':''}>${t.name}</option>`).join("")}</select></div>
    <div class="field"><label>Class</label><select id="f_class">${isEdit ? "" : `<option value="__all__">— All Classes —</option>`}${classes.map(c=>`<option value="${c.id}" ${x?.class_id===c.id?'selected':''}>${c.name}${c.section?(' '+c.section):''}</option>`).join("")}</select>
    ${isEdit ? "" : `<div class="tiny-note" style="margin:6px 0 0;text-align:left;"></div>`}</div>
    <div class="field"><label>Term</label><select id="f_term">${terms.map(t=>`<option value="${t.id}" ${x?.term_id===t.id?'selected':''}>${t.name}</option>`).join("")}</select></div>
    <div class="grid2">
      <div class="field"><label>Start date</label><input id="f_start" type="text" class="datefield" readonly value="${x?.exam_date||''}"/></div>
      <div class="field"><label>End date</label><input id="f_end" type="text" class="datefield" readonly value="${x?.exam_end_date||''}"/></div>
    </div>
  `, async (ov)=>{
    const exam_type_id = val(ov,"f_examtype")||null, class_id = val(ov,"f_class"), term_id = val(ov,"f_term");
    const typeName = examTypes.find(t=>t.id===exam_type_id)?.name || "Exam";
    const exam_date = val(ov,"f_start")||null, exam_end_date = val(ov,"f_end")||null;
    if (class_id === "__all__") {
      const already = new Set((existingExams||[]).filter(e => e.exam_type_id===exam_type_id && e.term_id===term_id).map(e=>e.class_id));
      const targetClasses = classes.filter(c => !already.has(c.id));
      if (!targetClasses.length) throw new Error("Every class already has an exam of this type for this term.");
      await dbInsert("exams", targetClasses.map(c => ({ name: typeName, exam_type_id, class_id: c.id, term_id, exam_date, exam_end_date })));
      renderExamList(body);
      toast(`Created for ${targetClasses.length} class${targetClasses.length===1?'':'es'}${already.size ? ` (${already.size} already had one and were skipped)` : ""}.`, false);
      return;
    }
    const dupe = (existingExams||[]).find(e => e.exam_type_id===exam_type_id && e.class_id===class_id && e.term_id===term_id && (!isEdit || e.id!==x.id));
    if (dupe) throw new Error("An exam of this type already exists for this class and term. Edit that one instead of creating a duplicate.");
    const payload = { name: typeName, exam_type_id, class_id, term_id, exam_date, exam_end_date };
    if (isEdit) await dbUpdate("exams", x.id, payload); else await dbInsert("exams", payload);
    renderExamList(body);
  }, { saveLabel: isEdit ? "Save changes" : "Add" });
}
async function renderEnterResults(body) {

      dbSelect("students", { class_id:`eq.${classId}`, status:"eq.active", order:"full_name.asc" }),

      <button class="btn btn-primary" id="saveResultsBtn" style="width:100%;">Save results</button><div id="resMsg"></div>`;

      const mark = marksMap[s.id];
      const initialGrade = (mark !== undefined && mark !== null && mark !== "") ? gradeFor((Number(mark)/maxScore)*100) : "—";
      gb.appendChild(elRow(`<tr><td>${s.full_name}</td>
        <td><input type="number" max="${maxScore}" min="0" style="width:80px;padding:6px;border:1px solid var(--line);border-radius:6px;" data-sid="${s.id}" class="markInput" value="${marksMap[s.id]??''}"/></td>
        <td>${maxScore}</td>
        <td class="gradeCell" data-sid="${s.id}" style="font-weight:700;">${initialGrade}</td>
        <td><input type="text" style="width:100%;min-width:120px;padding:6px;border:1px solid var(--line);border-radius:6px;" data-sid="${s.id}" class="remarkInput" value="${remarksMap[s.id]||''}"/></td></tr>`));
    });
    
    gb.querySelectorAll(".markInput").forEach(inp => {
      inp.addEventListener("input", () => {
        const cell = gb.querySelector(`.gradeCell[data-sid="${inp.dataset.sid}"]`);
        if (!cell) return;
        cell.textContent = inp.value === "" ? "—" : gradeFor((Number(inp.value)/maxScore)*100);
      });
    });
    document.getElementById("saveResultsBtn").onclick = async () => {
      const msg = document.getElementById("resMsg");
      const markInputs = [...gb.querySelectorAll(".markInput")].filter(i=>i.value !== "");
      const records = markInputs.map(i => {
        const remarkEl = gb.querySelector(`.remarkInput[data-sid="${i.dataset.sid}"]`);

      } catch(err) { msg.innerHTML = `<div class="err">${err.message}</div>`; }
    };

  selSubject.onchange = loadGrid;
  if (exams.length) loadSubjects();

async function renderResultsOverview(body, filters={}) {
  const [examsRaw, classes, terms, subjects, resultsRaw, students] = await Promise.all([
    dbSelectActive("exams", { select:"*,classes(name,section),terms(name),exam_types(name)", order:"exam_date.desc" }),
    dbSelectActive("classes", { order:"name.asc" }),
    dbSelectActive("terms", { order:"start_date.desc" }),
    dbSelectActive("subjects", { order:"name.asc" }),
    dbSelect("exam_results", { select:"*" }),
    dbSelectActive("students", { select:"id,full_name,admission_no,class_id" }),
    loadGrades(),
  ]);
  const exams = dedupeExams(examsRaw);
  const examMap = {}; exams.forEach(x=>examMap[x.id]=x);
  const studentMap = {}; students.forEach(s=>studentMap[s.id]=s);
  const subjectMap = {}; subjects.forEach(s=>subjectMap[s.id]=s.name);

  
  const groups = {};
  resultsRaw.forEach(r => {
    const exam = examMap[r.exam_id];
    if (!exam) return; 
    if (filters.class_id && exam.class_id !== filters.class_id) return;
    if (filters.term_id && exam.term_id !== filters.term_id) return;
    const key = `${r.student_id}|${r.exam_id}`;
    if (!groups[key]) groups[key] = { student_id:r.student_id, exam_id:r.exam_id, total:0, max:0, subjects:[] };
    groups[key].total += Number(r.marks_obtained||0);
    groups[key].max += Number(r.max_marks||0);
    groups[key].subjects.push(r);
  });
  const rows = Object.values(groups)
    .filter(g => studentMap[g.student_id] && examMap[g.exam_id])
    .sort((a,b) => (studentMap[a.student_id].full_name||"").localeCompare(studentMap[b.student_id].full_name||""));

  body.innerHTML = `
    <div class="row" style="gap:10px;margin-bottom:14px;">
      <select id="filterClass" style="flex:1;min-width:140px;"><option value="">All classes</option>${classes.map(c=>`<option value="${c.id}" ${filters.class_id===c.id?'selected':''}>${c.name}${c.section?(' '+c.section):''}</option>`).join("")}</select>
      <select id="filterTerm" style="flex:1;min-width:140px;"><option value="">All terms</option>${terms.map(t=>`<option value="${t.id}" ${filters.term_id===t.id?'selected':''}>${t.name}</option>`).join("")}</select>
    </div>
    <div class="card" id="resultsList"></div>
  `;
  document.getElementById("filterClass").onchange = (e) => renderResultsOverview(body, Object.assign({}, filters, { class_id: e.target.value || undefined }));
  document.getElementById("filterTerm").onchange = (e) => renderResultsOverview(body, Object.assign({}, filters, { term_id: e.target.value || undefined }));

  const list = document.getElementById("resultsList");
  list.innerHTML = rows.length ? "" : emptyState("No results recorded yet. Enter marks from the \"Enter results\" tab.");
  rows.forEach(g => {
    const student = studentMap[g.student_id];
    const exam = examMap[g.exam_id];
    const pct = g.max ? (g.total/g.max*100) : 0;
    const row = el(`<div class="list-row"><div class="avatar">${initials(student.full_name)}</div>
      <div class="list-main"><div class="list-title">${student.full_name}</div>
      <div class="list-sub">${examLabel(exam)}</div></div>
      <div style="text-align:right;"><div style="font-weight:800;color:var(--navy);">${g.total}/${g.max}</div><div style="font-size:11.5px;color:var(--ink-soft);">${pct.toFixed(1)}% · ${gradeLabel(pct)}</div></div>
    </div>`);
    row.onclick = () => openViewModal(`${student.full_name} — ${examLabel(exam)}`, [
      ["Admission no.", student.admission_no],
      ...g.subjects.map(r => [subjectMap[r.subject_id] || "Subject", `${r.marks_obtained}/${r.max_marks}${r.remarks?(' — '+r.remarks):''}`]),
      ["Total", `${g.total} / ${g.max}`],
      ["Average", `${pct.toFixed(1)}%`],
      ["Grade", gradeLabel(pct)],
    ]);
    list.appendChild(row);
  });
}

async function renderChatHistory(body, container) {
  let msgs = [];
  let missingTable = false;
  try {
    msgs = await dbSelect("private_messages", { recipient_id:`eq.${profile.id}`, order:"created_at.desc", limit:"500", select:"*,students(full_name,photo_url)" });
  } catch (e) { missingTable = true; }

  if (missingTable) {
    body.innerHTML = missingSetupHtml("Chat isn't available for your school yet.");
    return;
  }

  
  
  const threads = new Map();
  msgs.forEach(m => {
    const key = `${m.parent_id}::${m.student_id||''}`;
    if (!threads.has(key)) threads.set(key, { parent_id:m.parent_id, parent_name:m.parent_name, student_id:m.student_id, student_name: m.students?.full_name || null, messages:[] });
    threads.get(key).messages.push(m);
  });
  const list = [...threads.values()].map(t => {

  }).sort((a,b) => new Date(b.last.created_at) - new Date(a.last.created_at));

  body.innerHTML = `<div class="section-head"><h3 style="color:var(--navy);">Chat History</h3></div>
    <div class="card" id="threadList"></div>`;

    const row = el(`<div class="list-row">${avatarHtml(t.parent_name, null)}

      t.student_id ? { id:t.student_id, full_name:t.student_name } : null,
      () => renderChatHistory(body, container)

  });

let gradesCache = null;
async function loadGrades() {
  if (gradesCache !== null) return gradesCache;
  try {
    const rows = await dbSelectActive("grades", { order:"min_score.desc" });
    gradesCache = rows.length ? rows : [];
  } catch (e) { gradesCache = []; }
  return gradesCache;
}
function gradeInfo(pct) {
  const bands = gradesCache || [];
  const match = bands.find(g => pct >= Number(g.min_score) && pct <= Number(g.max_score));
  if (match) return { grade: match.grade, remark: match.remark || "" };
  
  const grade = pct>=80?"A":pct>=70?"B":pct>=60?"C":pct>=50?"D":pct>=40?"E":"F";
  return { grade, remark: "" };
}
function gradeFor(pct) { return gradeInfo(pct).grade; }
function gradeLabel(pct) { const {grade,remark} = gradeInfo(pct); return remark ? `${grade} (${remark})` : grade; }

const AIO_WARN_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.6 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"/></svg>`;
const AIO_RETRY_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>`;
const AIO_SEND_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>`;
const AIO_MENU_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>`;
const AIO_SUGGESTIONS = [
  "How is the school performing?",
  "How many students are absent today?",
  "Which students need attention?",
  "Which accounts need follow-up?",
  "How much fees are outstanding?",
  "What happened at school today?"
];

let aioConversations = [];
let aioActiveId = null; // null = fresh, unsaved chat (empty state)
let aioBusy = false;
let aioMessagesEl, aioHistoryListEl, aioQuickPromptsEl, aioInputForm, aioInput, aioSendBtn;

function aioEscapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function aioNowTime() {
  return new Date().toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" });
}
function aioGetActiveConv() {
  return aioConversations.find(c => c.id === aioActiveId) || null;
}
function aioStripHtml(html) {
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  return (tmp.textContent || "").replace(/\s+/g, " ").trim().slice(0, 60);
}

function aioRenderQuickPrompts() {
  aioQuickPromptsEl.innerHTML = AIO_SUGGESTIONS.map(q =>
    `<button type="button" class="aio-qp-chip" data-aio-prompt="${aioEscapeHtml(q)}">${aioEscapeHtml(q)}</button>`
  ).join("");
}

function aioRenderHistory() {
  if (!aioConversations.length) {
    aioHistoryListEl.innerHTML = `<div class="aio-history-empty">No conversations yet. Start by asking AiO ai a question.</div>`;
    return;
  }
  aioHistoryListEl.innerHTML = aioConversations.map(c => {
    const lastMsg = c.messages && c.messages.length ? c.messages[c.messages.length - 1] : null;
    const preview = lastMsg ? aioStripHtml(lastMsg.html) : (c.messages === null ? "Tap to view this conversation" : "");
    return `
      <button type="button" class="aio-history-item ${c.id === aioActiveId ? 'active' : ''}" data-aio-conv="${c.id}">
        <div class="t">${aioEscapeHtml(c.title)}</div>
        <div class="s">${aioEscapeHtml(preview)}</div>
      </button>`;
  }).join("");
}

function aioRenderEmptyState() {
  aioMessagesEl.classList.add("is-empty");
  const schoolName = (CURRENT_SCHOOL && CURRENT_SCHOOL.name) || "your school";
  aioMessagesEl.innerHTML = `
    <div class="aio-empty">
      <div class="aio-avatar">${ic.sparkle}</div>
      <h3>Ask AiO ai anything</h3>
      <p>Hello, ${aioEscapeHtml(schoolName)}!</p>
      <div class="aio-suggestions">
        ${AIO_SUGGESTIONS.map(q => `
          <button type="button" class="aio-suggest-chip" data-aio-prompt="${aioEscapeHtml(q)}">
            ${ic.sparkle}<span>${aioEscapeHtml(q)}</span>
          </button>`).join("")}
      </div>
    </div>
  `;
}

function aioMessageHtml(m) {
  if (m.role === "user") {
    return `
      <div class="aio-msg user">
        <div class="aio-msg-mark">You</div>
        <div>
          <div class="aio-msg-bubble">${aioEscapeHtml(m.html)}</div>
          <div class="aio-msg-time">${m.time}</div>
        </div>
      </div>`;
  }
  return `
    <div class="aio-msg assistant">
      <div class="aio-msg-mark">${ic.sparkle}</div>
      <div>
        <div class="aio-msg-bubble">${m.html}</div>
        <div class="aio-msg-time">${m.time}</div>
      </div>
    </div>`;
}

function aioRenderMessages() {
  const conv = aioGetActiveConv();
  if (!conv || !conv.messages || !conv.messages.length) {
    aioRenderEmptyState();
    aioQuickPromptsEl.classList.add("hide");
    return;
  }
  aioQuickPromptsEl.classList.remove("hide");
  aioMessagesEl.classList.remove("is-empty");
  aioMessagesEl.innerHTML = conv.messages.map(m => aioMessageHtml(m)).join("");
  aioScrollToBottom();
}

function aioScrollToBottom() {
  aioMessagesEl.scrollTop = aioMessagesEl.scrollHeight;
}

function aioShowThinking() {
  const elx = document.createElement("div");
  elx.className = "aio-msg assistant aio-thinking";
  elx.id = "aioThinkingBubble";
  elx.innerHTML = `
    <div class="aio-msg-mark">${ic.sparkle}</div>
    <div class="aio-msg-bubble">
      <span class="aio-think-dot"></span><span class="aio-think-dot"></span><span class="aio-think-dot"></span>
    </div>`;
  aioMessagesEl.appendChild(elx);
  aioScrollToBottom();
}
function aioHideThinking() {
  const elx = document.getElementById("aioThinkingBubble");
  if (elx) elx.remove();
}

function aioShowErrorBubble(forQuery, errorMessage) {
  const elx = document.createElement("div");
  elx.className = "aio-msg assistant aio-error";
  elx.innerHTML = `
    <div class="aio-msg-mark">${ic.sparkle}</div>
    <div class="aio-msg-bubble">
      <div class="aio-error-head">${AIO_WARN_ICON}Couldn't get a response</div>
      <div>${aioEscapeHtml(errorMessage || "AiO ai had trouble answering just now. Give it another try.")}</div>
      <button type="button" class="aio-retry-btn">${AIO_RETRY_ICON}Retry</button>
    </div>`;
  elx.querySelector(".aio-retry-btn").addEventListener("click", () => {
    elx.remove();
    const conv = aioGetActiveConv();
    if (conv) aioAnswerQuery(conv, forQuery);
  });
  aioMessagesEl.appendChild(elx);
  aioScrollToBottom();
}

async function aioLoadConversationList() {
  try {
    const rows = await dbSelect("ai_conversations", {
      user_id: `eq.${profile.id}`,
      select: "id,title,created_at",
      order: "created_at.desc",
      limit: "30"
    });
    aioConversations = (rows || []).map(c => ({
      id: c.id, dbId: c.id,
      title: c.title || "Untitled conversation",
      time: new Date(c.created_at).toLocaleString("en-US", { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }),
      messages: null
    }));
  } catch (e) {
    console.warn("Could not load AiO ai conversation history:", e && e.message ? e.message : e);
    aioConversations = [];
  }
  aioRenderHistory();
}

async function aioLoadConversationMessages(conv) {
  if (conv.messages) return conv.messages;
  try {
    const rows = await dbSelect("ai_messages", {
      conversation_id: `eq.${conv.dbId}`,
      select: "role,content,created_at",
      order: "created_at.asc"
    });
    conv.messages = (rows || []).map(m => ({ role: m.role, html: m.content, time: new Date(m.created_at).toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" }) }));
  } catch (e) {
    console.warn("Could not load conversation messages:", e && e.message ? e.message : e);
    conv.messages = [];
  }
  return conv.messages;
}

function aioEnsureActiveConv(firstMessageText) {
  const existing = aioGetActiveConv();
  if (existing) return existing;
  const title = firstMessageText.length > 42 ? firstMessageText.slice(0, 42) + "…" : firstMessageText;
  const localId = "c-" + Date.now();
  const conv = { id: localId, dbId: null, title, time: "Just now", messages: [] };
  aioConversations.unshift(conv);
  aioActiveId = localId;
  return conv;
  // Note: no DB row is created here — the Edge Function creates
  // ai_conversations on the first real message and returns its id,
  // which aioAnswerQuery() below stores onto conv.dbId.
}

async function aioAskBackend(message, conversationId) {
  const res = await fetch(`${SUPABASE_URL}/functions/v1/aio-ai-chat`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    },
    body: JSON.stringify({
      token: SESSION_TOKEN,
      message: message,
      conversation_id: conversationId || undefined
    })
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data && data.message ? data.message : "AiO ai is temporarily unavailable.");
  }
  return data; // { conversation_id, reply }
}

async function aioAnswerQuery(conv, text) {
  aioBusy = true;
  aioSendBtn.disabled = true;
  aioShowThinking();
  try {
    const { conversation_id, reply } = await aioAskBackend(text, conv.dbId);
    if (!conv.dbId) conv.dbId = conversation_id;
    aioHideThinking();
    const msg = { role:"assistant", html: aioEscapeHtml(reply).replace(/\n/g, "<br>"), time: aioNowTime() };
    conv.messages.push(msg);
    aioMessagesEl.insertAdjacentHTML("beforeend", aioMessageHtml(msg));
    aioScrollToBottom();
    aioRenderHistory();
  } catch (err) {
    aioHideThinking();
    console.warn("AiO ai answer failed:", err && err.message ? err.message : err);
    aioShowErrorBubble(text, err && err.message);
  } finally {
    aioBusy = false;
    aioSendBtn.disabled = false;
  }
}

function aioSendMessage(text) {
  text = (text || "").trim();
  if (!text || aioBusy) return;
  const conv = aioEnsureActiveConv(text);
  const userMsg = { role:"user", html: text, time: aioNowTime() };
  conv.messages.push(userMsg);
  if (conv.messages.length === 1) {
    aioRenderMessages();
  } else {
    aioQuickPromptsEl.classList.add("hide");
    aioMessagesEl.insertAdjacentHTML("beforeend", aioMessageHtml(userMsg));
    aioScrollToBottom();
  }
  aioRenderHistory();
  aioInput.value = "";
  aioInput.style.height = "auto";
  aioAnswerQuery(conv, text);
}

function aioStartNewChat() {
  aioActiveId = null;
  aioRenderMessages();
  aioRenderHistory();
  aioCloseHistoryDrawer();
}
function aioOpenHistoryDrawer() { document.body.classList.add("aio-history-open"); }
function aioCloseHistoryDrawer() { document.body.classList.remove("aio-history-open"); }

function aioWireEvents() {
  aioInputForm.addEventListener("submit", (e) => {
    e.preventDefault();
    aioSendMessage(aioInput.value);
  });
  aioInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      aioSendMessage(aioInput.value);
    }
  });
  aioInput.addEventListener("input", () => {
    aioInput.style.height = "auto";
    aioInput.style.height = Math.min(aioInput.scrollHeight, 120) + "px";
  });
  aioMessagesEl.addEventListener("click", (e) => {
    const chip = e.target.closest("[data-aio-prompt]");
    if (chip) aioSendMessage(chip.dataset.aioPrompt);
  });
  aioQuickPromptsEl.addEventListener("click", (e) => {
    const chip = e.target.closest("[data-aio-prompt]");
    if (chip) aioSendMessage(chip.dataset.aioPrompt);
  });
  document.getElementById("aioNewChatBtn").addEventListener("click", aioStartNewChat);
  const aioNewChatHeadBtnEl = document.getElementById("aioNewChatHeadBtn");
  if (aioNewChatHeadBtnEl) aioNewChatHeadBtnEl.addEventListener("click", aioStartNewChat);
  const aioClearChatBtnEl = document.getElementById("aioClearChatBtn");
  if (aioClearChatBtnEl) {
    aioClearChatBtnEl.addEventListener("click", async () => {
      const conv = aioGetActiveConv();
      if (conv) {
        aioConversations = aioConversations.filter(c => c.id !== conv.id);
        aioActiveId = null;
        aioRenderMessages();
        aioRenderHistory();
        if (conv.dbId) {
          try { await dbDelete("ai_conversations", conv.dbId); }
          catch (e) { console.warn("Could not delete conversation:", e && e.message ? e.message : e); }
        }
      }
    });
  }
  aioHistoryListEl.addEventListener("click", async (e) => {
    const item = e.target.closest("[data-aio-conv]");
    if (!item) return;
    const conv = aioConversations.find(c => c.id === item.dataset.aioConv);
    if (!conv) return;
    aioActiveId = conv.id;
    if (conv.messages === null) {
      aioRenderMessages();
      await aioLoadConversationMessages(conv);
    }
    aioRenderMessages();
    aioRenderHistory();
    aioCloseHistoryDrawer();
  });
  const aioHistoryToggleBtnEl = document.getElementById("aioHistoryToggleBtn");
  if (aioHistoryToggleBtnEl) {
    aioHistoryToggleBtnEl.addEventListener("click", () => {
      document.body.classList.toggle("aio-history-open");
    });
  }
  const backdrop = document.getElementById("aioHistoryBackdrop");
  if (backdrop) backdrop.addEventListener("click", aioCloseHistoryDrawer);
}

async function renderRegToggleCard() {
  const card = document.getElementById("regToggleCard");
  if (!card) return;
  let open = true;
  let missingCol = false;
  try {
    const rows = await dbSelect("school_settings", { select:"registration_open" });
    open = rows[0]?.registration_open !== false;
  } catch (e) { missingCol = true; }
  if (missingCol) {
    card.innerHTML = `<div class="tiny-note">Registration Controls isn't available for your school yet.</div>
      <button class="btn btn-primary btn-sm" id="retryRegToggleBtn" style="margin-top:10px;">Refresh</button>`;
    const retry = document.getElementById("retryRegToggleBtn");
    if (retry) retry.onclick = renderRegToggleCard;
    return;
  }
  const renderState = (isOpen) => `
    <div class="list-row">
      <div class="list-main">
        <div class="list-title">${isOpen ? "Registration open" : "Registration closed"}</div>
        <div class="list-sub">${isOpen ? "Anyone with your School ID can self-register (Staff or Parent), subject to any department locks below." : "New \"Create account\" attempts fail immediately with a message telling people to contact your admin."}</div>
      </div>
      <label class="row" style="gap:6px;align-items:center;cursor:pointer;">
        <input type="checkbox" id="regOpenToggle" ${isOpen ? "checked" : ""} style="width:18px;height:18px;"/>
      </label>
    </div>
    <div id="regToggleMsg" style="margin-top:8px;"></div>`;
  card.innerHTML = renderState(open);
  const wire = () => {
    document.getElementById("regOpenToggle").onchange = async (e) => {
      const nowOpen = e.target.checked;
      const msg = document.getElementById("regToggleMsg");
      e.target.disabled = true;
      try {
        await dbUpsert("school_settings", { registration_open: nowOpen }, "school_id");
        await loadSchoolSettings();
        card.innerHTML = renderState(nowOpen);
        document.getElementById("regToggleMsg").innerHTML = `<div class="msg-ok">Saved.</div>`;
        toast(nowOpen ? "Registration reopened." : "Registration closed.", false);
        wire();
      } catch (err) {
        msg.innerHTML = `<div class="err">${err.message}</div>`;
        e.target.checked = !nowOpen; e.target.disabled = false;
      }
    };
  };
  wire();
}

async function renderDeptLockCard() {
  const card = document.getElementById("deptLockCard");
  if (!card) return;
  let locked = {};
  let missingCol = false;
  try {
    const rows = await dbSelect("school_settings", { select:"locked_departments" });
    locked = (rows[0] && rows[0].locked_departments) || {};
  } catch (e) { missingCol = true; }
  if (missingCol) {
    card.innerHTML = `<div class="tiny-note">Registration Controls isn't available for your school yet.</div>
      <button class="btn btn-primary btn-sm" id="retryDeptLockBtn" style="margin-top:10px;">Refresh</button>`;
    const retry = document.getElementById("retryDeptLockBtn");
    if (retry) retry.onclick = renderDeptLockCard;
    return;
  }
  card.innerHTML = `
    ${Object.entries(DEPARTMENTS).map(([key,d]) => `
      <div class="list-row" data-dept-row="${key}">
        <div class="list-main">
          <div class="list-title">${d.label}${key==="administration" ? ` <span class="badge badge-amber">Full access</span>` : ""}</div>
          <div class="list-sub">${locked[key]===true ? "Closed to new self-registrations" : "Open — anyone can self-register into this department"}</div>
        </div>
        <label class="row" style="gap:6px;align-items:center;cursor:pointer;">
          <input type="checkbox" data-dept-lock="${key}" ${locked[key]===true?'checked':''} style="width:18px;height:18px;"/>
        </label>
      </div>`).join("")}
    <button class="btn btn-primary btn-sm" id="saveDeptLocksBtn" style="margin-top:10px;">Save registration controls</button>
    <div id="deptLockMsg" style="margin-top:8px;"></div>`;
  card.querySelectorAll("[data-dept-lock]").forEach(cb => {
    cb.onchange = () => {
      const row = cb.closest("[data-dept-row]");
      row.querySelector(".list-sub").textContent = cb.checked ? "Closed to new self-registrations" : "Open — anyone can self-register into this department";
    };
  });
  document.getElementById("saveDeptLocksBtn").onclick = async () => {
    const msg = document.getElementById("deptLockMsg"); msg.innerHTML = "";
    const btn = document.getElementById("saveDeptLocksBtn");
    btn.disabled = true; btn.textContent = "Saving…";
    const newLocked = {};
    card.querySelectorAll("[data-dept-lock]").forEach(cb => { newLocked[cb.dataset.deptLock] = cb.checked; });
    try {
      await dbUpsert("school_settings", { locked_departments: newLocked }, "school_id");
      await loadSchoolSettings();
      msg.innerHTML = `<div class="msg-ok">Saved — the self-signup screen picks this up automatically.</div>`;
      toast("Registration controls saved.", false);
    } catch (e) {
      msg.innerHTML = `<div class="err">${e.message}</div>`;
    }
    btn.disabled = false; btn.textContent = "Save registration controls";
  };
}

        toast("Your request was sent to Administration.", false);
        renderUsers(container);

    };
    const myReqs = document.getElementById("myReqs");
    try {
      const reqs = await dbSelect("account_change_requests", { profile_id:`eq.${profile.id}`, order:"created_at.desc", select:"id,message,status,created_at" });
      myReqs.innerHTML = !reqs.length ? "" : `<div class="section-head"><h3 style="color:var(--navy-2);">Your requests</h3></div><div class="card">` +

          <span class="badge ${r.status==='pending'?'badge-amber':r.status==='dismissed'?'badge-grey':'badge-green'}">${r.status}</span></div>`).join("") + `</div>`;
    } catch (e) {  }

  }

  const profiles = await dbSelect("profiles", { order:"full_name.asc", select:"id,full_name,phone,whatsapp,email,department,position,role,username,pin,photo_url,suspended_at,deleted_at,approval_status,is_owner,created_at" });
  const pendingRegs = profiles.filter(p => p.approval_status === "pending" && !p.deleted_at);
  let pendingReqs = [];
  try { pendingReqs = await dbSelect("account_change_requests", { status:"eq.pending", order:"created_at.asc", select:"id,full_name,department,message,created_at" }); } catch (e) {  }
  const deptOptions = (selected) => `<option value="" ${!selected?'selected':''}>— No department —</option>` +

  const posOptions = (deptKey, selected) => {

  if (!sub) {

      { id:"pendingregs", label:"Pending Registrations", icon:ic.bell,     badge: pendingRegs.length },

      { id:"pendingreqs", label:"Pending Requests",       icon:ic.edit,     badge: pendingReqs.length },

    ];

    const transferOwnerBtn = document.getElementById("transferOwnerBtn");

          ${avatarHtml(p.full_name, p.photo_url)}
          <div class="list-main">
            <div class="list-title">${p.full_name} <span class="badge badge-amber">${p.role === "parent" ? "Parent" : (DEPARTMENTS[p.department]?.label || "No department")}</span></div>
            <div class="list-sub">${p.phone || ""}${p.username ? ` · @${p.username}` : ""}</div>
          </div>
          <button class="btn btn-danger btn-sm rejectRegBtn" data-id="${p.id}">Reject</button>
          <button class="btn btn-primary btn-sm approveRegBtn" data-id="${p.id}">${ic.check} Approve</button>
        </div>`).join("");
      pendingRegList.querySelectorAll(".approveRegBtn").forEach(btn => btn.onclick = safe(async () => {
        const pw = await promptAdminPassword("Approve Registration");

        toast("Registration approved — they can now log in.", false);

      pendingRegList.querySelectorAll(".rejectRegBtn").forEach(btn => btn.onclick = async () => {

          const pw = await promptAdminPassword("Reject Registration");
          await rejectRegistration(btn.dataset.id, pw);
          toast("Registration rejected.", false);
          renderUsers(container);
        })();
      });

  if (sub === "manage") {

    const list = document.getElementById("list");
    profiles.forEach(p => {
      const isSelf = p.id === profile.id;
      const isDeleted = !!p.deleted_at;
      const isSuspended = !!p.suspended_at;
      const roleLabel = p.position || DEPARTMENTS[p.department]?.label || (p.role ? p.role.charAt(0).toUpperCase()+p.role.slice(1) : "No role set");
      const badges = `${isSelf ? `<span class="badge badge-green">This is You</span>` : ""}${isDeleted ? `<span class="badge badge-grey">Deleted</span>` : isSuspended ? `<span class="badge badge-amber">Suspended</span>` : ""}${!isDeleted && p.approval_status === "pending" ? ` <span class="badge badge-amber">Pending Approval</span>` : ""}${!isDeleted && p.approval_status === "rejected" ? ` <span class="badge badge-red">Rejected</span>` : ""}`;
      const row = el(`<div class="list-row" style="flex-wrap:wrap;${isDeleted?'opacity:.6;':''}${isSelf?'':'cursor:pointer;'}">
        ${avatarHtml(p.full_name, p.photo_url)}
        <div class="list-main">
          <div class="list-title">${p.full_name} ${badges}</div>
          <div class="list-sub">${roleLabel}</div>
          ${isSelf ? "" : `<div class="tiny-note" style="margin-top:2px;"></div>`}

    const reqList = document.getElementById("reqList");
    if (!pendingReqs.length) {
      reqList.innerHTML = `<div class="tiny-note">No pending requests.</div>`;
    } else {
      reqList.innerHTML = pendingReqs.map(r => `<div class="list-row" style="flex-wrap:wrap;align-items:flex-start;">
