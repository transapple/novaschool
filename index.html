function openAccountControls(p, container, deptOptions, posOptions) {
  const isDeleted = !!p.deleted_at;
  const isSuspended = !!p.suspended_at;
  const overlay = el(`<div class="overlay"><div class="modal">
    <button class="modal-close">&times;</button>
    <h3>${p.full_name}</h3>
    <div class="tiny-note" style="margin-bottom:12px;">${p.phone||''}${p.username?` · @${p.username}`:''}</div>
    ${isDeleted ? `<div class="tiny-note" style="margin-bottom:10px;">This account has been deleted.</div>` : `
      <div class="field"><label>Department</label><select id="ctrlDept">${deptOptions(p.department)}</select></div>
      <div class="field"><label>Position</label><select id="ctrlPos">${posOptions(p.department, p.position)}</select></div>
      <div class="field"><label title="">Legacy role</label>
        <select id="ctrlRole">${["admin","teacher","accountant","staff"].map(r=>`<option value="${r}" ${p.role===r?'selected':''}>${r}</option>`).join("")}</select>
      </div>
      ${p.role === "teacher" ? `<div class="field"><label>Linked Staff record</label><select id="ctrlLinkedTeacher"><option value="">Loading…</option></select>
        
      </div>` : ""}
    `}
    <div class="form-actions" style="flex-wrap:wrap;">
      <button class="btn btn-ghost" id="modalCancel">Close</button>
      ${isDeleted
        ? `<button class="btn btn-primary" id="recoverBtn">${ic.check} Recover account</button>`
        : `<button class="btn btn-ghost" id="suspendBtn">${isSuspended ? ic.check+' Unsuspend' : ic.keyLock+' Suspend'}</button>
           <button class="btn btn-ghost" id="deleteBtn" style="color:var(--red);">${ic.trash} Delete</button>`}
    </div>
  </div></div>`);
  document.body.appendChild(overlay);
  enableModalKeyboardHandling(overlay);
  const close = () => overlay.remove();
  overlay.querySelector(".modal-close").onclick = close;
  overlay.querySelector("#modalCancel").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  const refresh = () => { close(); renderUsers(container); };
  if (!isDeleted) {
    const deptSel = overlay.querySelector("#ctrlDept");
    const posSel = overlay.querySelector("#ctrlPos");
    deptSel.onchange = safe(async (e) => {
      const newDept = e.target.value || null;
      posSel.innerHTML = posOptions(newDept, null);
      await dbUpdate("profiles", p.id, { department: newDept, position: null });
      toast(`${p.full_name}'s department updated.`, false);
    });
    posSel.onchange = safe(async (e) => {
      await dbUpdate("profiles", p.id, { position: e.target.value || null });
      toast(`${p.full_name}'s position updated.`, false);
    });
    overlay.querySelector("#ctrlRole").onchange = safe(async (e) => {
      await dbUpdate("profiles", p.id, { role: e.target.value });
      toast(`${p.full_name}'s role updated.`, false);
    });
    const linkedSel = overlay.querySelector("#ctrlLinkedTeacher");
    if (linkedSel) {
      dbSelectActive("teachers", { order:"full_name.asc" }).then(teacherList => {
        linkedSel.innerHTML = `<option value="">— Not linked —</option>` +
          teacherList.map(t=>`<option value="${t.id}" ${p.linked_teacher_id===t.id?'selected':''}>${t.full_name}${t.nova_teacher_id?(' · '+t.nova_teacher_id):''}</option>`).join("");
      }).catch(()=>{ linkedSel.innerHTML = `<option value="">Couldn't load Staff list</option>`; });
      linkedSel.onchange = safe(async (e) => {
        await dbUpdate("profiles", p.id, { linked_teacher_id: e.target.value || null });
        toast(`${p.full_name}'s linked Staff record updated.`, false);
      });
    }
    overlay.querySelector("#suspendBtn").onclick = safe(async () => {
      if (isSuspended) {
        await dbUpdate("profiles", p.id, { suspended_at: null });
        toast(`${p.full_name}'s account unsuspended.`, false);
      } else {
        if (!(await customConfirm(`Suspend ${p.full_name}? They won't be able to log in until you unsuspend them.`, { danger:true, okLabel:"Suspend" }))) return;
        await dbUpdate("profiles", p.id, { suspended_at: new Date().toISOString() });
        toast(`${p.full_name}'s account suspended.`, false);
      }
      refresh();
    });
    overlay.querySelector("#deleteBtn").onclick = safe(async () => {
      if (!(await customConfirm(`Delete ${p.full_name}'s account? You can recover it later from this page.`, { danger:true, okLabel:"Delete" }))) return;
      await dbUpdate("profiles", p.id, { deleted_at: new Date().toISOString() });
      toast(`${p.full_name}'s account deleted.`, false);
      refresh();
    });
  } else {
    overlay.querySelector("#recoverBtn").onclick = safe(async () => {
      if (!(await customConfirm(`Restore ${p.full_name}'s account?`))) return;
      await dbUpdate("profiles", p.id, { deleted_at: null });
      toast(`${p.full_name}'s account restored.`, false);
      refresh();
    });
  }
}

  if (!mount) return;
  mount.innerHTML = Object.entries(DEPARTMENTS).map(([key, d]) => {
    const members = profiles.filter(p => p.department === key && !p.deleted_at);
    return `<div class="list-row deptCardRow" data-dept="${key}" style="cursor:pointer;flex-wrap:wrap;">
      <div class="list-main">
        <div class="list-title">${d.label}</div>
        <div class="list-sub">${members.length} account${members.length===1?"":"s"}</div>
      </div>
      <div class="tiny-note"></div>
    </div>`;
  }).join("");
  mount.querySelectorAll(".deptCardRow").forEach(row => {
    row.onclick = () => openDepartmentModal(row.dataset.dept, profiles, container);
  });
}
function openDepartmentModal(deptKey, profiles, container) {
  const dept = DEPARTMENTS[deptKey];
  const members = profiles.filter(p => p.department === deptKey);
  const activeMembers = members.filter(p => !p.deleted_at);
  const overlay = el(`<div class="overlay"><div class="modal">
    <button class="modal-close">&times;</button>
    <h3>${dept.label}</h3>
    <div class="tiny-note" style="margin-bottom:12px;">${members.length} account${members.length===1?"":"s"} in this department. Full registration information for each is shown below.</div>
    <div id="deptMemberList">
      ${!members.length ? `<div class="tiny-note">No one is in this department yet.</div>` : members.map(p => `
        <div class="list-row" style="flex-wrap:wrap;align-items:flex-start;border-bottom:1px solid var(--border,#eee);padding-bottom:10px;margin-bottom:10px;">
          ${avatarHtml(p.full_name, p.photo_url)}
          <div class="list-main">
            <div class="list-title">${p.full_name || "—"} ${p.id===profile.id?`<span class="badge badge-green">This is You</span>`:""}${p.deleted_at?`<span class="badge badge-grey">Deleted</span>`:p.suspended_at?`<span class="badge badge-amber">Suspended</span>`:""}${p.is_owner?` <span class="badge badge-green">Owner</span>`:""}</div>
            <div class="list-sub">${p.position || "No position set"}</div>
            <div class="list-sub">${p.username ? `@${p.username}` : ""}${p.phone ? ` · ${p.phone}` : ""}</div>
            <div class="list-sub">${p.whatsapp ? `WhatsApp: ${p.whatsapp}` : ""}${p.email ? `${p.whatsapp?" · ":""}${p.email}` : ""}</div>
            <div class="list-sub">${p.created_at ? `Joined ${new Date(p.created_at).toLocaleDateString()}` : ""}</div>
          </div>
        </div>`).join("")}
    </div>
    <div class="form-actions" style="flex-wrap:wrap;">
      <button class="btn btn-ghost" id="modalCancel">Close</button>
      ${activeMembers.length ? `
        <button class="btn btn-ghost" id="suspendDeptBtn">${ic.keyLock} Suspend department</button>
        <button class="btn btn-ghost" id="deleteDeptBtn" style="color:var(--red);">${ic.trash} Delete department</button>
      ` : ""}
    </div>
  </div></div>`);
  document.body.appendChild(overlay);
  enableModalKeyboardHandling(overlay);
  const close = () => overlay.remove();
  overlay.querySelector(".modal-close").onclick = close;
  overlay.querySelector("#modalCancel").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  const suspendBtn = overlay.querySelector("#suspendDeptBtn");
  const deleteBtn = overlay.querySelector("#deleteDeptBtn");
  
  
  const actionable = activeMembers.filter(p => p.id !== profile.id);
  if (suspendBtn) suspendBtn.onclick = safe(async () => {
    if (!actionable.length) { toast("Nothing to suspend besides your own account.", false); return; }
    if (!(await customConfirm(`Suspend all ${actionable.length} active account(s) in ${dept.label}? They won't be able to log in until unsuspended individually.`, { danger:true, okLabel:"Suspend department" }))) return;
    await Promise.all(actionable.map(p => dbUpdate("profiles", p.id, { suspended_at: new Date().toISOString() })));
    toast(`${dept.label} suspended.`, false);
    close(); renderUsers(container);
  });
  if (deleteBtn) deleteBtn.onclick = safe(async () => {

function openTransferOwnershipModal(profiles, container) {
  const candidates = profiles.filter(p => p.department === "administration" && p.id !== profile.id && !p.deleted_at && !p.suspended_at);
  const overlay = el(`<div class="overlay"><div class="modal">
    <button class="modal-close">&times;</button>
    <h3>Transfer ownership</h3>
    <div class="tiny-note" style="margin-bottom:12px;"></div>
    ${!candidates.length ? `<div class="tiny-note">There's no other active Administration account to transfer to yet — create one from Manage Accounts first.</div>` : `
      <div class="field"><label>New owner</label><select id="newOwnerSel">${candidates.map(p=>`<option value="${p.id}">${p.full_name}${p.username?` (@${p.username})`:""}</option>`).join("")}</select></div>
      <div class="field"><label>Your password (to confirm)</label><input id="ownerConfirmPw" type="password" /></div>
    `}
    <div class="form-actions">
      <button class="btn btn-ghost" id="modalCancel">Cancel</button>
      ${candidates.length ? `<button class="btn btn-primary" id="confirmTransferBtn">Transfer</button>` : ""}
    </div>
  </div></div>`);
  document.body.appendChild(overlay);
  enableModalKeyboardHandling(overlay);
  const close = () => overlay.remove();
  overlay.querySelector(".modal-close").onclick = close;
  overlay.querySelector("#modalCancel").onclick = close;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
  const confirmBtn = overlay.querySelector("#confirmTransferBtn");
  if (confirmBtn) confirmBtn.onclick = safe(async () => {
    const newOwnerId = val(overlay, "newOwnerSel");
    const pw = val(overlay, "ownerConfirmPw");
    if (!pw) { toast("Enter your password to confirm.", true); return; }
    const chosen = candidates.find(p => p.id === newOwnerId);
    if (!(await customConfirm(`Make ${chosen ? chosen.full_name : "this account"} the new owner? You'll lose owner powers immediately.`, { danger:true, okLabel:"Transfer ownership" }))) return;
    await transferOwnership(newOwnerId, pw);
    profile.is_owner = false;
    toast("Ownership transferred.", false);
    close(); renderUsers(container);
  });
}

async function wirePushNotifCard(container) {
  const toggle = container.querySelector("#staffPushToggle");
  if (!toggle) return;
  const msg = container.querySelector("#staffPushMsg");
  try {
    const existing = await getExistingStaffPushSubscription();
    toggle.checked = !!existing;

  toggle.onchange = async () => {
    msg.innerHTML = "";

  const listEl = document.getElementById("trashList");
  let allTrashed = [];
  await Promise.all(TRASH_TABLES.map(async (t) => {
    try {
      const rows = await dbSelect(t.table, { deleted_at:"not.is.null", order:"deleted_at.desc" });
      rows.forEach(r => allTrashed.push({ ...t, row:r }));
    } catch(e) {  }
  }));
  allTrashed.sort((a,b) => new Date(b.row.deleted_at) - new Date(a.row.deleted_at));
  if (!allTrashed.length) { listEl.innerHTML = emptyState("Trash is empty."); document.getElementById("emptyBtn").style.display="none"; return; }
  listEl.innerHTML = `<div class="card" id="list"></div>`;

      <div class="list-main"><div class="list-title">${name}</div>

      { label:"Delete permanently", icon:ic.trash, danger:true, onClick: () => { customConfirm(`Permanently delete "${name}"? This cannot be undone.`, { danger:true, okLabel:"Delete permanently" }).then(ok => { if (ok) safe(async()=>{ await dbDelete(item.table, item.row.id); renderTrash(container); })(); }); } },
    ]);
    list.appendChild(row);
  });
  document.getElementById("emptyBtn").onclick = async () => {

function makeFabDraggable(fab, onTap) {
  fab.style.touchAction = "none"; 
  fab.draggable = false; 
  let startX = 0, startY = 0, origLeft = 0, origBottom = 0, fabW = 0, fabH = 0, moved = false;
  let pendingLeft = null, pendingBottom = null, rafId = null;
  const DRAG_TOL = 8;
  const applyPosition = () => {
    rafId = null;
    fab.style.left = pendingLeft + "px";
    fab.style.right = "auto";
    fab.style.bottom = pendingBottom + "px";
  };
  fab.addEventListener("pointerdown", (e) => {
    moved = false;
    startX = e.clientX; startY = e.clientY;
    const rect = fab.getBoundingClientRect();
    origLeft = rect.left;
    origBottom = window.innerHeight - rect.bottom;
    fabW = rect.width; fabH = rect.height; 
    fab.setPointerCapture(e.pointerId);
  });
  fab.addEventListener("pointermove", (e) => {
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > DRAG_TOL || Math.abs(dy) > DRAG_TOL) moved = true;
    if (moved) {
      pendingLeft = Math.min(window.innerWidth - fabW - 6, Math.max(6, origLeft + dx));
      
      
      pendingBottom = Math.min(window.innerHeight - fabH - 6, Math.max(6, origBottom - dy));
      if (rafId === null) rafId = requestAnimationFrame(applyPosition); 
    }
  });
  fab.addEventListener("pointerup", () => {
    if (rafId !== null) { cancelAnimationFrame(rafId); applyPosition(); }
    if (!moved) onTap();
  });
  return fab;
}

function addFab(container, onClick) {
  const fab = el(`<button type="button" class="fab">${ic.plus}</button>`);

}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }

function toast(msg, isError=true) {
  const t = el(`<div style="position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:${isError?'#D6564F':'#2E9E7C'};color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;box-shadow:0 10px 28px rgba(0,0,0,.25);max-width:90%;text-align:center;">${msg}</div>`);
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .3s"; t.style.opacity="0"; setTimeout(()=>t.remove(),300); }, 3000);
}

function safe(fn) {
  return async (...args) => {
    try { await fn(...args); }
    catch (e) { toast(e.message || "Something went wrong. Please try again."); console.error(e); }
  };
}

let activeDateCal = null;
let activeDateInput = null;

function closeDateCalendar() {
  if (activeDateCal) { activeDateCal.remove(); activeDateCal = null; }
  document.removeEventListener("mousedown", onDateCalOutsideClick, true);
  document.removeEventListener("keydown", onDateCalKeydown, true);
  window.removeEventListener("resize", closeDateCalendar);
  window.removeEventListener("scroll", closeDateCalendar, true);
  activeDateInput = null;
}
function onDateCalOutsideClick(e) {
  if (activeDateCal && !activeDateCal.contains(e.target) && e.target !== activeDateInput) closeDateCalendar();
}
function onDateCalKeydown(e) { if (e.key === "Escape") closeDateCalendar(); }

function openDateCalendar(inputEl) {
  if (activeDateInput === inputEl) return; 
  closeDateCalendar();
  activeDateInput = inputEl;

  const todayD = new Date();
  const parsed = inputEl.value ? new Date(inputEl.value + "T00:00:00") : null;
  let viewYear = (parsed && !isNaN(parsed)) ? parsed.getFullYear() : todayD.getFullYear();
  let viewMonth = (parsed && !isNaN(parsed)) ? parsed.getMonth() : todayD.getMonth();
  let selectedIso = inputEl.value || null;

  const pop = document.createElement("div");
  pop.className = "date-cal-popup";
  document.body.appendChild(pop);
  activeDateCal = pop;

  const pad = n => String(n).padStart(2, "0");
  const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const todayIso = iso(todayD.getFullYear(), todayD.getMonth(), todayD.getDate());

  function position() {
    const r = inputEl.getBoundingClientRect();
    const w = pop.offsetWidth || 288, h = pop.offsetHeight || 320;
    let left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    let top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    pop.style.left = left + "px";
    pop.style.top = top + "px";
  }

  function draw() {
    const first = new Date(viewYear, viewMonth, 1);
    const startDow = first.getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const monthName = first.toLocaleString("default", { month: "long" });
    let cells = "";
    for (let i = 0; i < startDow; i++) cells += `<div class="dc-cell dc-empty"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const dStr = iso(viewYear, viewMonth, d);
      const cls = ["dc-cell", "dc-day"];
      if (dStr === selectedIso) cls.push("dc-selected");
      if (dStr === todayIso) cls.push("dc-today");
      cells += `<div class="${cls.join(' ')}" data-date="${dStr}">${d}</div>`;
    }
    pop.innerHTML = `
      <div class="dc-header">
        <button type="button" class="dc-nav" id="dcPrev">&#8249;</button>
        <div class="dc-title">${monthName} ${viewYear}</div>
        <button type="button" class="dc-nav" id="dcNext">&#8250;</button>
      </div>
      <div class="dc-grid dc-dow"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
      <div class="dc-grid">${cells}</div>
      <div class="dc-footer">
        <button type="button" class="dc-link" id="dcToday">Today</button>
        <button type="button" class="dc-link dc-danger" id="dcClear">Clear</button>
      </div>`;
    pop.querySelectorAll(".dc-day").forEach(cell => {
      cell.onclick = () => choose(cell.dataset.date);
    });
    pop.querySelector("#dcPrev").onclick = () => { viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } draw(); position(); };
    pop.querySelector("#dcNext").onclick = () => { viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } draw(); position(); };
    pop.querySelector("#dcToday").onclick = () => { viewYear = todayD.getFullYear(); viewMonth = todayD.getMonth(); choose(todayIso); };
    pop.querySelector("#dcClear").onclick = () => choose("");
  }

  function choose(dStr) {
    selectedIso = dStr || null;
    inputEl.value = dStr;
    inputEl.dispatchEvent(new Event("input", { bubbles: true }));
    inputEl.dispatchEvent(new Event("change", { bubbles: true }));
    closeDateCalendar();
  }

  draw();
  position();
  setTimeout(() => {
    document.addEventListener("mousedown", onDateCalOutsideClick, true);
    document.addEventListener("keydown", onDateCalKeydown, true);
    window.addEventListener("resize", closeDateCalendar);
    window.addEventListener("scroll", closeDateCalendar, true);
  }, 0);
}

document.addEventListener("focusin", (e) => { if (e.target.matches && e.target.matches("input.datefield")) openDateCalendar(e.target); });

document.addEventListener("wheel", (e) => {
  const row = e.target.closest && e.target.closest(".pill-row");
  if (!row || row.scrollWidth <= row.clientWidth) return;
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; 
  row.scrollLeft += e.deltaY;
  e.preventDefault();
}, { passive: false });

(async function boot() {
  renderBootLoader(); // shown immediately so nothing white/blank ever appears
  startHeaderClock(); 
  updateNetStatusPill();
  if (!navigator.onLine) { offlineBannerStickyUntilOnline = true; updateNetStatusPill(); }
  const rememberedSchoolIdAtBoot = isDeviceSeen() ? getRememberedSchool() : null;
  await Promise.all([loadSchoolSettings(), tryRestoreRememberedSession()]);
  if (!auth && rememberedSchoolIdAtBoot) {
    setCurrentSchool(rememberedSchoolIdAtBoot);
    await loadCurrentSchool();
  }
  if (typeof sb === "function") { sb(`/rest/v1/rpc/purge_expired_trashed_schools`, { method:"POST", body: JSON.stringify({}) }).catch(() => {}); } 
  render(); // lands straight on the dashboard (home) for a restored session, or on login otherwise
})();

// ---------- PWA install prompt ----------
let __pwaDeferredPrompt = null;
const __pwaBtn = () => document.getElementById("pwaInstallBtn");
const __pwaInstalled = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
function __pwaToast(msg) {
  let t = document.getElementById("pwaToast");
  if (!t) {
    t = document.createElement("div");
    t.id = "pwaToast";
    t.style.cssText = "position:fixed;left:50%;bottom:84px;transform:translateX(-50%);max-width:88vw;background:#161A26;color:#fff;padding:12px 16px;border-radius:12px;font:600 13.5px/1.4 system-ui,sans-serif;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:center;";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.style.display = "none"; }, 8000);
}
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  __pwaDeferredPrompt = e;
  const btn = __pwaBtn();
  if (btn && !__pwaInstalled()) btn.style.display = "flex";
});
